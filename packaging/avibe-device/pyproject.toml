[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avibe-device"
version = "0.1.0"
description = "Optional single-device LAN voice surface for Avibe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "avibe-os>=3.2",
    "aiohttp>=3.8",
    "psutil>=7.1.0",
    "opuslib-next>=1.3,<2",
    "audioop-lts>=0.2.1; python_version>='3.13'",
]

[project.scripts]
avibe-device = "avibe_device.cli:main"
