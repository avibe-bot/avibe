name: Publish Model Hub engine manifest

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['patches/model-hub-engine-channel.json', 'vibe/model_hub_runtime/engine_channel_roots.json']

permissions: {contents: read}
concurrency:
  group: model-hub-engine-manifest-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'avibe-bot/avibe' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/model_hub_engine_manifest_publish.py prepare

  sign:
    needs: prepare
    if: needs.prepare.outputs.revision != ''
    environment: model-hub-engine-channel-signer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Fetch pinned verifier
        run: python3 -I scripts/ci_avault_verifier.py --output-dir "$RUNNER_TEMP/avault" > "$RUNNER_TEMP/verifier"
      - name: Sign only the canonical payload of the master manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_SIGNER_BUNDLE: ${{ secrets.MODEL_HUB_ENGINE_CHANNEL_SIGNING_BUNDLE }}
        run: python3 -I scripts/model_hub_engine_manifest_publish.py sign --avault "$(cat "$RUNNER_TEMP/verifier")" --envelope "$RUNNER_TEMP/model-hub-engine.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-engine-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-hub-engine.json
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [prepare, sign]
    runs-on: ubuntu-latest
    environment: model-hub-engine-channel-writer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Fetch pinned verifier
        run: python3 -I scripts/ci_avault_verifier.py --output-dir "$RUNNER_TEMP/avault" > "$RUNNER_TEMP/verifier"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: signed-engine-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed
      - name: Verify origin, conditionally replace the index and verify both reads
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: python3 -I scripts/model_hub_engine_manifest_publish.py upload --avault "$(cat "$RUNNER_TEMP/verifier")" --envelope "$RUNNER_TEMP/signed/model-hub-engine.json"
