name: iroh Apple datapath gate
run-name: iOS 17.0 iroh binary qualification (no private datapath or local discovery)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional pinned iroh-apple-v<upstream>-<revision> tag (owner approval required)"
        type: string
        default: ""
      dry_run:
        description: "Validate publication without writing a tag or release"
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/iroh-apple-gate.yml
      - packaging/iroh-apple/**

permissions:
  contents: read

concurrency:
  group: iroh-apple-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IROH_GATE_DIR: packaging/iroh-apple

jobs:
  gate:
    name: iOS 17.0 qualified iroh binary gate
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out Avibe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test publication refusals without network or release writes
        run: python3 -m unittest discover -s packaging/iroh-apple -p 'test_release.py'

      - name: Report pinned Apple toolchain
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          source "$IROH_GATE_DIR/versions.env"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios
          rustc +"$RUST_VERSION" --version
          cargo +"$RUST_VERSION" --version

      - name: Check out pinned iroh-ffi commit
        run: |
          set -euo pipefail
          source "$IROH_GATE_DIR/versions.env"
          checkout_dir="$RUNNER_TEMP/iroh-ffi"
          git init -q "$checkout_dir"
          git -C "$checkout_dir" remote add origin https://github.com/n0-computer/iroh-ffi.git
          git -C "$checkout_dir" fetch --depth=1 origin \
            "$IROH_FFI_COMMIT" \
            "refs/tags/$IROH_FFI_TAG:refs/tags/$IROH_FFI_TAG"
          git -C "$checkout_dir" checkout --detach "$IROH_FFI_COMMIT"
          test "$(git -C "$checkout_dir" rev-parse HEAD)" = "$IROH_FFI_COMMIT"
          test "$(git -C "$checkout_dir" rev-parse "$IROH_FFI_TAG^{commit}")" = "$IROH_FFI_COMMIT"
          echo "IROH_SOURCE=$checkout_dir" >> "$GITHUB_ENV"

      - name: Install lowest available iOS 17.x runtime below 17.5
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/iroh-apple-artifacts"
          bash "$IROH_GATE_DIR/prepare-ios-runtime.sh" "$output_dir"
          cat "$output_dir/ios-runtime.env" >> "$GITHUB_ENV"

      - name: Build qualified iOS xcframework and Swift package
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/iroh-apple-artifacts"
          bash "$IROH_GATE_DIR/build-iroh-apple.sh" "$IROH_SOURCE" "$output_dir" \
            | tee "$RUNNER_TEMP/iroh-apple-build.log"
          bash "$IROH_GATE_DIR/test-ios-runtime.sh" "$IROH_SOURCE" "$output_dir"
          echo "IROH_OUTPUT=$output_dir" >> "$GITHUB_ENV"

      - name: Verify upstream prebuilt positive control (including iOS arm64)
        run: |
          set -euo pipefail
          source "$IROH_GATE_DIR/versions.env"
          upstream_zip="$RUNNER_TEMP/IrohLib-upstream.xcframework.zip"
          curl --fail --location --retry 3 \
            "https://github.com/n0-computer/iroh-ffi/releases/download/$IROH_FFI_TAG/IrohLib.xcframework.zip" \
            --output "$upstream_zip"
          echo "$UPSTREAM_XCFRAMEWORK_SHA256  $upstream_zip" | shasum -a 256 --check --strict
          upstream_dir="$RUNNER_TEMP/upstream-xcframework"
          rm -rf "$upstream_dir"
          mkdir -p "$upstream_dir"
          ditto -x -k "$upstream_zip" "$upstream_dir"
          bash "$IROH_GATE_DIR/check-private-apple-datapath.sh" --expect-hit "$upstream_dir" \
            | tee "$IROH_OUTPUT/positive-control-check.log"
          upstream_ios_arm64="$upstream_dir/Iroh.xcframework/ios-arm64/libiroh_ffi.a"
          test -f "$upstream_ios_arm64"
          bash "$IROH_GATE_DIR/check-private-apple-datapath.sh" --expect-hit "$upstream_ios_arm64" \
            | tee -a "$IROH_OUTPUT/positive-control-check.log"

      - name: Upload qualified iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iroh-apple-gate-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/iroh-apple-artifacts/IrohLib.xcframework.zip
            ${{ runner.temp }}/iroh-apple-artifacts/IrohLib.xcframework.zip.sha256
            ${{ runner.temp }}/iroh-apple-artifacts/IrohLib.swift
            ${{ runner.temp }}/iroh-apple-artifacts/manifest.json
            ${{ runner.temp }}/iroh-apple-artifacts/feature-graph-*.txt
            ${{ runner.temp }}/iroh-apple-artifacts/patched-check.log
            ${{ runner.temp }}/iroh-apple-artifacts/positive-control-check.log
            ${{ runner.temp }}/iroh-apple-artifacts/xcodebuild-*.log
            ${{ runner.temp }}/iroh-apple-artifacts/ios-runtime-*.json
            ${{ runner.temp }}/iroh-apple-artifacts/ios-runtime-*.log
            ${{ runner.temp }}/iroh-apple-artifacts/ios-runtime.env
            ${{ runner.temp }}/iroh-apple-artifacts/ios-runtimes-at-test.json

      # A separate companion keeps the qualified binary zip unchanged.
      - name: Collect redistribution notices and matching Swift binding
        run: |
          python3 "$IROH_GATE_DIR/release.py" support \
            --source "$IROH_SOURCE" --directory "$IROH_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iroh-apple-support-${{ github.sha }}
          path: ${{ runner.temp }}/iroh-apple-artifacts/IrohLib-support.zip
          if-no-files-found: error

  manifest:
    name: Publication manifest (read-only dry run)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: iroh-apple-gate-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: iroh-apple-support-${{ github.sha }}
          path: dist
      - name: Validate same-run candidate and requested tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 "$IROH_GATE_DIR/release.py" prepare --directory dist --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iroh-apple-release-candidate-${{ github.sha }}
          path: dist/iroh-apple-release.json
          if-no-files-found: error

  publish:
    name: Owner-triggered iroh asset publication
    needs: [gate, manifest]
    if: >-
      github.repository == 'avibe-bot/avibe' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.release_tag != '' && inputs.dry_run == false
    runs-on: ubuntu-latest
    # This is the only write-capable job. Owner approval is a procedure, not an
    # environment reviewer lock; repository writers can dispatch this workflow.
    permissions:
      contents: write
    concurrency:
      group: iroh-apple-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: iroh-apple-gate-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: iroh-apple-support-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: iroh-apple-release-candidate-${{ github.sha }}
          path: dist
      - name: Refuse mismatched provenance, runtime, or existing tag/release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 "$IROH_GATE_DIR/release.py" preflight --directory dist --tag "$RELEASE_TAG"
      - name: Publish only this run's verified artifacts (never latest)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "Avibe iroh Apple binary ${{ inputs.release_tag }}"
          make_latest: "false"
          prerelease: false
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            <!-- avibe:update-notification=none -->
            Qualified iroh Apple binary, not an Avibe product release.
            See iroh-apple-release.json for the upstream/core versions, deployment
            floor, exact tested runtime, provenance, URLs and SHA-256 checksums.
            Consume IrohLib-support.zip with the binary: it contains the matching
            generated Swift wrapper and redistribution license/NOTICE texts.
          files: |
            dist/IrohLib.xcframework.zip
            dist/IrohLib.xcframework.zip.sha256
            dist/IrohLib.swift
            dist/IrohLib-support.zip
            dist/manifest.json
            dist/iroh-apple-release.json
            dist/ios-runtime-test.json
            dist/ios-runtime-test.log
            dist/patched-check.log
            dist/positive-control-check.log
            dist/xcodebuild-*.log
            dist/feature-graph-*.txt
