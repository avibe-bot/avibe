name: WebKit proxy change measurement

on:
  push:
    branches:
      - experiment/webkit-proxy-change

permissions:
  contents: read

jobs:
  measure:
    name: iOS ${{ matrix.runtime }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: ["newest"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Run measurement
        id: measurement
        continue-on-error: true
        run: |
          set +e
          packaging/webkit-proxy-change/run-measurement.sh "${{ matrix.runtime }}" "$RUNNER_TEMP/webkit-proxy-change-${{ matrix.runtime }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-proxy-change-${{ matrix.runtime }}
          path: ${{ runner.temp }}/webkit-proxy-change-${{ matrix.runtime }}
          if-no-files-found: error
          retention-days: 14

      - name: Fail after evidence upload
        if: steps.measurement.outputs.status != '0'
        run: exit 1
