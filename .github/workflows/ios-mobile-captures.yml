name: ios-mobile-captures

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact merged master SHA (native + bundled page + capture infrastructure)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-mobile-captures-${{ github.run_id }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  captures:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact merged source and pinned toolchain
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          [ -d "$DEVELOPER_DIR" ]
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6" ]
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/capture-source-sha.txt"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the real bundled mobile UI
        working-directory: ui
        run: |
          npm ci
          npm run build:mobile

      - name: Prepare published license metadata
        run: |
          python3 ios/scripts/prepare_iroh_app.py stage --staging ios/Avibe/IrohLib
          python3 ios/scripts/app_licenses.py generate --bundle ios/Avibe/Resources/MobileApp --support-zip ios/Avibe/IrohLib/IrohLib-support.zip
          ios/scripts/verify_mobile_bundle.sh ios/Avibe/Resources/MobileApp

      - name: Select the pinned iPhone 17 Pro simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-simulators.json"
          simulator_id="$(python3 - "$RUNNER_TEMP/ios-simulators.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              devices = json.load(source)["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-26-5", [])
          matches = sorted(d["udid"] for d in devices if d.get("isAvailable") and d.get("name") == "iPhone 17 Pro")
          if not matches:
              raise SystemExit("Pinned iPhone 17 Pro / iOS 26.5 is unavailable")
          print(matches[0])
          PY
          )"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Build the fixture against the real bundle
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme AvibeSheetFixture \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/CaptureDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
          diff -qr ios/Avibe/Resources/MobileApp \
            "$RUNNER_TEMP/CaptureDerivedData/Build/Products/Debug-iphonesimulator/AvibeSheetFixture.app/MobileApp"
          python3 ios/scripts/mobile_capture_manifest.py \
            --bundle ios/Avibe/Resources/MobileApp \
            --sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/capture-manifest.json"

      - name: Capture six real-page states in both languages and themes
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme AvibeSheetFixture \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/CaptureDerivedData" \
            -parallel-testing-enabled NO \
            -only-testing:AvibeSheetFixtureTests/RealBundleCaptureUITests \
            -resultBundlePath "$RUNNER_TEMP/MobileCaptures.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Export screenshot attachments
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/MobileCaptures.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/MobileCaptures.xcresult" \
              --output-path "$RUNNER_TEMP/mobile-capture-attachments"
          fi

      - name: Upload captures and exact-source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-mobile-captures-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/mobile-capture-attachments
            ${{ runner.temp }}/MobileCaptures.xcresult
            ${{ runner.temp }}/capture-source-sha.txt
            ${{ runner.temp }}/capture-manifest.json
          if-no-files-found: error
          retention-days: 14
