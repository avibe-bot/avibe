name: Qualify Model Hub engine candidate

# Rehearses one reviewed engine candidate and publishes only untrusted source
# data. The exact result name is `untrusted_rehearsal`: it is informational and
# never authorizes release or promotion. The separate channel workflow uses a
# fixed trusted checkout to validate the run, candidate, manifest and archive
# digests without executing candidate or uploaded code, then the owner approves
# each promotion through the existing protected environments.
#
# Candidate jobs have no business secrets, repository-write token or OIDC
# publication authority. Their artifact credential can upload only untrusted
# reports/assets; it is not proof of which job wrote them. Missing and failed
# jobs remain visible to the trusted finalizer instead of becoming an automatic gate
# failure or a fabricated pass.

on:
  workflow_dispatch:
    inputs:
      asset_release_tag:
        description: "Candidate record under patches/model-hub-engine-candidates/"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: model-hub-engine-qualification-${{ inputs.asset_release_tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASSET_RELEASE_TAG: ${{ inputs.asset_release_tag }}

jobs:
  build:
    name: build
    if: github.repository == 'avibe-bot/avibe' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the reviewed candidate record
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ASSET_RELEASE_TAG" =~ ^model-hub-engine-v[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]; then
            echo "::error::not an engine release tag"
            exit 1
          fi
          candidate_dir="patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG"
          python3 scripts/model_hub_engine_qualification.py candidate --candidate-dir "$candidate_dir"
          raw_go_version="$(
            python3 scripts/model_hub_engine_release_guard.py \
              --manifest "$candidate_dir/model-hub-engine-manifest.json" go-version
          )"
          printf 'go_version=%s\n' "${raw_go_version#go}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.candidate.outputs.go_version }}

      # Strict mode: the rebuilt bytes must equal the digests the record pins.
      - name: Rebuild the pinned source and require the reviewed digests
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG"
          python3 scripts/model_hub_engine_release_guard.py \
            --manifest "$candidate_dir/model-hub-engine-manifest.json" \
            fetch-source --output-dir "$RUNNER_TEMP/candidate-assets"
          python3 scripts/model_hub_engine_qualification.py evidence-build \
            --candidate-dir "$candidate_dir" \
            --asset-dir "$RUNNER_TEMP/candidate-assets" \
            --output "$RUNNER_TEMP/evidence/build.json"

      - name: Upload the candidate assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: model-hub-engine-untrusted-assets
          path: ${{ runner.temp }}/candidate-assets
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: untrusted-rehearsal-evidence-build
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 30

  # Each archive starts on its own platform, from an isolated runtime and state
  # directory, and must pass the health check Avibe itself applies.
  platform-smoke:
    name: platform-smoke (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: darwin-arm64, runner: macos-15}
          - {platform: darwin-x64, runner: macos-15-intel}
          - {platform: linux-amd64, runner: ubuntu-latest}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm}
          # Windows runs x64 Python, as Avibe does there; on Arm that Python
          # still selects the native arm64 engine (core/windows_arch.py).
          - {platform: windows-amd64, runner: windows-latest, python_arch: x64, python_build: win-amd64}
          - {platform: windows-arm64, runner: windows-11-arm, python_arch: x64, python_build: win-amd64}
    steps:
      # Manifests are compared byte for byte; a Windows checkout must not
      # rewrite their line endings.
      - name: Keep checked-out bytes exact
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare hermetic UI asset placeholder
        shell: bash
        run: |
          mkdir -p ui/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > ui/dist/index.html

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      # On windows-11-arm, setup-python has ended as successful without
      # installing anything (seen in lint.yml's windows-model-hub), after which
      # `python` was the image's own interpreter. One more attempt, and then
      # `python` must be the interpreter setup-python reported, of the build
      # this leg asked for.
      - name: Set up Python again if the first attempt installed nothing
        if: steps.python.outputs.python-path == ''
        id: python_retry
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Require the requested Python
        shell: bash
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path || steps.python_retry.outputs.python-path }}
          PYTHON_BUILD: ${{ matrix.python_build }}
        run: |
          python - <<'EOF'
          import os, sys, sysconfig

          setup, wanted = os.environ["SETUP_PYTHON"], os.environ["PYTHON_BUILD"]
          version, build = "%d.%d" % sys.version_info[:2], sysconfig.get_platform()
          print(f"python {version} {build} at {sys.executable}; setup-python reported {setup or 'nothing'}")
          if not setup:
              raise SystemExit("setup-python reported no interpreter in two attempts")
          if not os.path.samefile(sys.executable, setup):
              raise SystemExit("`python` is not the interpreter setup-python reported")
          if version != "3.12" or (wanted and build != wanted):
              raise SystemExit(f"this job needs Python 3.12 {wanted}".rstrip())
          EOF

      - name: Install package
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.13.7
          uv pip install --system -e .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: model-hub-engine-untrusted-assets
          path: ${{ runner.temp }}/candidate-assets

      - name: Start the candidate and require Avibe's health check
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          export AVIBE_HOME="$RUNNER_TEMP/avibe-home"
          python scripts/model_hub_engine_qualification.py evidence-smoke \
            --candidate-dir "patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG" \
            --asset-dir "$RUNNER_TEMP/candidate-assets" \
            --work-dir "$RUNNER_TEMP/smoke" \
            --output "$RUNNER_TEMP/evidence/platform-smoke-$PLATFORM.json"
          python - "$RUNNER_TEMP/evidence/platform-smoke-$PLATFORM.json" <<'EOF'
          import json, os, sys
          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          if evidence["platform"] != os.environ["PLATFORM"]:
              raise SystemExit(f"this runner is {evidence['platform']}, not {os.environ['PLATFORM']}")
          EOF

      - name: Upload smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: untrusted-rehearsal-evidence-platform-smoke-${{ matrix.platform }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 30

  # The whole hermetic Model Hub E2E, driven through the released wheel of the
  # minimum Avibe and of the current stable Avibe. The tests are that release
  # tag's own and nothing else: there is no fallback to this checkout's tests.
  # They run where no product package can be imported from, the service starts
  # from the wheel's own entry script, and every process logs where it imported
  # Avibe from. The steps are the shared action that the rehearsal workflow
  # also runs. Qualification itself has not run: it needs stable 3.2.6.
  released-avibe-e2e:
    name: released-avibe-e2e (${{ matrix.role }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        role: [minimum, current_stable]
    env:
      ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # Published stable releases only; a draft, a pre-release or a wheel
      # without GitHub's digest is refused.
      - name: Resolve and download the released wheel
        id: released
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/released"
          mkdir -p "$work/record"
          python3 scripts/model_hub_engine_qualification.py released-avibe \
            --candidate-dir "patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG" \
            --role "$ROLE" --output "$work/record/$ROLE.json"
          python3 - "$work" <<'EOF'
          import hashlib, json, os, pathlib, sys
          from scripts.release_asset_download import download_to_path

          work = pathlib.Path(sys.argv[1])
          released = json.loads((work / "record" / f"{os.environ['ROLE']}.json").read_text(encoding="utf-8"))
          wheel = work / released["wheel_name"]
          download_to_path(released["wheel_url"], wheel, max_bytes=released["wheel_size"])
          if hashlib.sha256(wheel.read_bytes()).hexdigest() != released["wheel_sha256"]:
              raise SystemExit(f"{wheel.name} is not the wheel GitHub published")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={released['tag']}\nwheel={wheel}\n")
          EOF
          python3 scripts/model_hub_engine_qualification.py bundled-manifest \
            --wheel "$work/$(jq -er .wheel_name "$work/record/$ROLE.json")" \
            --output "$work/record/bundled-manifest-$ROLE.json"

      - name: Check out that release's own tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.released.outputs.tag }}
          path: released-src
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: model-hub-engine-untrusted-assets
          path: ${{ runner.temp }}/candidate-assets

      - name: Point the released Avibe at the exact candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/model_hub_engine_qualification.py evidence-build \
            --candidate-dir "patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG" \
            --asset-dir "$RUNNER_TEMP/candidate-assets" \
            --output "$RUNNER_TEMP/released/verified-assets.json"
          python3 scripts/model_hub_engine_qualification.py local-manifest \
            --manifest "patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG/model-hub-engine-manifest.json" \
            --asset-dir "$RUNNER_TEMP/candidate-assets" \
            --output "$RUNNER_TEMP/released/local-manifest.json"

      - name: Run the Model Hub E2E through the released wheel
        id: e2e
        uses: ./.github/actions/model-hub-released-e2e
        with:
          wheel: ${{ steps.released.outputs.wheel }}
          tests-source: released-src
          engine-manifest: ${{ runner.temp }}/released/local-manifest.json
          work-dir: ${{ runner.temp }}/released/run

      # Evidence only for a run that passed, whose scenario evidence passed, and
      # that provably ran the wheel.
      - name: Record the run as evidence
        shell: bash
        env:
          WHEEL: ${{ steps.released.outputs.wheel }}
          PYTEST_OUTCOME: ${{ steps.e2e.outputs.pytest-outcome }}
          SCENARIO_OUTCOME: ${{ steps.e2e.outputs.scenario-outcome }}
        run: |
          set -euo pipefail
          if [ "$PYTEST_OUTCOME" != "success" ] || [ "$SCENARIO_OUTCOME" != "success" ]; then
            echo "::error::the Model Hub E2E ($PYTEST_OUTCOME) or its scenario evidence ($SCENARIO_OUTCOME) did not pass"
            exit 1
          fi
          run="$RUNNER_TEMP/released/run"
          python3 scripts/model_hub_engine_qualification.py evidence-released-e2e \
            --candidate-dir "patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG" \
            --role "$ROLE" --released "$RUNNER_TEMP/released/record/$ROLE.json" --wheel "$WHEEL" \
            --environment "$run/venv" --harness "$run/harness" --origins-dir "$run/origins" \
            --junit "$run/junit/junit.xml" --scenario-evidence pass \
            --provenance "$run/provenance.json" \
            --output "$RUNNER_TEMP/evidence/released-avibe-e2e-$ROLE.json"

      - name: Upload the released Avibe record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: qualification-released-${{ matrix.role }}
          path: ${{ runner.temp }}/released/record
          if-no-files-found: error
          retention-days: 30

      - name: Upload E2E evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: untrusted-rehearsal-evidence-released-avibe-e2e-${{ matrix.role }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 30

  # The hosted passthrough, compared with every engine a machine may be running
  # when the candidate arrives: each release the signed index still lists, and
  # the engine each qualifying Avibe release bundles.
  hosted-wire:
    name: hosted-wire
    needs: [build, released-avibe-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare hermetic UI asset placeholder
        run: |
          mkdir -p ui/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > ui/dist/index.html

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.13.7
          uv pip install --system -e . --group dev

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: model-hub-engine-untrusted-assets
          path: ${{ runner.temp }}/candidate-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        continue-on-error: true
        with:
          pattern: qualification-released-*
          path: ${{ runner.temp }}/released
          merge-multiple: true

      # The engines the published index lists, read through the shipped keys,
      # and the engines the qualifying Avibe releases bundle. The signer checks
      # this list against its own ledger before it promotes anything.
      - name: List the baseline engines
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/released" "$RUNNER_TEMP/baselines"
          args=(--output-dir "$RUNNER_TEMP/baselines")
          if [ "$(python scripts/model_hub_engine_channel.py commissioned)" = "true" ]; then
            avault="$(python scripts/ci_avault_verifier.py --output-dir "$RUNNER_TEMP/avault")"
            args+=(--avault "$avault")
          fi
          shopt -s nullglob
          for manifest in "$RUNNER_TEMP"/released/bundled-manifest-*.json; do
            args+=(--bundled "$manifest")
          done
          python scripts/model_hub_engine_channel.py baselines "${args[@]}"

      - name: Compare the hosted passthrough with every baseline
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG"
          for baseline in "$RUNNER_TEMP"/baselines/manifests/*.json; do
            tag="$(basename "$baseline" .json)"
            if [ "$tag" = "$ASSET_RELEASE_TAG" ]; then
              continue
            fi
            python scripts/model_hub_hosted_wire_gate.py \
              --base-manifest "$baseline" \
              --head-manifest "$candidate_dir/model-hub-engine-manifest.json" \
              --head-assets "$RUNNER_TEMP/candidate-assets" \
              --evidence-output "$RUNNER_TEMP/evidence/hosted-wire-$tag.json" \
              --work-dir "$RUNNER_TEMP/hosted-wire/$tag" \
              --loopback-only
          done
          mkdir -p "$RUNNER_TEMP/evidence"

      - name: Upload the baseline list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: qualification-baselines
          path: ${{ runner.temp }}/baselines/baselines.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload hosted-wire evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: untrusted-rehearsal-evidence-hosted-wire
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30

  # This is a report assembler, not an authority. It never executes a
  # candidate or treats a report as authenticated; it merely makes missing
  # and failed source data easy for the trusted finalizer and owner to see.
  untrusted-rehearsal:
    name: untrusted_rehearsal
    needs: [build, platform-smoke, released-avibe-e2e, hosted-wire]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Collect untrusted reports when available
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        continue-on-error: true
        with:
          pattern: untrusted-rehearsal-evidence-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: false

      - name: Collect released Avibe context when available
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        continue-on-error: true
        with:
          pattern: qualification-released-*
          path: ${{ runner.temp }}/released
          merge-multiple: true

      - name: Collect baseline context when available
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        continue-on-error: true
        with:
          name: qualification-baselines
          path: ${{ runner.temp }}/baselines

      - name: Write the untrusted rehearsal result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/released" "$RUNNER_TEMP/baselines"
          test -f "$RUNNER_TEMP/baselines/baselines.json" || printf '{}\n' > "$RUNNER_TEMP/baselines/baselines.json"
          python3 scripts/model_hub_engine_qualification.py untrusted-rehearsal \
            --candidate-dir "patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG" \
            --evidence-dir "$RUNNER_TEMP/evidence" \
            --released-dir "$RUNNER_TEMP/released" \
            --baselines "$RUNNER_TEMP/baselines/baselines.json" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --head-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/untrusted_rehearsal.json"

      - name: Upload the untrusted rehearsal result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: model-hub-engine-untrusted-rehearsal
          path: ${{ runner.temp }}/untrusted_rehearsal.json
          if-no-files-found: error
          retention-days: 90
