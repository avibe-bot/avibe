name: desktop first-start diagnosis (draft only)

# Diagnosis-only lane for the false "stopped responding" message on the Mac
# Desktop App's first start. It lives on a draft PR that is never merged.
# pull_request-only, contents/actions read, no secrets. It installs a Desktop
# App fresh on a hosted macOS runner, launches it cold and then warm, and
# records one window capture per second, the shell's bootstrap log, the app's
# stdout/stderr and the WebKit/app system log.
#
# Build under test: the released 3.2.6 DMG (SHA-256 verified), or, when
# DIAG_BUILD_RUN is set, the unsigned macOS artifact of that desktop-package run.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/desktop-first-start-diagnosis.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-first-start-diagnosis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUILD_REF: fix/desktop-first-start-not-responding
  RELEASE_BASE: https://dl.avibe.bot/releases/v3.2.6
  MAC_ASSET: Avibe_3.2.6_aarch64-apple-darwin.dmg
  MAC_SUMS: Avibe_3.2.6_aarch64-apple-darwin.SHA256SUMS

jobs:
  build:
    # An unsigned, ad-hoc signed aarch64 build of the fix branch, the way
    # desktop-package builds a manual (non-release) package, without any
    # environment, secret, signing identity or updater key.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diag/desktop-first-start' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TARGET: aarch64-apple-darwin
      DESKTOP_VERSION: 0.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false
      - name: Pinned Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          git log -1 --format='%H %s' | tee build-head.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Resolve build cache identity
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint() { python -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:16])'; }
          echo "rustc=$(rustc -vV | fingerprint)" >> "$GITHUB_OUTPUT"
          echo "apple=$({ xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; } | fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target/release/.fingerprint
            desktop/target/release/build
            desktop/target/release/deps
          key: ${{ runner.os }}-aarch64-apple-darwin-desktop-package-${{ steps.toolchain.outputs.rustc }}-default-target-${{ steps.toolchain.outputs.apple }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/cua-driver/sources.json') }}
      - name: Discard an inexact Rust cache match
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-matched-key != ''
        run: rm -rf desktop/target/release/.fingerprint desktop/target/release/build desktop/target/release/deps
      - name: Build Workbench
        working-directory: ui
        run: npm ci && npm run build
      - name: Build bootstrap UI
        working-directory: desktop
        run: npm ci && npm run build
      - name: Prepare package version, updater disabled
        shell: bash
        run: |
          set -euo pipefail
          python scripts/desktop_release.py prepare --version "$DESKTOP_VERSION" --tag "" --source-sha "" \
            --config desktop/tauri.release.conf.json --env-file "$GITHUB_ENV" --target "$TARGET"
          python scripts/desktop_updater.py configure --config desktop/tauri.release.conf.json --env-file "$GITHUB_ENV"
      - name: Build verified private Runtime
        run: python desktop/scripts/build-runtime-bundle.py --target "$TARGET"
      - name: Install pinned driver validation dependency
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: "PyYAML==6.0.3"
      - name: Restore prepared Cua Driver
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            desktop/src-tauri/binaries/cua-driver-aarch64-apple-darwin
            desktop/src-tauri/binaries/cua-driver-aarch64-apple-darwin.provenance.json
          key: cua-driver-aarch64-apple-darwin-${{ steps.toolchain.outputs.apple }}-default-target-${{ hashFiles('desktop/cua-driver/**', 'desktop/scripts/prepare-cua-driver.py') }}
      - name: Prepare pinned Cua Driver sidecar
        run: python desktop/scripts/prepare-cua-driver.py --target "$TARGET" --reuse-verified
      - name: Build the app
        working-directory: desktop
        run: >
          npm run tauri -- build --bundles app --features bundled-runtime
          --config tauri.release.conf.json -- --locked
      - name: Ad-hoc sign and pack
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          app="target/release/bundle/macos/Avibe.app"
          codesign --force --sign - --preserve-metadata=identifier,entitlements,flags,runtime "$app/Contents/Helpers/cua-driver"
          codesign --force --sign - --preserve-metadata=identifier,entitlements,flags,runtime "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/out/Avibe.app.zip"
          cp ../build-head.txt "$RUNNER_TEMP/out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-build
          path: ${{ runner.temp }}/out/
          retention-days: 1

  mac:
    needs: build
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diag/desktop-first-start' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # en: the runner's default English system.
        # zh-system: Chinese set the way a real Chinese Mac reports it, in the
        # global domain (System Settings > Language & Region), not per app.
        scenario: [en, zh-system]
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Prepare the machine
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/diag"
          mkdir -p "$W/frames" "$W/logs"
          if [ "$SCENARIO" = zh-system ]; then
            defaults write -g AppleLanguages -array zh-Hans-CN en-US
            defaults write -g AppleLocale zh_CN
          fi
          # Ask WebKit to copy page console messages (the bootstrap page's
          # console.error) into the system log. Diagnostic only.
          defaults write bot.avibe.desktop WebKitDebugLogsPageMessagesToSystemConsoleEnabled -bool YES
          defaults write bot.avibe.desktop WebKitLogsPageMessagesToSystemConsoleEnabled -bool YES
          defaults read -g AppleLanguages || true
          sw_vers; sysctl -n hw.ncpu hw.memsize

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: diag-build
          path: ${{ runner.temp }}/diag/build
      - name: Get the build under test
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/diag"
          cd "$W"
          ditto -x -k build/Avibe.app.zip build
          app_src="build/Avibe.app"
          echo "build: unsigned aarch64 of $BUILD_REF, $(cat build/build-head.txt)" > "$W/logs/build.txt"
          test -n "$app_src"
          ditto "$app_src" /Applications/Avibe.app
          xattr -dr com.apple.quarantine /Applications/Avibe.app 2>/dev/null || true
          ls /Applications/Avibe.app/Contents/MacOS
          du -sh /Applications/Avibe.app

      - name: Build the window capture helper
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/diag"
          cat > "$W/capwin.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation

          // capwin <file-prefix> : captures every on-screen Avibe window.
          let prefix = CommandLine.arguments[1]
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          var count = 0
          for window in windows {
            let owner = window[kCGWindowOwnerName as String] as? String ?? ""
            guard owner == "Avibe" || owner == "avibe-desktop" else { continue }
            let bounds = window[kCGWindowBounds as String] as? [String: Double] ?? [:]
            guard (bounds["Width"] ?? 0) >= 300, (bounds["Height"] ?? 0) >= 200,
                  let id = window[kCGWindowNumber as String] as? Int else { continue }
            count += 1
            let capture = Process()
            capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
            capture.arguments = ["-x", "-o", "-l", String(id), "\(prefix)-\(count).png"]
            try? capture.run()
            capture.waitUntilExit()
          }
          print(count)
          SWIFT
          swiftc -O -o "$W/capwin" "$W/capwin.swift"

      - name: Cold start, then warm start
        timeout-minutes: 6
        shell: bash
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/diag"
          SUPPORT="$HOME/Library/Application Support/bot.avibe.desktop"

          launch_and_watch() {
            local tag="$1" seconds="$2" step="${3:-1}"
            log stream --style syslog --level info \
              --predicate 'process == "Avibe" OR process == "avibe-desktop" OR process BEGINSWITH "com.apple.WebKit"' \
              > "$W/logs/$tag-system.log" 2>&1 &
            local logger=$!
            sleep 2
            local start; start=$(python3 -c 'import time; print(time.time())')
            echo "$tag launch at $(date -u +%H:%M:%S.%N)" >> "$W/logs/timeline.txt"
            open --stdout "$W/logs/$tag-stdout.log" --stderr "$W/logs/$tag-stderr.log" \
              --env RUST_BACKTRACE=1 /Applications/Avibe.app
            local sampled=0
            for i in $(seq 0 "$step" "$seconds"); do
              local target; target=$(python3 -c "print($start + $i)")
              python3 -c "import time; d=$target-time.time(); time.sleep(d if d>0 else 0)"
              local n; n=$("$W/capwin" "$W/frames/$tag-t$(printf '%05.2f' "$i")s")
              echo "$tag t=${i}s windows=$n $(date -u +%H:%M:%S.%N)" >> "$W/logs/timeline.txt"
              if [ "$sampled" = 0 ] && [ "${i%.*}" -ge 2 ]; then
                local pid; pid=$(pgrep -x avibe-desktop || pgrep -x Avibe || true)
                if [ -n "$pid" ]; then
                  (sample "$pid" 3 -file "$W/logs/$tag-sample-t${i}s.txt" >/dev/null 2>&1 &)
                  sampled=1
                fi
              fi
            done
            ps -axo pid,ppid,etime,%cpu,rss,command | grep -iE 'avibe|vibe|python' | grep -v grep > "$W/logs/$tag-ps.txt" || true
            top -l 1 -n 15 -o cpu > "$W/logs/$tag-top.txt" 2>&1 || true
            kill "$logger" 2>/dev/null || true
          }

          # Plain-HTTP traffic to the local Workbench: which locale file the
          # page asked for, and the Accept-Language its WebView sent.
          sudo tcpdump -i lo0 -A -s 0 -l 'tcp dst port 5123' > "$W/logs/http-5123.txt" 2>/dev/null &
          sleep 1
          launch_and_watch cold 45

          # Stop the shell and the Runtime it started, keeping the prepared files.
          pkill -x avibe-desktop 2>/dev/null || true
          pkill -x Avibe 2>/dev/null || true
          sleep 3
          pkill -f "bot.avibe.desktop" 2>/dev/null || true
          sleep 3
          launch_and_watch warm 20 0.25

          sudo pkill -x tcpdump || true
          grep -aE '^(GET|POST) |Accept-Language' "$W/logs/http-5123.txt" | head -300 > "$W/logs/http-requests.txt" || true
          cp "$SUPPORT"/*.log "$W/logs/" 2>/dev/null || true
          find "$SUPPORT" -maxdepth 2 \( -name '*.log' -o -name '*.json' -o -name '*.jsonl' \) -size -5M \
            -exec cp {} "$W/logs/" \; 2>/dev/null || true
          ls -la "$SUPPORT" > "$W/logs/support-dir.txt" 2>&1 || true
          for d in "$HOME/.avibe/logs" "$SUPPORT/runtime-home/logs"; do
            [ -d "$d" ] && tail -n 400 "$d"/*.log > "$W/logs/runtime-$(basename "$(dirname "$d")").log" 2>/dev/null || true
          done
          grep -iE 'console|bootstrap|ipc|webview|not allowed|acquire' "$W/logs/"*-system.log | head -200 > "$W/logs/system-grep.txt" || true
          cat "$W/logs/timeline.txt"

      - name: WebKit probe (custom-scheme URL and navigator.languages per process)
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/diag"
          mkdir -p "$W/probe-www"
          echo '<!doctype html><title>b</title><body>b</body>' > "$W/probe-www/index.html"
          (cd "$W/probe-www" && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          cat > "$W/probe.swift" <<'SWIFT'
          import Cocoa
          import WebKit

          final class Scheme: NSObject, WKURLSchemeHandler {
            func webView(_ webView: WKWebView, start task: WKURLSchemeTask) {
              let body = "<!doctype html><title>a</title><body>a</body>".data(using: .utf8)!
              task.didReceive(URLResponse(url: task.request.url!, mimeType: "text/html", expectedContentLength: body.count, textEncodingName: "utf-8"))
              task.didReceive(body)
              task.didFinish()
            }
            func webView(_ webView: WKWebView, stop task: WKURLSchemeTask) {}
          }

          final class Probe: NSObject, WKNavigationDelegate {
            var step = 0
            let targets = ["tauri://localhost", "tauri://localhost/", "http://127.0.0.1:8765/"]
            func next(_ webView: WKWebView) {
              guard step < targets.count else { exit(0) }
              print("LOAD \(targets[step])")
              webView.load(URLRequest(url: URL(string: targets[step])!))
            }
            func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
              print("URL webView.url=\(webView.url?.absoluteString ?? "nil")")
              webView.evaluateJavaScript("JSON.stringify([location.href, navigator.language, navigator.languages])") { value, error in
                print("JS \(value ?? "nil") \(error.map { "\($0)" } ?? "")")
                self.step += 1
                self.next(webView)
              }
            }
            func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) { print("FAIL \(error)"); step += 1; next(webView) }
            func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) { print("FAILP \(error)"); step += 1; next(webView) }
          }

          let app = NSApplication.shared
          app.setActivationPolicy(.prohibited)
          let config = WKWebViewConfiguration()
          config.setURLSchemeHandler(Scheme(), forURLScheme: "tauri")
          let webView = WKWebView(frame: NSRect(x: 0, y: 0, width: 400, height: 300), configuration: config)
          let probe = Probe()
          webView.navigationDelegate = probe
          print("PREFERRED \(Locale.preferredLanguages)")
          probe.next(webView)
          DispatchQueue.main.asyncAfter(deadline: .now() + 60) { print("TIMEOUT"); exit(2) }
          app.run()
          SWIFT
          swiftc -O -o "$W/probe" "$W/probe.swift" && "$W/probe" | tee "$W/logs/webkit-probe.txt"
          # The same probe inside an app bundle that, like Avibe, declares only
          # an English development region and no zh localization.
          mkdir -p "$W/Probe.app/Contents/MacOS"
          cp "$W/probe" "$W/Probe.app/Contents/MacOS/probe"
          cat > "$W/Probe.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>bot.avibe.languageprobe</string>
          <key>CFBundleExecutable</key><string>probe</string>
          <key>CFBundleDevelopmentRegion</key><string>English</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          PLIST
          "$W/Probe.app/Contents/MacOS/probe" | tee "$W/logs/webkit-probe-bundled.txt"
          plutil -p /Applications/Avibe.app/Contents/Info.plist > "$W/logs/avibe-info-plist.txt" || true
          ls /Applications/Avibe.app/Contents/Resources | head -50 > "$W/logs/avibe-resources.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-first-start-${{ matrix.scenario }}
          path: ${{ runner.temp }}/diag/
          retention-days: 1
          if-no-files-found: warn
