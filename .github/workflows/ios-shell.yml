name: ios-shell

on:
  workflow_call:
    inputs:
      fast-native:
        description: Build the app and exercise the named native PR contracts instead of the full simulator suite
        type: boolean
        default: false

permissions:
  contents: read

env:
  # GitHub's hosted `xcode-27` image (macOS 27): Xcode 27.2, the stable
  # release; its default is 27.1. Apple requires the iOS 27 SDK from April 2027.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  simulator:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # Verify the PR merge's parents for touched XCTest files.

      - name: Report pinned Apple toolchain
        run: |
          set -euo pipefail
          # The image's installed Xcodes, so the pinned path is confirmed at run time.
          ls -d /Applications/Xcode*.app
          [ -d "$DEVELOPER_DIR" ] || {
            echo "Pinned Xcode is missing: $DEVELOPER_DIR" >&2
            exit 1
          }
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.2" ] || {
            echo "Expected Xcode 27.2 from $DEVELOPER_DIR" >&2
            exit 1
          }
          [ "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.2" ] || {
            echo "Expected the iOS 27.2 SDK" >&2
            exit 1
          }

      - name: Select Python for the native PR test selector
        if: inputs.fast-native
        id: native_pr_python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          update-environment: false

      - name: Prepare and check the native PR test selector before simulator boot
        if: inputs.fast-native
        env:
          SELECTOR_PYTHON: ${{ steps.native_pr_python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$SELECTOR_PYTHON" -m venv "$RUNNER_TEMP/native-pr-python"
          source "$RUNNER_TEMP/native-pr-python/bin/activate"
          python3 -m pip install --only-binary=:all: tree-sitter==0.25.2 tree-sitter-swift==0.7.4 pytest==9.0.3
          python3 -c 'import tree_sitter, tree_sitter_swift'
          python3 -m pytest --noconftest -o addopts='' -q tests/test_ci_native_pr_tests.py

      - name: Prepare published iroh App artifact
        run: python3 ios/scripts/prepare_iroh_app.py stage --staging ios/Avibe/IrohLib

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build bundled mobile UI
        working-directory: ui
        run: |
          npm ci
          npm run build:mobile

      - name: Generate the App's license notices
        run: python3 ios/scripts/app_licenses.py generate --bundle ios/Avibe/Resources/MobileApp --support-zip ios/Avibe/IrohLib/IrohLib-support.zip

      - name: Verify bundled mobile UI
        run: ios/scripts/verify_mobile_bundle.sh ios/Avibe/Resources/MobileApp

      - name: Build for the iOS Simulator SDK
        if: ${{ !inputs.fast-native }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme Avibe \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AvibeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify linked iroh binary in the simulator product
        if: ${{ !inputs.fast-native }}
        run: |
          set -euo pipefail
          ios/scripts/verify_iroh_app_product.sh \
            ios/Avibe/IrohLib \
            "$RUNNER_TEMP/AvibeDerivedData/Build/Products/Debug-iphonesimulator/Avibe.app/Avibe" \
            "$RUNNER_TEMP/AvibeDerivedData/Build/Products/Debug-iphonesimulator/Avibe.app/Avibe.debug.dylib" \
            YES

      - name: Select the pinned iPhone 18 Pro / iOS 27.2 simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-simulators.json"
          simulator_id="$(
            /usr/bin/python3 - "$RUNNER_TEMP/ios-simulators.json" <<'PY'
          import json
          import sys

          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-27-2"
          device_name = "iPhone 18 Pro"
          with open(sys.argv[1], encoding="utf-8") as source:
              devices = json.load(source)["devices"].get(runtime, [])
          matches = sorted(
              device["udid"]
              for device in devices
              if device.get("isAvailable") and device.get("name") == device_name
          )
          if not matches:
              raise SystemExit(
                  f"No available {device_name} simulator for {runtime} is installed"
              )
          print(matches[0])
          PY
          )"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Boot the pinned simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Compile the app and run the native PR contracts
        if: inputs.fast-native
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/native-pr-python/bin/activate"
          python3 -m scripts.ci_native_pr_tests
          ios/scripts/verify_iroh_app_product.sh ios/Avibe/IrohLib \
            "$RUNNER_TEMP/AvibeDerivedData/Build/Products/Debug-iphonesimulator/Avibe.app/Avibe" \
            "$RUNNER_TEMP/AvibeDerivedData/Build/Products/Debug-iphonesimulator/Avibe.app/Avibe.debug.dylib" YES

      - name: Build the sheet gesture XCUITest fixture
        if: ${{ !inputs.fast-native }}
        id: sheet-fixture-build
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme AvibeSheetFixture \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/AvibeSheetFixtureDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Run XCTest on iPhone Simulator
        if: ${{ !inputs.fast-native }}
        # The build takes about 11 minutes and the tests 34-58 on this runner;
        # one run that passed every test still met the old 70-minute bound.
        # A test rerun after a simulator stall adds a few minutes.
        timeout-minutes: 90
        run: |
          set -euo pipefail
          xctest() {
            xcodebuild \
              -project ios/Avibe.xcodeproj \
              -scheme Avibe \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath "$RUNNER_TEMP/AvibeTestDerivedData" \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 600 \
              CODE_SIGNING_ALLOWED=NO \
              "$@"
          }
          xctest -resultBundlePath "$RUNNER_TEMP/AvibeTests.xcresult" test \
            2>&1 | tee "$RUNNER_TEMP/AvibeTests.log" && exit 0
          # The hosted simulator now and then stalls WebKit's processes for
          # 30 s or more. A failed test whose own lines show such a stall runs
          # once more, alone; any other failure stands. See the script.
          python3 ios/scripts/xctest_stall_retry.py rerun "$RUNNER_TEMP/AvibeTests.log" \
            --out "$RUNNER_TEMP/AvibeTests.rerun" \
            --evidence "$RUNNER_TEMP/ios-simulator-stall.txt"
          rerun=()
          while IFS= read -r only; do rerun+=("$only"); done < "$RUNNER_TEMP/AvibeTests.rerun"
          xctest -resultBundlePath "$RUNNER_TEMP/AvibeTestsRerun.xcresult" \
            "${rerun[@]}" test-without-building

      - name: Upload XCTest result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-shell-xcresult
          path: |
            ${{ runner.temp }}/AvibeTests.xcresult
            ${{ runner.temp }}/AvibeTestsRerun.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # Only a job that reran a test after a simulator stall has one; the
      # matched lines are its content. `xctest_stall_retry.py count` reads
      # these per week, so a rising count is seen.
      - name: Upload simulator stall evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-stall
          path: ${{ runner.temp }}/ios-simulator-stall.txt
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      # The fixture's hold-to-talk page (HoldTouchUITests): the App follows a
      # press only with the microphone allowed.
      - name: Allow the fixture the simulator's microphone
        if: ${{ always() && !cancelled() && steps.sheet-fixture-build.outcome == 'success' }}
        run: xcrun simctl privacy "$SIMULATOR_ID" grant microphone bot.avibe.ios.sheet-fixture

      - name: Run sheet gesture XCUITest fixture
        if: ${{ always() && !cancelled() && steps.sheet-fixture-build.outcome == 'success' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme AvibeSheetFixture \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/AvibeSheetFixtureDerivedData" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/AvibeSheetFixtureTests.xcresult" \
            -skip-testing:AvibeSheetFixtureTests/RealBundleCaptureUITests \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Upload sheet gesture XCUITest result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-sheet-fixture-xcresult
          path: ${{ runner.temp }}/AvibeSheetFixtureTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
