name: ios-shell

on:
  # Advisory on affected PRs until NavigationPolicyTests #3418 is fixed.
  # Full master calls remain part of lint's required release certificate.
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Cancel stale standalone PR probes, never a running full master backstop.
  group: ios-shell-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --optional-ios

  simulator:
    needs: route
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      (needs.route.result == 'success' && needs.route.outputs.ios == 'run'))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report pinned Apple toolchain
        run: |
          set -euo pipefail
          [ -d "$DEVELOPER_DIR" ] || {
            echo "Pinned Xcode is missing: $DEVELOPER_DIR" >&2
            exit 1
          }
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6" ] || {
            echo "Expected Xcode 26.6 from $DEVELOPER_DIR" >&2
            exit 1
          }
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Prepare published iroh App artifact
        run: python3 ios/scripts/prepare_iroh_app.py stage --staging ios/Avibe/IrohLib

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build bundled mobile UI
        working-directory: ui
        run: |
          npm ci
          npm run build:mobile

      - name: Generate the App's license notices
        run: python3 ios/scripts/app_licenses.py generate --bundle ios/Avibe/Resources/MobileApp --support-zip ios/Avibe/IrohLib/IrohLib-support.zip

      - name: Verify bundled mobile UI
        run: ios/scripts/verify_mobile_bundle.sh ios/Avibe/Resources/MobileApp

      - name: Build for the iOS Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme Avibe \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AvibeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify linked iroh binary in the simulator product
        run: |
          set -euo pipefail
          ios/scripts/verify_iroh_app_product.sh \
            ios/Avibe/IrohLib \
            "$RUNNER_TEMP/AvibeDerivedData/Build/Products/Debug-iphonesimulator/Avibe.app/Avibe" \
            "$RUNNER_TEMP/AvibeDerivedData/Build/Products/Debug-iphonesimulator/Avibe.app/Avibe.debug.dylib" \
            YES

      - name: Select the pinned iPhone 17 Pro simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-simulators.json"
          simulator_id="$(
            /usr/bin/python3 - "$RUNNER_TEMP/ios-simulators.json" <<'PY'
          import json
          import sys

          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-26-5"
          device_name = "iPhone 17 Pro"
          with open(sys.argv[1], encoding="utf-8") as source:
              devices = json.load(source)["devices"].get(runtime, [])
          matches = sorted(
              device["udid"]
              for device in devices
              if device.get("isAvailable") and device.get("name") == device_name
          )
          if not matches:
              raise SystemExit(
                  f"No available {device_name} simulator for {runtime} is installed"
              )
          print(matches[0])
          PY
          )"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Boot the pinned simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Build the sheet gesture XCUITest fixture
        id: sheet-fixture-build
        if: ${{ false }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme AvibeSheetFixture \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/AvibeSheetFixtureDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Start the voice capture probe's stand-in instance (draft only)
        run: |
          set -euo pipefail
          nohup python3 ios/scripts/voice_capture_probe_server.py 8765 "$RUNNER_TEMP/probe-server.log" >/dev/null 2>&1 &
          sleep 1
          curl -sf http://127.0.0.1:8765/api/csrf-token
          xcrun simctl privacy "$SIMULATOR_ID" grant microphone bot.avibe.ios || echo "microphone grant failed"

      - name: Run XCTest on iPhone Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme Avibe \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/AvibeTests.xcresult" \
            -only-testing:AvibeTests/VoiceCaptureFramesTests \
            -testLanguage zh-Hans -testRegion CN \
            ENABLE_DEBUG_DYLIB=NO IROH_DEBUG_DYLIB_PATH= IROH_DEBUG_DYLIB_INPUT= \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload XCTest result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-shell-xcresult
          path: ${{ runner.temp }}/AvibeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Run sheet gesture XCUITest fixture
        if: ${{ false }}
        run: |
          set -euo pipefail
          xcrun simctl privacy "$SIMULATOR_ID" grant microphone bot.avibe.ios || echo "microphone grant failed"
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme AvibeSheetFixture \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/AvibeSheetFixtureDerivedData" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/AvibeSheetFixtureTests.xcresult" \
            -only-testing:AvibeSheetFixtureTests/VoiceCaptureProbeUITests \
            -only-testing:AvibeSheetFixtureTests/VoiceCaptureShowcaseUITests \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Capture the Live Activity frames in zh-Hans (draft only)
        if: ${{ false }}
        run: |
          set -euo pipefail
          xcrun simctl spawn "$SIMULATOR_ID" defaults write -g AppleLanguages -array zh-Hans
          xcrun simctl spawn "$SIMULATOR_ID" defaults write -g AppleLocale zh_CN
          xcrun simctl shutdown "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme AvibeSheetFixture \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/AvibeSheetFixtureDerivedData" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ShowcaseZh.xcresult" \
            -only-testing:AvibeSheetFixtureTests/VoiceCaptureShowcaseUITests \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Upload sheet gesture XCUITest result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-sheet-fixture-xcresult
          path: ${{ runner.temp }}/AvibeSheetFixtureTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect the voice capture probe logs (draft only)
        if: ${{ always() }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/probe/attachments"
          cp "$RUNNER_TEMP/probe-server.log" "$RUNNER_TEMP/probe/" || true
          container="$(xcrun simctl get_app_container "$SIMULATOR_ID" bot.avibe.ios data 2>/dev/null)"
          cp "$container/Library/Caches/voice-capture-probe.log" "$RUNNER_TEMP/probe/" || true
          ls -la "$container/Library/Caches/VoiceCapture" > "$RUNNER_TEMP/probe/takes.txt" 2>&1 || true
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 20m --style compact --info --debug \
            > "$RUNNER_TEMP/probe/simulator-full.log" 2>&1 || true
          grep -E 'Avibe|AvibeLiveActivity|linkd|appintents|SpringBoard.*([Aa]ction|Ringer|Hardware)|liveactivitiesd|WorkflowKit|ActionButton|audiomxd|mediaserverd' \
            "$RUNNER_TEMP/probe/simulator-full.log" | grep -v 'runningboard:monitor' > "$RUNNER_TEMP/probe/simulator.log" || true
          gzip -f "$RUNNER_TEMP/probe/simulator-full.log" || true
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/AvibeSheetFixtureTests.xcresult" \
            --output-path "$RUNNER_TEMP/probe/attachments" > "$RUNNER_TEMP/probe/attachments.txt" 2>&1 || true
          mkdir -p "$RUNNER_TEMP/probe/frames-unit"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/AvibeTests.xcresult" \
            --output-path "$RUNNER_TEMP/probe/frames-unit" > /dev/null 2>&1 || true
          mkdir -p "$RUNNER_TEMP/probe/frames-zh"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ShowcaseZh.xcresult" \
            --output-path "$RUNNER_TEMP/probe/frames-zh" > /dev/null 2>&1 || true
          echo "== app probe log"; cat "$RUNNER_TEMP/probe/voice-capture-probe.log" || true
          echo "== stand-in instance log"; cat "$RUNNER_TEMP/probe/probe-server.log" || true
          echo "== takes"; cat "$RUNNER_TEMP/probe/takes.txt"
          echo "== simulator log (filtered tail)"
          grep -iE "audio|record|activity|intent|VoiceCapture|background|suspend|assertion" "$RUNNER_TEMP/probe/simulator.log" | tail -200 || true

      - name: Upload the voice capture probe logs (draft only)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-capture-probe
          path: ${{ runner.temp }}/probe
          if-no-files-found: ignore
          retention-days: 7
