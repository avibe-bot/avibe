name: ios-shell

on:
  # Advisory on affected PRs until NavigationPolicyTests #3418 is fixed.
  # Full master calls remain part of lint's required release certificate.
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Cancel stale standalone PR probes, never a running full master backstop.
  group: ios-shell-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --optional-ios

  simulator:
    needs: route
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      (needs.route.result == 'success' && needs.route.outputs.ios == 'run'))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report pinned Apple toolchain
        run: |
          set -euo pipefail
          [ -d "$DEVELOPER_DIR" ] || {
            echo "Pinned Xcode is missing: $DEVELOPER_DIR" >&2
            exit 1
          }
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6" ] || {
            echo "Expected Xcode 26.6 from $DEVELOPER_DIR" >&2
            exit 1
          }
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Prepare published iroh App artifact
        run: python3 ios/scripts/prepare_iroh_app.py stage --staging ios/Avibe/IrohLib

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build bundled mobile UI
        working-directory: ui
        run: |
          npm ci
          npm run build:mobile

      - name: Generate the App's license notices
        run: python3 ios/scripts/app_licenses.py generate --bundle ios/Avibe/Resources/MobileApp --support-zip ios/Avibe/IrohLib/IrohLib-support.zip

      - name: Verify bundled mobile UI
        run: ios/scripts/verify_mobile_bundle.sh ios/Avibe/Resources/MobileApp

      - name: Build for the iOS Simulator SDK
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme Avibe \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AvibeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify linked iroh binary in the simulator product
        run: |
          set -euo pipefail
          bash packaging/iroh-apple/check-private-apple-datapath.sh \
            "$RUNNER_TEMP/AvibeDerivedData/Build/Products/Debug-iphonesimulator/Avibe.app"

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-simulators.json"
          simulator_id="$(
            /usr/bin/python3 - "$RUNNER_TEMP/ios-simulators.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              devices = json.load(source)["devices"]
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator is installed")
          PY
          )"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Run XCTest on iPhone Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Avibe.xcodeproj \
            -scheme Avibe \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/AvibeTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload XCTest failure result bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-shell-xcresult
          path: ${{ runner.temp }}/AvibeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
