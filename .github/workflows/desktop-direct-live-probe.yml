name: desktop-direct-live-probe

# Temporary, and for one pull request only: builds the live diagnostic of the
# Desktop's direct path (desktop/src-tauri/examples/direct_live_probe.rs) and
# keeps the executable for two days, so that it can be run in a controlled
# macOS guest against a regression instance. Nothing here runs the probe,
# reaches an instance, or holds a credential. The job exists for pull request
# 4330 alone; delete this file with the diagnosis.
#
# The executable is built from the pull request's head, merged in the job's
# own checkout with the pinned head of one other open pull request (MERGE_WITH
# below): that pull request's gate needs the diagnostic on its code before
# either merges. Its artifact name carries both hashes. With MERGE_WITH empty
# it is the head alone.

on:
  pull_request:
    branches: [master]
    paths:
      - desktop/src-tauri/examples/direct_live_probe.rs
      - desktop/src-tauri/examples/support/direct_transport_diag.rs
      - desktop/src-tauri/src/direct/**
      - .github/workflows/desktop-direct-live-probe.yml

permissions:
  contents: read

concurrency:
  group: desktop-direct-live-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: macos-arm64 executable
    # Pull request 4330 of this repository, from its own branch: never a
    # fork, never another pull request that happens to touch these paths.
    if: >-
      github.event.pull_request.number == 4330
      && github.head_ref == 'feat/direct-transport-diagnosis'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The head of pull request 4366 (every eligible window through the
      # listener from its first load), by its full hash; empty for none.
      # Nothing of it is added to this pull request.
      MERGE_WITH: "1a80c81a740ac1e6d9dae4f922b634e30fbe2d33"
    defaults:
      run:
        working-directory: desktop
    steps:
      # The pull request's own head, not its merge with the base: the
      # executable is built from exactly the commit its artifact is named for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # A merge needs the history the two commits share.
          fetch-depth: 0

      - name: Name what is built
        id: source
        working-directory: .
        run: |
          set -euo pipefail
          case "$MERGE_WITH" in
            "") echo "suffix=" >> "$GITHUB_OUTPUT" ;;
            *[!0-9a-f]*) echo "MERGE_WITH is not a commit hash" >&2; exit 1 ;;
            *) [ "${#MERGE_WITH}" -eq 40 ] || { echo "MERGE_WITH is not a full hash" >&2; exit 1; }
               echo "suffix=-on-$MERGE_WITH" >> "$GITHUB_OUTPUT" ;;
          esac

      # The other commit, in a checkout of its own beside the first: fetched
      # from there by path, so the first keeps no credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.source.outputs.suffix != ''
        with:
          ref: ${{ env.MERGE_WITH }}
          path: merged-with
          persist-credentials: false
          fetch-depth: 0

      - name: Merge it into the checkout
        if: steps.source.outputs.suffix != ''
        working-directory: .
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]
          [ "$(git -C merged-with rev-parse HEAD)" = "$MERGE_WITH" ]
          git fetch --no-tags "$PWD/merged-with" "$MERGE_WITH"
          [ "$(git rev-parse FETCH_HEAD)" = "$MERGE_WITH" ]
          rm -rf merged-with
          # A conflict fails the job: nothing is resolved here.
          git -c user.name=probe-build -c user.email=probe-build@users.noreply.github.com \
            merge --no-edit --no-ff "$MERGE_WITH"
          echo "merged: $HEAD_SHA with $MERGE_WITH"
          echo "tree: $(git rev-parse 'HEAD^{tree}')"

      - name: Report the source and the toolchain
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$MERGE_WITH" ]; then
            # The merge's two parents, in order, are exactly the two commits.
            built="$(git rev-parse 'HEAD^1')"
            [ "$(git rev-parse 'HEAD^2')" = "$MERGE_WITH" ] || {
              echo "the merge's second parent is not $MERGE_WITH" >&2
              exit 1
            }
            echo "source: $built merged with $MERGE_WITH"
          else
            built="$(git rev-parse HEAD)"
            echo "source: $built"
          fi
          [ "$built" = "$HEAD_SHA" ] || {
            echo "checked out $built, expected the pull request's head $HEAD_SHA" >&2
            exit 1
          }
          [ -d "$DEVELOPER_DIR" ] || {
            echo "Pinned Xcode is missing: $DEVELOPER_DIR" >&2
            exit 1
          }
          xcodebuild -version
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
          uname -m

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      # Read only, as the shell's pull-request job: release warm-ups own the
      # desktop cache namespace.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: ${{ runner.os }}-xcode-26.6-default-target-desktop-cargo-${{ hashFiles('desktop/Cargo.lock') }}

      - name: Install bootstrap UI dependencies
        run: npm ci

      - name: Install shared account UI dependencies
        working-directory: ui
        run: npm ci

      # `tauri::generate_context!` embeds `frontendDist` at compile time.
      - name: Build bootstrap UI
        run: npm run build

      - name: Build the live diagnostic
        run: cargo build --locked -p avibe-desktop --example direct_live_probe --all-features

      # Its own controls: a real WKWebView with no window, on loopback pages
      # of the probe's own. No session is read and nothing leaves the runner.
      - name: Run the probe's WebKit controls
        timeout-minutes: 10
        run: target/debug/examples/direct_live_probe --controls

      # Without its arguments and a session on standard input it reads
      # nothing and reaches nothing.
      - name: Check that it refuses an empty input
        run: |
          set -uo pipefail
          code=0
          out="$(target/debug/examples/direct_live_probe < /dev/null)" || code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 2 ] || { echo "expected exit code 2, got $code" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q '"boundary":"input"' || { echo "no input line" >&2; exit 1; }

      # What a run of the executable must be checked against.
      - name: Print the executable's sha256
        run: |
          set -euo pipefail
          file target/debug/examples/direct_live_probe
          shasum -a 256 target/debug/examples/direct_live_probe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: direct-live-probe-macos-arm64-${{ github.event.pull_request.head.sha }}${{ steps.source.outputs.suffix }}
          path: desktop/target/debug/examples/direct_live_probe
          if-no-files-found: error
          retention-days: 2
