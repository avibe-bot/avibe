name: Desktop native update acceptance

# TEMPORARY OBSERVATION ONLY: registered workflow path, dispatch branch only.
# Downloads signed public releases; no fixture assembly, build, sign or publish.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: signed-rc2-rc3-update-panel-smoke
  cancel-in-progress: false
env:
  SOURCE_TAG: gh-v3.2.7rc2
  TARGET_TAG: gh-v3.2.7rc3
  SOURCE_VERSION: 3.2.7-rc.2
  TARGET_VERSION: 3.2.7-rc.3
  ACCEPTANCE_SOURCE_SHA: ${{ github.sha }}
  ACCEPTANCE_EVENT_SHA: ${{ github.sha }}
  ACCEPTANCE_WORKFLOW_SHA: ${{ github.workflow_sha }}
  ACCEPTANCE_WORKFLOW_REF: ${{ github.workflow_ref }}
jobs:
  smoke:
    name: signed-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release admission before setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python desktop/scripts/published-update-admission.py --output "${{ runner.temp }}/signed-rc-smoke/evidence/admission-before-setup.json"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install observation dependencies
        run: python -m pip install --disable-pip-version-check psutil==7.2.2 pillow==12.0.0
      - name: Install Windows UI dependencies
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywinauto==0.6.9
      - name: Verify release admission before signed install
        env:
          GH_TOKEN: ${{ github.token }}
        run: python desktop/scripts/published-update-admission.py --output "${{ runner.temp }}/signed-rc-smoke/evidence/admission-before-install.json"
      - name: Real signed rc2 to rc3 panel smoke
        env:
          SMOKE_ROOT: ${{ runner.temp }}/signed-rc-smoke
        run: python desktop/scripts/test-signed-rc-update-panel.py
      - name: Upload allowlisted signed smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-rc2-rc3-update-panel-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-rc-smoke/evidence/
          if-no-files-found: error
          retention-days: 14
