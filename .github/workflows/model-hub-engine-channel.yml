name: Publish Model Hub engine assets

# Asset release remains separately approved; this workflow never signs an index.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "release: publish trusted-checked assets only"
        required: true
        type: choice
        options: [release]
      asset_release_tag:
        description: "Engine release to publish"
        type: string
      rehearsal_run_id:
        description: "Designated qualification run ID"
        required: true
        type: string
      rehearsal_attempt:
        description: "Designated qualification run attempt"
        required: true
        default: '1'
        type: string

permissions: {}

# One writer at a time, and never a cancelled one: a half-finished change is
# resolved by the conditional replacement, not by killing the job.
concurrency:
  group: model-hub-engine-channel
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPERATION: ${{ inputs.operation }}
  ASSET_RELEASE_TAG: ${{ inputs.asset_release_tag }}

jobs:
  authorize:
    name: authorize
    if: github.repository == 'avibe-bot/avibe' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Fails while the channel is uncommissioned, on any other ref or workflow,
      # and when either environment is missing, admits another branch, or has no
      # required reviewer. Nothing privileged is scheduled until this passes.
      - name: Require a commissioned channel and protected environments
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 scripts/model_hub_engine_channel.py authorize \
            --environment model-hub-engine-asset-approval --operation "$OPERATION"
          [[ "$ASSET_RELEASE_TAG" =~ ^model-hub-engine-v[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]

  prepare:
    name: trusted prepare
    needs: authorize
    if: inputs.operation == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
      REHEARSAL_ATTEMPT: ${{ inputs.rehearsal_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the reviewed producer as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 275e150316765a3b5f1e467b249ccdca08327832
          path: frozen-producer
          persist-credentials: false

      - name: Download the untrusted rehearsal and source data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REHEARSAL_RUN_ID" =~ ^[1-9][0-9]*$ && "$REHEARSAL_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          report=model-hub-engine-untrusted-rehearsal
          if [[ "$REHEARSAL_ATTEMPT" != 1 ]]; then report+="-attempt-$REHEARSAL_ATTEMPT"; fi
          gh run download "$REHEARSAL_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$report" --dir "$RUNNER_TEMP/rehearsal"
          gh run download "$REHEARSAL_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name model-hub-engine-untrusted-assets --dir "$RUNNER_TEMP/untrusted-assets"
          test "$(jq -er .run_id "$RUNNER_TEMP/rehearsal/untrusted_rehearsal.json")" = "$REHEARSAL_RUN_ID"

      # This job is the trusted read/prepare boundary. It never imports,
      # executes, extracts or runs candidate output. The rehearsal assertions
      # remain explicitly untrusted; only current checkout code verifies the
      # candidate record, manifest, archive bytes and run identity.
      - name: Verify the rehearsal run and exact candidate context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_dir="patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG"
          for file in candidate.json model-hub-engine-manifest.json; do
            cmp "frozen-producer/$candidate_dir/$file" "$candidate_dir/$file"
          done
          avault="$(python3 scripts/ci_avault_verifier.py --output-dir "$RUNNER_TEMP/avault")"
          python3 -I scripts/model_hub_engine_rehearsal.py --repo frozen-producer \
            --run "$REHEARSAL_RUN_ID" --attempt "$REHEARSAL_ATTEMPT" --tag "$ASSET_RELEASE_TAG" \
            --avault "$avault" --artifact "$RUNNER_TEMP/rehearsal/untrusted_rehearsal.json"
          python3 scripts/model_hub_engine_qualification.py evidence-build \
            --candidate-dir "$candidate_dir" \
            --asset-dir "$RUNNER_TEMP/untrusted-assets" \
            --output "$RUNNER_TEMP/verified-assets.json"

      - name: Show the owner-facing rehearsal context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/rehearsal/untrusted_rehearsal.json"
          {
            echo '## Model Hub untrusted rehearsal'
            echo
            jq -r '"- rehearsal result: `" + .result + "`\n- run: `" + (.run_id|tostring) + "` attempt `" + (.run_attempt|tostring) + "`\n- upstream source: `" + .candidate.source.repository + "` `" + .candidate.source.release_tag + "`\n- source reference: " + .candidate.source.source_url + "\n- source SHA: `" + .candidate.source.source_sha + "`\n- manifest SHA-256: `" + .candidate.manifest_sha256 + "`\n- minimum Avibe: `" + .candidate.min_avibe_version + "`\n- exact archive digests: " + ([.candidate.assets[] | (.platform + "=" + .sha256)] | join(", "))' "$record"
            echo
            echo '### Untrusted observations'
            jq -r 'if (.observations|length) == 0 then "- none recorded" else (.observations[] | "- " + .) end' "$record"
            echo
            echo '### Rehearsal job results'
            gh run view "$REHEARSAL_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | "- `" + .name + "`: " + (.conclusion // .status)' || echo '- unable to read job results'
            echo
            echo 'Runtime pass/fail assertions above are rehearsal data, not authenticated proof against a malicious candidate. Owner approval for this exact run and digest remains the promotion authority.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Availability before advertisement: a promotion needs every asset served,
      # byte for byte, by the release and by the mirror clients try first.
      - name: Hand the trusted-checked assets to the release job
        if: inputs.operation == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: model-hub-engine-trusted-assets
          path: ${{ runner.temp }}/untrusted-assets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: release
    needs: [authorize, prepare]
    if: inputs.operation == 'release'
    runs-on: ubuntu-latest
    environment: model-hub-engine-asset-approval
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Require this run's approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/model_hub_engine_channel.py authorize \
            --environment model-hub-engine-asset-approval --operation "$OPERATION" --require-approval

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: model-hub-engine-trusted-assets
          path: ${{ runner.temp }}/candidate-assets

      # The checked bytes are never rebuilt. A release that already exists is
      # only verified: published assets are never replaced.
      - name: Publish the trusted-checked assets as an immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="patches/model-hub-engine-candidates/$ASSET_RELEASE_TAG/model-hub-engine-manifest.json"
          asset_dir="$RUNNER_TEMP/candidate-assets"
          python3 scripts/model_hub_engine_release_guard.py --manifest "$manifest" verify --asset-dir "$asset_dir"
          version="$(jq -er '.version' "$manifest")"
          if ! gh release view "$ASSET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ASSET_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --latest=false \
              --title "Avibe Model Hub engine $version" \
              --notes "Avibe-managed patched CPA assets, checked against the reviewed manifest; owner approval is required for publication." \
              "$asset_dir"/*
          fi
          if [ "$(gh release view "$ASSET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            python3 scripts/model_hub_engine_release_guard.py --manifest "$manifest" publish-draft \
              --repo "$GITHUB_REPOSITORY" --asset-dir "$asset_dir"
          fi
          python3 scripts/model_hub_engine_release_guard.py --manifest "$manifest" fetch \
            --output-dir "$RUNNER_TEMP/published"
