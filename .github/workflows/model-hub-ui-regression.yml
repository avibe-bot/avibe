name: Model Hub UI regression

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-hub-ui-regression
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  model-hub-ui:
    name: model-hub-ui-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Chromium
        id: install_chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run Model Catalog browser regression
        working-directory: ui
        run: npm run test:model-catalog

      - name: Run Model Provider browser regression
        if: ${{ always() && steps.install_chromium.outcome == 'success' }}
        working-directory: ui
        run: npm run test:model-provider

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: model-hub-ui-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui/e2e/.artifacts
          if-no-files-found: ignore
          retention-days: 14
