name: ios-sdk-comparison

# The same native screens and real bundled pages, built with Xcode 26.6 (iOS
# 26.5 SDK) and with Xcode 27.2 (iOS 27.2 SDK), both run on one iOS 27.2
# simulator, so only the SDK differs. Produces the PNGs and a side-by-side
# page. Fixture data only.
on:
  workflow_dispatch:
  push:
    # Only while the Xcode 27 move is under review; removed before merge.
    branches: [ci/ios-xcode-27]

permissions:
  contents: read

concurrency:
  group: ios-sdk-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-26:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6" ]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Prepare bundled page and published artifacts
        run: |
          set -euo pipefail
          (cd ui && npm ci && npm run build:mobile)
          python3 ios/scripts/prepare_iroh_app.py stage --staging ios/Avibe/IrohLib
          python3 ios/scripts/app_licenses.py generate --bundle ios/Avibe/Resources/MobileApp --support-zip ios/Avibe/IrohLib/IrohLib-support.zip
      - name: Build both test products for the simulator
        run: |
          set -euo pipefail
          for scheme in Avibe AvibeSheetFixture; do
            xcodebuild -project ios/Avibe.xcodeproj -scheme "$scheme" -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/DD" CODE_SIGNING_ALLOWED=NO build-for-testing
          done
          tar -C "$RUNNER_TEMP/DD/Build" -czf "$RUNNER_TEMP/products-26.6.tgz" Products
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: products-26.6
          path: ${{ runner.temp }}/products-26.6.tgz
          retention-days: 3

  compare:
    needs: build-26
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the toolchain
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.2" ]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Prepare bundled page and published artifacts
        run: |
          set -euo pipefail
          (cd ui && npm ci && npm run build:mobile)
          python3 ios/scripts/prepare_iroh_app.py stage --staging ios/Avibe/IrohLib
          python3 ios/scripts/app_licenses.py generate --bundle ios/Avibe/Resources/MobileApp --support-zip ios/Avibe/IrohLib/IrohLib-support.zip
      - name: Build both test products with the iOS 27.2 SDK
        run: |
          set -euo pipefail
          for scheme in Avibe AvibeSheetFixture; do
            xcodebuild -project ios/Avibe.xcodeproj -scheme "$scheme" -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/DD27" CODE_SIGNING_ALLOWED=NO build-for-testing
          done
          mkdir -p "$RUNNER_TEMP/sdk-27.2" && cp -R "$RUNNER_TEMP/DD27/Build/Products" "$RUNNER_TEMP/sdk-27.2/"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: products-26.6
          path: ${{ runner.temp }}
      - name: Unpack the 26.6 products
        run: mkdir -p "$RUNNER_TEMP/sdk-26.6" && tar -C "$RUNNER_TEMP/sdk-26.6" -xzf "$RUNNER_TEMP/products-26.6.tgz"
      - name: Boot iPhone 17 Pro / iOS 27.2
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/sims.json"
          id="$(python3 - "$RUNNER_TEMP/sims.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-27-2", [])
          matches = sorted(d["udid"] for d in devices if d.get("isAvailable") and d.get("name") == "iPhone 17 Pro")
          if not matches:
              raise SystemExit("No iPhone 17 Pro / iOS 27.2 simulator")
          print(matches[0])
          PY
          )"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$id" -b
      - name: Capture with each SDK on the same simulator
        run: |
          set -uo pipefail
          status=0
          for sdk in 26.6 27.2; do
            products="$RUNNER_TEMP/sdk-$sdk/Products"
            for pair in "Avibe:AvibeTests/NativeScreenCaptureTests/testCaptureNativeScreens" \
                        "AvibeSheetFixture:AvibeSheetFixtureTests/RealBundleCaptureUITests/testRealBundledPageCaptureMatrix"; do
              scheme="${pair%%:*}"; test="${pair#*:}"
              run="$(ls "$products"/${scheme}_*.xctestrun | head -1)"
              echo "== $sdk $scheme ($run)"
              TEST_RUNNER_AVIBE_NATIVE_CAPTURES=1 xcodebuild test-without-building \
                -xctestrun "$run" -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
                -parallel-testing-enabled NO -only-testing:"$test" \
                -resultBundlePath "$RUNNER_TEMP/results/$sdk-$scheme.xcresult" || status=$?
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/results/$sdk-$scheme.xcresult" \
                --output-path "$RUNNER_TEMP/attachments/$sdk/$scheme" || status=$?
            done
          done
          exit "$status"
      - name: Pair the captures side by side
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 ios/scripts/sdk_comparison.py --before "$RUNNER_TEMP/attachments/26.6" \
            --after "$RUNNER_TEMP/attachments/27.2" --output "$RUNNER_TEMP/comparison"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: ios-sdk-comparison
          path: |
            ${{ runner.temp }}/comparison
            ${{ runner.temp }}/results
          retention-days: 14
