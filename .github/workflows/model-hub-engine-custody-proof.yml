name: Prove engine signer custody once

on: workflow_dispatch

permissions: {contents: read}

jobs:
  proof:
    if: github.repository == 'avibe-bot/avibe' && github.ref == 'refs/heads/master'
    environment: model-hub-engine-channel-signer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refuse repeat dispatches and retries
        run: test "$GITHUB_RUN_NUMBER/$GITHUB_RUN_ATTEMPT" = '1/1'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch the existing digest-pinned avault
        run: python3 -I scripts/ci_avault_verifier.py --output-dir "$RUNNER_TEMP/avault"
      - name: Sign the fixed custody statement
        env:
          CHANNEL_SIGNER_BUNDLE: ${{ secrets.MODEL_HUB_ENGINE_CHANNEL_SIGNING_BUNDLE }}
        run: python3 -I scripts/model_hub_engine_custody_proof.py
      - name: Independently verify the public envelope against the owner's key
        run: node scripts/verify_engine_custody_proof.mjs "$RUNNER_TEMP/custody-proof.json"
      - name: Retain only the verified public envelope
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: engine-custody-proof
          path: ${{ runner.temp }}/custody-proof.json
          if-no-files-found: error
          retention-days: 1
