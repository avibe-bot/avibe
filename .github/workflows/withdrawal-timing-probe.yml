name: Temporary withdrawal timing probe
on:
  push:
    branches: [fix/model-hub-withdrawal-test-signal]
    paths:
      - tests/_withdrawal_timing_probe.py
      - .github/workflows/withdrawal-timing-probe.yml
permissions:
  contents: read
jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Isolated locked dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.13.7
          mkdir -p ui/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > ui/dist/index.html
          uv sync --locked --no-install-project --python "$(command -v python)"
      - name: Measure existing test with polling and signal controls
        shell: bash
        run: |
          uv run --no-sync python -c 'import os, sys, sysconfig; assert sys.version_info[:2] == (3, 12); assert os.name == "nt" and sysconfig.get_platform() == "win-amd64"'
          uv run --no-sync python -m pytest -s -q tests/_withdrawal_timing_probe.py
