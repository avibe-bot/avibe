name: Publish signed Model Hub engine index

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {contents: read}
# One publication at a time. Coalescing pending
# pushes is intentional: never replay snapshots on the way to current master.
concurrency:
  group: hosted-model-hub-engine-index
  cancel-in-progress: false

env:
  HOSTED_COMMISSIONED: ${{ vars.MODEL_HUB_ENGINE_CHANNEL_HOSTED_ENABLED }}

jobs:
  prepare:
    if: github.repository == 'avibe-bot/avibe' && github.ref == 'refs/heads/master' && vars.MODEL_HUB_ENGINE_CHANNEL_HOSTED_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.prepare.outputs.revision }}
      attempt: ${{ steps.prepare.outputs.attempt }}
    steps:
      - &tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 47bf08388e13336ec5d320e7c6dbf62b19703061
          path: tools
          persist-credentials: false
      - uses: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          path: ledger
          fetch-depth: 0
          sparse-checkout: vibe/model_hub_runtime/engine_channel_roots.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - &verifier
        name: Fetch pinned verifier
        run: python3 -I tools/scripts/ci_avault_verifier.py --output-dir "$RUNNER_TEMP/avault" > "$RUNNER_TEMP/verifier"
      - name: Verify the assets still offered by current master
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -I tools/scripts/model_hub_engine_index.py prepare --data ledger --avault "$(cat "$RUNNER_TEMP/verifier")"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  sign:
    needs: prepare
    if: needs.prepare.outputs.revision != ''
    runs-on: ubuntu-latest
    environment: model-hub-engine-channel-signer
    steps:
      - *tools
      - &revision
        uses: *checkout
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: ledger
          fetch-depth: 0
          sparse-checkout: vibe/model_hub_runtime/engine_channel_roots.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - *verifier
      - name: Sign only the prepared snapshot, in the same attempt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREPARED_ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          HOSTED_SIGNING_BUNDLE: ${{ secrets.MODEL_HUB_ENGINE_CHANNEL_SIGNING_BUNDLE }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "$PREPARED_ATTEMPT"
          python3 -I tools/scripts/model_hub_engine_index.py sign --data ledger --avault "$(cat "$RUNNER_TEMP/verifier")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: engine-index-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-hub-engine.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, sign]
    # Master-only deployment policy, separate from owner approval for asset releases.
    environment: model-hub-engine-channel-writer
    runs-on: ubuntu-latest
    steps:
      - *tools
      - *revision
      - *verifier
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: engine-index-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed
      - name: Verify the signed bytes, conditionally write, and recheck both reads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          mv "$RUNNER_TEMP/signed/model-hub-engine.json" "$RUNNER_TEMP/model-hub-engine.json"
          python3 -I tools/scripts/model_hub_engine_index.py publish --data ledger --avault "$(cat "$RUNNER_TEMP/verifier")"
