name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v2.0.0 or v2.0.1rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish_legacy: ${{ steps.tag.outputs.publish_legacy }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
      workflow_branch: ${{ steps.tag.outputs.workflow_branch }}
      workflow_sha: ${{ steps.tag.outputs.workflow_sha }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ]; then
            echo "Tag is empty" >&2
            exit 1
          fi

          PUBLISH_LEGACY="false"
          if [[ "$TAG" =~ ^v3\.0\.[0-9]+$ ]]; then
            PUBLISH_LEGACY="true"
          fi

          PRERELEASE="false"
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          elif [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(([.-])?(a|b|rc|dev)[0-9]+)$ ]]; then
            PRERELEASE="true"
          fi

          SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$TAG" --jq '.sha')"
          if [ -z "$SOURCE_SHA" ]; then
            echo "Could not resolve source commit for $TAG" >&2
            exit 1
          fi

          WORKFLOW_BRANCH="$GITHUB_REF_NAME"
          WORKFLOW_SHA="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "push" ]; then
            WORKFLOW_BRANCH="$TAG"
            WORKFLOW_SHA="$SOURCE_SHA"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish_legacy=$PUBLISH_LEGACY" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "workflow_branch=$WORKFLOW_BRANCH" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

  resolve-show-runtime-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve Show Runtime ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          REF=$(gh api repos/avibe-bot/vibe-show-runtime/commits/main --jq '.sha')
          if [ -z "$REF" ]; then
            echo "Failed to resolve avibe-bot/vibe-show-runtime main" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  show-runtime-bundles:
    needs: resolve-show-runtime-ref
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-15-intel
            artifact: darwin-x64
          - os: macos-14
            artifact: darwin-arm64
          - os: windows-latest
            artifact: win32-x64
          - os: windows-11-arm
            artifact: win32-arm64
    steps:
      - name: Checkout Show Runtime
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: avibe-bot/vibe-show-runtime
          ref: ${{ needs.resolve-show-runtime-ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Build Show Runtime bundle
        run: |
          npm ci
          npm run build
          npm run bundle:vibe-remote
          cp dist/vibe-show-runtime-node-*.tgz .
          git rev-parse HEAD > show-runtime-ref-${{ matrix.artifact }}.txt

      - name: Upload Show Runtime bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: show-runtime-${{ matrix.artifact }}
          path: |
            vibe-show-runtime-node-*.tgz
            show-runtime-ref-${{ matrix.artifact }}.txt

  memory-runtime-bundles:
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-14
            artifact: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.9.18"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Build Memory Runtime bundle
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python scripts/build_memory_runtime.py \
            --output-dir runtime-artifacts \
            --platform "${{ matrix.artifact }}" \
            --metadata-output "runtime-artifacts/memory-runtime-1.2.3-${{ matrix.artifact }}.json"

      - name: Upload Memory Runtime bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: memory-runtime-${{ matrix.artifact }}
          path: |
            runtime-artifacts/memory-runtime-*.tar.gz
            runtime-artifacts/memory-runtime-*.json

  build:
    needs:
      - resolve-tag
      - show-runtime-bundles
      - memory-runtime-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.14.0"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Download Show Runtime bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: show-runtime-*
          path: runtime-artifacts
          merge-multiple: true

      - name: Generate Show Runtime manifest
        run: |
          python scripts/generate_show_runtime_manifest.py \
            --archive-dir runtime-artifacts \
            --tag "${{ needs.resolve-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --runtime-ref-file 'runtime-artifacts/show-runtime-ref-*.txt' \
            --output vibe/show_runtime_manifest.json
          cp vibe/show_runtime_manifest.json runtime-artifacts/show-runtime-manifest.json

      - name: Download Memory Runtime bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: memory-runtime-*
          path: runtime-artifacts
          merge-multiple: true

      - name: Generate Memory Runtime manifest
        run: |
          python scripts/generate_memory_runtime_manifest.py \
            --archive-dir runtime-artifacts \
            --tag "${{ needs.resolve-tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --output vibe/memory_runtime_manifest.json
          cp vibe/memory_runtime_manifest.json runtime-artifacts/memory-runtime-manifest.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Pin package version to release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          PACKAGE_VERSION="$(python scripts/release_package_version.py "$RELEASE_TAG")"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AVIBE_OS=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AVIBE_MEMORY=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Verify Show Runtime release assets
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("vibe/show_runtime_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          archives = manifest.get("archives") or {}
          expected = {
              "darwin-arm64",
              "darwin-x64",
              "linux-arm64",
              "linux-x64",
              "win32-arm64",
              "win32-x64",
          }
          missing = expected - set(archives)
          if missing:
              raise SystemExit("Manifest is missing platforms: " + ", ".join(sorted(missing)))

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as file:
                  for chunk in iter(lambda: file.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for platform, archive in sorted(archives.items()):
              path = Path("runtime-artifacts") / archive["name"]
              if not path.exists():
                  raise SystemExit(f"Missing release archive for {platform}: {archive['name']}")
              if archive.get("size") is not None and path.stat().st_size != archive["size"]:
                  raise SystemExit(f"Size mismatch for {archive['name']}")
              if sha256(path) != archive["sha256"]:
                  raise SystemExit(f"Checksum mismatch for {archive['name']}")
          PY

      - name: Install build and test dependencies
        run: pip install -e . build pytest

      - name: Build Python distributions
        run: |
          python -m build --outdir dist packaging/avibe-memory
          python -m build

      - name: Verify Python distribution asset matrix
        run: |
          python - <<'PY'
          from pathlib import Path

          patterns = (
              "avibe_memory-*.whl",
              "avibe_memory-*.tar.gz",
              "avibe_os-*.whl",
              "avibe_os-*.tar.gz",
          )
          for pattern in patterns:
              matches = sorted(Path("dist").glob(pattern))
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one release asset matching {pattern}, found {len(matches)}"
                  )
          PY

      - name: Build 3.0 compatibility legacy PyPI shim
        shell: bash
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          if [ "${{ needs.resolve-tag.outputs.publish_legacy }}" = "true" ]; then
            python scripts/prepare_legacy_pypi_shim.py --tag "$TAG"
            python -m build --outdir dist packaging/vibe-remote-shim
          else
            echo "Skipping legacy vibe-remote shim for $TAG"
          fi

      - name: Verify package runtime manifests
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          core_wheels = [
              wheel
              for wheel in sorted(Path("dist").glob("*.whl"))
              if wheel.name.startswith("avibe_os-")
          ]
          memory_wheels = [
              wheel
              for wheel in sorted(Path("dist").glob("*.whl"))
              if wheel.name.startswith("avibe_memory-")
          ]
          if len(core_wheels) != 1:
              raise SystemExit(f"Expected exactly one avibe-os wheel, found {len(core_wheels)}")
          if len(memory_wheels) != 1:
              raise SystemExit(f"Expected exactly one avibe-memory wheel, found {len(memory_wheels)}")

          with zipfile.ZipFile(core_wheels[0]) as wheel:
              core_names = set(wheel.namelist())
              archives = {
                  name for name in core_names
                  if name.startswith("vibe/show_runtime/") and name.endswith(".tgz")
              }

          if archives:
              raise SystemExit("Wheel unexpectedly contains Show Runtime archives:\n" + "\n".join(sorted(archives)))
          if "vibe/show_runtime_manifest.json" not in core_names:
              raise SystemExit("Wheel is missing vibe/show_runtime_manifest.json")
          if any(name.startswith("vibe/memory_runtime/") for name in core_names):
              raise SystemExit("Wheel unexpectedly contains Memory Runtime archives")
          if "vibe/memory_runtime_manifest.json" in core_names:
              raise SystemExit("avibe-os wheel unexpectedly owns the Memory Runtime manifest")

          with zipfile.ZipFile(memory_wheels[0]) as wheel:
              memory_names = set(wheel.namelist())
          if "vibe/memory_runtime_manifest.json" not in memory_names:
              raise SystemExit("avibe-memory wheel is missing vibe/memory_runtime_manifest.json")
          if any(name.startswith("vibe/memory_runtime/") for name in memory_names):
              raise SystemExit("avibe-memory wheel unexpectedly contains Memory Runtime archives")
          PY

      - name: Verify distribution package matrix
        run: |
          AVIBE_CORE_WHEEL="$(ls dist/avibe_os-*.whl)" \
          AVIBE_MEMORY_WHEEL="$(ls dist/avibe_memory-*.whl)" \
            pytest tests/test_memory_distribution.py -v

      - name: Run Memory Runtime release guard before publication
        run: |
          rm -rf memory-release-guard-assets
          mkdir -p memory-release-guard-assets
          cp vibe/memory_runtime_manifest.json memory-release-guard-assets/memory-runtime-manifest.json
          cp runtime-artifacts/memory-runtime-*.tar.gz memory-release-guard-assets/
          python scripts/memory_runtime_release_guard.py \
            --manifest vibe/memory_runtime_manifest.json \
            verify --asset-dir memory-release-guard-assets

      - name: Run release install and upgrade regressions
        run: |
          docker info
          export VIBE_INSTALL_TEST_WHEEL="$(ls dist/avibe_os-*.whl)"
          pytest \
            tests/test_upgrade_flow.py \
            tests/test_install_script.py \
            tests/e2e/test_install_command.py \
            tests/e2e/test_upgrade_command.py \
            -v

      - name: Checkout release automation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.resolve-tag.outputs.workflow_sha }}
          path: release-automation
          sparse-checkout: scripts/github_release.py
          sparse-checkout-cone-mode: false

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          python release-automation/scripts/github_release.py ensure-draft \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --title "$TAG" \
            --notes "Release assets for $TAG."

          # Runtime archives + manifests are IMMUTABLE per tag and must NOT be
          # re-clobbered. Builds are normalized and pinned, but the wheel published
          # to PyPI is itself immutable. Replacing any hosted runtime byte after that
          # point would desync the wheel's manifest and break integrity checks.
          #
          # Verify immutability BEFORE mutating ANY release asset (including dist/*), so a
          # mismatch fails the job without having already replaced the wheel/sdist. Upload
          # each runtime asset only if absent; if it already exists, require byte-identity.
          existing="$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          tmp="$(mktemp -d)"
          runtime_to_upload=()
          for path in \
            runtime-artifacts/vibe-show-runtime-node-*.tgz \
            runtime-artifacts/show-runtime-manifest.json \
            runtime-artifacts/memory-runtime-*.tar.gz \
            runtime-artifacts/memory-runtime-manifest.json; do
            name="$(basename "$path")"
            if grep -qxF "$name" <<<"$existing"; then
              rm -f "$tmp/$name"
              gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --pattern "$name" --dir "$tmp" --clobber
              if cmp -s "$tmp/$name" "$path"; then
                echo "Release asset '$name' already present and byte-identical; skipping (immutable per tag)."
              else
                echo "::error::Release asset '$name' already exists for $TAG but differs from this run's build." >&2
                echo "::error::Overwriting it would desync the release from the PyPI wheel's manifest. Cut a NEW version instead of re-running the release." >&2
                exit 1
              fi
            else
              runtime_to_upload+=("$path")
            fi
          done

          # Immutability gate passed — only now is it safe to mutate the release.
          if [ "${#runtime_to_upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" "${runtime_to_upload[@]}"
          fi
          # Python distributions are safe to refresh (PyPI itself is skip-existing).
          gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" dist/* --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: dist
          path: dist/

  publish-avibe-memory:
    needs:
      - build
      - finalize-github-release
    runs-on: ubuntu-latest
    environment: pypi-avibe-memory
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Keep avibe-memory distributions only
        shell: bash
        run: |
          find dist -type f ! \( -name 'avibe_memory-*' -o -name 'avibe-memory-*' \) -delete
          test -n "$(find dist -maxdepth 1 -type f -name 'avibe_memory-*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'avibe_memory-*.tar.gz' -print -quit)"

      - name: Publish avibe-memory to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true
        # Uses trusted publishing (OIDC), no API token needed
        # Configure at: https://pypi.org/manage/project/avibe-memory/settings/publishing/

  verify-avibe-memory-pypi:
    needs:
      - resolve-tag
      - build
      - publish-avibe-memory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Download staged distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Verify PyPI serves the exact avibe-memory wheel
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          staged_wheels=(dist/avibe_memory-*.whl)
          if [ "${#staged_wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one staged avibe-memory wheel, found ${#staged_wheels[@]}." >&2
            exit 1
          fi

          package_version="$(python scripts/release_package_version.py "$RELEASE_TAG")"
          download_dir="$RUNNER_TEMP/avibe-memory-pypi"
          mkdir -p "$download_dir"

          for attempt in {1..12}; do
            find "$download_dir" -mindepth 1 -maxdepth 1 -type f -delete
            if python -m pip --isolated download \
              --index-url https://pypi.org/simple \
              --disable-pip-version-check \
              --no-deps \
              --no-cache-dir \
              --only-binary=:all: \
              --dest "$download_dir" \
              "avibe-memory==$package_version"; then
              public_wheels=("$download_dir"/avibe_memory-*.whl)
              if [ "${#public_wheels[@]}" -ne 1 ]; then
                echo "::error::Expected exactly one public avibe-memory wheel, found ${#public_wheels[@]}." >&2
                exit 1
              fi
              if cmp -s "${staged_wheels[0]}" "${public_wheels[0]}"; then
                echo "PyPI serves the exact staged avibe-memory wheel for $package_version."
                exit 0
              fi
              echo "::error::PyPI already serves a non-identical avibe-memory wheel for $package_version." >&2
              exit 1
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "::error::PyPI did not serve the avibe-memory wheel for $package_version after $attempt attempts." >&2
              exit 1
            fi
            sleep 10
          done

  publish-avibe-os:
    needs:
      - build
      - finalize-github-release
      - verify-avibe-memory-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Keep avibe-os distributions only
        shell: bash
        run: |
          find dist -type f ! \( -name 'avibe_os-*' -o -name 'avibe-os-*' \) -delete
          test -n "$(find dist -maxdepth 1 -type f -name 'avibe_os-*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name 'avibe_os-*.tar.gz' -print -quit)"

      - name: Publish avibe-os to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true
        # Uses trusted publishing (OIDC), no API token needed
        # Configure at: https://pypi.org/manage/project/avibe-os/settings/publishing/

  publish-vibe-remote:
    needs:
      - resolve-tag
      - build
      - finalize-github-release
    if: needs.resolve-tag.outputs.publish_legacy == 'true'
    runs-on: ubuntu-latest
    # PyPI trusted publishers issue project-scoped tokens for the exact OIDC
    # claim, including the GitHub environment. Keep the legacy shim on a
    # separate environment so it can be configured for the vibe-remote project
    # without colliding with the avibe-os publisher.
    environment: pypi-vibe-remote
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Keep vibe-remote distributions only
        shell: bash
        run: |
          find dist -type f ! \( -name 'vibe_remote-*' -o -name 'vibe-remote-*' \) -delete
          test -n "$(find dist -maxdepth 1 -type f -name 'vibe_remote-*' -print -quit)"

      - name: Publish vibe-remote to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true
        # Uses trusted publishing (OIDC), no API token needed
        # Configure at: https://pypi.org/manage/project/vibe-remote/settings/publishing/

  finalize-github-release:
    needs:
      - resolve-tag
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ needs.resolve-tag.outputs.workflow_sha }}

      - name: Wait for exact-source release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/github_release.py wait-notes \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.resolve-tag.outputs.tag }}" \
            --workflow release_ai.yml \
            --branch "${{ needs.resolve-tag.outputs.workflow_branch }}" \
            --run-sha "${{ needs.resolve-tag.outputs.workflow_sha }}" \
            --source-sha "${{ needs.resolve-tag.outputs.source_sha }}" \
            --event "${{ github.event_name }}" \
            --timeout 3600 \
            --interval 15

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LATEST_MODE="preserve"
          if [ "${{ needs.resolve-tag.outputs.prerelease }}" = "true" ]; then
            LATEST_MODE="false"
          elif [ "${{ github.event_name }}" = "push" ]; then
            LATEST_MODE="true"
          fi

          python scripts/github_release.py finalize \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.resolve-tag.outputs.tag }}" \
            --prerelease "${{ needs.resolve-tag.outputs.prerelease }}" \
            --latest "$LATEST_MODE"
