name: Guard Memory Runtime releases

on:
  push:
    branches: [master]
    paths:
      - "scripts/memory_runtime_release_guard.py"
      - ".github/workflows/memory-runtime-release-guard.yml"
  schedule:
    - cron: "29 */6 * * *"
    - cron: "53 4 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: memory-runtime-release-guard
  cancel-in-progress: false

jobs:
  resolve_manifests:
    name: Resolve published Memory Runtime manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      available: ${{ steps.manifests.outputs.available }}
      manifests: ${{ steps.manifests.outputs.manifests }}
      excluded: ${{ steps.manifests.outputs.excluded }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Resolve every published Memory Runtime manifest
        id: manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/memory-runtime-candidate"
          records_file="$RUNNER_TEMP/memory-runtime-manifests.jsonl"
          excluded_file="$RUNNER_TEMP/memory-runtime-excluded.jsonl"
          mkdir -p "$candidate_dir"
          : > "$records_file"
          : > "$excluded_file"
          while IFS= read -r candidate_tag; do
            rm -rf "$candidate_dir"
            mkdir -p "$candidate_dir"
            if ! gh release download "$candidate_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'avibe_os-*.whl' --dir "$candidate_dir" >/dev/null 2>&1; then
              jq -nc --arg release_tag "$candidate_tag" \
                --arg reason "published wheel could not be downloaded" \
                '{release_tag: $release_tag, reason: $reason}' >> "$excluded_file"
              continue
            fi
            asset_names="$(
              gh release view "$candidate_tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name'
            )"
            if grep -Eq '^avibe_memory-.*\.whl$' <<<"$asset_names"; then
              gh release download "$candidate_tag" --repo "$GITHUB_REPOSITORY" \
                --pattern 'avibe_memory-*.whl' --dir "$candidate_dir" >/dev/null
            fi
            set +e
            discovery_output="$(
              python3 scripts/memory_runtime_release_guard.py \
                discover-manifest --asset-dir "$candidate_dir" \
                --output-manifest "$candidate_dir/memory-runtime-manifest.json" \
                --release-tag "$candidate_tag" 2>&1
            )"
            discovery_status=$?
            set -e
            # Explicitly retain releases that predate the managed runtime as
            # manifest-free legacy releases. Transition package failures are fatal.
            if [ "$discovery_status" -eq 4 ]; then
              continue
            elif [ "$discovery_status" -ne 0 ]; then
              echo "$discovery_output" >&2
              exit "$discovery_status"
            fi
            manifest_owner="$(jq -r '.manifest_owner' <<<"$discovery_output")"
            manifest="$candidate_dir/memory-runtime-manifest.json"
            manifest_sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
            set +e
            policy_output="$(
              python3 scripts/memory_runtime_release_guard.py \
                --manifest "$manifest" check-policy 2>&1
            )"
            policy_status=$?
            set -e
            if [ "$policy_status" -eq 0 ]; then
              jq -nc --arg release_tag "$candidate_tag" --arg sha256 "$manifest_sha" \
                --arg owner "$manifest_owner" \
                '{release_tag: $release_tag, sha256: $sha256, owner: $owner}' >> "$records_file"
            elif [ "$policy_status" -eq 2 ]; then
              policy_reason="$(jq -r '.error // "manifest excluded by policy"' <<<"$policy_output")"
              jq -nc --arg release_tag "$candidate_tag" --arg reason "$policy_reason" \
                '{release_tag: $release_tag, reason: $reason}' >> "$excluded_file"
            else
              echo "$policy_output" >&2
              exit "$policy_status"
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(any(.assets[]?; (.name | startswith("avibe_os-")) and (.name | endswith(".whl")))) | .tag_name'
          )
          RECORDS_FILE="$records_file" EXCLUDED_FILE="$excluded_file" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_records(name: str) -> list[dict[str, str]]:
              return [
                  json.loads(line)
                  for line in Path(os.environ[name]).read_text().splitlines()
                  if line.strip()
              ]

          records = load_records("RECORDS_FILE")
          excluded = load_records("EXCLUDED_FILE")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"available={'true' if records else 'false'}\n")
              output.write(f"manifests={json.dumps(records, separators=(',', ':'))}\n")
              output.write(f"excluded={json.dumps(excluded, separators=(',', ':'))}\n")

          guarded_tags = [record["release_tag"] for record in records]
          print(f"Guarded Memory Runtime manifests ({len(records)}): {', '.join(guarded_tags) or 'none'}")
          print(f"Excluded Memory Runtime manifests ({len(excluded)}):")
          for record in excluded:
              print(f"- {record['release_tag']}: {record['reason']}")
          if not excluded:
              print("- none")

          summary = [
              "## Memory Runtime release guard coverage",
              "",
              f"Guarded Memory Runtime manifests ({len(records)}): "
              f"{', '.join(guarded_tags) or 'none'}",
              "",
              f"Excluded Memory Runtime manifests ({len(excluded)}):",
          ]
          summary.extend(
              f"- `{record['release_tag']}`: {record['reason']}" for record in excluded
          )
          if not excluded:
              summary.append("- none")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          PY

  guard:
    name: Verify and recover ${{ matrix.manifest.release_tag }}
    needs: resolve_manifests
    if: needs.resolve_manifests.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.resolve_manifests.outputs.manifests) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Resolve selected published Memory Runtime manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.manifest.release_tag }}
          EXPECTED_SHA256: ${{ matrix.manifest.sha256 }}
          EXPECTED_OWNER: ${{ matrix.manifest.owner }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/memory-runtime-packages"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'avibe_os-*' --dir "$package_dir" >/dev/null
          if [ "$EXPECTED_OWNER" = "memory" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'avibe_memory-*' --dir "$package_dir" >/dev/null
          fi
          discovery_output="$(
            python3 scripts/memory_runtime_release_guard.py \
              discover-manifest --asset-dir "$package_dir" \
              --output-manifest "$package_dir/memory-runtime-manifest.json" \
              --release-tag "$RELEASE_TAG"
          )"
          test "$(jq -r '.manifest_owner' <<<"$discovery_output")" = "$EXPECTED_OWNER"
          manifest="$package_dir/memory-runtime-manifest.json"
          test "$(sha256sum "$manifest" | cut -d' ' -f1)" = "$EXPECTED_SHA256"

      - name: Verify Memory distribution ownership and isolated sdist rebuilds
        if: matrix.manifest.owner == 'memory'
        run: |
          python3 -m pip install build
          python3 scripts/memory_runtime_release_guard.py \
            --manifest "$RUNNER_TEMP/memory-runtime-packages/memory-runtime-manifest.json" \
            verify-packages --asset-dir "$RUNNER_TEMP/memory-runtime-packages"

      - name: Fetch and verify published assets
        id: probe
        env:
          RELEASE_TAG: ${{ matrix.manifest.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          probe_output="$(
            python3 scripts/memory_runtime_release_guard.py \
              --manifest "$RUNNER_TEMP/memory-runtime-packages/memory-runtime-manifest.json" \
              fetch --output-dir "$RUNNER_TEMP/memory-runtime-release" 2>&1
          )"
          probe_status=$?
          set -e
          echo "$probe_output"
          failure_kind="$(jq -r '.failure_kind // empty' <<<"$probe_output" 2>/dev/null || true)"
          if [ "$probe_status" -eq 0 ]; then
            echo "result=verified" >> "$GITHUB_OUTPUT"
          elif [ "$probe_status" -eq 1 ] && [ "$failure_kind" = "bytes" ]; then
            echo "result=bytes_failure" >> "$GITHUB_OUTPUT"
          elif [ "$probe_status" -eq 2 ] && [ "$failure_kind" = "policy" ]; then
            echo "result=policy_excluded" >> "$GITHUB_OUTPUT"
            echo "::notice title=Memory Runtime manifest excluded by policy::$RELEASE_TAG: $probe_output"
            echo "- Guard-time exclusion for \`$RELEASE_TAG\`: $probe_output" >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$probe_status"
          fi

      - name: Recover missing assets from latest verified backup
        if: steps.probe.outputs.result == 'bytes_failure'
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA: ${{ matrix.manifest.sha256 }}
          RELEASE_TAG: ${{ matrix.manifest.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="memory-runtime-release-backup-$MANIFEST_SHA"
          restore_dir="$RUNNER_TEMP/memory-runtime-restore"
          backup_run=""
          # Resolve the run from the artifact itself rather than scanning recent
          # runs: backups are retained for 90 days, but a fixed window of the
          # last 50 successful runs covers only about 12 days at the six-hourly
          # schedule, so a live backup outside it was unreachable.
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            rm -rf "$restore_dir"
            mkdir -p "$restore_dir"
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" --dir "$restore_dir"; then
              backup_run="$run_id"
              break
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
              --jq '[.artifacts[]? | select(.expired == false)]
                    | sort_by(.created_at) | reverse | .[].workflow_run.id'
          )
          if [ -z "$backup_run" ]; then
            echo "::error::No verified Memory Runtime backup is available for manifest $MANIFEST_SHA."
            exit 1
          fi
          python3 scripts/memory_runtime_release_guard.py \
            --manifest "$RUNNER_TEMP/memory-runtime-packages/memory-runtime-manifest.json" \
            verify --asset-dir "$restore_dir"

          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          missing=()
          for asset in "$restore_dir"/*; do
            name="$(basename "$asset")"
            if ! grep -qxF "$name" <<<"$existing"; then
              missing+=("$asset")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "::error::All asset names exist but integrity failed; refusing to overwrite immutable runtime bytes."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${missing[@]}"

      - name: Verify recovered release
        if: steps.probe.outputs.result == 'bytes_failure'
        run: |
          python3 scripts/memory_runtime_release_guard.py \
            --manifest "$RUNNER_TEMP/memory-runtime-packages/memory-runtime-manifest.json" \
            fetch --output-dir "$RUNNER_TEMP/memory-runtime-release"

      - name: Check whether this manifest already has a backup
        id: backup
        if: >-
          steps.probe.outputs.result == 'verified' ||
          steps.probe.outputs.result == 'bytes_failure'
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA: ${{ matrix.manifest.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          # Backups are keyed by manifest hash, so a newly published manifest has
          # no artifact to recover from until its first upload. Without this
          # check the six-hourly run skips the upload whenever the probe passes,
          # leaving a window of up to a week -- until the Sunday cron -- in which
          # an asset that disappears cannot be restored at all.
          artifact_name="memory-runtime-release-backup-$MANIFEST_SHA"
          existing="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
            --jq '[.artifacts[]? | select(.expired == false)] | length')"
          if [ "${existing:-0}" -gt 0 ]; then
            echo "Manifest $MANIFEST_SHA already has $existing live backup artifact(s)."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "Manifest $MANIFEST_SHA has no live backup artifact yet."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve verified release backup
        if: >-
          (steps.probe.outputs.result == 'verified' ||
           steps.probe.outputs.result == 'bytes_failure') &&
          (github.event_name != 'schedule' ||
           github.event.schedule == '53 4 * * 0' ||
           steps.probe.outputs.result == 'bytes_failure' ||
           steps.backup.outputs.missing == 'true')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: memory-runtime-release-backup-${{ matrix.manifest.sha256 }}
          path: ${{ runner.temp }}/memory-runtime-release
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
