name: desktop-signpath-test

# Standalone, explicit TEST signing only. Do not add workflow_call: GitHub
# validates every nested job's permissions before evaluating its `if`, so this
# action's actions:read permission must stay outside the release call graph.
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer prerelease stamped into the test installer (e.g. 0.0.0-rc.1)
        required: true
        type: string
      signpath_test:
        description: Explicitly enable TEST signing of the Windows installer
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  # SignPath signs only the outer NSIS installer PE with its test certificate;
  # the executables inside stay unsigned. Build and verification reference no
  # secret; the sign job never checks out or runs repository code.
  # See docs/plans/2026-11-04-signpath-test-signing.md for the origin allowlist.
  signpath-test-build:
    name: SignPath test / build Windows installer
    if: inputs.signpath_test == true
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Resolve build cache identity
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "rustc=$(rustc -vV | python -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:16])')" >> "$GITHUB_OUTPUT"

      # The same Windows dependency cache the package job uses, restored only.
      - name: Restore Rust build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target/release/.fingerprint
            desktop/target/release/build
            desktop/target/release/deps
            desktop/target/cua-driver-patched
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-desktop-package-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/cua-driver/sources.json') }}
          restore-keys: ${{ runner.os }}-x86_64-pc-windows-msvc-desktop-package-${{ steps.toolchain.outputs.rustc }}-

      - name: Build Workbench
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build bootstrap UI
        working-directory: desktop
        run: |
          npm ci
          npm run build

      # A test-signed installer never carries a stable version number.
      - name: Prepare test package version
        shell: bash
        env:
          AVIBE_DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$AVIBE_DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]] || {
            echo "SignPath test builds require a SemVer prerelease version" >&2
            exit 1
          }
          python scripts/desktop_release.py prepare \
            --version "$AVIBE_DESKTOP_VERSION" --config desktop/tauri.release.conf.json \
            --env-file "$GITHUB_ENV" --target x86_64-pc-windows-msvc

      - name: Disable the updater
        shell: bash
        run: >
          python scripts/desktop_updater.py configure
          --config desktop/tauri.release.conf.json --env-file "$GITHUB_ENV"

      - name: Build verified private Runtime
        run: >
          python desktop/scripts/build-runtime-bundle.py
          --target x86_64-pc-windows-msvc

      - name: Build self-contained installer
        working-directory: desktop
        run: >
          npm run tauri --
          build
          --bundles nsis
          --features bundled-runtime
          --config tauri.release.conf.json
          -- --locked

      # SignPath's windows-installer-test configuration signs exactly this one
      # file at the root of the artifact ZIP.
      - name: Stage unsigned installer for SignPath
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/target/release/bundle/nsis/*setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned installer" }
          New-Item -ItemType Directory -Path signpath-test/unsigned | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination signpath-test/unsigned/Avibe-test-setup.exe

      - name: Upload unsigned installer for SignPath
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: avibe-signpath-test-unsigned
          path: signpath-test/unsigned/Avibe-test-setup.exe
          if-no-files-found: error
          retention-days: 3

  signpath-test-sign:
    name: SignPath test / sign installer
    needs: signpath-test-build
    if: inputs.signpath_test == true
    runs-on: ubuntu-latest
    environment: signpath-test
    permissions:
      contents: read
      actions: read
    outputs:
      signing-request-id: ${{ steps.sign.outputs.signing-request-id }}
      signing-request-url: ${{ steps.sign.outputs.signing-request-web-url }}
    steps:
      - name: Submit installer to SignPath test signing
        id: sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_TEST_API_TOKEN }}
          organization-id: cd712383-10e4-47d1-8267-d395bd8104b1
          project-slug: avibe
          signing-policy-slug: test-signing
          artifact-configuration-slug: windows-installer-test
          github-artifact-id: ${{ needs.signpath-test-build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-test/signed

      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: avibe-signpath-test-signed
          path: signpath-test/signed/
          if-no-files-found: error
          retention-days: 3

  signpath-test-verify:
    name: SignPath test / verify signed installer
    needs: [signpath-test-build, signpath-test-sign]
    if: inputs.signpath_test == true
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download unsigned installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: avibe-signpath-test-unsigned
          path: signpath-test/unsigned

      - name: Download signed installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: avibe-signpath-test-signed
          path: signpath-test/signed

      # Pinned certificate identity, a Valid Authenticode verdict under
      # ephemeral trust, payload equality, and negative controls; see the script.
      - name: Verify test signature independently
        shell: bash
        env:
          AVIBE_DESKTOP_VERSION: ${{ inputs.version }}
          SIGNPATH_SIGNING_REQUEST_ID: ${{ needs.signpath-test-sign.outputs.signing-request-id }}
          SIGNPATH_SIGNING_REQUEST_URL: ${{ needs.signpath-test-sign.outputs.signing-request-url }}
        run: |
          set -euo pipefail
          report=signpath-test/report/signpath-test-report.json
          python desktop/scripts/signpath_test_signing.py verify \
            --unsigned-dir signpath-test/unsigned --signed-dir signpath-test/signed --report "$report"
          {
            echo "## SignPath TEST signing (not production)"
            echo
            echo "Only the outer NSIS installer PE is signed; the executables it embeds are not."
            echo
            echo '```json'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: avibe-signpath-test-report
          path: signpath-test/report/signpath-test-report.json
          if-no-files-found: error
          retention-days: 14
