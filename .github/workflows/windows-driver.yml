name: windows-driver

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Windows ordinary-user driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned driver validation dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: "PyYAML==6.0.3"

      - name: Verify Windows Cua Driver security boundary as ordinary user
        working-directory: desktop
        shell: pwsh
        run: ./scripts/test-windows-driver-source.ps1 -CaptureProductionDriver

      # Only a successful native run can issue this index. Keep partial logs and
      # test failures available below without labeling them a passing receipt.
      - name: Bind production binary and test receipts to the candidate
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path

          root, = Path(os.environ['RUNNER_TEMP']).glob('avibe-windows-driver-security-*')
          provenance = json.loads((root / 'provenance.json').read_text(encoding='utf-8-sig'))
          sha = os.environ['GITHUB_SHA']
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != sha or provenance['avibe_head'] != sha:
              raise SystemExit('Native verification did not use the candidate checkout')
          binary = root / 'production' / 'cua-driver.exe'
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          production_sha256 = digest(binary)
          if provenance['production_binary_sha256'] != production_sha256:
              raise SystemExit('Production binary does not match native verification')
          receipts = {p.name: digest(p) for p in sorted(root.glob('junit-*.xml'))}
          if 'junit-no-skip-count-guard.xml' not in receipts or len(receipts) < 2:
              raise SystemExit('Missing native test receipts')
          index = {'candidate_sha': sha, 'production_binary_sha256': production_sha256, 'junit_sha256': receipts}
          (root / 'candidate.json').write_text(json.dumps(index, indent=2) + '\n', encoding='utf-8')

      - name: Upload Windows Cua Driver security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-cua-driver-security-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/avibe-windows-driver-security-*/candidate.json
            ${{ runner.temp }}/avibe-windows-driver-security-*/provenance.json
            ${{ runner.temp }}/avibe-windows-driver-security-*/junit-*.xml
            ${{ runner.temp }}/avibe-windows-driver-security-*/logs/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Cua Driver production metadata and binary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-cua-driver-production-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/avibe-windows-driver-security-*/production/**
          if-no-files-found: error
          retention-days: 14
