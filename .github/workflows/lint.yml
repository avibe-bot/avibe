name: lint

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  memory-insight-contract:
    # Repository branch protection still requires this historical context name.
    # An administrator can rename that requirement after this compatibility job
    # has landed; the job itself is a substantive removal contract, not a shim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Prepare hermetic UI asset placeholder
        run: |
          mkdir -p ui/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > ui/dist/index.html
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.12.10
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-ci-uv-0.12.10-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Install package and test dependencies
        run: uv pip install --system -e . --group dev
      - name: Validate removed-feature compatibility contract
        run: |
          pytest -q tests/test_memory_removal.py tests/test_admin_notifications.py \
            tests/test_message_facts_generic.py

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Run pre-commit (ruff)
        run: |
          pip install pre-commit
          pre-commit run --all-files

  ui-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.14.0"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Validate and test UI
        working-directory: ui
        run: |
          npm ci
          npm run validate:theme
          npm run lint
          # Production tsc excludes test files, and vitest only strips types.
          npm run typecheck:tests
          npm test

      - name: Test browser interactions
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:model-catalog
          npm run test:model-provider
          npm run test:onboarding-fidelity -- hub-ownership.spec.ts
          npm run test:project-order
          npm run test:inbox-return
          npm run test:badge-triggers
          npm run test:workbench-general -- sidebar-floating.spec.ts

  show-router-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: avibe-bot/vibe-show-runtime
          # Producer of the checked-in generated router. Release builds export
          # it again from the same Runtime source as their platform archives.
          ref: 5a9a6a52f2ae03611d617a659bfd0c1c32389478
          path: .show-runtime-test
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: .show-runtime-test/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.12.10
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-ci-uv-0.12.10-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - run: uv sync --frozen --no-install-project
      - name: Build the real Runtime
        working-directory: .show-runtime-test
        run: |
          npm ci
          npm run build -w @avibe/show-sdk
          npm run build -w @avibe/show-ui
          npm run build -w @avibe/show-runtime
      - name: Check Python scaffold through Runtime HTTP
        run: node scripts/check_show_router.mjs --runtime-root .show-runtime-test --python .venv/bin/python

  build-linux-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # Both distributions use VCS-derived versions; a shallow PR merge
          # checkout falls back to 0.1.dev1 instead of the 3.0 release line.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.14.0"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI assets
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Build package artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AVIBE_PACKAGE_CONTRACT_VERSION: 3.0.99rc1
          SETUPTOOLS_SCM_PRETEND_VERSION: 3.0.99rc1
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AVIBE_OS: 3.0.99rc1
        run: |
          # Build backends are installed by each isolated PEP 517 build.
          python -m pip install --disable-pip-version-check build
          python scripts/prepare_local_show_runtime_manifest.py
          python -m build

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: ui-dist-linux
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: vibe-wheel-linux
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

      # Keep the existing core-only wheel artifact stable for all consumers.
      # companion artifact, consumed only by the distribution contracts.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: vibe-package-contracts-linux
          path: |
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  unit-test-shards:
    name: unit-tests (${{ matrix.shard }}/${{ matrix.shard-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
        shard-total: [6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      # Editable installs require the force-included directory, but unit tests
      # build their own UI fixtures and do not need the production bundle.
      - name: Prepare minimal UI asset placeholder
        run: |
          mkdir -p ui/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > ui/dist/index.html

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      # Exact setup-uv versions still fetch a remote manifest on a cold runner.
      - name: Install pinned uv
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.12.10

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-ci-uv-0.12.10-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install package and test deps
        # Install the declared dev group instead of a hand-listed set so test
        # dependencies (pytest, pytest-asyncio for asyncio_mode="auto",
        # jsonschema) cannot drift from pyproject.
        run: uv pip install --system -e . --group dev

      - name: Run unit tests shard ${{ matrix.shard }}/${{ matrix.shard-total }}
        run: bash scripts/ci_unit_tests.sh "${{ matrix.shard }}" "${{ matrix.shard-total }}"

  unit-tests:
    runs-on: ubuntu-latest
    # Keep UI validation in the existing required gate while allowing artifact
    # consumers to start as soon as their production bundle is built.
    needs: [unit-test-shards, ui-checks]
    if: always()
    steps:
      - name: Verify unit test shards and UI checks
        env:
          UNIT_RESULT: ${{ needs['unit-test-shards'].result }}
          UI_RESULT: ${{ needs['ui-checks'].result }}
        run: |
          for result in "$UNIT_RESULT" "$UI_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Unit/UI checks finished with result: $result"
              exit 1
            fi
          done
          echo "All unit test shards and UI checks passed."

  migration-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # The guard reads each release's migration graph straight out of git. The
          # default shallow checkout fetches no tags, which would leave it with no
          # shipped graph to compare against.
          fetch-depth: 0

      # Editable installs require the force-included directory; this job only needs the
      # migration chain to import.
      - name: Prepare minimal UI asset placeholder
        run: |
          mkdir -p ui/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > ui/dist/index.html

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.12.10

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-ci-uv-0.12.10-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install package and test deps
        run: uv pip install --system -e . --group dev

      - name: Guard the migration graph against every released version
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/migration-release-guard.log"
          python -m pytest tests/test_migration_release_guard.py -ra | tee "$output"
          # The release-history properties skip themselves when no tags are reachable so
          # the sharded unit job stays green on its shallow checkout. This job is the one
          # that supplies the history, so here a skip means the guard proved nothing.
          if grep -Eq '(^|[[:space:]])[0-9]+ skipped|SKIPPED' "$output"; then
            echo "The migration release guard must not skip: this checkout reached no release history."
            exit 1
          fi

  npm-wrapper:
    runs-on: [self-hosted, Linux, X64, avibe]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "20"

      - name: Test npm entrypoint
        working-directory: npm/avibe
        run: npm test

      - name: Validate npm package contents
        working-directory: npm/avibe
        run: npm pack --dry-run

  install-upgrade-shards:
    name: install-upgrade-regression (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: build-linux-artifacts
    strategy:
      fail-fast: false
      matrix:
        suite: [installer]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ui-dist-linux
          path: ui/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: vibe-wheel-linux
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        if: matrix.suite == 'installer'
        with:
          name: vibe-package-contracts-linux
          path: dist

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps uv==0.12.10

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-ci-uv-0.12.10-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install package and test dependencies
        run: |
          uv pip install --system dist/*.whl pytest

      - name: Prepare Show Runtime manifest for fixture wheels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prepare_local_show_runtime_manifest.py

      - name: Verify built distribution contracts
        if: matrix.suite == 'installer'
        env:
          AVIBE_PACKAGE_CONTRACT_VERSION: 3.0.99rc1
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/distribution-contracts.log"
          AVIBE_CORE_WHEEL="$(ls dist/avibe_os-*.whl)" \
          AVIBE_CORE_SDIST="$(ls dist/avibe_os-*.tar.gz)" \
            pytest tests/test_distribution_artifacts.py -v -ra | tee "$output"
          if grep -Eq '(^|[[:space:]])[0-9]+ skipped|SKIPPED' "$output"; then
            echo "Distribution contracts must not skip."
            exit 1
          fi

      - name: Run install and upgrade regressions
        if: matrix.suite == 'installer'
        run: |
          docker info
          export VIBE_INSTALL_TEST_WHEEL="$(ls dist/*.whl)"
          pytest \
            tests/test_upgrade_flow.py \
            tests/test_install_generations.py \
            tests/test_install_script.py \
            tests/e2e/test_install_command.py \
            -v

  install-upgrade-regression:
    runs-on: ubuntu-latest
    needs: install-upgrade-shards
    if: always()
    steps:
      - name: Verify all install and upgrade suites
        env:
          INSTALL_RESULT: ${{ needs['install-upgrade-shards'].result }}
        run: |
          if [ "$INSTALL_RESULT" != "success" ]; then
            echo "Install/upgrade suites finished with result: $INSTALL_RESULT"
            exit 1
          fi
          echo "All install and upgrade suites passed."

  windows-install-smoke:
    runs-on: windows-latest
    needs: build-linux-artifacts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: vibe-wheel-linux
          path: dist

      - name: Run Windows installer smoke test
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          if (-not $wheel) {
            throw "Missing wheel artifact"
          }

          $env:AVIBE_INSTALL_PACKAGE_SPEC = $wheel
          & .\install.ps1 *>&1 | Tee-Object -FilePath install-output.log

          if (-not (Select-String -Path install-output.log -Pattern 'avibe-os installed successfully \(from custom package spec\)' -Quiet)) {
            throw "Installer output missing custom package success message"
          }

          # Exercise the real hardlink/copy launcher and process inspection on
          # Windows, not just mocked link fallbacks in the Python unit suite.
          1..3 | ForEach-Object {
            & .\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "Repeated installer failed" }
            $generations = @(Get-ChildItem "$env:USERPROFILE\.avibe\runtime\install-generations" -Directory)
            if ($generations.Count -ne 2) { throw "Expected two managed generations, found $($generations.Count)" }
          }

      - name: Verify vibe in fresh PowerShell session
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path', 'User')

          $vibeCommand = Get-Command vibe -ErrorAction Stop
          $vibeCommand | Out-String | Tee-Object -FilePath vibe-command.log
          vibe version | Tee-Object -FilePath vibe-version.log

          if (-not $vibeCommand.Source.ToLowerInvariant().EndsWith('vibe.exe')) {
            throw "Get-Command vibe did not resolve to vibe.exe"
          }

          if (-not (Select-String -Path vibe-version.log -Pattern 'avibe-os ' -Quiet)) {
            throw "vibe version output missing expected marker"
          }

  windows-control-ipc:
    runs-on: windows-latest
    needs: build-linux-artifacts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: vibe-wheel-linux
          path: dist

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install package and focused test dependency
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          if (-not $wheel) {
            throw "Missing wheel artifact"
          }
          python -m pip install $wheel pytest

      - name: Verify Windows Controller control IPC
        run: python -m pytest tests/test_control_ipc.py -q

      # Windows byte-range locks are mandatory and per-handle, so a lock taken
      # over the bytes of a record makes that record unreadable to every other
      # handle -- including this process's own. Nothing on Linux can observe
      # that: POSIX file locks are advisory and never deny a read. This is the
      # one place in CI where the service lock's readability can be tested at
      # all, and it needs neither a packaged Runtime nor an installer.
      - name: Verify the Windows service lock keeps its record readable
        run: python -m pytest tests/test_service_lock_record.py -q

      # `vibe stop` walks every process on the machine before it signals
      # anything. On Linux a process whose command line psutil cannot read
      # costs a /proc read; on Windows it cost a `powershell` launch, and a
      # second `pwsh` when the first said nothing. Only a real Windows process
      # table holds enough unreadable processes to turn that into a stop that
      # produces no output and never returns, which is how gh-v3.1.1rc10 died
      # -- and like the two steps above, showing it needs neither a packaged
      # Runtime nor an installer, so it does not have to cost a release.
      - name: Verify the process scan stays off the external shell
        run: python -m pytest tests/test_runtime_process_scan.py -q
