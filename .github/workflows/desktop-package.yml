name: desktop-self-contained-package

# Release (tag) builds Developer ID sign and notarize every macOS layer. The
# Windows NSIS build is intentionally unsigned here; a downstream job binds the
# `windows-signing` environment for TEST and stable release tags, signs exactly
# the final installer, and then rebuilds all release metadata from those signed
# bytes.
#
# Caches have one writer: the unsigned warm-up, which runs on master only (a
# push that changes a desktop build input, and a daily run), builds every
# target, and signs and uploads nothing. Release and manual builds restore its
# default-branch entries by exact key and never save; a miss rebuilds from
# source. desktop-cache-keepalive.yml performs the separate five-day lookup-only
# observation and tells an operator to run the warm-up when a cache is missing,
# unreadable, or not refreshed.
#
# The warm-up is also the only Intel Mac build between stable releases: an RC
# builds the targets its caller names, which leave out x86_64-apple-darwin, and
# pull request CI compiles the shell for Apple silicon and Windows only. Its
# push paths cover native sources, packaging helpers and locked dependencies;
# the scheduled run also covers other changes and hosted toolchain updates.
on:
  push:
    branches: [master]
    paths:
      - desktop/**
      - "!desktop/**/*.md"
      - uv.lock
      - scripts/desktop_release.py
      - scripts/desktop_updater.py
      - scripts/release_package_version.py
      - .github/workflows/desktop-package.yml
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version stamped into the desktop application and installer
        required: true
        type: string
      warmup:
        description: Retry the unsigned master cache warm-up (maintenance use only)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        description: Exact peeled commit of the validated TEST tag
        required: true
        type: string
      updater_enabled:
        description: Require cryptographically signed updater artifacts
        type: boolean
        default: false
      release_tag:
        description: Canonical gh-vX.Y.ZrcN TEST or vX.Y.Z stable tag
        required: true
        type: string
      targets:
        description: JSON array of the target triples to build; empty builds every target
        type: string
        default: ""

concurrency:
  group: desktop-package-${{ inputs.release_tag || github.ref }}
  # Only master cache warm-ups may cancel an older warm-up. Release and manual
  # non-warm-up builds must not cancel one another. workflow_call has no warmup
  # input: compare explicitly so this expression returns a boolean when called
  # by workflow_dispatch. A missing value prevents Actions from expanding jobs.
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || inputs.warmup == true) && github.ref == 'refs/heads/master' && !inputs.release_tag }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.target }}
    # Each target builds on its own architecture. A target this map does not
    # name resolves to no runner, so the job cannot start.
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-26","x86_64-apple-darwin":"macos-26-intel","x86_64-pc-windows-msvc":"windows-latest"}')[matrix.target] }}
    environment: desktop-updater
    env:
      # Never a release: a release build always carries its tag.
      DESKTOP_CACHE_WARMUP: ${{ !inputs.release_tag && github.ref == 'refs/heads/master' && ((github.event_name == 'push' || github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.warmup)) }}
      DESKTOP_VERSION: ${{ inputs.version || '0.0.0' }}
      DEVELOPER_DIR: ${{ contains(matrix.target, '-apple-') && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
      DESKTOP_BUNDLE: ${{ contains(matrix.target, '-apple-') && 'app' || 'nsis' }}
    strategy:
      fail-fast: false
      matrix:
        # A static `include` list cannot be narrowed: an entry that matches no
        # combination adds one. The caller's list is therefore the whole matrix,
        # and everything else about a target follows from its operating system.
        target: ${{ fromJSON(inputs.targets || '["aarch64-apple-darwin","x86_64-apple-darwin","x86_64-pc-windows-msvc"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Report pinned Apple toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          [ -d "$DEVELOPER_DIR" ] || {
            echo "Pinned Xcode is missing: $DEVELOPER_DIR" >&2
            exit 1
          }
          xcodebuild -version
          [ "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6" ] || {
            echo "Expected Xcode 26.6 from $DEVELOPER_DIR" >&2
            exit 1
          }
          xcrun --sdk macosx --show-sdk-version
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      # Cargo artifacts and a prepared Cua Driver are reused only from the same
      # compiler and Apple SDK; a toolchain change starts a new cache entry.
      - name: Resolve build cache identity
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          fingerprint() {
            python -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:16])'
          }
          echo "rustc=$(rustc -vV | fingerprint)" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "apple=$({ xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; } | fingerprint)" >> "$GITHUB_OUTPUT"
          fi

      # Cargo's dependency output for the Tauri build: bundles and final
      # binaries are rebuilt every time, and the Cua Driver's own build tree is
      # left out because the prepared driver has its own entry. Every build
      # restores this exact key or nothing, so a warm-up entry starts clean and
      # a release never reuses output from another lockfile or toolchain.
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target/release/.fingerprint
            desktop/target/release/build
            desktop/target/release/deps
          key: ${{ runner.os }}-${{ matrix.target }}-desktop-package-${{ steps.toolchain.outputs.rustc }}-${{ runner.os == 'macOS' && format('default-target-{0}-', steps.toolchain.outputs.apple) || '' }}${{ hashFiles('desktop/Cargo.lock', 'desktop/cua-driver/sources.json') }}

      # The cache service may answer a key with an entry whose key merely starts
      # with it. Only an exact hit is build input; anything else is removed.
      - name: Discard an inexact Rust cache match
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-matched-key != ''
        shell: bash
        run: |
          rm -rf desktop/target/release/.fingerprint desktop/target/release/build desktop/target/release/deps

      - name: Build Workbench
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build bootstrap UI
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Prepare package version
        shell: bash
        env:
          AVIBE_DESKTOP_VERSION: ${{ env.DESKTOP_VERSION }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python scripts/desktop_release.py prepare \
            --version "$AVIBE_DESKTOP_VERSION" --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" --config desktop/tauri.release.conf.json \
            --env-file "$GITHUB_ENV" --target "${{ matrix.target }}"

      - name: Configure signed updater or explicitly disable it
        shell: bash
        env:
          UPDATER_ENABLED: ${{ inputs.updater_enabled }}
          AVIBE_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          args=()
          if [ "$UPDATER_ENABLED" = "true" ]; then args+=(--enabled); fi
          python scripts/desktop_updater.py configure \
            --config desktop/tauri.release.conf.json --env-file "$GITHUB_ENV" ${args[@]+"${args[@]}"}

      # Signing must exist before the Runtime is built: every Mach-O inside
      # runtime.zip is signed before the archive and its hashes exist. A tag
      # build fails here on a missing or partial credential set; a manual build
      # accepts the complete set or none of it. Only identity, keychain, and
      # notary key locations leave this step, under names Tauri never reads.
      # The cache warm-up alone skips it and stays ad-hoc.
      - name: Import Apple signing identity
        if: runner.os == 'macOS' && env.DESKTOP_CACHE_WARMUP != 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: >
          python desktop/scripts/macos_signing.py import-identity
          --release-tag "$RELEASE_TAG" --env-file "$GITHUB_ENV"
          --work-dir "$RUNNER_TEMP/apple-signing"

      # Reads AVIBE_CODESIGN_IDENTITY/KEYCHAIN when the identity was imported.
      - name: Build verified private Runtime
        run: >
          python desktop/scripts/build-runtime-bundle.py
          --target "${{ matrix.target }}"

      - name: Install pinned driver validation dependency
        if: runner.os == 'macOS'
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: "PyYAML==6.0.3"

      # The pinned helper's inputs never change between releases. A restored
      # helper is kept only when its provenance names exactly these inputs and
      # it passes the checks a fresh build passes; otherwise it is rebuilt.
      - name: Restore prepared Cua Driver
        id: cua-driver-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            desktop/src-tauri/binaries/cua-driver-${{ matrix.target }}
            desktop/src-tauri/binaries/cua-driver-${{ matrix.target }}.provenance.json
          key: cua-driver-${{ matrix.target }}-${{ steps.toolchain.outputs.apple }}-default-target-${{ hashFiles('desktop/cua-driver/**', 'desktop/scripts/prepare-cua-driver.py') }}

      # A release that misses rebuilds from source, which is correct and slow:
      # the driver alone takes 9 to 17 minutes. The warning names the cause on
      # the run page instead of leaving a long build to be explained later.
      - name: Report build cache state
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ matrix.target }}
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          DRIVER_CACHE_HIT: ${{ steps.cua-driver-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf '%s\n' "| Target | Cache | State |" "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          report() {
            local name="$1" hit="$2" state=hit
            if [ "$hit" != true ]; then
              state=miss
              if [ -n "$RELEASE_TAG" ]; then
                echo "::warning title=Desktop cache miss::$TARGET restored no $name cache for $RELEASE_TAG and rebuilds it from source."
              fi
            fi
            echo "| $TARGET | $name | $state |" >> "$GITHUB_STEP_SUMMARY"
          }
          report "Rust build" "$RUST_CACHE_HIT"
          if [ "$RUNNER_OS" = macOS ]; then report "prepared Cua Driver" "$DRIVER_CACHE_HIT"; fi

      # A restored driver that fails verification is rebuilt, never used. That
      # should not happen to an entry the warm-up wrote, so it is reported.
      - name: Prepare pinned Cua Driver sidecar
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DRIVER_CACHE_HIT: ${{ steps.cua-driver-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          driver="desktop/src-tauri/binaries/cua-driver-$TARGET"
          digest() { if [ -f "$driver" ]; then shasum -a 256 "$driver" | cut -d ' ' -f 1; fi; }
          restored="$(digest)"
          python desktop/scripts/prepare-cua-driver.py --target "$TARGET" --reuse-verified
          if [ "$DRIVER_CACHE_HIT" = true ] && [ "$restored" != "$(digest)" ]; then
            echo "::warning title=Cua Driver cache rejected::The restored $TARGET driver failed verification and was rebuilt from source."
          fi

      - name: Save prepared Cua Driver
        if: runner.os == 'macOS' && !inputs.release_tag && env.DESKTOP_CACHE_WARMUP == 'true' && steps.cua-driver-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            desktop/src-tauri/binaries/cua-driver-${{ matrix.target }}
            desktop/src-tauri/binaries/cua-driver-${{ matrix.target }}.provenance.json
          key: ${{ steps.cua-driver-cache.outputs.cache-primary-key }}

      - name: Clean prior bundle output
        shell: bash
        run: rm -rf desktop/target/release/bundle

      - name: Verify prepared Cua Driver provenance
        if: runner.os == 'macOS'
        run: >
          python scripts/desktop_release.py verify-driver-prepared
          --target "${{ matrix.target }}"
          --driver "desktop/src-tauri/binaries/cua-driver-${{ matrix.target }}"
          --provenance-path "desktop/src-tauri/binaries/cua-driver-${{ matrix.target }}.provenance.json"

      - name: Build self-contained installer
        working-directory: desktop
        run: >
          npm run tauri --
          build
          --bundles "${{ env.DESKTOP_BUNDLE }}"
          --features bundled-runtime
          --config tauri.release.conf.json
          -- --locked

      - name: Verify macOS SDK and deployment target ceiling
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          app="target/release/bundle/macos/Avibe.app"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
          # The app keeps Tauri's existing 10.13 floor; the Cua Driver requires macOS 13.
          python ../scripts/desktop_release.py verify-macos-build-version \
            --binary "$app/Contents/MacOS/$executable=11.0" \
            --binary "$app/Contents/Helpers/cua-driver=13.0" \
            --minimum-sdk 26.0

      # The entry holds third-party output only, and Cargo.lock in its key pins
      # every third-party source by checksum. Avibe's own crates are removed
      # here, so no build can take first-party code from a cache.
      - name: Remove first-party build output before saving
        if: ${{ !inputs.release_tag && env.DESKTOP_CACHE_WARMUP == 'true' && steps.rust-cache.outputs.cache-hit != 'true' }}
        working-directory: desktop
        run: cargo clean --locked --release -p avibe-desktop -p avibe-runtime-host

      - name: Save Rust build cache
        if: ${{ !inputs.release_tag && env.DESKTOP_CACHE_WARMUP == 'true' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target/release/.fingerprint
            desktop/target/release/build
            desktop/target/release/deps
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      # The .app inside the DMG. A signed build signs the Cua Driver helper and
      # then the app with the Team's Developer ID, pins both code identities,
      # and notarizes and staples the app. The smoke test, the DMG, and the
      # updater archive all use this final app. Only a manual build without
      # credentials reaches the ad-hoc branch.
      - name: Sign macOS app
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          app="target/release/bundle/macos/Avibe.app"
          driver="$app/Contents/Helpers/cua-driver"
          [ -d "$app" ] || { echo "Avibe.app not found at $app" >&2; exit 1; }
          [ -f "$driver" ] || { echo "Cua Driver helper not found at $driver" >&2; exit 1; }
          [ ! -e "$app/Contents/MacOS/cua-driver" ] || {
            echo "stale Cua Driver copy found in Contents/MacOS" >&2
            exit 1
          }
          if [ "${apple_signing:-absent}" = "enabled" ]; then
            python scripts/macos_signing.py sign-app "$app"
            python scripts/macos_signing.py notarize "$app"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "release builds must be Developer ID signed" >&2
            exit 1
          else
            # Sign nested code from the inside out. `--deep` is deliberately a
            # verification option only; it must not choose what gets signed.
            codesign --force --sign - \
              --preserve-metadata=identifier,entitlements,flags,runtime \
              "$driver"
            codesign --force --sign - \
              --preserve-metadata=identifier,entitlements,flags,runtime \
              "$app"
            codesign --verify --strict "$driver"
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | grep -q '^Signature=adhoc$'
            codesign -dv "$driver" 2>&1 | grep -q '^Signature=adhoc$'
          fi
          APP_PATH="$app" python - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          code_resources = Path(os.environ["APP_PATH"]) / "Contents/_CodeSignature/CodeResources"
          files2 = plistlib.loads(code_resources.read_bytes()).get("files2", {})
          helper = files2.get("Helpers/cua-driver")
          if not isinstance(helper, dict) or not ({"cdhash", "requirement"} & helper.keys()):
              raise SystemExit("Helpers/cua-driver is not sealed as nested code")
          PY
          echo "driver_packaged_path=$(pwd)/$driver" >> "$GITHUB_ENV"
          echo "driver_provenance_path=$(pwd)/src-tauri/binaries/cua-driver-${{ matrix.target }}.provenance.json" >> "$GITHUB_ENV"
          echo "driver_packaged_cdhash=$(codesign -dv --verbose=4 "$driver" 2>&1 | sed -n 's/^CDHash=//p' | head -1)" >> "$GITHUB_ENV"

      - name: Smoke-test macOS app launch
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          app="target/release/bundle/macos/Avibe.app"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")"
          binary="$app/Contents/MacOS/$executable"
          [ -x "$binary" ] || {
            echo "Avibe executable not found at $binary" >&2
            exit 1
          }
          launch_log="$RUNNER_TEMP/avibe-desktop-launch.log"
          smoke_home="$(mktemp -d)"
          mkdir -p "$smoke_home/tmp"
          HOME="$smoke_home" TMPDIR="$smoke_home/tmp" "$binary" >"$launch_log" 2>&1 &
          app_pid=$!
          cleanup() {
            if kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
            fi
            for _ in $(seq 1 5); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if kill -0 "$app_pid" 2>/dev/null; then
              kill -KILL "$app_pid" 2>/dev/null || true
            fi
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 10); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              wait "$app_pid" || status=$?
              cat "$launch_log"
              echo "Avibe exited during the launch smoke test (status ${status:-0})" >&2
              exit 1
            fi
            sleep 1
          done
          if grep -Eiq 'panicked at|there is no reactor running|fatal runtime error' "$launch_log"; then
            cat "$launch_log"
            echo "Avibe logged a panic during the launch smoke test" >&2
            exit 1
          fi

          cleanup
          trap - EXIT

      - name: Create headless-safe DMG
        if: runner.os == 'macOS'
        working-directory: desktop
        run: >
          sh scripts/create-macos-dmg.sh
          target/release/bundle/macos/Avibe.app
          "target/release/bundle/dmg/Avibe_${{ env.DESKTOP_VERSION }}_${{ matrix.target }}.dmg"

      # The DMG carries the stapled app; it is signed, notarized, and stapled
      # itself, then the shipped shapes are checked the way Gatekeeper sees a
      # download: staples, spctl verdicts, and both pinned code identities,
      # including those of the app inside the mounted image.
      - name: Sign and notarize macOS DMG
        if: runner.os == 'macOS' && env.apple_signing == 'enabled'
        working-directory: desktop
        shell: bash
        run: |
          set -eu
          dmg="target/release/bundle/dmg/Avibe_${{ env.DESKTOP_VERSION }}_${{ matrix.target }}.dmg"
          python scripts/macos_signing.py sign-dmg "$dmg"
          python scripts/macos_signing.py notarize "$dmg"
          python scripts/macos_signing.py verify-release \
            --app target/release/bundle/macos/Avibe.app --dmg "$dmg"

      - name: Verify unsigned Windows installer before Certum handoff
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/target/release/bundle/nsis/*setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned TEST installer" }

      - name: Stage unsigned Windows installer for Certum
        if: runner.os == 'Windows' && (startsWith(inputs.release_tag, 'gh-v') || startsWith(inputs.release_tag, 'v'))
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/target/release/bundle/nsis/*setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          Remove-Item -Recurse -Force windows-signing-input -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force windows-signing-input/runtime | Out-Null
          Copy-Item $installers[0].FullName windows-signing-input/
          Copy-Item desktop/src-tauri/resources/runtime/* windows-signing-input/runtime/ -Force

      - name: Record artifact hashes
        if: runner.os != 'Windows' || (!startsWith(inputs.release_tag, 'gh-v') && !startsWith(inputs.release_tag, 'v'))
        shell: bash
        env:
          AVIBE_DESKTOP_VERSION: ${{ env.DESKTOP_VERSION }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ matrix.target }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            installers=(desktop/target/release/bundle/dmg/*.dmg)
          else
            installers=(desktop/target/release/bundle/nsis/*setup.exe)
          fi
          [ "${#installers[@]}" -eq 1 ] || { echo "Expected exactly one installer" >&2; exit 1; }
          driver_args=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Every signing step fails the job, so `enabled` here means the
            # Runtime, app, and DMG were all signed, notarized, and verified.
            if [ "${apple_signing:-absent}" = "enabled" ]; then signing=developer-id; else signing=ad-hoc; fi
            driver_args=(
              --prepared-driver "desktop/src-tauri/binaries/cua-driver-${{ matrix.target }}"
              --driver "$driver_packaged_path"
              --driver-provenance-path "$driver_provenance_path"
              --driver-cdhash "$driver_packaged_cdhash"
            )
          else
            signing=unsigned
          fi
          python scripts/desktop_release.py record \
            --version "$AVIBE_DESKTOP_VERSION" --target "$TARGET" --tag "$RELEASE_TAG" \
            --source-sha "$(git rev-parse HEAD)" --installer "${installers[0]}" \
            --runtime desktop/src-tauri/resources/runtime --output desktop-package \
            --signing "$signing" ${driver_args[@]+"${driver_args[@]}"}

      - name: Sign and verify final updater artifacts
        if: inputs.updater_enabled && (runner.os != 'Windows' || (!startsWith(inputs.release_tag, 'gh-v') && !startsWith(inputs.release_tag, 'v')))
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python scripts/desktop_updater.py produce \
            --directory desktop-package --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --target "$TARGET" --app desktop/target/release/bundle/macos/Avibe.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: runner.os == 'macOS' && env.DESKTOP_CACHE_WARMUP != 'true'
        with:
          name: avibe-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.target }}
          path: desktop-package/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: runner.os == 'Windows' && (startsWith(inputs.release_tag, 'gh-v') || startsWith(inputs.release_tag, 'v')) && env.DESKTOP_CACHE_WARMUP != 'true'
        with:
          name: avibe-desktop-unsigned-${{ env.DESKTOP_VERSION }}-${{ matrix.target }}
          path: windows-signing-input/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: runner.os == 'Windows' && !startsWith(inputs.release_tag, 'gh-v') && !startsWith(inputs.release_tag, 'v') && env.DESKTOP_CACHE_WARMUP != 'true'
        with:
          name: avibe-desktop-${{ env.DESKTOP_VERSION }}-${{ matrix.target }}
          path: desktop-package/
          if-no-files-found: error
          retention-days: 14

      - name: Remove Apple signing material
        if: always() && runner.os == 'macOS'
        run: python desktop/scripts/macos_signing.py cleanup --work-dir "$RUNNER_TEMP/apple-signing"
