name: RC7 Intel UI diagnostic
run-name: "Intel UI diagnostic — rc6 versus pinned rc7 (no release)"

# Temporary branch only: reuse the registered workflow path, never master/tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-ui:
    name: Intel UI / ${{ matrix.source }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: rc6
            sha: 5a5ed033ceec348fb5ad11cdbc02a33dcdfb5067
          - source: rc7
            sha: 2609dc507da038a06069091d5d5a0efd6b231871
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout exact comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: Pin Node without dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Record identity and prepare bounded sampling
        id: identity
        env:
          EXPECTED_SOURCE_SHA: ${{ matrix.sha }}
          DIAGNOSTIC_WORKFLOW_SHA: ${{ github.workflow_sha }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/rc7-intel-npm-cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc7-intel-diag/initial"
          # Fail instead of silently reusing a cache left by an earlier process.
          test ! -e "$NPM_CONFIG_CACHE"
          mkdir "$NPM_CONFIG_CACHE"
          # Same fresh job-private npm cache policy for both sources.
          printf 'NPM_CONFIG_CACHE=%s\n' "$NPM_CONFIG_CACHE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(node --version)" = v22.23.4
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.6'
          {
            date -u
            git rev-parse HEAD
            sw_vers
            uname -m
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            node --version
            npm --version
            python3 --version
            sysctl hw.ncpu hw.memsize
            df -k "$GITHUB_WORKSPACE"
            vm_stat
          } > "$RUNNER_TEMP/rc7-intel-diag/initial/identity.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'rc7-intel-diag'
          names = ('ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH',
                   'EXPECTED_SOURCE_SHA', 'DIAGNOSTIC_WORKFLOW_SHA')
          (root / 'initial' / 'image.json').write_text(json.dumps(
              {name: os.environ.get(name, 'unavailable') for name in names}, indent=2) + '\n')
          PY
          cat > "$RUNNER_TEMP/rc7-intel-diag/run_phase.py" <<'PY'
          """Bound one CI child process group; sample metrics without command arguments."""
          import datetime
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time

          phase, budget, *command = sys.argv[1:]
          budget = int(budget)
          root = Path(os.environ['RUNNER_TEMP']) / 'rc7-intel-diag' / phase
          root.mkdir()
          started = time.monotonic()

          def capture(command):
              try:
                  result = subprocess.run(command, text=True, capture_output=True, timeout=3)
                  return {'exit': result.returncode, 'stdout': result.stdout,
                          'stderr': result.stderr[:1000]}
              except subprocess.TimeoutExpired:
                  return {'unavailable': 'sampling command exceeded 3 seconds'}
              except OSError as error:
                  return {'unavailable': str(error)}

          def sample(stream):
              processes = capture(['ps', '-axo', 'pid=,ppid=,%cpu=,rss=,comm='])
              rows = processes.get('stdout', '').splitlines()
              def rss(row):
                  fields = row.split(maxsplit=4)
                  return int(fields[3]) if len(fields) >= 4 and fields[3].isdigit() else 0
              processes['stdout'] = '\n'.join(sorted(rows, key=rss, reverse=True)[:15])
              record = {'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        'elapsed_seconds': round(time.monotonic() - started, 1),
                        'memory_pages': capture(['vm_stat']),
                        'disk_kib': capture(['df', '-k', '.']),
                        'top_processes_by_sampled_rss_kib': processes}
              stream.write(json.dumps(record) + '\n')
              stream.flush()
              print(json.dumps(record), flush=True)

          # Only descendants of this CI step's own process group are stopped.
          child = None
          def stop_child():
              if child is None or child.poll() is not None:
                  return
              try:
                  os.killpg(child.pid, signal.SIGTERM)
              except ProcessLookupError:
                  return
              try:
                  child.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  child.wait(timeout=5)

          def interrupted(signum, _frame):
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          code = 1
          timed_out = False
          try:
              with (root / 'npm.log').open('w') as output, (root / 'samples.jsonl').open('w') as samples:
                  sample(samples)
                  child = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT,
                                           start_new_session=True)
                  deadline = time.monotonic() + budget
                  while True:
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          timed_out = True
                          code = 124
                          break
                      try:
                          code = child.wait(timeout=min(15, remaining))
                          break
                      except subprocess.TimeoutExpired:
                          sample(samples)
          except SystemExit as error:
              code = error.code
              raise
          finally:
              stop_child()
              (root / 'result.json').write_text(json.dumps({
                  'phase': phase, 'exit_code': code, 'timeout': timed_out,
                  'budget_seconds': budget, 'elapsed_seconds': round(time.monotonic() - started, 1),
                  'sampling_note': 'Point samples, not peak memory or proof of resource exhaustion.'
              }, indent=2) + '\n')
              log = root / 'npm.log'
              if log.exists():
                  # Keep checkpoint uploads small even if npm emitted a long log.
                  with log.open('rb') as stream:
                      stream.seek(max(0, log.stat().st_size - 65536))
                      tail = stream.read()
                  log.write_bytes(tail)
                  print(tail.decode(errors='replace')[-16000:], flush=True)
          sys.exit(code)
          PY
          cat "$RUNNER_TEMP/rc7-intel-diag/initial/identity.txt"
          cat "$RUNNER_TEMP/rc7-intel-diag/initial/image.json"

      - name: Upload initial checkpoint
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: intel-ui-${{ matrix.source }}-initial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc7-intel-diag/initial/
          retention-days: 3

      - name: Install UI dependencies (six minute diagnostic budget)
        id: install
        working-directory: ui
        shell: bash
        run: python3 "$RUNNER_TEMP/rc7-intel-diag/run_phase.py" install 360 npm ci

      - name: Upload install checkpoint
        if: ${{ always() && steps.install.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: intel-ui-${{ matrix.source }}-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc7-intel-diag/install/
          retention-days: 3

      - name: Build UI (six minute diagnostic budget)
        id: build
        working-directory: ui
        shell: bash
        run: python3 "$RUNNER_TEMP/rc7-intel-diag/run_phase.py" build 360 npm run build

      - name: Upload build checkpoint
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: intel-ui-${{ matrix.source }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc7-intel-diag/build/
          retention-days: 3
