name: Solana nonce recipe

on:
  pull_request:
    paths:
      - 'skills/use-avibe-vault/scripts/**'
      - 'tests/fixtures/vault_signing/solana-durable-nonce.json'
      - '.github/workflows/solana-nonce-recipe.yml'
  push:
    branches: [master]
    paths:
      - 'skills/use-avibe-vault/scripts/**'
      - 'tests/fixtures/vault_signing/solana-durable-nonce.json'
      - '.github/workflows/solana-nonce-recipe.yml'

permissions:
  contents: read

jobs:
  nonce-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: skills/use-avibe-vault/scripts/package-lock.json
      - name: Test offline nonce recipe (no RPC, funds or wallet keys)
        working-directory: skills/use-avibe-vault/scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
