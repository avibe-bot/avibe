name: Desktop Release (Stage 2)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach desktop assets to"
        required: true
        type: string
      source_sha:
        description: "Optional exact source SHA proven by Stage 1"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release-backstop:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
      run_id: ${{ steps.verify.outputs.run_id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The ref only selects the workflow code. The script resolves the
          # dispatch/tag input through the API and never trusts a workflow
          # context SHA as the release source.
          ref: ${{ github.ref }}
      - name: Require exact full master backstop
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/ci_release_backstop.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Confirm Stage 1 source when supplied
        if: inputs.source_sha != ''
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
        run: test "$EXPECTED_SOURCE_SHA" = "$SOURCE_SHA"

  resolve-desktop-release:
    needs: release-backstop
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      updater_enabled: ${{ steps.resolve.outputs.updater_enabled }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Resolve the requested tag with the tooling that tag carries. An
          # unpinned checkout would run a dispatched branch's resolver against a
          # tag it never belonged to. fetch-depth keeps the tag history the
          # resolver walks.
          ref: ${{ needs.release-backstop.outputs.source_sha }}
          fetch-depth: 0
      - name: Resolve exact TEST source and versions
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TEST_ENABLED: ${{ vars.DESKTOP_UPDATER_TEST }}
          STABLE_ENABLED: ${{ vars.DESKTOP_UPDATER_STABLE }}
          BACKSTOP_SOURCE_SHA: ${{ needs.release-backstop.outputs.source_sha }}
        shell: bash
        run: |
          enabled=false
          updater_enabled=false
          if [[ "$RELEASE_TAG" == gh-v* ]]; then
            enabled=true
            if [ "$TEST_ENABLED" = true ]; then updater_enabled=true; fi
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$STABLE_ENABLED" = true ]; then
            enabled=true
            updater_enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "updater_enabled=$updater_enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = true ]; then
            python scripts/desktop_release.py resolve --tag "$RELEASE_TAG" --source-sha "$BACKSTOP_SOURCE_SHA" --output "$GITHUB_OUTPUT"
          fi

  desktop-packages:
    needs: [release-backstop, resolve-desktop-release]
    if: needs.release-backstop.result == 'success' && needs.resolve-desktop-release.outputs.enabled == 'true'
    uses: ./.github/workflows/desktop-package.yml
    with:
      source_sha: ${{ needs.resolve-desktop-release.outputs.source_sha }}
      version: ${{ needs.resolve-desktop-release.outputs.version }}
      release_tag: ${{ needs.resolve-desktop-release.outputs.tag }}
      updater_enabled: ${{ needs.resolve-desktop-release.outputs.updater_enabled == 'true' }}
    # A called job's Environment secrets resolve empty unless the caller inherits
    # (actions/runner#4453). The callee reads the updater pair and, on macOS, the
    # Apple set from desktop-updater: every tag build is Developer ID signed and
    # notarized, and fails without the complete set.
    secrets: inherit

  certum-windows-sign:
    needs: [release-backstop, resolve-desktop-release, desktop-packages]
    if: >-
      ${{ needs.release-backstop.result == 'success' && !cancelled() && needs.resolve-desktop-release.outputs.enabled == 'true' &&
          (startsWith(inputs.tag, 'gh-v') ||
           startsWith(inputs.tag, 'v')) }}
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve-desktop-release.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: avibe-desktop-unsigned-${{ needs.resolve-desktop-release.outputs.version }}-x86_64-pc-windows-msvc
          path: windows-input/

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Download and verify pinned Certum signer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/certum_signing.py download --directory "$env:RUNNER_TEMP/certum-signer"

      - name: Resolve unsigned installer path
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem windows-input/*setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one staged NSIS installer" }
          "CERTUM_INSTALLER=$($installers[0].FullName)" >> $env:GITHUB_ENV

      - name: Sign installer with Certum SimplySign
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP: ${{ secrets.CERTUM_TOTP_SEED }}
        run: |
          python scripts/certum_signing.py sign `
            --installer "$env:CERTUM_INSTALLER" `
            --signer "$env:RUNNER_TEMP/certum-signer/ssign.exe" `
            --output-directory "$env:RUNNER_TEMP/certum-signed"
          Copy-Item "$env:RUNNER_TEMP/certum-signed/$(Split-Path $env:CERTUM_INSTALLER -Leaf)" `
            $env:CERTUM_INSTALLER -Force

      - name: Verify publisher, code-signing EKU, timestamp, and tamper rejection
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature $env:CERTUM_INSTALLER
          if ($signature.Status -ne 'Valid') { throw "Certum Authenticode verification failed" }
          $certificate = $signature.SignerCertificate
          if ($certificate.Subject -notmatch 'CN=YUHAO CHEN') { throw "Unexpected Authenticode publisher" }
          if ($certificate.Issuer -notmatch 'Certum') { throw "Unexpected Authenticode issuer" }
          $ekuExtension = @($certificate.Extensions |
            Where-Object { $_.Oid.Value -eq '2.5.29.37' } |
            Select-Object -First 1)
          $codeSigningEku = @()
          if ($null -ne $ekuExtension) {
            $codeSigningEku = @($ekuExtension.EnhancedKeyUsages |
              Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' })
          }
          if ($codeSigningEku.Count -eq 0) {
            throw "Signer certificate is missing the code-signing EKU"
          }
          if ($certificate.NotAfter.ToUniversalTime().Date -ne ([datetime]::Parse('2027-11-05')).Date) {
            throw "Unexpected Certum certificate expiry"
          }
          if ($null -eq $signature.TimeStamperCertificate) { throw "Missing Authenticode timestamp" }
          if ($signature.TimeStamperCertificate.Issuer -notmatch 'Certum') {
            throw "Unexpected timestamp issuer"
          }
          $tampered = Join-Path $env:RUNNER_TEMP 'certum-tampered.exe'
          Copy-Item $env:CERTUM_INSTALLER $tampered -Force
          $bytes = [IO.File]::ReadAllBytes($tampered)
          if ($bytes.Length -lt 4097) { throw "Installer is unexpectedly short" }
          $bytes[4096] = $bytes[4096] -bxor 1
          [IO.File]::WriteAllBytes($tampered, $bytes)
          $negative = Get-AuthenticodeSignature $tampered
          if ($negative.Status -eq 'Valid') { throw "Tampered installer still verified" }

      - name: Record final signed desktop metadata
        shell: pwsh
        env:
          AVIBE_DESKTOP_VERSION: ${{ needs.resolve-desktop-release.outputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-desktop-release.outputs.source_sha }}
        run: |
          python scripts/desktop_release.py record `
            --version "$env:AVIBE_DESKTOP_VERSION" `
            --target x86_64-pc-windows-msvc `
            --tag "$env:RELEASE_TAG" `
            --source-sha "$env:SOURCE_SHA" `
            --installer "$env:CERTUM_INSTALLER" `
            --runtime windows-input/runtime `
            --output desktop-package `
            --signing certum-authenticode

      - name: Upload signed Windows artifact for updater finalization
        if: needs.resolve-desktop-release.outputs.updater_enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: avibe-desktop-signed-${{ needs.resolve-desktop-release.outputs.version }}-x86_64-pc-windows-msvc
          path: desktop-package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload final signed Windows artifact
        if: needs.resolve-desktop-release.outputs.updater_enabled != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: avibe-desktop-${{ needs.resolve-desktop-release.outputs.version }}-x86_64-pc-windows-msvc
          path: desktop-package/
          if-no-files-found: error
          retention-days: 14

  windows-updater-finalize:
    needs: [release-backstop, resolve-desktop-release, certum-windows-sign]
    if: >-
      ${{ needs.release-backstop.result == 'success' && !cancelled() && needs.certum-windows-sign.result == 'success' &&
          needs.resolve-desktop-release.outputs.updater_enabled == 'true' }}
    runs-on: windows-latest
    environment: desktop-updater
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve-desktop-release.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: avibe-desktop-signed-${{ needs.resolve-desktop-release.outputs.version }}-x86_64-pc-windows-msvc
          path: desktop-package/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Tauri updater signer
        working-directory: desktop
        run: npm ci

      - name: Sign final Windows updater artifact
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-desktop-release.outputs.source_sha }}
          TARGET: x86_64-pc-windows-msvc
          AVIBE_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python scripts/desktop_updater.py produce `
            --directory desktop-package `
            --tag "$env:RELEASE_TAG" `
            --source-sha "$env:SOURCE_SHA" `
            --target "$env:TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: avibe-desktop-${{ needs.resolve-desktop-release.outputs.version }}-x86_64-pc-windows-msvc
          path: desktop-package/
          if-no-files-found: error
          retention-days: 14

  stage-desktop:
    needs: [release-backstop, resolve-desktop-release, desktop-packages, certum-windows-sign, windows-updater-finalize]
    if: >-
      ${{ needs.release-backstop.result == 'success' && !cancelled() &&
          needs.resolve-desktop-release.outputs.enabled == 'true' &&
          needs.desktop-packages.result == 'success' &&
          needs.certum-windows-sign.result == 'success' &&
          (needs.windows-updater-finalize.result == 'success' ||
           needs.windows-updater-finalize.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve-desktop-release.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: avibe-desktop-${{ needs.resolve-desktop-release.outputs.version }}-*
          path: desktop-dist/
          merge-multiple: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Attach verified desktop assets to the same release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-desktop-release.outputs.source_sha }}
          UPDATER_ENABLED: ${{ needs.resolve-desktop-release.outputs.updater_enabled }}
          AVIBE_DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATER_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$UPDATER_ENABLED" = true ]; then args+=(--updater-enabled); fi
          python scripts/desktop_release.py stage \
            --directory desktop-dist \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            ${args[@]+"${args[@]}"}

      # Stage 1 dispatches this workflow with GITHUB_TOKEN. Do not rely on a
      # downstream workflow_run event to reconcile the newly attached assets.
      - name: Dispatch release mirror
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-mirror.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f dry_run=false
