version: 2
# Each ecosystem gets its own weekday, before working hours. A lint run asks for
# 33-39 hosted jobs and the organization has 20 concurrent slots, so five
# ecosystems opening their weekly PRs at the same minute queued every PR (human
# ones included) for over an hour. Security updates are not bound to this
# schedule.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      ui-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Tested Vitest 5.0.5 and 5.1.0 exclude our supported Node20 toolchain.
    # 5.0.5 also breaks executable scenario evidence collected through its CLI.
    # Keep the 4.x declaration; review later candidates independently.
    # Tested refresh releases change diagnostics beyond the existing lint ledger.
    # Keep 0.4.26 for now; later candidates still get an independent review.
    ignore:
      # 31.0.0 excludes Node20 and its Undici dependency fails startup there.
      # Preserve the supported toolchain; review later candidates independently.
      - dependency-name: jsdom
        versions: ["31.0.0"]
      # 1.65.0 regresses the existing fake-clock activity-expiry contract;
      # changing only Playwright back to 1.64.1 restores the consuming test.
      - dependency-name: "@playwright/test"
        versions: ["1.65.0"]
      - dependency-name: vitest
        versions: ["5.0.5", "5.1.0"]
      - dependency-name: eslint-plugin-react-refresh
        versions: ["0.5.5", "0.5.6", "0.5.7"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      desktop-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      desktop-cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Both versions break forwarding to an already-running Windows 2.5.3 shell.
    # Keep later candidates reviewable; unpin only after mixed-version validation.
    ignore:
      - dependency-name: tauri-plugin-single-instance
        versions: ["2.5.4", "2.5.5"]

  # Dependabot's uv ecosystem can update the declared Python requirements and
  # uv.lock together. `increase` makes declaration-bound maintenance explicit;
  # review still rejects lock-only drift. Keep the Claude SDK on its explicit
  # runtime path: it bundles a CLI and has a separate Windows wheel constraint.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      python-uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: claude-agent-sdk
