version: 2
# Each ecosystem gets its own weekday, before working hours. A lint run asks for
# 33-39 hosted jobs and the organization has 20 concurrent slots, so five
# ecosystems opening their weekly PRs at the same minute queued every PR (human
# ones included) for over an hour. Security updates are not bound to this
# schedule.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      ui-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # 0.5.0 through 0.5.8 flag the existing lazy registry and deferred exports.
    # Keep 0.4.26; review later candidates independently.
    ignore:
      # Preserve existing DOM consumer behavior until the jsdom migration is verified.
      - dependency-name: jsdom
        versions: ["31.0.0"]
      # Both candidates failed the activity-expiry browser gate. Keep the
      # runner, driver and browser image together; evaluate later versions separately.
      - dependency-name: "@playwright/test"
        versions: ["1.65.0", "1.65.1"]
      - dependency-name: eslint-plugin-react-refresh
        versions: ["0.5.0", "0.5.1", "0.5.2", "0.5.3", "0.5.4", "0.5.5", "0.5.6", "0.5.7", "0.5.8"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      desktop-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      desktop-cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Both versions break forwarding to an already-running Windows 2.5.3 shell.
    # Keep later candidates reviewable; unpin only after mixed-version validation.
    ignore:
      - dependency-name: tauri-plugin-single-instance
        versions: ["2.5.4", "2.5.5"]

  - package-ecosystem: cargo
    directory: /direct-transport
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      direct-transport-cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # iroh is a deliberate native-runtime pin shared with the iOS qualification gate.
    # Review and update it explicitly; never let a grouped Dependabot PR bump it.
    ignore:
      - dependency-name: iroh

  # Dependabot's uv ecosystem can update the declared Python requirements and
  # uv.lock together. `increase` makes declaration-bound maintenance explicit;
  # review still rejects lock-only drift. Keep the Claude SDK on its explicit
  # runtime path: it bundles a CLI and has a separate Windows wheel constraint.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      python-uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: claude-agent-sdk
