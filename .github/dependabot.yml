version: 2
# Each ecosystem gets its own weekday, before working hours. A lint run asks for
# 33-39 hosted jobs and the organization has 20 concurrent slots, so five
# ecosystems opening their weekly PRs at the same minute queued every PR (human
# ones included) for over an hour. Security updates are not bound to this
# schedule.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      ui-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      desktop-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      desktop-cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Dependabot's uv ecosystem can update the declared Python requirements and
  # uv.lock together. `increase` makes declaration-bound maintenance explicit;
  # review still rejects lock-only drift. Keep the Claude SDK on its explicit
  # runtime path: it bundles a CLI and has a separate Windows wheel constraint.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      python-uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: claude-agent-sdk
