[package]
name = "avibe-direct-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT"
description = "The Avibe iroh direct-transport sidecar"

[dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "io-std", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
