[package]
name = "relay-interop-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[[test]]
name = "relay_fixture"
path = "fixture.rs"

[dev-dependencies]
futures-core = { version = "=0.3.34", default-features = false }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "io-std", "macros", "net", "rt-multi-thread", "sync", "time"] }
