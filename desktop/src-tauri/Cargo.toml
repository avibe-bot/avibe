[package]
name = "avibe-desktop"
description = "Avibe desktop shell: bootstraps a local Runtime and hands its Workbench to a native window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `_lib` keeps the library name distinct from the binary on Windows, as the
# Tauri v2 scaffold requires.
name = "avibe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
bundled-runtime = []
# Test-only builds may redirect Computer Use state and assets to a hermetic lane.
# Release packaging never enables this feature.
computer-use-test-overrides = []
# Hermetic App Lock peer used by desktop-client tests; forbidden in release builds.
app-lock-e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
base64 = "0.23"
avibe-runtime-host = { path = "../runtime-host" }
cookie = "0.18"
flate2 = "1"
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = { version = "=2.6.1", default-features = false }
sys-locale.workspace = true
tar = "0.4"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
# The desktop pet's summon shortcut, registered from Rust only.
tauri-plugin-global-shortcut = "~2.4" # 2.4 requires tauri 2.12
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# 2.5.4 and 2.5.5 send a Windows IPC format that a running 2.5.3 shell silently ignores.
# Keep forwarding compatible with older shells; unpin after mixed-version validation.
# Dependabot excludes those known-incompatible versions in .github/dependabot.yml.
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-window-state = "2"
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "test"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Networking_WindowsWebServices", "Win32_Foundation", "Data_Xml_Dom", "UI_Notifications"] }
keyring = { version = "3.6", features = ["windows-native"] }
zeroize = "1"
# Match Tauri's Known Folder lookup without initializing the GUI.
dirs = "7"
# The pet's drag: the primary button's state and a one-step window frame.
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # Computer Use's inactive Windows x64 process-ownership foundation.
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
# Reads a native menu item's text, where muda keeps its accelerator.
windows-sys = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security_Authorization",
  "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LABiometryType"] }
objc2-authentication-services = { version = "0.3.2", default-features = false, features = ["std", "ASFoundation", "ASPublicKeyCredential", "ASAuthorization", "ASAuthorizationController", "ASAuthorizationCredential", "ASAuthorizationProvider", "ASAuthorizationRequest", "ASAuthorizationPublicKeyCredentialAssertion", "ASAuthorizationPublicKeyCredentialAssertionRequest", "ASAuthorizationPublicKeyCredentialConstants", "ASAuthorizationPublicKeyCredentialDescriptor", "ASAuthorizationPlatformPublicKeyCredentialAssertion", "ASAuthorizationPlatformPublicKeyCredentialAssertionRequest", "ASAuthorizationPlatformPublicKeyCredentialDescriptor", "ASAuthorizationPlatformPublicKeyCredentialProvider"] }
keyring = { version = "3.6", features = ["apple-native"] }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "block2",
  "FoundationErrors",
  "NSAppleEventDescriptor",
  "NSBundle",
  "NSAppleEventManager",
  "NSArray",
  "NSDate",
  "NSData",
  "NSAttributedString",
  "NSDictionary",
  "NSSet",
  "NSEnumerator",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSDistributedNotificationCenter", "NSRunLoop", "NSTimer",
  "NSOperation",
  "NSProcessInfo",
  "NSString",
  "NSURL",
  "NSURLRequest",
  "NSURLResponse",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSAccessibilityProtocols",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSButtonCell",
  "NSBezierPath",
  "NSTrackingArea",
  "NSColor",
  "NSControl",
  "NSFont",
  "NSFontDescriptor",
  "NSImage",
  "NSKeyValueBinding",
  "NSParagraphStyle",
  "NSTextField",
  "NSImageRep",
  "NSImageView",
  "NSLayoutConstraint",
  "NSSharingService",
  "NSTitlebarAccessoryViewController",
  "NSToolbar",
  "NSViewController",
  "NSAlert",
  "NSAppearance",
  "NSWorkspace",
  "NSRunningApplication",
  "libc",
  "NSBezierPath",
  "NSButtonCell",
  "NSText",
  "NSCell",
  "NSEvent",
  "NSGraphics",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSStatusBar",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSMenu",
  "NSMenuItem",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKContentWorld",
  "WKFrameInfo",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKPreferences",
  "WKSecurityOrigin",
  "WKSnapshotConfiguration",
  "WKUIDelegate",
  "WKURLSchemeHandler",
  "WKURLSchemeTask",
  "WKUserContentController",
  "WKUserScript",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "WKWindowFeatures",
] }
# The macOS notification center: authorization, posts, withdrawal and responses.
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
# Reads the running app's own signed entitlements for the Vault passkey marker.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecTask"] }

[[example]]
name = "app-lock-peer"
path = "examples/app-lock-peer.rs"
required-features = ["app-lock-e2e"]
