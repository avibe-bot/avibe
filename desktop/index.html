<!doctype html>
<html lang="en" data-phase="probing">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avibe</title>
  </head>
  <body>
    <main class="stage" role="main">
      <section class="card" aria-labelledby="title">
        <!--
          The product mark, reused from the application icon set so the bootstrap
          window and the Dock icon can never show two different logos.
        -->
        <img class="mark" src="/src-tauri/icons/128x128.png" alt="" width="56" height="56" />

        <h1 class="title" id="title">Avibe</h1>

        <p class="message" id="message" role="status" aria-live="polite">
          Looking for a running Avibe Runtime…
        </p>

        <div class="track" id="track" aria-hidden="true"><span class="bar"></span></div>

        <p class="origin"><code id="origin"></code></p>

        <div class="actions" id="actions" hidden>
          <button class="retry" id="retry" type="button">Try again</button>
          <button class="help" id="help" type="button">Installation help</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
