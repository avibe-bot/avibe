version: 2
capability:
  id: model_hub
  name: Model Hub configured routes and turn outcomes
  canonical_tests:
    - tests/test_model_hub_api.py
    - tests/test_model_hub_config.py
    - tests/test_model_hub_resolution.py
    - tests/test_model_hub_injection.py
    - tests/test_model_hub_runtime.py
    - tests/test_model_hub_l3.py
    - tests/test_model_hub_usage.py
    - tests/test_local_deps.py
    - tests/test_opencode_server.py
    - tests/test_runtime_activation.py
    # The user-visible half of metering. A vitest case is the only place these
    # properties can be observed, so the catalog checker resolves both shapes.
    - ui/src/components/settings/models/UsageTab.test.tsx
    - ui/src/components/settings/models/SettingsModelsPage.render.test.tsx
    - ui/src/components/settings/models/RouteChainDialog.test.tsx
    - ui/src/components/settings/models/BackendModelCatalogDialog.test.tsx
    # The gate that resolves those rows against vitest's own collection, and
    # its own evidence.
    - ui/scripts/scenarioCatalog.test.mjs
    - tests/scenarios/model_hub/test_model_hub_catalog.py
    - tests/scenarios/model_hub/test_model_hub_configured_route_scenarios.py
    - tests/scenarios/model_hub/test_model_hub_live_resolution_scenarios.py
    - tests/scenarios/model_hub/test_model_hub_turn_contract_scenarios.py
    - tests/scenarios/model_hub/test_model_hub_migration_scenarios.py
    - tests/scenarios/model_hub/test_model_hub_native_oauth_scenarios.py
    - tests/e2e/test_model_hub_guards.py
    - tests/e2e/test_model_hub_migration.py
    - tests/e2e/test_model_hub_mock_upstream.py
    - tests/e2e/test_model_hub_routing.py
    - tests/e2e/test_model_hub_backend_settings.py
    - tests/e2e/test_model_hub_runtime.py
    - tests/e2e/test_model_hub_sources.py
    - tests/e2e/test_model_hub_usage_events.py
status_legend:
  covered:
    description: closed-loop coverage exists at the declared layer
    test_required: true
    expected_fail: false
    priority: false
  partial:
    description: executable coverage exists at the declared layer, but the layer named in missing_layer is still unproved
    test_required: true
    expected_fail: false
    priority: true
  gap:
    description: no executable coverage at any layer yet
    test_required: false
    expected_fail: false
    priority: true
  assert:
    description: the E2E scenario asserts the intended contract when its environmental preconditions are present
    test_required: true
    expected_fail: false
    priority: false
  baseline:
    description: the E2E scenario freezes current behavior while its product decision remains open
    test_required: true
    expected_fail: false
    priority: true
  xfail:
    description: executable evidence isolates a known broken product surface without weakening passing invariants
    test_required: true
    expected_fail: true
    priority: true
  skip:
    description: this layer cannot execute the scenario; reason and owning_layer identify the boundary
    test_required: false
    expected_fail: false
    priority: false
