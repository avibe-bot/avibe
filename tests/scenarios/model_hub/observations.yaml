version: 2
capability: model_hub
observations:
  - id: MH-OBS-001
    source: engine-survey-s1
    summary: The adapter owns one Source call while the configured route executor owns cross-Source fallback.
    affects:
      - MH-S1-001
      - MH-TAKEOVER-001
      - MH-CREDENTIAL-001
      - MH-RES-LIVE-004
  - id: MH-OBS-002
    source: engine-survey-s1
    summary: Engine usage events can contain credential material, so Model Hub emits only its own redacted records.
    affects:
      - MH-PROTOCOL-001
      - MH-TURN-RESULT-001
      - MH-TURN-COPY-001
  - id: MH-OBS-003
    source: engine-survey-s1
    summary: OAuth presentation is runtime-declared rather than inferred from vendor metadata.
    affects:
      - MH-OAUTH-NATIVE-001
      - MH-OAUTH-NATIVE-002
      - MH-OAUTH-NATIVE-003
  - id: MH-OBS-004
    source: model-hub-completeness-audit
    summary: Persisted Sources from every writer must survive the same canonical serialization and reload boundary.
    affects:
      - MH-AC29-001
      - MH-MIG-001
  - id: MH-OBS-005
    source: local-incus-cold-start-2026-08-23
    summary: A first CLIProxyAPI process remained alive when Avibe ended the fixed 10-second readiness window; the next start reached both health surfaces in 7.4 seconds.
    affects:
      - MH-RUNTIME-005
      - MH-RUNTIME-006
