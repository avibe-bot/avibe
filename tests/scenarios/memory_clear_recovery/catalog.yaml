version: 1
capability:
  id: memory_clear_intent
  name: Durable Memory Clear intent
  canonical_tests:
    - tests/test_memory_maintenance.py
    - tests/test_memory_runtime.py
status_legend:
  covered: scenario coverage exists
  partial: unit or contract coverage exists but the closed loop is incomplete
  manual: currently validated only by human regression
  gap: not covered yet
scenarios:
  - id: MEMORY-CLEAR-201
    name: Clear discards retained local evidence and converges after interruption
    status: covered
    kind: recovery
    layer: scenario
    test: tests/test_memory_runtime.py::test_memory_clear_201_discards_manual_required_evidence_and_allows_new_delivery
    actor: Memory Settings user
    trigger: A provider add times out after submission and fences its session as manual_required
    given: The queue retains the ambiguous payload and pinned attachment bundle without replaying it
    when: The user confirms Clear Memory Data
    then: Marker-owned Clear removes retained evidence, advances the epoch, and a later capture can deliver normally
    expected_outputs:
      - Clear completes through the four existing idempotent deletion primitives
      - Maintenance advertises can_clear while the manual_required fence exists
      - Clear completes through the four existing idempotent deletion primitives
      - The ambiguous payload and attachment bundle are removed without another provider add
      - The session is unfenced and a subsequent capture reaches the provider
  - id: MEMORY-CLEAR-202
    name: Failed marker is retried automatically on boot
    status: covered
    kind: recovery
    layer: scenario
    test: tests/test_memory_runtime.py::test_runtime_reconcile_completes_readable_clear_marker_on_boot
    actor: Memory runtime
    trigger: A clear primitive fails after the marker is durable
    given: Processing Record projects a failed clear marker and Memory remains fenced
    when: The next runtime reconcile runs
    then: The marker returns to deleting, all four primitives are retried idempotently, and the marker is removed on success
