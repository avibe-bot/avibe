version: 1
capability:
  id: memory_clear_intent
  name: Memory Clear control-plane authority over volatile capture
  canonical_tests:
    - tests/test_memory_maintenance.py
    - tests/test_memory_provider_root.py
    - tests/test_memory_runtime.py
status_legend:
  covered: scenario coverage exists
  partial: unit or contract coverage exists but the closed loop is incomplete
  manual: currently validated only by human regression
  gap: not covered yet
scenarios:
  - id: MEMORY-CLEAR-201
    name: Clear resets owned Memory surfaces and converges after interruption
    status: covered
    kind: recovery
    layer: scenario
    test: tests/test_memory_maintenance.py::test_clear_writes_marker_and_repeats_four_surfaces
    actor: Memory Settings user
    trigger: Clear begins while volatile capture work may still be queued or in flight
    given: Delivery state is process-local and may be dropped; the identity store is fenced
    when: The user confirms Clear Memory Data
    then: Marker-owned Clear resets stable identity, advances the epoch, and a later capture can deliver normally
    expected_outputs:
      - Clear completes through the four existing idempotent deletion primitives
      - Maintenance advertises can_clear while the volatile writer is quiesced
      - No durable payload or delivery marker is replayed after Clear
      - The new epoch remains fail-closed until the authority transition completes
  - id: MEMORY-CLEAR-202
    name: Failed marker is retried automatically on boot
    status: covered
    kind: recovery
    layer: scenario
    test: tests/test_memory_maintenance.py::test_failed_clear_persists_failed_projection_and_boot_retries
    actor: Memory runtime
    trigger: Runtime replacement or shutdown interrupts volatile work
    given: Identity state remains available while capture delivery is intentionally best effort
    when: The next runtime starts
    then: No delivery replay occurs and control-plane authority remains explicit
  - id: MEMORY-CLEAR-203
    name: Boot Clear recovery repairs Avibe's released unsentinelled first-start root
    status: covered
    kind: recovery
    layer: scenario
    test: tests/test_memory_provider_root.py::test_provider_root_clear_recovers_released_unsentinelled_first_start
    actor: Memory runtime
    trigger: A released sidecar start populated the provider root before its ownership sentinel existed
    given: The provider root is owned by the existing sidecar lifecycle and the store contains only identity state
    when: The next runtime reconcile retries the durable Clear
    then: Clear uses the existing authority transition and does not infer delivery evidence from SQLite
    expected_outputs:
      - Missing ownership never permits an ordinary sidecar or rebuild write
      - Clear recovery accepts only bounded released first-start states whose final controls match or whose temporary controls are byte prefixes of generated controls
      - Unknown or mismatched unsentinelled roots remain untouched and fail closed
      - The target epoch remains current and ordinary Memory activation resumes
