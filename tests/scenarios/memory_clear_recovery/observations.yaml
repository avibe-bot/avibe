version: 1
capability: memory_clear_intent
observations:
  - id: OBS-MEMORY-CLEAR-001
    source: issue_1392_rev2
    related_scenarios:
      - MEMORY-CLEAR-201
    summary: An ambiguous provider add is dropped without replay and does not disable marker-owned Clear.
    previous_assumption: Unknown provider outcomes had to block Clear to preserve per-call evidence.
    observed_behavior: Clear records an atomic intent marker, resets stable identity at a new epoch, and retries the four idempotent deletion primitives after interruption.
    required_updates:
      - keep automatic replay forbidden for unknown outcomes
      - allow Clear to drop volatile work and release pinned attachments
      - remove the obsolete snapshot/Resume/Abort contract
      - project failed marker state without blocking service startup
      - prove a later capture in the same logical session can deliver
  - id: OBS-MEMORY-CLEAR-002
    source: issue_1574
    related_scenarios:
      - MEMORY-CLEAR-203
    summary: A released sidecar/rebuild writer could populate an unsentinelled provider root that durable Clear correctly refused to delete.
    previous_assumption: Every process writer was reached only after the runtime had claimed the provider root.
    observed_behavior: The process layer could create the root and duplicate generated TOMLs before any ownership guard, while Clear required the missing sentinel and kept its durable fence open.
    required_updates:
      - enforce ownership at every sidecar and rebuild write boundary
      - keep ordinary root admission strict for non-empty unsentinelled roots
      - recover only bounded released first-start shapes, including interrupted Avibe control-file writes, during durable Clear
      - prove boot recovery releases the fence and resumes activation
