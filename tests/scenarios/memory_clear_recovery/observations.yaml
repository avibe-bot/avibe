version: 1
capability: memory_clear_intent
observations:
  - id: OBS-MEMORY-CLEAR-001
    source: issue_1392_rev2
    related_scenarios:
      - MEMORY-CLEAR-201
    summary: An ordinary provider add timeout is conservatively retained as manual_required, but that local fence must not disable marker-owned Clear.
    previous_assumption: Unknown provider outcomes had to block Clear to preserve their evidence.
    observed_behavior: Clear records an atomic intent marker, resets the queue at a new epoch, and retries the four idempotent deletion primitives after interruption.
    required_updates:
      - keep automatic replay forbidden for unknown outcomes
      - allow Clear to discard retained local evidence and release pinned attachments
      - remove the obsolete snapshot/Resume/Abort contract
      - project failed marker state without blocking service startup
      - prove a later capture in the same logical session can deliver
