version: 1
capability:
  id: memory_independence
  name: Memory remains optional across delivery and session lifecycle
  canonical_tests:
    - tests/test_session_delivery_fsm.py
    - tests/test_message_handler_typing.py
    - tests/test_command_handler_user_names.py
    - tests/test_memory_runtime.py
    - tests/test_memory_admission.py
    - tests/test_memory_slice3.py
    - tests/test_controller_dispatch_loop.py
    - tests/test_native_session_providers.py
    - tests/test_core_services_dispatch.py
    - tests/test_admin_notifications.py
    - tests/test_memory_disabled_isolation.py
    - tests/test_memory_loader.py
    - tests/test_local_deps.py
    - tests/test_memory_upgrade_packaged.py
    - tests/test_upgrade_flow.py
    - tests/scenarios/memory_independence/test_memory_package_shape.py
contract:
  dispatch: capture_must_not_fence_turn_start
  destructive_ops: new_and_archive_fail_open_on_capture_timeout
  generation: retained_snapshot_prevents_cross_generation_attribution
  shutdown: capture_and_archive_volatile_work_may_drop_before_runtime_close
  imports: shared_delivery_and_handler_imports_stay_behind_leaf_boundaries
  retention: settled_lifecycle_and_archive_authorization_state_is_released_without_delivery_wait
  scheduling: capture_setup_failure_is_best_effort
  transient_dispatch: lifecycle_snapshots_never_enter_platform_payloads_or_waiters
  processing_events: memory_health_events_stay_in_service_logs_without_im_delivery
status_legend:
  covered: executable evidence exists
scenarios:
  - id: MEMORY-INDEP-001
    name: A hung capture does not block the next turn, /new, or archive
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_memory_adapter.py::test_session_and_shutdown_cancellation_release_active_leases
  - id: MEMORY-INDEP-002
    name: A capture admitted before /new or archive is discarded after the transition
    status: covered
    kind: correctness
    layer: scenario
    test: tests/test_memory_adapter.py::test_worker_failure_and_stale_lifecycle_each_release_exactly_once
  - id: MEMORY-INDEP-003
    name: Idle-session capture still attributes while shutdown may drop volatile work
    status: covered
    kind: regression_keep
    layer: scenario
    test: tests/test_memory_adapter.py::test_session_and_shutdown_cancellation_release_active_leases
  - id: MEMORY-INDEP-004
    name: Shared delivery imports do not load Memory implementations
    status: covered
    kind: guardrail
    layer: contract
    test: tests/test_memory_admission.py::test_session_turns_import_keeps_memory_and_handlers_behind_their_boundaries
  - id: MEMORY-INDEP-005
    name: Settled lifecycle generations do not retain historical sessions
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_session_delivery_fsm.py::test_completed_memory_lifecycle_state_does_not_accumulate
  - id: MEMORY-INDEP-006
    name: A synchronous Memory capture setup failure stays best effort
    status: covered
    kind: correctness
    layer: contract
    test: tests/test_memory_adapter.py::test_capture_scheduling_failure_releases_retained_lease
  - id: MEMORY-INDEP-007
    name: Archive releases process-local Memory authorization after one non-blocking barrier offer
    status: covered
    kind: guardrail
    layer: contract
    test: tests/test_memory_slice3.py::test_archive_session_commits_then_offers_session_archived
  - id: MEMORY-INDEP-008
    name: Shutdown drops queued and tracked Memory work before closing the runtime
    status: covered
    kind: guardrail
    layer: contract
    test: tests/test_controller_dispatch_loop.py::test_cleanup_sync_stops_watch_service_on_stopped_loop
  - id: MEMORY-INDEP-009
    name: Lightweight handler imports do not load the session FSM or storage
    status: covered
    kind: guardrail
    layer: contract
    test: tests/test_native_session_providers.py::test_native_session_lightweight_imports_do_not_require_sqlite
  - id: MEMORY-INDEP-010
    name: Non-blocking lifecycle barriers never wait for capture delivery and stale captures are missed
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_memory_adapter.py::test_reset_and_archive_events_preserve_barriers
  - id: MEMORY-INDEP-011
    name: Streaming waiters release lifecycle snapshots after handler admission
    status: covered
    kind: guardrail
    layer: contract
    test: tests/test_core_services_dispatch.py::test_streaming_dispatch_releases_lifecycle_snapshot_after_handler_returns
  - id: MEMORY-INDEP-012
    name: Memory processing health events stay in service logs and out of IM delivery
    status: covered
    kind: regression_keep
    layer: contract
    test: tests/test_admin_notifications.py::test_memory_indep_012_processing_events_stay_in_service_logs
  - id: MEMORY-INDEP-013
    name: Disabled fresh startup has no Memory runtime filesystem, task, or process side effects
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_memory_disabled_isolation.py::test_memory_indep_013_disabled_fresh_startup_has_no_runtime_side_effects
  - id: MEMORY-INDEP-014
    name: Disabled Controller startup succeeds while optional Memory implementation imports are blocked
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_memory_disabled_isolation.py::test_memory_indep_014_disabled_controller_starts_with_runtime_imports_blocked
  - id: MEMORY-INDEP-015
    name: Shutdown bounds capture cancellation, destructive settlement, and runtime close under one shared budget
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_memory_disabled_isolation.py::test_memory_indep_015_shutdown_bounds_all_memory_stages_under_one_budget
  - id: MEMORY-INDEP-016
    name: New queued rows use authenticated author and message kind without Memory-private metadata
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_session_delivery_fsm.py::test_memory_indep_016_new_queue_uses_core_identity_without_memory_metadata
  - id: MEMORY-INDEP-017
    name: Core workflows run without importing the optional Memory implementation package
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_memory_disabled_isolation.py::test_memory_indep_017_core_workflows_run_without_avibe_memory
  - id: MEMORY-INDEP-021
    name: Not-required and unreadable Memory status imports no optional implementation
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/test_local_deps.py::test_memory_indep_021_status_import_fence
  - id: MEMORY-INDEP-024
    name: Forward upgrades inspect Memory package shape without retired lifecycle imports
    status: covered
    kind: guardrail
    layer: scenario
    test: tests/scenarios/memory_independence/test_memory_package_shape.py::test_memory_indep_024_forward_package_shape_and_import_contract
  - id: MEMORY-INDEP-025
    name: A failed upgrade is terminal, has no compensating package mutation, and permits retry
    status: covered
    kind: correctness
    layer: scenario
    test: tests/test_upgrade_flow.py::test_memory_indep_025_failed_upgrade_is_terminal_and_retryable
