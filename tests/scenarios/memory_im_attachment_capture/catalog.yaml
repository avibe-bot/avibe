version: 1
capability:
  id: memory_im_attachment_capture
  name: Bound-DM attachment capture through EverOS multimodal ingest
  canonical_tests:
    - tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_catalog.py
    - tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py
    - tests/test_memory_admission.py
    - tests/test_memory_im_attachments.py
    - tests/test_inbound_attachments.py
    - tests/test_ui_memory_routes.py
contract:
  admission: bound_enabled_one_to_one_dm_fail_closed
  opt_in: explicit_complete_multimodal_endpoint
  degradation: text_and_valid_attachments_survive_independently
  formats: everos_parser_minus_svg_video_office_requires_live_soffice
  limits: memory_only_8_files_25_mib_each_100_mib_bundle
  preflight: generated_image_without_user_data
  workbench_compatibility: implicit_main_llm_for_one_cycle
status_legend:
  covered: executable evidence exists
scenarios:
  - id: MEMORY-IM-ATTACH-001
    name: Bound Slack DM attachments traverse one download, pin, add, flush, and search path
    status: covered
    kind: happy_path
    layer: scenario
    delivery_slice: 4
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_bound_slack_dm_attachment_reaches_search_with_redacted_call_log
  - id: MEMORY-IM-ATTACH-002
    name: Group and unbound events perform no Memory attachment acquisition
    status: covered
    kind: authorization
    layer: scenario
    delivery_slice: 4
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_denied_slack_scope_never_reaches_memory_provider
  - id: MEMORY-IM-ATTACH-003
    name: Missing multimodal configuration preserves eligible text without attachment provider activity
    status: covered
    kind: degradation
    layer: scenario
    delivery_slice: 4
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_missing_multimodal_config_preserves_text_without_attachment_activity
  - id: MEMORY-IM-ATTACH-004
    name: Invalid attachments preserve valid siblings and leave no temporary or bundle leak
    status: covered
    kind: boundary
    layer: scenario
    delivery_slice: 4
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_invalid_sibling_preserves_valid_attachment_and_leaves_no_memory_leak
  - id: MEMORY-IM-ATTACH-005
    name: Native Discord DM file shares reach Memory attachment admission
    status: covered
    kind: platform_contract
    layer: scenario
    delivery_slice: 5
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_enabled_platform_attachment_fact_reaches_memory_admission
  - id: MEMORY-IM-ATTACH-006
    name: Native Telegram DM document, photo, voice, and audio shares reach Memory attachment admission
    status: covered
    kind: platform_contract
    layer: scenario
    delivery_slice: 5
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_enabled_platform_attachment_fact_reaches_memory_admission
  - id: MEMORY-IM-ATTACH-007
    name: Native Lark DM file and image shares reach Memory attachment admission
    status: covered
    kind: platform_contract
    layer: scenario
    delivery_slice: 5
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_enabled_platform_attachment_fact_reaches_memory_admission
  - id: MEMORY-IM-ATTACH-008
    name: Native WeChat DM image, voice, file, and video shares reach Memory attachment admission
    status: covered
    kind: platform_contract
    layer: scenario
    delivery_slice: 5
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_enabled_platform_attachment_fact_reaches_memory_admission
  - id: MEMORY-IM-ATTACH-009
    name: Claimed attachment preflight failure retries its caption as text-only
    status: covered
    kind: degradation
    layer: scenario
    delivery_slice: 6
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_claimed_attachment_preflight_failure_retries_caption_as_text_only
  - id: MEMORY-IM-ATTACH-010
    name: Fully rejected attachments preserve the caption without a multimodal provider call
    status: covered
    kind: boundary
    layer: scenario
    delivery_slice: 4
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_rejected_attachment_preserves_caption_without_multimodal_provider_call
  - id: MEMORY-IM-ATTACH-011
    name: Provider attachment rejection retries its caption as text-only
    status: covered
    kind: degradation
    layer: scenario
    delivery_slice: 7
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_provider_attachment_rejection_retries_caption_as_text_only
  - id: MEMORY-IM-ATTACH-012
    name: Office attachments require LibreOffice at admission and delivery
    status: covered
    kind: boundary
    layer: scenario
    delivery_slice: 8
    test: tests/scenarios/memory_im_attachment_capture/test_memory_im_attachment_capture_scenarios.py::test_office_attachment_requires_soffice_and_preserves_valid_siblings
