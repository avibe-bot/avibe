    # ignored twice." ``next_attempt_at`` and NOT ``updated_at``, which
    # ``DefinitionWriteExpectation`` deliberately refuses: a row-version marker refuses
    # benign writes and a freshly stamped notice carries none, whereas ``next_attempt_at`` is
    # stamped unconditionally by every stamper and a legacy notice predating the field reads
    # ``""`` identically on both sides. Deliberately NOT stripped on the Python side, unlike
    # ``owed_notice_eligible``, because SQLite does not strip and stripping here would refuse
    # a write over a padded instant nobody raced. A completion of round 8's value-CAS to the
    # decision's full read-set, not a reversal of it.
    # THE ROUND-8 KNOWN-BY-DESIGN SENTENCE IS RETRACTED. Round 8 recorded, as a deliberate
    # non-guarantee, that two owners deferring one notice from the same read BOTH land. They
    # no longer do: the first moves the field the second re-asserts, so the second LOSES.
    # That is correct under the new contract rather than a benign-refusal regression, and the
    # distinction is the observable state -- "the refused write was refused because the world
    # had already moved to the state it was trying to establish". The outcome is
    # observationally identical: the notice is deferred either way, no attempt is consumed
    # either way, and the two recheck instants differ by the microseconds between two owners
    # reading the clock. Pinned by
    # ``test_a_second_identical_deferral_loses_the_cas_without_changing_the_outcome``, beside
    # ``test_a_stale_claim_cannot_overwrite_a_concurrent_deferral``. Two pre-existing tests
    # were widened in place rather than renamed: the race test now asserts ``expect[:2]``
    # plus the live instant rather than a literal that would pin a wall clock, and the
    # Python/SQL parity test grows five ``next_attempt_at`` shapes and a third "wrong
    # neighbour" tuple, "because a predicate that silently ignored the third element would
    # pass every other assertion in this test".
    # (F) A MALFORMED ``attempts`` WEDGED THE BATCH INSTEAD OF DEGRADING. ``next_attempt``
    # did ``int(notice.get("attempts") or 0)``, which raises on a nonnumeric string or a
    # container. Nothing crashes -- the drain's per-row handler catches it -- "and that is
    # precisely what makes it bad": the exception escapes BEFORE the claim, so it writes NO
    # state, the row keeps its malformed value, stays eligible, and re-occupies a slot in the
    # batch of ten on every 2 s tick. Every notice behind it starved, with a log line per
    # tick and a drain that looks busy rather than broken. FIX: ``_attempts_read`` degrades
    # to 0. Not a fresh choice -- ``notice_write_expectation`` already normalizes this field
    # the same way for the CAS predicate, and SQLite's
    # ``CAST(coalesce(json_extract(...), 0) AS INTEGER)`` reads a nonnumeric value as 0 too,
    # so all three readings agree, "which is what lets the guarded write MATCH and the row
    # advance through claim, backoff and -- if it keeps failing -- the visible dead letter. A
    # different degraded value here would refuse the claim on every pass and reach the same
    # wedge by a quieter road." Three subordinate tests:
    # ``test_a_malformed_attempts_value_degrades_instead_of_raising`` over six shapes,
    # ``test_the_python_and_sql_readings_of_a_malformed_attempts_agree`` for the three-way
    # agreement, and ``test_a_malformed_attempts_row_advances_instead_of_occupying_the_batch``
    # for the consuming outcome -- the batch slot released, not re-occupied forever.
    # (L) ONE PASS COULD HOLD THE WHOLE BACKLOG -- and the obvious diagnosis is REFUTED
    # FIRST, which is why this paragraph is worth reading twice. A wedged batch does NOT
    # re-select itself forever: ``list_owed_failure_notices`` orders by ``next_attempt_at
    # ASC``, least-recently-deferred first, so the fresh backoff instants a slow pass just
    # armed sort BEHIND a notice stamped while it was working, and the newcomer is picked up
    # next pass. Starvation by re-selection was already closed by that ordering. What IS the
    # defect is the SERIAL COST of one pass: deliveries within a pass run one at a time
    # deliberately -- row #2 of a streak only observes row #1's ``sent`` because the passes
    # are ordered, so parallelising them reopens the same-streak duplicate window that
    # serialization closes -- but a batch of ten each legitimately sitting on
    # ``NOTICE_DELIVERY_TIMEOUT_SECONDS`` is 3000 s, fifty minutes, before the pass so much
    # as returns, and a notice stamped one second in waits behind all of it. So the fix is a
    # BUDGET, not concurrency: ``NOTICE_DRAIN_PASS_BUDGET_SECONDS``, declared derivationally
    # as ``2 * NOTICE_DELIVERY_TIMEOUT_SECONDS`` rather than as a literal 600.
    # Two-sided, like every other constant on this id: at least ONE full worst-case delivery,
    # or a pass could spend its budget before finishing the notice it started and make no
    # progress at all; and small enough that a fresh notice's wait is a function of the
    # budget rather than of the batch size -- worst wait becomes budget plus one delivery
    # instead of ten deliveries, and stops growing when the batch limit does. Checked BETWEEN
    # notices and never mid-delivery: "cancelling a delivery already on the wire would trade
    # a slow pass for a duplicate, and the walk already has its own deadline." A truncated
    # pass costs the rows it did not reach NOTHING -- never claimed, no attempt consumed, no
    # backoff armed, and the ASC ordering puts the oldest of them first. Two subordinate
    # tests: ``test_one_pass_stops_at_its_fairness_budget_instead_of_holding_the_backlog``
    # and ``test_the_pass_budget_admits_one_full_worst_case_delivery``, the lower side of the
    # argument as an assertion.
