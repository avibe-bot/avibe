  # PR6 review round 5 (#1072). HFR-079 was the one id left unused when the round-3
  # block started at 080; the block is PR6's up to 099, so it is taken here rather
  # than skipped.
  - id: HFR-079
    name: a replayed failure notice reaches the user without touching the live lifecycle
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # The drain replayed a historical failure through the LIVE emitter and then
    # neutralized its live behaviour one argument at a time: a non-settling output,
    # an auth-recovery bypass, an explicit failure id. ``settle_terminal_failure``
    # still ran in a ``finally``, so the replay stayed inside the live turn
    # lifecycle with a defused payload — and four review rounds found a settlement,
    # an auth and an identity defect in the gaps between those switches.
    # FIX: ``core/backend_failure.py::emit_replayed_backend_failure`` — one visible
    # ``notify`` built from ``backend_failure_notification_output`` and nothing else.
    # No ``result``, so no turn settlement, no status-bubble teardown and no
    # runtime-turn release can be reached at all; no auth recovery; an identity that
    # is authoritative by construction. The run is terminal by construction too: a
    # notice is owed only once the row is settled.
    # Asserted at both ends over a real dispatcher and a migrated state DB: the user
    # gets the persisted notify row and the notice acks on that receipt, AND the live
    # emitter is unreachable (patched to raise under both module spellings, with the
    # drain's import proven absent), exactly one emission and it is the notify, the
    # output settles neither turn nor run, no live-turn hook fires, and the
    # controller's auth service raises on any attribute read.
    # PR6 review round 6 (#1072), F7. Two further subordinate tests carry this same
    # id -- ``test_a_workbench_addressed_notice_lands_as_a_durable_inbox_row`` and
    # ``test_an_avibe_rung_does_not_ack_on_a_synthetic_send_id`` -- because "reaches
    # the user" never held for a workbench-addressed rung. This test set
    # ``deliver_key="slack::channel::C123"`` and so only ever exercised rung (1);
    # every ``avibe::project::...`` target -- the bound session's scope, the creator
    # scope, and rung (5) itself -- was parsed with ``parse_session_key``, which
    # rejects the ``project`` scope type, and ``_add`` swallowed the error. For an
    # Avibe-only definition the ENTIRE ladder was empty, so its failures exhausted
    # their retries and dead-lettered instead of notifying.
    # FIX: ``_add`` falls back to ``parse_scope_id`` for three-part scope ids -- five
    # part ``::thread::`` keys stay on the strict parser, which is the only one that
    # can express a thread -- and an avibe rung acknowledges on the persisted
    # ``messages`` receipt ONLY. That second half is not optional:
    # ``AvibeBot.send_message`` mints a synthetic id whether or not anything durable
    # landed, so a ``delivery_only`` ack would have flipped "nowhere to write the
    # row" from a visible dead letter into a permanent false ``sent`` -- strictly
    # worse than the bug. Receipt-gating one platform in turn forces PER-RUNG
    # evidence, since a single ``DeliveryEvidence`` latches ``delivered`` on the
    # first ``delivered_id`` and one rejected rung would otherwise vouch for every
    # later one.
    # The delta rung (5) really buys is an ARCHIVED session: ``_session_row`` has no
    # status filter where ``resolve_session_id_target`` refuses archived, so rung (2)
    # is gone and rung (5) still delivers. A run whose session row is gone entirely,
    # and a definition that never had one, still dead-letter VISIBLY -- the
    # workspace-level inbox scope that would close that is product surface, not a bug
    # fix. They take no ids of their own because PR6's block is full at 099 and 100+
    # is contracted to PR2 (#1044).
    # PR6 review round 7 (#1072) closed the CLASS instead of the third symptom of it.
    # Three rounds had each found one more target acking on evidence that proved
    # nothing, because "who may ack on what" lived as a predicate reading a platform
    # name -- so every new rung, platform or scope type inherited a permissive answer
    # by default and nothing failed until a user lost a notice.
    # FIX: ``core/scheduled_tasks.py`` states the policy DECLARATIVELY, as
    # ``LADDER_ACK_SOURCES``: a total table over (platform kind, scope type) -> the one
    # evidence source that may acknowledge there. External IM conversations may ack on
    # their native delivery id; every workbench class, the ``project`` scope type and
    # any UNREGISTERED platform require a persisted receipt, and
    # ``UNDECLARED_LADDER_ACK_SOURCE`` makes receipt-only the default an undeclared
    # class would fall back to, so the unsafe direction is never the implicit one.
    # ``_rung_acknowledges`` is now one lookup plus one membership test.
    # A third subordinate test carries this id --
    # ``test_every_ladder_target_class_declares_its_acknowledgement_source`` -- and it
    # is STRUCTURAL: it derives both axes from the code (the ``kind`` of every
    # ``PLATFORM_REGISTRY`` descriptor; the scope-type vocabularies the two ladder
    # parsers actually enforce, asserted parseable rather than hand-copied) and
    # requires the table's domain to equal their product exactly -- no missing class,
    # no stale one. A future rung introducing a platform kind or a scope type cannot
    # ship without declaring its acknowledgement source. Verified red both ways: adding
    # a ``workspace`` scope type reports the three missing classes, and renaming a
    # platform kind reports the stale ones.
    # The two consuming directions are now both asserted end to end. Direction 1 (the
    # workbench inbox row) also proves the notice never enters the LIVE
    # ``emit_backend_failure`` lifecycle, by the same technique as the replay guard
    # above -- patched to raise under both module spellings, with the drain's import
    # proven absent from a ``hasattr`` snapshot taken BEFORE the ``raising=False``
    # patch would have created it -- plus one emission, no turn or run settlement, no
    # live-turn hook and an auth service that raises on any read. Direction 2 (the
    # synthetic send id) is driven through TWO drain passes: with the bound session row
    # DELETED both rungs send and neither persists, so the notice stays ``pending``
    # with no ``ack_evidence``, one attempt consumed and an error naming the missing
    # receipt rather than "produced no evidence"; then, with the row restored ARCHIVED
    # and the backoff rewound, the same still-owed notice is delivered by rung (5),
    # receipts, and acks with the attempt count carried forward. That second pass is
    # what makes "walks on and stays retryable" an assertion instead of a claim.
    # PR6 review round 8 (#1072) named the ONE premise that table cannot check for
    # itself, since totality over an axis says nothing about the axis VALUE being
    # right: ``kind == "im"`` is a claim that the id a send returns was minted by a
    # platform that reached a person, and it is what entitles ("im", channel|user) to
    # the permissive rows. ``PlatformDescriptor.kind`` DEFAULTS to ``"im"``, so a
    # transport added to ``PLATFORM_REGISTRY`` without stating its kind would inherit
    # that entitlement silently -- and the structural test above would stay green,
    # because no new kind appeared. If such a transport minted its own id the way
    # ``AvibeBot.send_message`` does, this whole finding class would reopen with
    # nothing failing.
    # FIX (no product behaviour change): the premise is now WRITTEN DOWN where the
    # claim is made -- a contract comment on ``PlatformDescriptor.kind`` and one beside
    # ``LADDER_ACK_SOURCES`` -- all five IM descriptors state ``kind="im"`` explicitly
    # instead of inheriting it, and a fourth subordinate test carries this id:
    # ``test_every_registry_platform_declares_its_kind_explicitly``. It reads the
    # registry's AST, because at RUNTIME a defaulted ``kind`` and an explicit
    # ``kind="im"`` are the same object; it also asserts the parsed ids equal the live
    # registry's keys, so a registry the AST can no longer read fails rather than
    # silently passing over nothing. The dataclass default is deliberately KEPT --
    # ``PlatformDescriptor`` is constructed outside the registry too -- so the
    # enforcement sits at the registry, not on the shared constructor.
    # It takes no id of its own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 (#1044).
    test: tests/test_harness_failure_visibility.py::test_a_replayed_notice_reaches_the_user_without_touching_the_live_lifecycle
