  - id: HFR-099
    name: a successful rebind is delivered through the retried notice path
    status: covered
    kind: failure
    layer: contract
    backend: shared
    # The one binding transition nobody hears about. A create_once definition whose
    # pinned session is hard-deleted rebinds and retries; when the retry SUCCEEDS the
    # run settles succeeded with error=None, so _owed_failure_notice_for_transition
    # stamps nothing (it stamps only on failed) and _notify_binding_change is a
    # log-only seam. The user's pinned session was replaced -- possibly onto different
    # Agent/model settings -- and the only trace was a logger.warning.
    # FIX: _emit_binding_change stamps a durable notice on the succeeded run row, once
    # per transition (immediately after the binding_recovery marker lands, and only for
    # action == "rebound" with a run that did not fail, so a rebind whose retry failed
    # keeps its ordinary failure notice). Identity is binding:{task_id}:{signature} --
    # SessionBindingChange's own "one broken binding, one notification" key -- and the
    # kind/binding fields are additive, so no migration and no change to the
    # eligibility index expressions HFR-088/089 pin. failure_notices.decide grows a
    # deliver-always lane beside is_interruption, and the drain asks
    # bypasses_suppression rather than is_interruption at the streak gate: reading the
    # streak off a SUCCEEDED anchor would sweep in the definition's surrounding
    # failures and defer the notice forever. list_owed_failure_notices widens its
    # status predicate to both terminal verdicts (free: the index covers state and
    # next_attempt_at, never status).
    # Asserted on the real path end to end -- one SQLite file for the fire, the drain
    # and the messages receipt -- and the second half is the point: the first delivery
    # is killed, which must consume an attempt and arm the backoff rather than
    # re-firing, and the next eligible tick delivers with a receipt. A one-shot emit
    # beside the log line would satisfy "a message appeared" and fail that half.
    # A second, subordinate test carries this same id --
    # ``test_the_binding_notice_copy_only_names_commands_the_cli_has`` -- which parses
    # every command the binding copy prints with the REAL ``build_parser()`` in both
    # locales. It takes no id of its own because the PR6 overflow range this block was
    # written against (250-274) was already occupied by #1064's landed HFR-240...279.
    # Re-truthed in round 11: the plan merged as #1044 re-drew that allocation
    # (docs/plans/harness-run-reliability.md §10.7, "Re-drawn 2026-07-29 against the
    # merged catalog"), so PR6's overflow is now HFR-280...319 -- see the round-11 note
    # under HFR-099 for why these subordinate ids are still unassigned.
    # PR6 review round 9 (#1072). ``stamp_binding_change_notice`` is the ONE owed-notice
    # writer with no terminal transition to ride: it runs on a LIVE run, before
    # ``complete()``, so its read and its write are two statements with no lock across
    # the gap -- pysqlite emits no ``BEGIN`` for a bare SELECT, the fact
    # ``update_owed_failure_notice`` and ``upsert_definition_in_connection`` both
    # document. Round 7 (see HFR-076) audited this writer and excused it as "a pre-read
    # stamp"; right about the order, wrong about the connection, and there were two
    # damage directions, both user-visible.
    # * A second connection settles the row ``failed`` and stamps its OWN failure notice
    #   in the same UPDATE (``_merge_owed_failure_notice``). The whole-blob write put the
    #   binding blob over the top, so the user was told their session was swapped and
    #   NEVER told the run failed -- the notice this whole capability exists to deliver,
    #   overwritten by the one added last.
    # * The row settles ``canceled``. A ``pending`` notice then sat on a status
    #   ``list_owed_failure_notices`` excludes by design: durable and undeliverable
    #   forever, the silent-drop shape HFR-088/089 exist to prevent. ``canceled`` is
    #   reserved for explicit stop semantics, so the correct outcome is NO notice at all
    #   rather than a deferred one -- a user who pressed Stop outranks the rebind news.
    # FIX: the SELECT's status is re-asserted VERBATIM in the UPDATE's WHERE clause
    # beside ``owed_notice_absent()``, with the loss read off ``rowcount`` -- the
    # ``DefinitionWriteExpectation`` idiom, the same one HFR-076 moved the drain's guard
    # into. The write is a ``json_set`` of the single key this method owns rather than a
    # composed blob, for the atomicity reason one level down: the run is LIVE, so sibling
    # metadata keys are being written concurrently (the sweep's ``interrupt_reason``, the
    # settler's ``ok`` marker), and a status+notice CAS over a whole-blob write would
    # still clobber whichever of those landed in the gap. ``json_valid`` over the same
    # ``coalesce``d expression makes a MALFORMED blob a refusal-and-log rather than a
    # ``malformed JSON`` raised out of the rebind path -- refused, never
    # repaired-by-replacement, which is exactly what the old whole-blob write did to an
    # unreadable blob.
    # Four subordinate tests carry this same id.
    # ``test_a_binding_stamp_refuses_a_failure_terminalized_inside_its_gap`` commits the
    # terminal failure from a SECOND connection inside the gap (the loser's UPDATE
    # hooked, as HFR-076's round-8 test does) and asserts the stamp reports it wrote
    # nothing while the failure's own notice survives BYTE-INTACT.
    # ``test_a_binding_stamp_never_lands_on_a_run_canceled_inside_its_gap`` does the same
    # with a cancel and requires no notice at all.
    # ``test_a_binding_stamp_on_a_malformed_metadata_row_is_refused_not_raised`` and
    # ``test_a_binding_stamp_writes_only_its_own_metadata_key`` pin the two costs of the
    # move: an unreadable blob is left alone rather than replaced, and a sibling live-run
    # metadata key written in the gap survives.
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    # PR6 review round 10 (#1072). That CAS had a THIRD damage direction, and its two
    # tests could not see it because both raced the stamp against a status the guard is
    # RIGHT to refuse. The winner can also terminalize ``succeeded`` -- which is not an
    # edge case but the ORDINARY outcome of the rebind this notice exists for, a
    # create_once definition whose pinned session was hard-deleted, rebound, and retried
    # successfully. Refusing there is not a deferral, it is a PERMANENT SILENT LOSS, for
    # two reasons that compound: a successful settlement writes no notice of its own, so
    # nothing else ever fills the slot; and ``_emit_binding_change`` has already
    # persisted the ``binding_recovery`` dedup marker through
    # ``record_binding_recovery`` BEFORE it calls the stamp, so every later fire
    # short-circuits on that marker and no retry is ever attempted. The user's pinned
    # session was replaced, possibly onto different Agent/model settings, and the only
    # trace is a logger.warning -- which is verbatim the bug THIS ID WAS OPENED TO
    # CLOSE, reintroduced by the guard added to protect it. ``succeeded`` is also
    # precisely why ``list_owed_failure_notices`` was widened to both terminal verdicts
    # above: this catalog's own words, "the one notice a succeeded run can owe". The
    # slot is not merely empty, it is legitimately owed and deliverable.
    # FIX: a lost CAS re-reads the row ONCE, inside the same transaction, and retries
    # the stamp exactly once when the winner normalizes to ``succeeded``, the metadata
    # parses, and the notice slot is still empty. The retry re-asserts the RE-READ
    # status and keeps ``owed_notice_absent()``/``json_valid`` unchanged, so it is the
    # same compare-and-swap over a fresher observation rather than a weakened one. The
    # other directions are unchanged and now stated as a total policy over terminal
    # statuses: ``failed`` refuses (its own failure notice owns the slot and outranks
    # this news), ``canceled`` refuses (Stop outranks the rebind news, and the drain
    # excludes the status so a notice there would be durable and undeliverable), and
    # anything else refuses (still live, slot occupied, or unreadable). No outcome falls
    # through to an accidental default, which is the round-7 lesson about auditing a
    # guard for TOTALITY rather than for the one case a finding named.
    # EXACTLY ONE RETRY, AND THE REASON IS CONVERGENCE RATHER THAN LUCK -- explicitly
    # NOT an argument from lock acquisition, since an UPDATE matching zero rows may
    # never escalate to RESERVED. ``succeeded`` is terminal and every terminal writer in
    # the module is guarded on a non-terminal status, so once the re-read sees it the
    # status can never move again and the retry's predicate cannot go stale a second
    # time. The slot is equally settled: ``record_binding_recovery`` is a guarded write
    # admitting a single stamper per transition, so no second binding stamp exists to
    # race and no terminal transition remains to stamp a failure notice. The only writer
    # that can still touch the row is a sibling-key ``json_set`` (the sweep's
    # ``interrupt_reason``), which moves neither the status nor the slot. A second loss
    # would mean an invariant broke, not that a third attempt would help -- so there is
    # no loop.
    # One subordinate test carries this same id:
    # ``test_a_binding_stamp_survives_a_success_settled_inside_its_gap`` reuses the
    # round-9 failed-race interleaving with a SUCCESSFUL settlement as the racing write,
    # and asserts ``interleaved`` first so a stamp that simply never raced cannot pass.
    # Red on b3986fde with ``stamped is None``. The round-9 failed/canceled/malformed/
    # sibling-key tests are untouched and still green, which is what makes this an
    # ADDITION to the policy rather than a relaxation of it.
    # It takes no id of its own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    # PR6 review round 11 (#1072). The round-10 retry answered "is the notice LOST?" and
    # was silent on "is it DUPLICATED?", which is the obligation a retry incurs. The
    # follow-up asked for proof that exactly one durable binding notice reaches the user
    # and that later fires do not add another, and no test carried it: the success-race
    # test stops at store level and never calls ``_emit_binding_change``, so the
    # ``binding_recovery`` marker that gates every later fire does not exist in its
    # world -- and that marker is exactly what the round-10 second stamp attempt runs
    # against.
    # ``test_one_rebind_that_wins_its_race_still_notifies_exactly_once`` closes it end to
    # end on one store, in three steps: the race driven THROUGH ``_emit_binding_change``
    # so the marker is persisted before the stamp as in production; a later fire of the
    # same definition against the same signature, on a REAL second ``agent_runs`` row
    # (reusing the first would be refused by the occupied slot and would prove the wrong
    # layer), which must not reach the store at all -- asserted on every stamp ATTEMPT,
    # since the store's contents cannot distinguish a short-circuit from a refused
    # attempt; and the drain through the real dispatcher landing exactly ONE durable
    # message, with a second pass landing nothing.
    # A GREEN-FROM-BIRTH PIN, said plainly: both dedup layers already existed and are
    # each exercised elsewhere, so nothing here is a red-first fix -- what was missing
    # was putting them together on the path round 10 touched. RED BY MUTATION instead:
    # neutering the signature short-circuit makes the later fire stamp a second notice,
    # and the attempt list comes back with the same signature twice.
    # It takes no id of its own for the reason above -- but the allocation itself has
    # moved, and this is the note the other blocks point at. The plan merged as #1044
    # RE-DREW §10.7 against the merged catalog ("an overflow block is dead the moment a
    # landed catalog occupies any of it"), and PR6's overflow is now HFR-280...319, with
    # PR2 at HFR-100...129. §10.7 says so explicitly: "#1072 currently carries
    # review-round tests that took no ID because its block was full and its old overflow
    # was occupied -- the 280...319 block above is where they belong." So the ~20
    # subordinate tests documented throughout this file now HAVE a home, and assigning
    # them is real outstanding work rather than a documentation nicety. It is left
    # undone here deliberately: it changes the catalog's id SET, which is the one
    # property every round of this review has verified as unchanged, so it is a scoped
    # follow-up for the plan owner and not a close-out edit.
    test: tests/test_harness_failure_visibility.py::test_a_successful_rebind_is_delivered_through_the_retried_notice_path
