    # ``backend_failure_notification_output`` directly and so could not see it.
    # FIX: ``emit_replayed_backend_failure`` passes
    # ``failure_id_authoritative=True`` unconditionally and exposes no way to say
    # otherwise, so the authority is a property of the emitter rather than an
    # argument a call site can forget. Driven through the REAL drain and asserted on
    # the durable ``messages`` row's ``native_message_id`` and metadata, which is
