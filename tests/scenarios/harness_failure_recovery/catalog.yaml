  - id: HFR-094
    name: a failed watch notice renders watch commands
    status: covered
    kind: failure
    layer: contract
    backend: shared
    # ``_failure_notice_body`` resolved the definition through
    # ``ScheduledTaskStore.get_task`` ALONE — the scheduled-task mirror — and then
    # appended ``vibe task run {id}`` / ``vibe task show {id}`` for every definition.
