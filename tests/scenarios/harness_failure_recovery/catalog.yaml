    # rerouting changes the address, never the identity.
    # (c) "NOT hidden ... The row is ``foreground``" and the reasoning that a hidden row
    # "would need a schema change this round does not take". SUPERSEDED. The impasse was
    # real and was mis-diagnosed as a schema problem: ordinary session lists filter
    # POSITIVELY on ``visibility == 'foreground'``, and so did the inbox -- which is why
