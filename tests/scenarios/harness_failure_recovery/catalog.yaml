  - id: HFR-076
    name: a raising delivery rung consumes an attempt instead of retrying forever
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # PR6 review round 6 (#1072), F8. A second, subordinate test carries this same
    # id -- ``test_a_stale_drain_pass_cannot_overwrite_a_newer_acknowledgement`` --
    # the same bound attacked from the other side of the clock. During a service-lock
    # handoff an old drain can stay suspended in the awaited send while the new owner
    # reads the same pending notice and delivers it; the late pass's
    # read/modify/write was keyed by run id alone and guarded only on the notice
    # still EXISTING, so it could rewrite ``sent`` back to ``pending`` -- re-sending
    # a delivered notice -- or forward to ``failed``, a dead letter burying a real
    # receipt. Ownership is checked once at the top of the pass and never re-checked
    # across the await, which is the check-then-act gap.
    # FIX: every drain write re-asserts the ``(state, attempts)`` it was decided
    # from inside ``update_owed_failure_notice`` (as a Python comparison in this round;
    # see round 8 below, which moved it into the UPDATE's WHERE clause) -- the
    # same write-re-asserts-its-read idiom as ``DefinitionWriteExpectation``, without
    # reusing the class, whose predicate is over ``run_definitions`` lifecycle
    # columns rather than a blob in ``agent_runs.metadata_json``. ``attempts`` is in
    # the predicate so two passes reading the same value cannot both consume the
    # increment, and ``updated_at`` deliberately is NOT: a fresh stamp does not carry
    # it, which would make the guard refuse every write. The losing pass no-ops
    # silently rather than raising, because it has nothing to repair and the next 2 s
    # tick reads the winner's state; raising would log an exception on every handoff.
    # It takes no id of its own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    # PR6 review round 7 (#1072) audited that guard for TOTALITY rather than for the
    # one write the finding named, because a CAS that covers four of five writes
    # protects nothing. Every production transition of a notice AFTER the drain's read
    # now passes the expectation: the deferral (backoff + ``defer_reason``), the skip,
    # the ack, the dead letter and the retry -- five call sites, one read, one
    # ``expect``. The deferral is the easy one to miss, since it consumes no attempt,
    # but it does move ``next_attempt_at`` and would have shadowed a newer pass's ack
    # behind a fresh backoff. Two neighbouring writers were audited and deliberately
    # left unguarded: ``_merge_owed_failure_notice``'s four call sites are terminal
    # STAMPS folded into the same UPDATE that transitions ``agent_runs.status``, and
    # ``_owed_failure_notice_for_transition`` refuses to overwrite an existing notice
    # at all. That half still holds: both ride the transition itself, so there is no gap
    # and an expectation there would have nothing to compare against. The remaining
    # unguarded calls are test-only backoff rewinds.
    # CORRECTED IN ROUND 9. The same audit also excused ``stamp_binding_change_notice``
    # as "likewise a pre-read stamp inside its own guarded read/modify/write ... not a
    # post-read transition, so an expectation there would have nothing to compare
    # against". That was right about the ORDER and wrong about the CONNECTION: the
    # excuse only covers a competing pass on the same statement, and cyhhao
    # demonstrated it fails across connections. The stamp reads a LIVE run and runs
    # before ``complete()``, so a second connection can settle that row -- ``failed``
    # (stamping its own notice) or ``canceled`` -- between its SELECT and its UPDATE,
    # exactly the gap this id's own guard was moved into SQL to close.
    # FIX: the stamp now carries a CAS of its own in the UPDATE's WHERE clause -- the
    # status the SELECT saw, verbatim, plus ``owed_notice_absent()`` plus ``json_valid``
    # over the same expression -- and writes through ``json_set`` rather than a composed
    # blob. See HFR-099's round-9 paragraph for both damage directions and the tests.
    # PR6 review round 8 (#1072) found the guard itself was a CHECK-THEN-ACT: it read
    # the row, compared ``(state, attempts)`` in Python, then issued its UPDATE, and
    # under pysqlite a bare SELECT emits no ``BEGIN`` (the same fact
    # ``upsert_definition_in_connection`` documents), so no lock spans that gap and the
    # write lock is first taken by the UPDATE. Two passes could both read
    # ``(pending, N)``, both pass the comparison, and both write -- the round-6 guard
    # narrowed the window from a whole awaited send to sub-millisecond without closing
    # it, and the losing write is the terminal ``failed`` dead letter.
    # FIX: the predicate moved into the UPDATE's WHERE clause
    # (``owed_notice_state_unchanged``), evaluated by SQLite in the same statement that
    # writes, with the loss read off ``rowcount`` -- the ``DefinitionWriteExpectation``
    # idiom now in full, not just in shape. Two subordinate tests carry this same id:
    # ``test_a_notice_write_refuses_a_race_settled_after_its_own_read`` commits the
    # winner from a second connection INSIDE that gap (a
    # ``before_cursor_execute`` hook on the loser's UPDATE), which only an SQL-level
    # predicate survives, and
    # ``test_the_notice_expectation_reads_the_same_in_python_and_in_sql`` pins the cost
    # of the move -- ``notice_write_expectation`` and its new SQL twin must normalize a
    # missing/null/string/non-integer ``attempts`` identically, or the guard would
    # refuse writes nobody raced.
    # They take no id of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    # PR6 review round 8 (#1072), SECOND FINDING: that CAS is a write guard, and the
    # duplicate it prevents is a duplicate ROW, not a duplicate MESSAGE. It correctly
    # stops a stale pass from overwriting a newer acknowledgement, but it does not
    # stop the stale pass from DELIVERING. Both owners can read ``pending``, both then
    # await ``_emit_failure_notice``, and only after the external send does either
    # attempt the CAS -- so the loser is refused at the database having already spoken
    # to the user. ``MessageDispatcher.emit_agent_message`` checks
    # ``agent_message_exists`` before ``send_message`` and persists after it, so two
    # concurrent drain owners both pass the pre-send lookup and both send before
    # either receipt exists; the unique persisted ``(platform, native_message_id)``
    # row resolves only the later database race and cannot recall the duplicate
    # message already delivered.
    # FIX: the attempt is CONSUMED BEFORE the external send, as a guarded claim
    # through the existing CAS (``expect=(pending, N)`` evaluated by SQLite in the
    # UPDATE's WHERE clause), so exactly one of any number of passes that read
    # ``(pending, N)`` wins and every loser returns WITHOUT SENDING.
    # ``next_attempt_at`` doubles as the recovery lease
    # (``CLAIM_LEASE_SECONDS = 600.0``, chosen above both the worst-case five-rung
    # ladder walk at ~30-60 s adapter HTTP timeouts and the 512 s backoff cap), so a
    # claimant that dies mid-send is reclaimed after a bounded delay instead of
    # stalling forever -- no SQL text change and no migration, since the lease rides
    # the column the eligibility index already ranges on. The post-read guard in
    # ``_deliver_one_failure_notice`` widens from a bare ``state == pending`` check to
    # full eligibility (``owed_notice_eligible``, factored in ``storage/background.py``
    # and shared with ``list_owed_failure_notices``' own Python re-check so the two
    # copies cannot drift). That half is not optional: the claim ALONE is insufficient,
    # because an owner that listed before the claim would re-read ``(pending, 1)`` and
    # send a duplicate anyway.
    # Two further subordinate tests carry this same id.
    # ``test_two_owners_reading_one_pending_notice_deliver_it_exactly_once`` runs two
    # services over one SQLite file on two connections, suspends the first exactly at
    # the IM adapter's send boundary, lets the second take ownership and run to
    # completion, and asserts exactly one outbound send and one durable receipt --
    # red on 93c1b379 with "got 2".
    # ``test_a_dead_claimants_lease_expires_into_exactly_one_recovered_delivery``
    # cancels the claimant while it holds the lease, rewinds the lease, and requires
    # recovery to deliver once while consuming its OWN claim, so ``attempts == 2``.
    # THE RESIDUAL IS AT-LEAST-ONCE DELIVERY, AND MUST NEVER BE DESCRIBED AS
    # EXACTLY-ONCE. A duplicate now requires the claimant to die (or stall past the
    # lease) AFTER the transport accepted the send and BEFORE
    # ``persist_agent_message`` committed; a crash after the receipt persisted is
    # absorbed by the HFR-075 duplicate short-circuit, which reports the found row as
    # a receipt and acks. Before this fix duplicate delivery was SYSTEMATIC -- every
    # concurrent-owner race duplicated, with a window the full width of a send and no
    # crash required. What remains is irreducible without a transport-honoured
    # idempotency key, which Slack/Discord/Telegram plain sends do not offer.
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    # PR6 review round 9 (#1072). The claim bounds a competing owner, and by lease
    # expiry it bounds an owner that DIES. Neither bounds an owner that never RETURNS. A
    # transport that accepted the request and hung -- a half-open socket, a platform that
    # stopped answering, an adapter with no timeout of its own -- leaves the pass
    # suspended inside the send, the row ineligible for as long as the lease holds, and
    # nothing anywhere reporting it: the drain is not crashed, it is STOPPED, so this
    # notice and every notice behind it are owed indefinitely.
    # FIX, in two halves that are both required.
    # (a) ``NOTICE_DELIVERY_TIMEOUT_SECONDS = 300.0`` bounds ONE delivery -- the whole
    # ladder walk, not one rung. The worst legitimate five-rung walk (each rung able to
    # sit on an adapter's 30-60 s HTTP timeout) comes to AT MOST this same 300 s, so
    # the bound MATCHES the worst case rather than exceeding it: a walk that saturates
    # every rung's timeout is consumed as an ordinary failed attempt, retried on the
    # declared backoff, and a rung that had already persisted its receipt is absorbed
    # by the duplicate short-circuit on the retry. The deadline also stays strictly
    # BELOW ``CLAIM_LEASE_SECONDS``' 600 s, so a timed-out claimant is cancelled and its
    # backoff durably written while its OWN lease still holds and a replacement claimant
    # can never coexist with a transport coroutine that is still unwinding. The deadline
    # CONSUMES the claim rather than rewinding it: the attempt was already made durable
    # before the send, so the timeout takes the ordinary retry path under the claim's own
    # ``expect`` and arms the declared interval. Rewinding ``attempts`` instead would let
    # a transport that hangs every time retry without bound and never dead-letter --
    # precisely the unbounded loop this id exists to prevent, reached by a different
    # road. ``asyncio.wait_for`` cancels the inner task and AWAITS that cancellation
    # before raising, so no detached transport coroutine survives the deadline.
    # (b) The drain is no longer awaited by ``_watch_store``; it is dispatched as a
    # SINGLE-FLIGHT background task. The deadline alone would only shorten the stall to
    # 300 s, and a deadline short enough to hold a 2 s tick would cancel legitimate
    # deliveries -- and the watch is one coroutine running every periodic pass in
    # sequence, so a wedged notice stalled request draining, callbacks, vault callbacks
    # and the stale-run sweep too. Single-flight rather than a task per tick, which would
    # replace a stalled loop with an unbounded pile of coroutines each re-reading and
    # re-claiming: a tick that finds the previous pass still running simply skips, since
    # eligibility is re-read from the row every pass. The dispatched task's exception is
    # retrieved in a done callback, because a fire-and-forget pass has no reader and a
    # drain that has been failing every tick for a week would otherwise surface only as
    # an asyncio "never retrieved" warning at collection time.
    # SAME ROUND, THE SEQUENCE ITSELF WAS OFF BY ONE. ``BACKOFF_SECONDS`` declares five
    # intervals, and the arming indexed on the INCREMENTED attempt number: the first
    # failed attempt armed ``BACKOFF_SECONDS[1]``, so the 2 s rung was never used, the
    # 512 s cap was never reachable, and the ladder ran 8/32/128/512 and dead-lettered a
    # rung early. Not cosmetic -- ``CLAIM_LEASE_SECONDS`` is justified as exceeding
    # ``BACKOFF_SECONDS[-1]``, an invariant about an interval the code could not arm.
    # FIX: the Nth failed attempt arms ``BACKOFF_SECONDS[N - 1]``, one interval per
    # consumed attempt in order, and ``MAX_ATTEMPTS`` is DERIVED as
    # ``len(BACKOFF_SECONDS) + 1`` rather than chosen, because N attempts are separated
    # by N-1 waits plus the attempt that finds no interval left. Total ladder time moves
    # 680 s to 682 s.
    # Four subordinate tests carry this same id.
    # ``test_a_wedged_delivery_times_out_into_one_durably_retryable_claim`` wedges the
    # send, requires the delivery to RETURN, and asserts the row comes back as ONE
    # durably retryable claim: the attempt consumed, the declared interval armed, no
    # second send.
    # ``test_a_wedged_notice_delivery_does_not_stall_the_store_watch`` wedges one notice
    # and requires an unrelated periodic pass to keep ticking -- red on 93c1b379 by
