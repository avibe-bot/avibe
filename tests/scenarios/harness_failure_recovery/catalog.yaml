    # THE RESIDUAL IS UNCHANGED, AND MUST STILL NEVER BE DESCRIBED AS EXACTLY-ONCE.
    # Cancel-after-transport-accept is a SECOND ENTRANCE to the at-least-once window
    # ``CLAIM_LEASE_SECONDS`` already documents, not a new one: a claimant cancelled
