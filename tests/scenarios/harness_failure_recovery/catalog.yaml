  - id: HFR-084
    name: a malformed metadata row stays writable under the eligibility index
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # PR6 review round 12 (#1072). "STILL WRITABLE" WAS TRUE AND NOT ENOUGH: the four
    # terminal writers were writable over a malformed row by DESTROYING it.
    # ``_merge_owed_failure_notice`` took a pre-DECODED dict and fell back to ``{}`` for
    # anything that was not one, and every terminal writer handed it
    # ``_json_loads(row["metadata_json"], {})`` -- so settling a row whose blob is
    # unparseable, or valid JSON that is not an object, REPLACED the column with just the
    # notice. Whatever those bytes were (a truncated write, a value another component owns,
    # the context an operator would need to diagnose it) "is not this feature's to
    # destroy", and it went on all four writers.
    # WHAT MAKES IT A DEFECT RATHER THAN A POLICY is that it was already inconsistent with
    # every other reader on this head: the binding stamp refuses malformed rows through
    # ``json_valid`` (round 9), ``update_owed_failure_notice`` returns ``None`` when the
    # metadata is not a dict, and ``list_owed_failure_notices`` excludes them outright. One
    # writer out of four chose repair-by-replacement while three chose refusal.
    # FIX: the parameter becomes ``row_metadata_json`` and takes the RAW COLUMN, "because
    # the decode is a decision this choke point has to make rather than inherit". An
    # undecodable or non-object blob logs and RETURNS EARLY without setting
    # ``metadata_json``, so the caller's ``status``/``error``/``completed_at`` UPDATE still
    # commits -- the run settles, only the column is left alone. This completes the
    # refuse-don't-repair rule the binding stamp adopted in round 9: it is now TOTAL across
    # all four terminal writers rather than true of one.
    # RESIDUAL, stated rather than hidden: such a row settles ``failed`` and never owes a
    # notice, so its failure is visible in the run list and in derived health but is never
    # delivered as a message. That was ALREADY true -- the eligibility query excludes
    # malformed rows, so a notice written here would have been durable and unreachable --
    # and it is the direction every other reader on this path chose.
    # One subordinate test carries this id --
    # ``test_a_terminal_writer_never_rewrites_unparseable_metadata`` -- a matrix over four
    # blob shapes and all four writers, asserting the raw column byte-identical while the
    # run still settles ``failed`` with its error. The ``settle_run_terminal`` leg passes a
    # caller-supplied ``interrupt_reason`` on purpose: a sibling field must not be the lever
    # that rewrites the column either.
    # It takes no id of its own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    test: tests/test_harness_failure_visibility.py::test_a_malformed_metadata_row_is_still_writable_under_the_expression_index
