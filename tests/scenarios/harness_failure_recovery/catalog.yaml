    name: the owed-notice lookup is bounded in SQL and does not scan settled history
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # PR6 review round 12 (#1072). The eligibility lookup was bounded here, and HFR-095
    # bounded the streak read, but ONE read on the same 2 s tick was still deciding in
    # Python what the index could decide for it: ``earliest_unsettled_run_before``
    # selected every ``queued``/``running`` row for the definition and applied both the
    # anchor position and the staleness cap as a Python ``continue``. So a definition
    # holding a large nonterminal backlog -- a paused ``create_per_run`` task, a queue
    # drained slower than it fills -- paid that whole backlog per notice per tick "to
    # answer a question whose answer is at most one row".
    # FIX: both filters become SQL TERMS. The anchor is a ROW VALUE
    # (``(created_at, id) < (?, ?)``) for the reason ``failure_streak_decision`` spells
    # out -- ``created_at`` alone is not a position, because several writers stamp a whole
    # batch with one value, and a row value keeps the tie-break IN the comparison where
    # SQLite can constrain it with the index. The staleness cap becomes a lexicographic
    # ``created_at >= cutoff``, and ``LIMIT 1`` states in the statement what the docstring
    # already claimed. Served by ``ix_agent_runs_definition_streak``
    # (``definition_id, created_at, id``): under the older two-column index SQLite
    # decomposes the row value into a weaker scalar range and recovers the tie-break with
    # ``USE TEMP B-TREE FOR LAST TERM OF ORDER BY``, which defeats the ``LIMIT 1``'s early
    # exit -- so the third key is what makes the bound real, not tidiness.
    # ONE DIVERGENCE IS DOCUMENTED RATHER THAN HIDDEN, and it is a deliberate behaviour
    # change: the Python filter asked ``_parse_iso_instant`` and SKIPPED the staleness test
    # when the answer was ``None``, so a row whose ``created_at`` cannot be parsed read as
    # fresh and blocked the notice for as long as it stayed nonterminal -- "a wait nothing
    # can bound". A lexicographic cutoff has no such escape and may class the same value as
    # stale, treating it as settled. That is the duplicate-not-lost direction the cap
    # itself already chose, so it is the acceptable side to land on. The boundary is
    # preserved exactly: ``>=``, because the Python test skipped on
    # ``> stale_after_seconds`` and a row exactly at the cap was kept.
    # Three subordinate tests carry this id.
    # ``test_the_predecessor_read_is_bounded_and_seeks_rather_than_scans`` asserts the
    # RESULT-SET SIZE separately from the plan, which is the reusable lesson: "a read that
    # filters in Python passes both a statement-count budget and a plan that names an
    # index while still materialising an unbounded population."
    # ``test_the_sql_predecessor_read_matches_the_python_filtered_one`` is the parity
    # oracle against ``_python_earliest_unsettled_before``, byte-for-byte the production
    # algorithm as of ``3578f2b6``.
    # ``test_an_unparseable_created_at_reads_as_stale_rather_than_as_a_blocker`` pins the
    # divergence above as intended rather than accidental.
    # A fourth names the two cases the randomised fixture only SAMPLES --
    # ``test_the_predecessor_read_breaks_created_at_ties_by_id_and_stays_bounded_on_no_match``
    # -- because "reproducible is not the same as named": nothing in a seeded fixture fails
    # if the tie-break regresses for a reason its row pool stops generating. It pins both
    # failure directions of the tie (a scalar ``<`` drops the whole tied group and loses a
    # real blocker, the duplicate direction; a scalar ``<=`` admits the anchor itself and
    # defers every notice behind its own run forever) and requires the ``None`` answer to
    # stay bounded too, since ``None`` is what RELEASES the notice and is the common case
    # on a healthy definition. Red on ``b43837f7``: the no-match read handed Python 2 rows.
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    test: tests/test_harness_failure_visibility.py::test_the_owed_notice_lookup_does_not_scan_settled_history
