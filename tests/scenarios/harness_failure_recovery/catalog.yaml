    # row, resolve the name through the watch read path
    # (``get_watch_definition``), and render watch copy
    # (``harness.notice.watchPaused`` / ``harness.notice.watchShow`` →
    # ``vibe watch resume`` / ``vibe watch show``). Asserted through the REAL
    # translator, because the defect is in the command strings a user reads.
