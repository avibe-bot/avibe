    # worse than a dead letter, which at least says so." And the receipt-only ack policy
    # this same block introduced CANNOT catch it: it is blind here precisely because the
    # write really does happen.
    # FIX: ``_rung_five_session_id`` reads the row's status and REROUTES rung (5) to
    # ``WORKSPACE_NOTICE_SESSION_ID`` when it is ``archived``, keyed on that single
    # literal "not on a whitelist of good ones, so a new status is treated as deliverable
    # until somebody teaches the read paths otherwise", and failing OPEN (an unreadable
    # DB returns the original id rather than hijacking the notice). ROUTING, NOT HEALING,
    # and the asymmetry with round 12 is deliberate: the reserved row may never be
    # archived at all, so an archived one is corruption and repairing it in place restores
    # the invariant -- whereas an ordinary session was archived by its owner ON PURPOSE.
    # "The session is not broken; the ADDRESS is. So the notice moves." Pinned by
    # ``test_an_archived_ordinary_session_is_rerouted_instead_of_acked_into``, which
    # asserts the ACK FIRST -- "it passes either way, which is what makes the bug silent"
    # -- then the surface it claims to have reached, and which also requires the archived
