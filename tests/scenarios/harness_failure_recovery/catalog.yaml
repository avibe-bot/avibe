  - id: HFR-072
    name: one malformed metadata row does not blank health for every definition
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # PR6 review round 12 (#1072). THE GUARD THIS ID ESTABLISHED WAS BEING READ AS A
    # CLAIM IT NEVER MADE. ``INTERRUPT_REASON_SQL``'s ``CASE json_valid`` wrapper exists
    # to stop ONE bad blob failing the whole statement -- "it was never a claim that the
    # row is classifiable". But a malformed blob makes that CASE yield NULL, and
    # ``_not_an_out_of_band_interruption`` admits NULL, so an unreadable row was admitted
    # to the health window as an ORDINARY VERDICT and counted as whatever its ``status``
    # column happened to say. A definition whose history could not be read got a confident
    # ``failing`` or ``healthy`` badge -- and a wrongly-CLEAN bill is the failure mode this
    # whole capability exists to remove, contradicting ``HEALTH_UNKNOWN``'s own docstring
    # ("a health signal that cannot be computed must not read as a clean bill").
    # FIX: readability travels as a fourth element of the SAME correlated statement -- not
    # as a second read, because the page-budget invariant holds this lookup to one
    # statement and the round-10/11 plan tests pin the window predicates byte-identical.
    # The expression is ``json_valid(coalesce(nullif(metadata_json, ''), '{}'))``, and the
    # wrapper is load-bearing rather than defensive: a NULL or empty column is VALID -- an
    # absent blob is not an unreadable one -- while ``json_valid(NULL)`` is NULL and
    # ``json_valid('')`` is 0, either of which would otherwise mark every metadata-free run
    # unreadable. It is carried as a VALUE rather than raised, because the window is per
    # definition and one bad row must not take the page down, which is this id's own rule.
    # ONE UNREADABLE ROW ANYWHERE IN THE WINDOW DEGRADES THE WHOLE DEFINITION TO
    # ``HEALTH_UNKNOWN`` rather than being skipped, and the reasoning is worth keeping
    # because skipping looks like the conservative choice and is not: "both answers this
    # function can give are claims over the WHOLE window -- ``failing`` reads the newest
    # verdict and ``healthy`` asserts the absence of a failure across all of them -- so a
    # window with a hole in it cannot support either." The counters go out as ``(0, 0)``,
    # the same shape ``definition_health_batch`` already reports when the read itself
    # raises, so a caller rendering "N consecutive failures" beside an unknown badge cannot
    # print a number that was never computed. The degrade is scoped to the WINDOW, not the
    # lifetime -- otherwise one ancient bad blob would blank a definition's badge forever.
    # THE ASSERTION ON THIS ID'S OWN TEST WAS ALSO TIGHTENED, and the loosening it
    # replaces is instructive: it read ``health in {"failing", "unknown"}``, a disjunction
    # that was green on the broken code. It is now an equality on ``unknown``, so this
    # entry's semantics strengthen without its locator moving.
    # One subordinate test carries this id --
    # ``test_a_malformed_history_row_reports_unknown_rather_than_a_verdict`` -- with three
    # definitions: the unreadable row newest (so "the latest run failed" is unknowable),
    # inside the window but not newest (so ``degraded`` is not answerable either), and aged
    # out of the window by eleven later successes, which must still read ``healthy`` and is
    # the negative control for the scoping claim.
    # It takes no id of its own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    test: tests/test_harness_failure_visibility.py::test_one_malformed_metadata_row_does_not_blank_health_for_every_definition
