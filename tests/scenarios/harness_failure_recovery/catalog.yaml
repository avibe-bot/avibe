    # EXISTS. A run outlives its definition -- the notice is stamped by the terminal
    # transition and drained later, and the retry ladder above makes that window minutes
    # wide -- and the archetypal case is ordinary: a user deletes a task whose last fire
    # failed and has not been reported yet. Both bodies then named commands that resolve
