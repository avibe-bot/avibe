  - id: HFR-095
    name: the streak read is bounded by the streak, not by the definition's lifetime
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # ``failure_streak`` is asked once per pending owed notice on the same 2 s tick
    # HFR-078/083/086 bounded the eligibility lookup for — and it was the last read
    # in that path that was still unbounded. ``_definition_verdict_rows`` selected a
    # definition's ENTIRE settled lifetime ordered by ``(created_at, id)``,
    # materialised every row and JSON-decoded each one to drop interruptions, then
    # sliced out a streak that is almost always two or three rows. Measured on a
    # 5000-row history: 5000 metadata blobs decoded to return 6 rows, under
    # ``SEARCH ... ix_agent_runs_definition_created (definition_id=?)`` plus
    # ``USE TEMP B-TREE FOR LAST TERM OF ORDER BY``.
    # FIX: two ``LIMIT 1`` seeks for the successes bracketing the run by
    # ``(created_at, id)``, then only the rows between them —
    # ``SEARCH ... ix_agent_runs_definition_streak
    # (definition_id=? AND (created_at,id)>(?,?) AND (created_at,id)<(?,?))``, 6
    # blobs decoded. Asserted on the plan's CONSTRAINED TERMS rather than on an
    # index name, which is the HFR-086 lesson: a plan can name an index while the
    # term that matters stays a per-row filter.
    # PR6 review round 12 (#1072). BOTH CLAIMS ABOVE ARE SUPERSEDED, one on cost and one
    # on correctness, and the second is the serious one.
    # THE BOUND WAS ON THE ANSWER, NOT ON THE WORK. The seek-based replacement fixed the
    # plan and kept HANDING THE STREAK'S ROWS BACK; its decode budget was written as
    # ``2 * len(streak) + 2``, which is a bound on the ANSWER and therefore only a bound
    # when the answer is small. On a definition that has never succeeded the streak IS
    # its lifetime, and that is not a corner case -- it is every definition that has been
    # failing since it was created. Measured on a 1500-run never-succeeded history: 4
    # statements, 1500 rows into Python, 1500 blobs decoded, per pending notice, per 2 s
    # tick. So the "6 blobs decoded" figure above describes a bracketed history only; it
    # was never the worst case. Now 1 statement, 1 row, 0 blobs -- on both shapes.
    # THE THREE READS SAW A MOVING HISTORY, and the previous paragraph's safety argument
    # was the wrong argument. It reasoned that three statements are not three snapshots
    # "because every row they read is already SETTLED" -- true of each row individually,
    # and silent about which rows the WINDOW contains. The boundaries are what moves.
    # pysqlite opens no transaction for reads, so the boundaries were seeked at one
    # instant and the rows read at a later one; a success settling in that gap left the
    # boundary saying "no success before this run", the row read swept in the PREVIOUS
    # outage, and that outage's ``sent`` notice made ``decide`` answer SKIP for a live
    # one. ``skipped`` is durable and nothing revisits it, so the outage is never
    # reported: a lost notice, the D1 direction. The old conclusion that holding the
    # write lock "would buy nothing" is retired too -- the fix takes one snapshot without
    # taking any lock.
    # FIX: ``failure_streak_decision`` replaces ``failure_streak``, which is DELETED
    # rather than deprecated (no production callers remain). It answers the three facts
    # ``decide`` actually needs -- ``in_streak``, ``has_sent_elsewhere``,
    # ``earliest_pending_id`` -- in ONE statement, which is one SQLite read snapshot, so
    # the boundaries and the rows inside them come from the same database. The drain never
    # wanted a streak: returning the rows is what made the read cost the streak's LENGTH
    # and forced the caller to redo the classification in Python. The notice state is
    # compared INSIDE SQLite (``OWED_NOTICE_STATE_SQL`` referenced, never retyped), which
    # is why zero blobs are decoded, and ``id != run_id`` on the ``has_sent_elsewhere``
    # term keeps it evidence of delivery by SOMEBODY ELSE -- this row's own ``sent`` state
    # is not evidence that it is a duplicate.
    # AN ABSENT BOUNDARY IS A DERIVED SENTINEL, NOT A DROPPED PREDICATE, and this is the
    # subtle part. The three-statement form knew at build time whether a seek had found
    # anything and omitted the term when it had not; one statement cannot, and spelling it
    # ``(boundary IS NULL OR position > boundary)`` would make the term a DISJUNCTION,
    # which SQLite cannot use as an index constraint -- the plan would name the index
    # while the range stayed a per-row filter, which is the exact failure ``20260728_0040``
    # shipped and HFR-086 pinned. Below every position is the empty string; above every
    # position is the definition's own last ``created_at`` with ``'x'`` appended, DERIVED
    # by the same ``LIMIT 1`` seek rather than a magic high constant, "because a constant
    # would have to out-sort every possible ``created_at`` byte string and nothing
    # guarantees that, while ``X < X || 'x'`` holds for every ``X`` under BINARY
    # collation". Anchor membership is itself a window term, because without it a
    # ``run_id`` that is not a verdict of this definition leaves both boundaries NULL,
    # both sentinels apply, and the "window" becomes the definition's entire history.
    # Two subordinate tests carry this id. The locator above is repointed at
    # ``failure_streak_decision`` and now pins ONE statement, ZERO blobs on BOTH shapes
    # (bracketed and never-succeeded), and the plan's constrained terms with both
    # row-value boundary seeks -- allowing ``SCAN CONSTANT ROW`` deliberately, since the
    # outer projection has no FROM at all.
    # ``test_a_success_settling_mid_read_cannot_merge_two_streaks`` is the correctness
    # half: a second connection commits the recovery from the third ``agent_runs`` SELECT
    # onward, which is a point a multi-statement read reaches with its boundaries already
    # taken and its rows not yet read -- and a one-statement read never reaches at all.
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    test: tests/test_harness_failure_visibility.py::test_the_streak_read_is_bounded_and_seeks_rather_than_scans
  - id: HFR-096
    name: the bounded streak read is the same streak the materialized one computed
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # Parity for HFR-095 against the algorithm it replaces, kept in the test module
    # as an oracle. Randomised histories carry every row class that decides the
    # answer: verdicts and non-verdicts, interruptions inside and outside
    # ``RUN_INTERRUPTION_REASONS``, ``watch_runtime`` heartbeats, and runs sharing a
    # ``created_at`` so the ``id`` tie-break decides ordering — and every run in the
    # history is asked for, not just the failures. The first cut compared boundaries
    # on ``created_at`` alone and this caught it immediately: a bare scalar range
    # both drops rows tied with the boundary and can leave a SUCCESS inside the
    # window, which merges two streaks and skips the second one's notice as a
    # duplicate. The comparison is a ROW VALUE for that reason.
    # PR6 review round 12 (#1072). REPOINTED, and the oracle is now a COMPOSITION. The
    # locator above named ``test_the_sql_streak_matches_the_materialized_streak``, which
    # no longer exists: the read it checked stopped returning a streak, so the test was
    # renamed with it. The parity claim is stronger than a rename suggests.
    # ``_materialized_streak`` survives unchanged -- still byte-for-byte the pre-SQL
    # production algorithm -- and a new ``_facts`` helper is byte-for-byte the derivation
    # ``decide`` used to perform inline on the rows it was handed. Their COMPOSITION is
    # the full old behaviour end to end, and that is what the one-statement read is
    # checked against: "a parity test against a reimplementation of the new code would
    # prove nothing." Six seeded histories of 40 runs, every run asked for plus the
    # literal ``run-does-not-exist``, because a missing anchor is the case that could turn
    # the window into the definition's whole history.
    # A second subordinate test carries this id --
    # ``test_the_facts_decide_exactly_what_the_streak_rows_decided`` -- which pins the
    # CONSUMER against ``_legacy_decide`` (``decide`` as of ``467b7c80``, taking rows)
    # over an asserted 1100-case matrix, comparing ``(action, reason)`` rather than
    # action alone: the reasons are written into the row as ``skip_reason`` /
    # ``defer_reason`` and read back by operators, and ``canonical_pending:<id>`` names a
    # specific run. Moving a derivation into SQL is only safe if no outcome moved with
    # it, and that is a claim about the OLD code, so the old code has to be present to
    # check against.
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    test: tests/test_harness_failure_visibility.py::test_the_sql_streak_facts_match_the_materialized_streak
