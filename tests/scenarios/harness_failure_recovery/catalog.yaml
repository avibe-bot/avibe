    # ``visibility='system'``, and a vocabulary split rather than a migration:
    # ``SESSION_VISIBILITIES`` widens to what may be STORED while
    # ``ASSIGNABLE_SESSION_VISIBILITIES`` (foreground/background) stays what a CALLER may
    # choose, and ``INBOX_SESSION_VISIBILITIES = ("foreground", "system")`` admits the row
    # to ``list_inbox_sessions`` explicitly. The session lists needed NO change at all --
