  - id: HFR-099
    name: a successful rebind is delivered through the retried notice path
    status: covered
    kind: failure
    layer: contract
    backend: shared
    # The one binding transition nobody hears about. A create_once definition whose
    # pinned session is hard-deleted rebinds and retries; when the retry SUCCEEDS the
    # run settles succeeded with error=None, so _owed_failure_notice_for_transition
    # stamps nothing (it stamps only on failed) and _notify_binding_change is a
    # log-only seam. The user's pinned session was replaced -- possibly onto different
    # Agent/model settings -- and the only trace was a logger.warning.
    # FIX: _emit_binding_change stamps a durable notice on the succeeded run row, once
    # per transition (immediately after the binding_recovery marker lands, and only for
    # action == "rebound" with a run that did not fail, so a rebind whose retry failed
    # keeps its ordinary failure notice). Identity is binding:{task_id}:{signature} --
    # SessionBindingChange's own "one broken binding, one notification" key -- and the
    # kind/binding fields are additive, so no migration and no change to the
    # eligibility index expressions HFR-088/089 pin. failure_notices.decide grows a
    # deliver-always lane beside is_interruption, and the drain asks
    # bypasses_suppression rather than is_interruption at the streak gate: reading the
    # streak off a SUCCEEDED anchor would sweep in the definition's surrounding
    # failures and defer the notice forever. list_owed_failure_notices widens its
    # status predicate to both terminal verdicts (free: the index covers state and
    # next_attempt_at, never status).
    # Asserted on the real path end to end -- one SQLite file for the fire, the drain
    # and the messages receipt -- and the second half is the point: the first delivery
    # is killed, which must consume an attempt and arm the backoff rather than
    # re-firing, and the next eligible tick delivers with a receipt. A one-shot emit
    # beside the log line would satisfy "a message appeared" and fail that half.
    # A second, subordinate test carries this same id --
    # ``test_the_binding_notice_copy_only_names_commands_the_cli_has`` -- which parses
    # every command the binding copy prints with the REAL ``build_parser()`` in both
    # locales. It takes no id of its own because the plan's PR6 overflow ranges
    # (250-274) are already occupied by #1064's landed HFR-240...279.
    # PR6 review round 9 (#1072). ``stamp_binding_change_notice`` is the ONE owed-notice
    # writer with no terminal transition to ride: it runs on a LIVE run, before
    # ``complete()``, so its read and its write are two statements with no lock across
    # the gap -- pysqlite emits no ``BEGIN`` for a bare SELECT, the fact
    # ``update_owed_failure_notice`` and ``upsert_definition_in_connection`` both
    # document. Round 7 (see HFR-076) audited this writer and excused it as "a pre-read
    # stamp"; right about the order, wrong about the connection, and there were two
    # damage directions, both user-visible.
    # * A second connection settles the row ``failed`` and stamps its OWN failure notice
    #   in the same UPDATE (``_merge_owed_failure_notice``). The whole-blob write put the
    #   binding blob over the top, so the user was told their session was swapped and
    #   NEVER told the run failed -- the notice this whole capability exists to deliver,
    #   overwritten by the one added last.
    # * The row settles ``canceled``. A ``pending`` notice then sat on a status
    #   ``list_owed_failure_notices`` excludes by design: durable and undeliverable
    #   forever, the silent-drop shape HFR-088/089 exist to prevent. ``canceled`` is
    #   reserved for explicit stop semantics, so the correct outcome is NO notice at all
    #   rather than a deferred one -- a user who pressed Stop outranks the rebind news.
    # FIX: the SELECT's status is re-asserted VERBATIM in the UPDATE's WHERE clause
    # beside ``owed_notice_absent()``, with the loss read off ``rowcount`` -- the
    # ``DefinitionWriteExpectation`` idiom, the same one HFR-076 moved the drain's guard
    # into. The write is a ``json_set`` of the single key this method owns rather than a
    # composed blob, for the atomicity reason one level down: the run is LIVE, so sibling
    # metadata keys are being written concurrently (the sweep's ``interrupt_reason``, the
    # settler's ``ok`` marker), and a status+notice CAS over a whole-blob write would
    # still clobber whichever of those landed in the gap. ``json_valid`` over the same
    # ``coalesce``d expression makes a MALFORMED blob a refusal-and-log rather than a
    # ``malformed JSON`` raised out of the rebind path -- refused, never
    # repaired-by-replacement, which is exactly what the old whole-blob write did to an
    # unreadable blob.
    # Four subordinate tests carry this same id.
    # ``test_a_binding_stamp_refuses_a_failure_terminalized_inside_its_gap`` commits the
    # terminal failure from a SECOND connection inside the gap (the loser's UPDATE
    # hooked, as HFR-076's round-8 test does) and asserts the stamp reports it wrote
    # nothing while the failure's own notice survives BYTE-INTACT.
    # ``test_a_binding_stamp_never_lands_on_a_run_canceled_inside_its_gap`` does the same
    # with a cancel and requires no notice at all.
    # ``test_a_binding_stamp_on_a_malformed_metadata_row_is_refused_not_raised`` and
    # ``test_a_binding_stamp_writes_only_its_own_metadata_key`` pin the two costs of the
    # move: an unreadable blob is left alone rather than replaced, and a sibling live-run
    # metadata key written in the gap survives.
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 (#1044).
    test: tests/test_harness_failure_visibility.py::test_a_successful_rebind_is_delivered_through_the_retried_notice_path
