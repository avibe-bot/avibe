  - id: HFR-094
    name: a failed watch notice renders watch commands
    status: covered
    kind: failure
    layer: contract
    backend: shared
    # ``_failure_notice_body`` resolved the definition through
    # ``ScheduledTaskStore.get_task`` ALONE — the scheduled-task mirror — and then
    # appended ``vibe task run {id}`` / ``vibe task show {id}`` for every definition.
    # A watch is in neither: it got named by its raw id and handed two commands that
    # cannot address it, and there is no ``vibe task run`` for a definition that is
    # not scheduled at all. FIX: discriminate on ``run_type`` / the watch definition
    # row, resolve the name through the watch read path
    # (``get_watch_definition``), and render watch copy
    # (``harness.notice.watchPaused`` / ``harness.notice.watchShow`` →
    # ``vibe watch resume`` / ``vibe watch show``). Asserted through the REAL
    # translator, because the defect is in the command strings a user reads.
    # PR6 review round 9 (#1072). That discrimination still assumed the definition
    # EXISTS. A run outlives its definition -- the notice is stamped by the terminal
    # transition and drained later, and the retry ladder above makes that window minutes
    # wide -- and the archetypal case is ordinary: a user deletes a task whose last fire
    # failed and has not been reported yet. Both bodies then named commands that resolve
    # to nothing. The failure body appended ``harness.notice.rerun`` unconditionally
    # ("Re-run it now with: ``vibe task run <id>``") and ``harness.notice.show``; the
    # binding body offered ``vibe task update <id> --session-id ...`` to pin back a row
    # that cannot be pinned. Each PARSES and then fails at runtime with "not found",
    # which is this id's own defect one noun over: copy naming an action the user cannot
    # take, and worse than silence because it reads as a working recovery path.
    # FIX: when neither read path resolves the definition (``get_task`` and
    # ``get_watch_definition`` both empty), the body says the definition is gone
    # (``harness.notice.definitionDeleted``) and names only RUN-LEVEL recovery --
    # ``vibe runs show <run id>``, the one row that does still exist -- dropping the
    # definition-scoped pair entirely. The binding body got the same treatment and keeps
    # the news itself: the old and new session ids are still reported, because "your
    # pinned session was replaced" is true whether or not the definition survived.
    # Validated by parsing EVERY command the body prints through the real
    # ``build_parser()``, which is the HFR-099 copy-test discipline, because a
    # hand-written expectation drifts with the CLI.
    # Two subordinate tests carry this same id:
    # ``test_a_deleted_definition_notice_names_only_run_level_recovery`` and
    # ``test_a_deleted_definition_binding_notice_drops_the_repin_command``.
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 (#1044).
    test: tests/test_harness_failure_visibility.py::test_a_failed_watch_notice_renders_watch_commands
  - id: HFR-095
    name: the streak read is bounded by the streak, not by the definition's lifetime
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # ``failure_streak`` is asked once per pending owed notice on the same 2 s tick
    # HFR-078/083/086 bounded the eligibility lookup for — and it was the last read
    # in that path that was still unbounded. ``_definition_verdict_rows`` selected a
    # definition's ENTIRE settled lifetime ordered by ``(created_at, id)``,
    # materialised every row and JSON-decoded each one to drop interruptions, then
    # sliced out a streak that is almost always two or three rows. Measured on a
    # 5000-row history: 5000 metadata blobs decoded to return 6 rows, under
    # ``SEARCH ... ix_agent_runs_definition_created (definition_id=?)`` plus
    # ``USE TEMP B-TREE FOR LAST TERM OF ORDER BY``.
    # FIX: two ``LIMIT 1`` seeks for the successes bracketing the run by
    # ``(created_at, id)``, then only the rows between them —
    # ``SEARCH ... ix_agent_runs_definition_streak
    # (definition_id=? AND (created_at,id)>(?,?) AND (created_at,id)<(?,?))``, 6
    # blobs decoded. Asserted on the plan's CONSTRAINED TERMS rather than on an
    # index name, which is the HFR-086 lesson: a plan can name an index while the
    # term that matters stays a per-row filter.
    test: tests/test_harness_failure_visibility.py::test_the_streak_read_is_bounded_and_seeks_rather_than_scans
  - id: HFR-096
    name: the bounded streak read is the same streak the materialized one computed
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # Parity for HFR-095 against the algorithm it replaces, kept in the test module
    # as an oracle. Randomised histories carry every row class that decides the
    # answer: verdicts and non-verdicts, interruptions inside and outside
    # ``RUN_INTERRUPTION_REASONS``, ``watch_runtime`` heartbeats, and runs sharing a
    # ``created_at`` so the ``id`` tie-break decides ordering — and every run in the
    # history is asked for, not just the failures. The first cut compared boundaries
    # on ``created_at`` alone and this caught it immediately: a bare scalar range
    # both drops rows tied with the boundary and can leave a SUCCESS inside the
    # window, which merges two streaks and skips the second one's notice as a
    # duplicate. The comparison is a ROW VALUE for that reason.
    test: tests/test_harness_failure_visibility.py::test_the_sql_streak_matches_the_materialized_streak
  # Collapse the CLI's second health read model into the one projection.
  - id: HFR-097
    name: the CLI is a projection consumer, not a second health read model
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # This change's own first draft added _task_health_map/_task_health to vibe/cli.py
