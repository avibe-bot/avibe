  - id: HFR-061
    name: the coalesced completer does not clobber an already-settled success
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # PR6 review round 12 (#1072). THE DELIBERATE FALL-THROUGH THIS ID ESTABLISHED IS
    # ALSO A HOLE. HFR-061 stopped the coalesced completer clobbering an already-SETTLED
    # row by skipping terminal statuses, but it deliberately let ``canceled`` fall through
    # so a cancel-requested row keeps being normalized. That exemption read
    # ``cancel_requested`` from a batch snapshot and never re-asserted it, and ``cancel_run``
    # is a separate transaction: pysqlite starts no transaction for the read, so the
    # snapshot is genuinely older than the write and a Stop landing in the gap is
    # overwritten by a ``failed`` the writer decided on BEFORE the user pressed it.
    # ``settle_run_terminal`` has the reachable half of the same defect from the other
    # side: it scopes its UPDATE to ``queued|running``, which catches a cancel of a QUEUED
    # row because ``cancel_run`` flips that status directly -- but on a RUNNING row
    # ``cancel_run`` sets only the flag, the status predicate still matches, and the write
    # lands ``failed`` over the Stop. A running turn is what a user actually presses Stop
    # on.
    # THE DAMAGE IS TWO-LAYERED, and the second layer is why this belongs to PR6 rather
    # than to the settlement lane alone: the run reads ``failed`` when the user cancelled
    # it, so the Stop silently did nothing; AND a ``failed`` transition stamps an owed
    # failure notice, so the drain then tells the user their task is broken because they
    # cancelled it -- "a notice nobody can act on, in the lane this whole feature exists
    # to make trustworthy."
    # FIX: ``cancel_requested`` joins the terminal CAS as ``cancel_not_requested()``, a
    # module-level SQL helper under the same ``coalesce``/``CAST`` shape
    # ``owed_notice_state_unchanged`` uses -- ``coalesce`` because a NULL column reads as
    # "not requested" on the Python side and NULL is not false in SQL, ``CAST`` because
    # untyped storage means a text ``'0'`` must not read as truthy. The asymmetry IS the
    # fix: the ``canceled`` branch keeps ``canceled`` in its status list and falls through,
    # while the ``succeeded``/``failed`` branch re-asserts ``cancel_not_requested()`` and
    # DROPS ``canceled`` from its list. Both halves are needed -- the status predicate stops
    # the write landing on a row already flipped to ``canceled``, the flag predicate stops
    # it landing on a running row where only the flag moved.
    # ONE RE-READ ON A REFUSED WRITE, NEVER A LOOP, and the reason one suffices is not
    # lock acquisition: a refusal means the row moved under the snapshot, so the decision
    # is remade from what the row NOW says -- "otherwise a run the user cancelled
    # mid-flight is simply left ``running`` and nothing ever settles it, which trades a
    # wrong status for a zombie." The retry's own snapshot already sees the cancel, and
    # this runs on the Workbench completion path where an unbounded retry is its own
    # outage. ``settle_run_terminal`` now also RETURNS what it actually wrote rather than
    # what it first decided.
    # Three subordinate tests carry this id, one per writer plus the control. The cancel
    # goes through the production ``cancel_run`` on a second store over the same file, not
    # a hand-written UPDATE, "so what the test races against is what the Stop button
    # does", and each asserts the race actually fired before judging the outcome.
    # ``test_a_cancel_landing_under_the_coalesced_completer_is_not_overwritten`` and
    # ``test_a_cancel_landing_under_settle_run_terminal_is_not_overwritten`` require
    # ``canceled`` AND no stamped notice; red on ``a2829d3b`` for both writers, where the
    # row ends ``failed`` with a notice attached.
    # ``test_the_cancel_cas_does_not_leave_an_uncancelled_run_unsettled`` is the negative
    # control, and it is not optional: "a ``cancel_requested`` predicate is the kind of
    # guard that quietly refuses writes nobody raced -- and here that would mean a failed
    # turn never settling and never owing its notice, which is a D1 loss dressed as a
    # safety fix."
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    test: tests/test_harness_failure_visibility.py::test_complete_coalesced_does_not_clobber_an_already_succeeded_run
