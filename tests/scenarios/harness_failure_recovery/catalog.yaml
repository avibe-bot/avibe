  - id: HFR-079
    name: a replayed failure notice reaches the user without touching the live lifecycle
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # The drain replayed a historical failure through the LIVE emitter and then
    # neutralized its live behaviour one argument at a time: a non-settling output,
    # an auth-recovery bypass, an explicit failure id. ``settle_terminal_failure``
    # still ran in a ``finally``, so the replay stayed inside the live turn
    # lifecycle with a defused payload — and four review rounds found a settlement,
    # an auth and an identity defect in the gaps between those switches.
    # FIX: ``core/backend_failure.py::emit_replayed_backend_failure`` — one visible
    # ``notify`` built from ``backend_failure_notification_output`` and nothing else.
    # No ``result``, so no turn settlement, no status-bubble teardown and no
    # runtime-turn release can be reached at all; no auth recovery; an identity that
    # is authoritative by construction. The run is terminal by construction too: a
    # notice is owed only once the row is settled.
    # Asserted at both ends over a real dispatcher and a migrated state DB: the user
    # gets the persisted notify row and the notice acks on that receipt, AND the live
    # emitter is unreachable (patched to raise under both module spellings, with the
    # drain's import proven absent), exactly one emission and it is the notify, the
    # output settles neither turn nor run, no live-turn hook fires, and the
    # controller's auth service raises on any attribute read.
    # PR6 review round 6 (#1072), F7. Two further subordinate tests carry this same
    # id -- ``test_a_workbench_addressed_notice_lands_as_a_durable_inbox_row`` and
    # ``test_an_avibe_rung_does_not_ack_on_a_synthetic_send_id`` -- because "reaches
    # the user" never held for a workbench-addressed rung. This test set
    # ``deliver_key="slack::channel::C123"`` and so only ever exercised rung (1);
    # every ``avibe::project::...`` target -- the bound session's scope, the creator
    # scope, and rung (5) itself -- was parsed with ``parse_session_key``, which
    # rejects the ``project`` scope type, and ``_add`` swallowed the error. For an
    # Avibe-only definition the ENTIRE ladder was empty, so its failures exhausted
    # their retries and dead-lettered instead of notifying.
    # FIX: ``_add`` falls back to ``parse_scope_id`` for three-part scope ids -- five
    # part ``::thread::`` keys stay on the strict parser, which is the only one that
    # can express a thread -- and an avibe rung acknowledges on the persisted
    # ``messages`` receipt ONLY. That second half is not optional:
    # ``AvibeBot.send_message`` mints a synthetic id whether or not anything durable
    # landed, so a ``delivery_only`` ack would have flipped "nowhere to write the
    # row" from a visible dead letter into a permanent false ``sent`` -- strictly
    # worse than the bug. Receipt-gating one platform in turn forces PER-RUNG
    # evidence, since a single ``DeliveryEvidence`` latches ``delivered`` on the
    # first ``delivered_id`` and one rejected rung would otherwise vouch for every
    # later one.
    # The delta rung (5) really buys is an ARCHIVED session: ``_session_row`` has no
    # status filter where ``resolve_session_id_target`` refuses archived, so rung (2)
    # is gone and rung (5) still delivers. A run whose session row is gone entirely,
    # and a definition that never had one, still dead-letter VISIBLY -- the
    # workspace-level inbox scope that would close that is product surface, not a bug
    # fix. They take no ids of their own because PR6's block is full at 099 and 100+
    # is contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    # RETRACTED IN ROUND 12 -- and it is the sentence directly above that is wrong, so
    # read it as history rather than as contract. "A run whose session row is gone
    # entirely, and a definition that never had one, still dead-letter VISIBLY" was
    # recorded as Known-By-Design across four rounds, on the reasoning that the
    # workspace-level inbox scope which would close it "is product surface, not a bug
    # fix". THE PLAN DISAGREES, IN WRITING AND BY NAME. #1044 merged carrying two dated
    # corrections that assign exactly this to PR6:
    # "Rung (5) is mandatory, not an implementation check (corrected 2026-07-27)" --
    # which names the earlier conditional framing as "a way to ship PR6 with the failure
    # still silent" -- and "'Widen the push helper' was not a mechanism (corrected
    # 2026-07-29, review)", which specifies the synthetic workspace-notifications session
    # and says outright "This is in PR6's scope, not a follow-up, because without it rung
    # (5) is as empty as the four above it" (docs/plans/harness-run-reliability.md
    # :3170-3174, :3196-3222, with the D5 body requirement at :3165-3168).
    # THE POPULATION THIS WAS LOSING is not exotic: a definition created by a plain
    # ``vibe task add`` records no caller provenance at all
    # (``_definition_creation_metadata_from_caller`` returns ``{}`` for a null caller
    # context), so rungs (3) and (4) are empty; with no deliver key and no session
    # binding, rungs (1), (2) and the session-derived rung (5) candidate are empty too.
    # EVERY rung empty meant the notice could only dead-letter -- visible to somebody who
    # goes looking, which is precisely the population D1 is about.
    # FIX (round 12): the blocker was a missing HOME, not a missing writer.
    # ``persist_agent_message`` declines to write only when an avibe context resolves
    # neither a scope nor a session row, so rung (5) now resolves-or-creates ONE reserved
    # workspace-notifications session (``resolve_workspace_notice_session`` in
    # ``storage/agent_session_rows.py``) and addresses it exactly like any other avibe
    # session: the same ``avibe::project::<session id>`` candidate, the same
    # ``_session_row`` lookup, the same receipt-only ack policy the paragraph above
    # forced, and the same inbox / unread / realtime / Web Push machinery. Nothing
    # downstream learns a new row shape, which is the whole point -- the rejected
    # alternative was a sessionless inbox row, and the plan's own correction records why
    # that fails: the inbox is per-session by construction at four layers, so widening
    # the push helper alone "creates nothing -- there is no row to notify about".
    # THREE IMPLEMENTATION CHOICES DIVERGE FROM THE PLAN'S SKETCH, each for a reason
    # worth keeping, because the plan asked for a row "hidden from ordinary session
    # lists, exempt from ``/new`` clears and eviction".
    # * NOT hidden. ``visibility='background'`` is filtered out of
    #   ``list_inbox_sessions``, so hiding the row would hide the inbox card rung (5)
    #   exists to show -- the plan's own requirement defeats itself. The row is
    #   ``foreground`` and named through ``vibe/i18n`` instead
    #   (``harness.notice.workspaceSession``).
    # * NOT exempt. Durability is by lazy RECREATION rather than by exemption, so no
    #   ``/new`` clear path and no eviction code learns a special case (no PR5 file is
    #   touched); if the row is removed, the next notice simply makes it again.
    # * Idempotence rests on the PRIMARY KEY, not on a lock alone:
    #   ``WORKSPACE_NOTICE_SESSION_ID`` is spelled outside ``SESSION_ID_ALPHABET``, so
    #   ``new_session_id`` can never mint it, and the create re-decides under
    #   ``reserve_write_lock`` so two racing drain owners produce one row. The row
    #   carries NO scope, because every avibe project scope is a row in
    #   ``list_projects`` and a reserved one would mint a fake sidebar project.
    # The old pin is INVERTED rather than deleted --
    # ``test_a_session_less_definition_dead_letters_rather_than_going_silent`` is now
    # ``test_a_session_less_definition_now_reaches_the_workspace_inbox`` -- and the
    # plan's two owed tests exist by name:
    # ``test_a_caller_less_cli_definition_still_delivers_its_failure_notice``, built with
    # ``caller_context=None`` so the emptiness is STRUCTURAL rather than mocked, and
    # ``test_workspace_notification_session_is_created_once_and_reused``.
    # RESIDUALS, three, stated because none of them is closed: the session appears in
    # ordinary session lists (the direct cost of choosing foreground over hidden); its
    # ``agent_backend`` is empty, since it has no backend and no turns; and D5's
    # remaining body item -- the creation channel/thread with a deep link -- is NOT
    # implemented, only the failure class and last-success lines are (see HFR-094's
    # round-12 paragraph). That half awaits the plan's numbered-deferral mechanism rather
    # than being claimed here.
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header) -- and the offer to
    # take §10.7's re-drawn HFR-280...319 block is WITHDRAWN as of round 14, for two
    # independent reasons. The first is a ruling: cyhhao declined to consume an id for this
    # round, so the subordinate tests documented throughout this file stay subordinate by
    # DECISION, not merely because the block was full. The second is stronger and outlives
    # the ruling: THAT BLOCK IS ALREADY DEAD. Master landed HFR-280 in ``807d1eee``
    # (``feat(search): opt-in include-archived``) -- an unrelated PR that took the first id
    # of the block §10.7 had just re-drawn for PR6 -- and §10.7's own rule is explicit:
    # "an overflow block is dead the moment a landed catalog occupies any of it; reassign
    # from above the highest landed ID, never reuse or straddle." So this is the THIRD
    # occurrence of the exact failure §10.7 was written to prevent (after PR1/PR5 both
    # claiming 041...048, and PR5's overflow landing across blocks promised to
    # PR6/PR2/PR3), and it arrived the same way each previous one did: silently, visible
    # only on comparing branches by hand. Any future assignment for these tests must be
    # re-drawn above the highest landed id rather than taken from 280...319. Round 11's
    # note under HFR-099 should be read with both facts attached.
    # RETRACTED IN ROUND 14, THREE CLAIMS, and two of them are claims this block made
    # about its own fix rather than about the code it replaced -- so read the marked
    # sentences above as history.
    # (a) "The delta rung (5) really buys is an ARCHIVED session: ``_session_row`` has no
    # status filter where ``resolve_session_id_target`` refuses archived, so rung (2) is
    # gone and rung (5) still delivers." REVERSED (round-13 P1, review thread
    # 3676292667). The mechanism is real and still is; the CONCLUSION was wrong. An
    # archived ``agent_sessions`` row is "a WRITABLE row that is not a VISIBLE surface":
    # ``persist_agent_message`` resolves the scope through ``_session_row``, which has no
    # status filter, so the write lands; a persisted receipt is the workbench class's ack
