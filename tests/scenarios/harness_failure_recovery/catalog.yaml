  - id: HFR-091
    name: the drain preserves an authoritative interruption identity
    status: covered
    kind: failure
    layer: contract
    backend: shared
    # ``_failure_identity`` honours an explicit id outright only when the caller says
    # it is AUTHORITATIVE; otherwise the harness run-id override wins, which is what
    # aligns a backend's own turn id with the drain's replay (HFR-087). The drain
    # passed its explicit ``failure_id`` WITHOUT that flag, so the interruption
    # identity ``interrupt:{run}:{reason}`` — stamped precisely so a D1 interruption
