    # (D) THE CAS WAS INCOMPLETE, AND THE ROUND-8 PARAGRAPH ABOVE DESCRIBES IT AS
    # ``(state, attempts)`` BECAUSE THAT IS WHAT IT WAS. Eligibility is decided from THREE
    # fields -- ``owed_notice_eligible`` reads ``state`` and ``next_attempt_at``,
    # ``next_attempt`` reads ``attempts`` -- and the one left out is the only field a
    # DEFERRAL writes. A deferral touches neither ``state`` nor ``attempts``, so a claimant
    # that read before a concurrent owner's deferral still matched its own expectation, won
    # the CAS, and ERASED the deferral: two notices per streak in the stale-cutoff lane, and
    # a ``DEFERRAL_RECHECK_SECONDS`` that any stale claimant could cancel -- which is the
    # starvation the durable deferral exists to prevent.
    # FIX: ``notice_write_expectation`` returns ``(state, attempts, next_attempt_at)`` and
    # ``owed_notice_state_unchanged`` gains the third predicate, reusing
    # ``OWED_NOTICE_NEXT_ATTEMPT_SQL`` verbatim rather than retyping it -- "a divergent copy
