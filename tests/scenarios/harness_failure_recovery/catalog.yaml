    # ``suppress_delivery`` keys on ``== 'background'`` alone, so realtime and Web Push
    # are untouched. ``unread_counts_by_session`` had to be edited even though its answer
    # is the same shape, because its predicate is the NEGATIVE form and "has to name every
    # visibility the inbox admits or the badge would disagree with the feed it is supposed
    # to count". Message search deliberately keeps ``== 'foreground'``, narrower than the
    # inbox. The Agents run graph is excluded EXPLICITLY, because its own filter was
    # ``!= 'background'``, which admits by default.
    # NO ALEMBIC MIGRATION, and the reason is worth keeping because it is unusual: "this
    # row exists in no release (this PR created it), so there is nothing deployed to
    # migrate." ``_workspace_notice_session_is_usable`` now requires ``system`` EXACTLY
    # rather than accepting either value, so a round-12/13 development row is converted in
    # place by the next notice, under the same write lock the create takes -- "the heal is
    # also the migration". The naive alternative is kept as a PERMANENT REFUTATION rather
    # than a comment: ``test_background_would_hide_the_card_which_is_why_system_exists``
    # flips the row to ``background`` by direct SQL and asserts both halves of the cost in
    # one failure -- the card disappears while the notice row is still persisted and still
    # stamped ``sent``, and the badge stops counting it.
    # (d) THE RESIDUALS ARE NOW TWO, NOT THREE. "The session appears in ordinary session
    # lists" is closed by (c). "D5's remaining body item -- the creation channel/thread
    # with a deep link -- is NOT implemented" is closed by round 14's origin contract; see
    # HFR-094's round-14 paragraph, which also retracts the matching sentence there. What
    # remains: the row's ``agent_backend`` is empty, since it has no backend and no turns;
    # and it is still one ``DELETE /api/sessions/ses-workspace-notices`` from anyone
    # holding the id, which the inbox card carries -- "hiding the row from the lists
    # narrows the blast radius; it does not replace this guard, which is why both exist",
    # and a delete HEALS on the next notice rather than being exempted.
    # The system-surface behaviour has its own file, ``tests/test_workspace_system_session.py``,
    # so only the doctrine is recorded here.
    # THE ALWAYS-APPEND DOCTRINE (round 14, gate item 2; review thread 3676292675). Round
    # 12's rule was that the workspace rung fires only for an otherwise-empty ladder, and
    # that rule was "too narrow by exactly the case #1060 reported (maintainer note
    # 5120451508): a NON-EMPTY ladder is not a DELIVERABLE one." A watch bound to a
    # HARD-DELETED session builds a ladder whose every candidate resolves to nothing: each
    # attempt sends, the receipt-only ack source correctly refuses it, the ``if not rungs``
    # gate NEVER FIRES, all six attempts burn, and the notice dead-letters with nothing
    # written anywhere. That silent dead letter is the 3.5 hours of silence in #1060's
    # field evidence.
    # TWO DESIGNS ARE RETIRED, named so neither comes back. (i) Round 12's "only when
    # nothing else resolved". (ii) Round 13's FINAL-ATTEMPT fallback (``ce695b42``), which
    # appended the same rung last but only on attempt ``MAX_ATTEMPTS``; it closed (i)'s
    # hole and was overruled anyway -- "correct about the mechanism and overruled on the
    # trade". It never shipped: the history was rebuilt and that commit is not an ancestor
    # of the branch, so the catalog never documented it as landed and should not now.
    # FIX: the workspace rung is appended UNCONDITIONALLY, once, last. "What survives of
    # round 12's argument is ORDER, and it does the work a condition used to" -- a healthy
    # preferred rung wins every walk because it comes first, not because a gate suppressed
    # the fallback. The reviewer's ruling is quoted verbatim in the code rather than
    # paraphrased: "Append one distinct workspace-notifications target after every
    # person/context target, even when earlier candidates exist but are stale, unavailable,
    # or fail delivery. It cannot be conditional on rungs being empty."
    # THE REROUTE AND THE APPEND COLLAPSE TO ONE RUNG, and that is a property of the
    # ``_add`` seen-set rather than of a special case: ``_rung_five_session_id`` returns the
    # bare ``WORKSPACE_NOTICE_SESSION_ID`` constant, so an archived row's rerouted rung (5)
    # and the unconditional append are byte-identical ``(parsed key, session id)`` tuples
    # and dedupe for free. Pinned ladder-only by
    # ``test_an_archived_session_ladder_holds_exactly_one_workspace_rung``, with a live
    # rung (1) present so it covers POSITION as well as count.
    # THE TRADE IS RECORDED, WITH ITS ACCEPTANCE, because it is a real behaviour change:
    # any walk in which every preferred rung fails to deliver now reaches this rung on THAT
    # walk, delivers, and acks -- so a preferred rung that failed TRANSIENTLY (a platform
    # blip on attempt 1) permanently routes that one notice to the workspace inbox, and the
    # user's own channel never receives the copy it would have got a minute later. Accepted
    # explicitly by the maintainer in the ruling above ("...or fail delivery"), "on the
    # judgement that a misrouted notice a user can find beats a notice nobody receives".
    # Scope of the residual is ONE notice, not the definition: the next failure builds a
    # fresh ladder and the recovered preferred rung wins it again.
    # THE RESERVED ROW IS NOT MINTED ON HEALTHY INSTALLS, which is the cost the append
    # would otherwise carry. The rung is appended at ladder-build time but RESOLVED at the
    # walk, so ``_workspace_notice_session_id`` is only called when the walk actually
    # reaches it -- the call is made "for its WRITE, not for its return".
    # ``test_a_healthy_preferred_rung_never_reaches_the_workspace_inbox`` is the negative
    # pin nothing else in the file carried: one live rung (1) wins, no workspace
    # ``messages`` row exists, and no reserved session row is created at all.
    # The unwritable-DB residual MOVED rather than disappeared: from "nothing to append" to
    # "the rung is skipped", with the walk logging it and preserving a preferred rung's own
    # refusal rather than overwriting it with the resolve failure. Still a visible dead
    # letter, pinned by ``test_an_unwritable_workspace_inbox_still_dead_letters_visibly``.
    # Two further subordinate tests, both renamed from the retired design so no locator
    # points at a name that never shipped:
    # ``test_a_walk_whose_preferred_rungs_all_fail_lands_in_the_workspace_inbox`` (was
    # ``test_the_final_attempt_falls_back_to_the_workspace_inbox``) pins the ladder before
    # any send, the send ORDER, exactly one workspace row, and the round-14 delta --
    # ``attempts == 1`` on ONE drain pass, where the retired design needed six; and
    # ``test_replaying_the_workspace_walk_reuses_the_persisted_receipt`` (was
    # ``test_replaying_the_final_walk_reuses_the_persisted_workspace_receipt``), which is
    # explicitly a pin rather than a red-first case -- HFR-075's machinery already makes it
    # green, and its red half is the mutation at the end: delete the persisted row and the
    # same replay delivers again.
    # ``attempt`` is no longer threaded into the walk. It used to be, only because the
    # workspace rung's presence depended on the attempt number; with the rung unconditional
    # the parameter had no other reader, and ``MAX_ATTEMPTS``, the backoff ladder and
    # ``LADDER_ACK_SOURCES`` are untouched by all of this.
    # PR6 review round 7 (#1072) closed the CLASS instead of the third symptom of it.
    # Three rounds had each found one more target acking on evidence that proved
    # nothing, because "who may ack on what" lived as a predicate reading a platform
    # name -- so every new rung, platform or scope type inherited a permissive answer
    # by default and nothing failed until a user lost a notice.
    # FIX: ``core/scheduled_tasks.py`` states the policy DECLARATIVELY, as
    # ``LADDER_ACK_SOURCES``: a total table over (platform kind, scope type) -> the one
    # evidence source that may acknowledge there. External IM conversations may ack on
    # their native delivery id; every workbench class, the ``project`` scope type and
    # any UNREGISTERED platform require a persisted receipt, and
    # ``UNDECLARED_LADDER_ACK_SOURCE`` makes receipt-only the default an undeclared
    # class would fall back to, so the unsafe direction is never the implicit one.
    # ``_rung_acknowledges`` is now one lookup plus one membership test.
    # A third subordinate test carries this id --
    # ``test_every_ladder_target_class_declares_its_acknowledgement_source`` -- and it
    # is STRUCTURAL: it derives both axes from the code (the ``kind`` of every
    # ``PLATFORM_REGISTRY`` descriptor; the scope-type vocabularies the two ladder
    # parsers actually enforce, asserted parseable rather than hand-copied) and
    # requires the table's domain to equal their product exactly -- no missing class,
    # no stale one. A future rung introducing a platform kind or a scope type cannot
    # ship without declaring its acknowledgement source. Verified red both ways: adding
    # a ``workspace`` scope type reports the three missing classes, and renaming a
    # platform kind reports the stale ones.
    # The two consuming directions are now both asserted end to end. Direction 1 (the
    # workbench inbox row) also proves the notice never enters the LIVE
    # ``emit_backend_failure`` lifecycle, by the same technique as the replay guard
    # above -- patched to raise under both module spellings, with the drain's import
    # proven absent from a ``hasattr`` snapshot taken BEFORE the ``raising=False``
    # patch would have created it -- plus one emission, no turn or run settlement, no
    # live-turn hook and an auth service that raises on any read. Direction 2 (the
    # synthetic send id) is driven through TWO drain passes: with the bound session row
    # DELETED both rungs send and neither persists, so the notice stays ``pending``
    # with no ``ack_evidence``, one attempt consumed and an error naming the missing
    # receipt rather than "produced no evidence"; then, with the row restored ARCHIVED
    # and the backoff rewound, the same still-owed notice is delivered by rung (5),
    # receipts, and acks with the attempt count carried forward. That second pass is
    # what makes "walks on and stays retryable" an assertion instead of a claim.
    # CORRECTED IN ROUND 14: pass 2's SUBJECT changed, though its shape did not. It was
    # written in round 9 to assert that rung (5) delivers INTO the archived row, on the
    # premise that an archived row is a valid delivery surface; the premise was wrong (see
    # the round-14 retraction (a) above), so the test's own docstring now records the
    # reversal and pass 2 pins the REROUTE instead: the still-owed notice is delivered to
    # the workspace-notifications session, receipts there, and acks with the attempt count
    # carried forward. What survives of the round-9 claim is narrower and still worth
    # having -- "the surviving delta rung (5) buys over rung (2) is a DELIVERY at all, not
    # a delivery into that particular row" -- and pass 1 additionally has to SUPPRESS the
    # now-mandatory workspace rung to keep testing what it was written to test.
    # PR6 review round 8 (#1072) named the ONE premise that table cannot check for
    # itself, since totality over an axis says nothing about the axis VALUE being
    # right: ``kind == "im"`` is a claim that the id a send returns was minted by a
    # platform that reached a person, and it is what entitles ("im", channel|user) to
    # the permissive rows. ``PlatformDescriptor.kind`` DEFAULTS to ``"im"``, so a
    # transport added to ``PLATFORM_REGISTRY`` without stating its kind would inherit
    # that entitlement silently -- and the structural test above would stay green,
    # because no new kind appeared. If such a transport minted its own id the way
    # ``AvibeBot.send_message`` does, this whole finding class would reopen with
    # nothing failing.
    # FIX (no product behaviour change): the premise is now WRITTEN DOWN where the
    # claim is made -- a contract comment on ``PlatformDescriptor.kind`` and one beside
    # ``LADDER_ACK_SOURCES`` -- all five IM descriptors state ``kind="im"`` explicitly
    # instead of inheriting it, and a fourth subordinate test carries this id:
    # ``test_every_registry_platform_declares_its_kind_explicitly``. It reads the
    # registry's AST, because at RUNTIME a defaulted ``kind`` and an explicit
    # ``kind="im"`` are the same object; it also asserts the parsed ids equal the live
    # registry's keys, so a registry the AST can no longer read fails rather than
    # silently passing over nothing. The dataclass default is deliberately KEPT --
    # ``PlatformDescriptor`` is constructed outside the registry too -- so the
    # enforcement sits at the registry, not on the shared constructor.
    # It takes no id of its own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header).
    # PR6 review round 12 (#1072), TWO COUPLED FINDINGS -- and the coupling is the point:
    # they ship in one round because each one alone would make the other worse.
    # (G) A RAISING RUNG KILLED THE WALK. The per-rung ``try/except`` covered
    # ``_build_context`` alone; the ``emit_replayed_backend_failure`` call one line below was
    # unwrapped, so any raise from a rung's delivery -- a platform whose settings manager is
    # gone, a client lookup that fails, an adapter that throws before the transport --
    # escaped the ``for`` body, unwound through the walk's ``finally``, and landed in the
    # handler that consumes the attempt and arms the backoff. The next pass restarted the
    # SAME ladder at rung (1) and raised again, so the notice burned every attempt on one
    # broken rung and dead-lettered WITHOUT EVER TRYING rung (2). The inconsistency is what
    # makes it a defect: every other way a rung can fail to deliver already continues --
    # ``_build_context`` raising, a stale synthetic candidate, an un-acked send -- and round
    # 7's accepted contract is that an unresolvable or stale candidate continues the walk.
    # "A raising one is the same class of unusable and must be treated the same way."
    # FIX: the delivery call is wrapped, the rung records ``error_stage = "deliver"``, the
    # walk ``continue``s, and the first raising rung's error is copied onto the aggregate
    # evidence when the winning rung carries none -- recorded purely for diagnosis, "the same
    # way a post-delivery stream error is, and -- like that one -- must never be read as a
    # delivery failure". ``Exception`` and deliberately NOT ``BaseException``: the walk-level
    # deadline cancels this coroutine, and cancellation must unwind the walk rather than
    # advance it past the bound it was cancelled to respect. Pinned both ways --
    # ``test_a_raising_ladder_rung_does_not_abandon_the_rest_of_the_walk`` requires the later
    # rung to be attempted, to ack on its receipt, to consume ONE attempt, and to carry the
    # skipped rung's error for diagnosis; ``test_the_walk_deadline_still_cancels_through_a_rung``
    # pins the one-letter distinction, and its assertion is that rung (2) is NEVER attempted,
    # "which is what distinguishes cancellation from the raise above".
    # THE HONEST RESIDUAL, and it is why (B) is in the same round: a rung that raises AFTER
    # its transport accepted the send, leaving no evidence behind, now delivers again on the
    # next rung. That is a duplicate this fix introduces, and it is only acceptable because
    # the state that manufactures it is being removed at the source in the same round.
    # (B) THE ADAPTERS WERE MANUFACTURING EXACTLY THAT STATE. Threaded Slack and Feishu sends
    # ran ``sessions.mark_thread_active`` AFTER the transport call but BEFORE returning the
    # native message id, unguarded -- and "the transport call is the point of no return: once
    # it succeeds the user HAS the message." A raise there REPLACED the return value, so the
    # dispatcher's blanket handler recorded a send failure with no delivery evidence for a
    # message the user already had, and the fallback ladder re-sent it. "That is a systematic
    # duplicate per bookkeeping failure, not the crash-only at-least-once residual" this id's
    # family documents elsewhere.
    # FIX AT THE ADAPTER, and the layer is forced rather than chosen: ``modules/im/discord.py``
    # already wrapped the identical call, so Slack (four send paths) and Feishu (two) now
    # match its shape exactly. It "cannot be papered over in ``core/message_dispatcher.py``:
    # the id is destroyed inside the adapter before it can ever escape." Slack's inbound event
    # handlers keep their unguarded calls deliberately -- they return no native id and are not
    # send paths. Behaviour-preserving on the success path; only the already-delivered failure
    # path changes. Red-first: six adapter cases fail without the change.
    # THE NOTICE-LEVEL CONSUMER IS PINNED SEPARATELY, because adapter and dispatcher coverage
    # do not answer the question this id asks -- whether the DRAIN's ack/retry decision comes
    # out right for an adapter whose transport succeeded and whose bookkeeping blew up.
    # ``test_a_notice_acks_when_the_adapters_post_send_bookkeeping_raises`` drives a real
    # ``SlackBot`` with only the HTTP call stubbed ("real adapter and not a shaped stub,
    # because the subject IS the adapter's own ordering: transport, bookkeeping, return")
    # through the real drain, and requires the notice to ACK rather than resend. It is GREEN
    # FROM BIRTH, since the fix landed in the same round, so the red half lives in the same
    # file: ``test_the_pre_guard_adapter_shape_resends_an_already_delivered_notice``
    # reintroduces the pre-fix shape and asserts BOTH consequences, "because either alone
    # would understate the defect" -- the notice is not acknowledged AND, now that a raising
    # rung continues the walk, the same body is pushed onto the next rung.
    # ``test_a_real_send_failure_is_still_undelivered`` is the negative control that keeps the
    # guard honest: it only ever runs after the transport returned, "otherwise the guard would
    # have converted every failed send into a silent success, which is the failure mode the
    # whole durable notice exists to prevent."
    # They take no ids of their own because PR6's block is full at 099 and 100+ is
    # contracted to PR2 by the merged plan (docs/plans/harness-run-reliability.md
    # §10.7; landed in #1044, PR2 not started per its status header). The adapter-level cases
    # live in ``tests/test_im_post_send_bookkeeping.py`` and the dispatcher-level ones in
    # ``tests/test_message_dispatcher_scheduled.py`` as platform unit pins, which is why only
    # the notice-level consumer is documented here.
    test: tests/test_harness_failure_visibility.py::test_a_replayed_notice_reaches_the_user_without_touching_the_live_lifecycle
