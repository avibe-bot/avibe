  - id: HFR-068
    name: cancellations do not bury a failure in the bounded health window
    status: covered
    kind: safety
    layer: contract
    backend: shared
    # PR6 review round 10 (#1072). The window this id is named for was advertised and
    # not ENFORCED. ``HEALTH_WINDOW_RUNS`` promises "the last ten verdicts", but
    # ``_health_rows`` made SQLite assign ``row_number()`` to every verdict in the
    # definition's entire 72 h window before the outer ``position <= HEALTH_WINDOW_RUNS``
    # could discard any of them: the settled-time index narrows by time and cannot stop
    # early, because the window function needs every row to rank. Measured on a 400-run
    # history the plan was ``SEARCH agent_runs USING INDEX ix_agent_runs_definition_settled
    # (definition_id=? AND <expr>>?)`` -- the seek is there -- followed by
    # ``SCAN (subquery-3)``, ``SCAN anon_1`` and ``USE TEMP B-TREE FOR ORDER BY``, with no
    # ``LIMIT`` anywhere to stop it. So a high-frequency definition walked its whole
    # recent history to return ten rows.
    # WHERE IT IS PAID, stated correctly because the first framing of this finding was
    # wrong about it: NOT the 2 s drain tick, which does not read health at all. It is
    # every Harness list, show and mutation enriched read -- the surfaces HFR-097/098
    # collapsed onto ``_enrich_definitions`` -- so the cost lands on interactive reads
    # once per page rather than on a background loop.
    # THE OBVIOUS FIX WAS REVERTED, AND THE REVERT IS THE INTERESTING PART. A
    # per-definition seek in a loop bounds the work perfectly and reintroduces exactly
    # the per-row query #1033 removed; the master-owned page-budget invariant
    # ``test_a_page_costs_a_fixed_number_of_queries``
