version: 1
capability: harness_failure_recovery
observations:
  - id: HFR-OBS-001
    date: 2026-07-18
    source: deterministic pre-fix fault injection
    result: confirmed
    detail: >-
      After backend acceptance, a definitive backend_alive false result was
      observable but had no lifecycle consumer. The AgentService runtime gate
      remained locked and a same-runtime successor timed out waiting. The
      scheduler execution and its per-session reservation had already returned.
  - id: HFR-OBS-002
    date: 2026-07-18
    source: code-path trace
    result: confirmed
    detail: >-
      A silent terminal result is the existing shared idempotent convergence
      point: it settles the Run, signals the Session sink, releases the runtime
      token, flushes the persisted Workbench queue, and enables callback drain.
  - id: HFR-OBS-003
    date: 2026-07-18
    source: local Incus pre-fix controller restart
    result: confirmed
    detail: >-
      Session sesswwbh4da32 lost its in-memory owner on restart. Owner Run
      fae757453b2b became terminal, while successor 3838c93fbfaa remained queued
      with its Workbench queue row for more than twelve minutes. No running Run
      or live Session owner remained. The scheduler correctly excluded the held
      Run, but the restarted Session FSM never re-entered its durable queue.
  - id: HFR-OBS-004
    date: 2026-07-18
    source: local Incus post-fix controller restart
    result: passed
    detail: >-
      With state preserved, boot recovered Session sesswwbh4da32 at
      05:21:14Z. The exact successor Run 3838c93fbfaa started once, completed
      once with HFR915_RR_SECOND_DONE, recorded one output, and emptied the
      queue.
  - id: HFR-OBS-005
    date: 2026-07-18
    source: local Incus Codex process-group kill
    result: passed
    detail: >-
      Session ses7dr38p3qsp owned Codex PGID 8205 after prompt acceptance.
      SIGKILL at 05:05:53.727Z failed owner Run 91962dcd8f50 through the shared
      terminal path, then successor ef4b716f05e1 started once, completed once,
      recorded one output, and emptied the persisted queue.
  - id: HFR-OBS-006
    date: 2026-07-18
    source: deterministic ownership-generation fault injection
    result: confirmed
    detail: >-
      A replacement runtime under the same cwd or session key can be alive
      while the transport or receiver task that accepted an older turn is
      dead. Recovery and diagnostics must therefore use the liveness probe
      captured from the concrete accepted generation.
  - id: HFR-OBS-007
    date: 2026-07-18
    source: deterministic mixed-queue fault injection
    result: confirmed
    detail: >-
      A user queue row preserved by explicit Stop can precede a held Agent Run
      row. Startup recovery must not call the generic FIFO flush until the
      eligible held Agent Run segment itself is at the queue head.
  - id: HFR-OBS-008
    date: 2026-07-25
    source: code-path trace of dispatch_turn and its callers
    result: confirmed
    detail: >-
      A turn sink can be released without ever emitting a terminal result -
      a blank harness message, or a refusal because the Session already has a
      streaming turn. dispatch_turn returned success in both cases, so
      _execute_agent_run reported nothing and the Run stayed running forever.
      The refusal path returns before any sink exists, so the sink itself
      cannot carry the reason; the outcome has to be reported by the caller.
  - id: HFR-OBS-009
    date: 2026-07-25
    source: code-path trace of the two ownership lanes
    result: confirmed
    detail: >-
      A running Run is owned by either the drain lane
      (ScheduledTaskService._inflight_executions) or the turn lane
      (SessionTurnManager in_flight plus active_turn_sinks), and neither can
      observe the other. Nothing periodically reconciles rows whose owner
      disappeared inside a live process, and queued rows never age at all, so
      a Run stranded by a transport that never reconnected waits with no
      user-visible explanation and keeps its Session slot.
  - id: HFR-OBS-010
    date: 2026-07-25
    source: code-path trace of SqliteInvalidationProbe.has_external_write
    result: confirmed
    detail: >-
      The store tick's reload gate bumps on any write to the database file,
      including the service's own. Recording staleness evidence on every skip
      iteration would therefore become a self-feeding write to reload to
      re-drain loop for as long as a transport stayed down, plus one
      runs.updated event per cycle. The evidence stamp must be written only
      when the recorded reason changes, and must not bump updated_at.
  - id: HFR-OBS-011
    date: 2026-07-25
    source: deterministic startup-recovery fault injection
    result: confirmed
    detail: >-
      recover_processing_runs requeues every running row at service
      construction, so a restart retries its in-flight Runs rather than
      leaving them for the sweep. The swept orphan class is therefore about
      owners lost within a live process, and any staged running fixture must
      be written after the service is constructed or recovery flips it to
      queued first.
  - id: HFR-OBS-012
    date: 2026-07-25
    source: review of _drain_requests capacity break against the sweep's evidence read
    result: confirmed
    detail: >-
      The drain breaks at _MAX_CONCURRENT_EXECUTIONS without examining the
      remaining queue, so rows below the cut keep whatever skip reason they
      last carried. A transport_unavailable stamp therefore survives long
      after the platform reconnected, and sweeping on the stamp alone would
      fail a Run that is merely waiting for a free slot. The transport class
      needs a live second opinion (deliverable_run_ids) in addition to the
      recorded reason, and must disable itself when that opinion is
      unavailable.
  - id: HFR-OBS-013
    date: 2026-07-25
    source: review of the stop-versus-terminal-result ordering in _stream_chunk
    result: confirmed
    detail: >-
      An acknowledged stop stamps settled_by in memory and releases the waiter
      immediately, while the Run row is only written later when
      _execute_agent_run reads the stamp back. A terminal result arriving in
      that window overwrote the reason, so the guarded canceled settlement was
      skipped and the outcome depended on which coroutine resumed first. The
      reason the user was already shown must win; the row's terminal status
      stays first-writer-wins.
  - id: HFR-OBS-014
    date: 2026-07-25
    source: review of the transport TTL clock against a long-queued Run
    result: confirmed
    detail: >-
      A Run can sit in queued far longer than the transport TTL for reasons that
      are progress, such as capacity or a busy Session. Aging the transport class
      from created_at therefore made such a Run sweepable on the first tick after
      its transport blinked, consuming none of the configured reconnect window.
      The TTL is a reconnect window, so it must be measured from last_skip_at,
      the instant the transport reason started, which the transition-triggered
      skip stamp already records.
