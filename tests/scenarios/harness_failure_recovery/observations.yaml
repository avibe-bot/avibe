version: 1
capability: harness_failure_recovery
observations:
  - id: HFR-OBS-001
    date: 2026-07-18
    source: deterministic pre-fix fault injection
    result: confirmed
    detail: >-
      After backend acceptance, a definitive backend_alive false result was
      observable but had no lifecycle consumer. The AgentService runtime gate
      remained locked and a same-runtime successor timed out waiting. The
      scheduler execution and its per-session reservation had already returned.
  - id: HFR-OBS-002
    date: 2026-07-18
    source: code-path trace
    result: confirmed
    detail: >-
      A silent terminal result is the existing shared idempotent convergence
      point: it settles the Run, signals the Session sink, releases the runtime
      token, flushes the persisted Workbench queue, and enables callback drain.
  - id: HFR-OBS-003
    date: 2026-07-18
    source: local Incus pre-fix controller restart
    result: confirmed
    detail: >-
      Session sesswwbh4da32 lost its in-memory owner on restart. Owner Run
      fae757453b2b became terminal, while successor 3838c93fbfaa remained queued
      with its Workbench queue row for more than twelve minutes. No running Run
      or live Session owner remained. The scheduler correctly excluded the held
      Run, but the restarted Session FSM never re-entered its durable queue.
  - id: HFR-OBS-004
    date: 2026-07-18
    source: local Incus post-fix controller restart
    result: passed
    detail: >-
      With state preserved, boot recovered Session sesswwbh4da32 at
      05:21:14Z. The exact successor Run 3838c93fbfaa started once, completed
      once with HFR915_RR_SECOND_DONE, recorded one output, and emptied the
      queue.
  - id: HFR-OBS-005
    date: 2026-07-18
    source: local Incus Codex process-group kill
    result: passed
    detail: >-
      Session ses7dr38p3qsp owned Codex PGID 8205 after prompt acceptance.
      SIGKILL at 05:05:53.727Z failed owner Run 91962dcd8f50 through the shared
      terminal path, then successor ef4b716f05e1 started once, completed once,
      recorded one output, and emptied the persisted queue.
  - id: HFR-OBS-006
    date: 2026-07-18
    source: deterministic ownership-generation fault injection
    result: confirmed
    detail: >-
      A replacement runtime under the same cwd or session key can be alive
      while the transport or receiver task that accepted an older turn is
      dead. Recovery and diagnostics must therefore use the liveness probe
      captured from the concrete accepted generation.
  - id: HFR-OBS-007
    date: 2026-07-18
    source: deterministic mixed-queue fault injection
    result: confirmed
    detail: >-
      A user queue row preserved by explicit Stop can precede a held Agent Run
      row. Startup recovery must not call the generic FIFO flush until the
      eligible held Agent Run segment itself is at the queue head.
  - id: HFR-OBS-008
    date: 2026-07-25
    source: code-path trace of dispatch_turn and its callers
    result: confirmed
    detail: >-
      A turn sink can be released without ever emitting a terminal result -
      a blank harness message, or a refusal because the Session already has a
      streaming turn. dispatch_turn returned success in both cases, so
      _execute_agent_run reported nothing and the Run stayed running forever.
      The refusal path returns before any sink exists, so the sink itself
      cannot carry the reason; the outcome has to be reported by the caller.
  - id: HFR-OBS-009
    date: 2026-07-25
    source: code-path trace of the two ownership lanes
    result: confirmed
    detail: >-
      A running Run is owned by either the drain lane
      (ScheduledTaskService._inflight_executions) or the turn lane
      (SessionTurnManager in_flight plus active_turn_sinks), and neither can
      observe the other. Nothing periodically reconciles rows whose owner
      disappeared inside a live process, and queued rows never age at all, so
      a Run stranded by a transport that never reconnected waits with no
      user-visible explanation and keeps its Session slot.
  - id: HFR-OBS-010
    date: 2026-07-25
    source: code-path trace of SqliteInvalidationProbe.has_external_write
    result: confirmed
    detail: >-
      The store tick's reload gate bumps on any write to the database file,
      including the service's own. Recording staleness evidence on every skip
      iteration would therefore become a self-feeding write to reload to
      re-drain loop for as long as a transport stayed down, plus one
      runs.updated event per cycle. The evidence stamp must be written only
      when the recorded reason changes, and must not bump updated_at.
  - id: HFR-OBS-011
    date: 2026-07-25
    source: deterministic startup-recovery fault injection
    result: confirmed
    detail: >-
      recover_processing_runs requeues every running row at service
      construction, so a restart retries its in-flight Runs rather than
      leaving them for the sweep. The swept orphan class is therefore about
      owners lost within a live process, and any staged running fixture must
      be written after the service is constructed or recovery flips it to
      queued first.
  - id: HFR-OBS-012
    date: 2026-07-25
    source: review of _drain_requests capacity break against the sweep's evidence read
    result: confirmed
    detail: >-
      The drain breaks at _MAX_CONCURRENT_EXECUTIONS without examining the
      remaining queue, so rows below the cut keep whatever skip reason they
      last carried. A transport_unavailable stamp therefore survives long
      after the platform reconnected, and sweeping on the stamp alone would
      fail a Run that is merely waiting for a free slot. The transport class
      needs a live second opinion (deliverable_run_ids) in addition to the
      recorded reason, and must disable itself when that opinion is
      unavailable.
  - id: HFR-OBS-013
    date: 2026-07-25
    source: review of the stop-versus-terminal-result ordering in _stream_chunk
    result: confirmed
    detail: >-
      An acknowledged stop stamps settled_by in memory and releases the waiter
      immediately, while the Run row is only written later when
      _execute_agent_run reads the stamp back. A terminal result arriving in
      that window overwrote the reason, so the guarded canceled settlement was
      skipped and the outcome depended on which coroutine resumed first. The
      reason the user was already shown must win; the row's terminal status
      stays first-writer-wins.
  - id: HFR-OBS-014
    date: 2026-07-25
    source: review of the transport TTL clock against a long-queued Run
    result: confirmed
    detail: >-
      A Run can sit in queued far longer than the transport TTL for reasons that
      are progress, such as capacity or a busy Session. Aging the transport class
      from created_at therefore made such a Run sweepable on the first tick after
      its transport blinked, consuming none of the configured reconnect window.
      The TTL is a reconnect window, so it must be measured from last_skip_at,
      the instant the transport reason started, which the transition-triggered
      skip stamp already records.
  - id: HFR-OBS-015
    date: 2026-07-25
    source: review of owned_agent_run_ids against the workbench queue-hold TTL
    result: confirmed
    detail: >-
      A coalesced Workbench turn claims its secondary Runs and deliberately
      leaves them queued with workbench_queue_holds_run while the primary
      settles them, and owned_agent_run_ids reports every one of those ids as
      actively owned. Ownership therefore cannot be a running-only exemption:
      a hold TTL that ignored it would fail live sibling Runs as soon as the
      turn outran the TTL, reintroducing a turn-duration timeout by the back
      door. A live owner outranks every staleness class, whatever the row
      status, so the check belongs at the top of the candidate loop rather than
      duplicated per branch.
  - id: HFR-OBS-016
    date: 2026-07-25
    source: review of the avibe gate hand-off against the two settlement lanes
    result: confirmed
    detail: >-
      An avibe-targeted execution hands its prompt to the Session turn gate and
      returns from _execute_agent_run with complete_on_return false while the
      turn is still live, so the drain lane deliberately keeps its hands off the
      row. Only the turn lane can settle it, but the turn lane called the thin
      dispatch_turn wrapper that discards settled_by, so a turn released without
      a terminal result left the Run running forever until the sweep grace
      expired. Whichever lane owns the row must read the settlement vocabulary,
      not just the error, and settle through the same guarded first-writer-wins
      writer so racing an honest terminal result is safe in both directions.
  - id: HFR-OBS-017
    date: 2026-07-25
    source: review of a swept queue hold against the persisted Workbench queue
    result: confirmed
    detail: >-
      Terminalizing an agent_runs row is not the whole reclamation: a queue-hold
      Run also owns a persisted queued messages segment keyed by
      agent_run:<run_id>. recover_persisted_agent_run_queue ignores references
      whose Run is no longer queued, so after the sweep expired the hold the
      Session still displayed stale pending input until an unrelated send forced
      a flush. The sweep must retire each expired Run's own queue segment,
      scoped by that run id so it can never touch a live sibling's row, and
      publish queue.updated so the surface reflects the reclamation immediately.
  - id: HFR-OBS-018
    date: 2026-07-25
    source: review of the turn-lane CancelledError handler against release_for_backend_refresh
    result: confirmed
    detail: >-
      A cancelled turn task carries no cause. release_for_backend_refresh cancels
      in-flight turns whenever an agents.* save triggers the required rolling
      backend reconciliation, so reading every CancelledError as a user Stop made
      a Run killed by routine configuration work settle canceled with the
      user-stop explanation: the callback told the user they stopped a Run they
      never touched, and failure accounting saw deliberate intent instead of an
      infrastructure fault. The canceller is the only party that knows why, so the
      cause has to be recorded on the Turn before task.cancel() and read back when
      the turn is popped. The default reading of a bare cancellation stays stopped,
      because a plain Stop and send-now are the paths that legitimately have no
      more specific reason.
  - id: HFR-OBS-019
    date: 2026-07-25
    source: review of both settlement lanes against the Claude Activity delivery-failure emit
    result: confirmed
    detail: >-
      "The turn ended" is not "the Run ended". _settle_activity_turn_after_delivery_failure
      closes its origin turn with a silent terminal result carrying
      completes_run=False, because the REQUEUED Activity keeps the Run and retries
      it. That emit still mutates the turn lifecycle, so the release ran through
      mark_turn_complete, whose own default reason is the no-dispatch case: both
      lanes then read no_terminal_result and failed a live Activity-owned Run,
      firing its terminal callback before the retry ever ran. The release site is
      the only party that knows whether it also owns the Run, so it must supply the
      reason, and both lanes must allow-list the settlements that genuinely mean no
      result is coming (SETTLEMENTS_WITHOUT_RESULT) rather than treating everything
      except terminal_result as a zombie -- otherwise the next "turn ended, run
      lives on" reason repeats the same failure.
  - id: HFR-OBS-020
    result: confirmed
    detail: >-
      Staleness evidence is a point-in-time fact, and the sweep is the only party
      that sees both halves of its lifetime. A queued row stamped
      transport_unavailable at t0 stays stamped after transport recovers, because
      re-stamping is transition-triggered and a drain that never reaches the row
      (at concurrency capacity) rewrites nothing; deliverability then exempts it,
      so nobody retires the stamp. When transport drops again at t2 > t0 + TTL, the
      second outage is aged from the FIRST one and is swept with zero reconnect
      window. Retiring the evidence at the moment deliverability proves the outage
      is over restores the invariant that a TTL measures one continuous outage.
      The same shape holds for the hold class: owned_agent_run_ids() reports only
      the ids a live turn is executing, never the followers the gate parked behind
      it, so a turn legitimately longer than harness_run_hold_ttl_seconds had its
      own queued successor failed. Live facts the sweep cannot derive must be
      supplied by the caller at the granularity the truth lives at -- sessions for
      the gate, run ids for ownership and deliverability -- and a caller that
      cannot enumerate them must fail closed by disabling the class rather than
      guessing.
  - id: HFR-OBS-021
    result: confirmed
    detail: >-
      A synthetic terminal result is not evidence of a result. Every backend answers
      an acknowledged stop with an empty silent ``result`` so the dot settles and the
      SSE waiter closes through the one outbound chokepoint, and all three sent it
      with the terminal-turn default (completes_run=True). The dispatcher therefore
      recorded that empty body as the run's ``succeeded`` terminal BEFORE the stop's
      own guarded write, so first-writer-wins reported every normally-stopped run as
      a success and left the ``stopped`` -> ``canceled`` mapping reachable only when
      the backend could not emit at all (stop_failed, stale release, IM /stop). The
      earlier design accepted this race as benign because either outcome is "true of
      a run the user stopped"; that was wrong, because the ordering is not a race at
      all -- SessionTurnManager.cancel awaits the interrupt (which emits) and only
      then cancels the task, so the losing branch was the ONLY branch. Correcting it
      means the stop output declaring what it is: completes_turn=True so the turn
      still ends, completes_run=False so an empty body never becomes a terminal
      status, and an explicit settled_by so "I do not settle the run" is not confused
      with the Activity case where somebody else genuinely owns the row. Where an
      identical emit is copied across backends, the guard has to be cross-backend too
      -- one behavior test pins one backend and lets the other two regress.
  - id: HFR-OBS-022
    date: 2026-08-06
    source: issue #1190 runtime evidence plus deterministic shared-runtime simulation
    result: confirmed
    detail: >-
      OpenCode can accept a prompt while its provider runtime keeps the assistant
      message incomplete and retries indefinitely. Avibe's poll owner then retains
      the Turn without any terminal evidence. The OpenCode server is shared across
      Vibe Agents, so native abort is the release action for provider-level blocking;
      the failed terminal result is the existing release action for Avibe's per-Session
      runtime gate and durable Run. Timeout must perform them in that order and must
      not fall through to the empty successful-result path.
  - id: HFR-OBS-023
    date: 2026-08-06
    source: PR7R current-master evidence matrix (HFR-180..HFR-186)
    result: confirmed
    detail: >-
      Two End-path defects, both on the direct-IM / agent-run lane where there is no
      Workbench turn projection to fall back on. (1) ``_resolve_live_state`` reads
      ``claude_active_sessions``, which ``handle_message`` stamps only AFTER
      ``get_or_create_claude_session`` returns; a Run accepted while that call is in
      flight reads ``idle``, End takes the idle branch into ``_end_claude``, and the
      canonical stop -- the only path that emits ``stopped`` -> ``canceled``, which
      invariant 2 requires for a user Stop -- never runs. ``cleanup_session`` then
      marks the key an intentional teardown, so when the still-live turn dies of the
      resulting kill signal ``claude_teardown_is_intentional`` classifies it as
      service cleanup rather than a fault: the Stop is erased from the record twice.
      Which terminal status the IM Run ends with is NOT established and is carried as
      an open probe -- ``SETTLED_BY_BACKEND_REFRESH`` is emitted by
      ``SessionTurnManager.release_for_backend_refresh`` on the Workbench lane, and
      nothing connects it to an IM Run. (2) On the codex active branch a teardown that succeeds after a
      FAILED ``_stop_active_agent`` synthesizes ``{ok: True, action: "ended"}``.
      Clearing the stale row is deliberate and should stay, but the payload is
      byte-identical to a stop that really settled the turn: the un-interrupted
      turn's mappings are cleared and no caller can tell that the interrupt never
      happened. The teardown is not the defect; the missing signal is. What the Run
      receives is NOT established here either -- the reproducer builds only the codex
      session and turn registries, so no Run row exists for it to observe, and an
      earlier draft's "its Run is never settled" was inference from the missing
      interrupt rather than evidence. Round 3 corrected how (1) is DEMONSTRATED
      without changing the finding: the race window used to be postulated by the
      fixture (an empty ``claude_active_sessions`` handed in) and the intentional
      teardown marker used to be stamped by the probe itself, so the reproducer
      would have kept passing -- still reporting the defect -- the day production
      closed either half. Both are now read off production: the ordering out of
      ``handle_message``, and the marker by running the real
      ``_cleanup_session_locked``, which applies its own
      ``client is not None or receiver_task is not None`` guard the hand-stamp
      skipped. Both matrix cells were also demoted from ``defect`` to ``unproven``:
      the reproducers characterize End's behaviour and explicitly disclaim the Run
      half those cells are about, and ``defect`` is excluded from
      ``UNPROVEN_BUDGET``, so the classification was hiding eight cells behind a
      vocabulary word. Round 4 hardened both reproducers again, and for (2) it
      MOVED the defect. On (1), review challenged the fixture as unreachable --
      ``claude_sessions`` is populated only at the very end of session creation,
      so a cold start has no client for End to tear down. That is correct about a
      cold start and it is not this state: the state staged is warm-idle, and
      ``mark_session_idle`` discards the key from ``active_sessions`` while
      deliberately KEEPING the client, which the probe now drives rather than
      asserts in prose. The window is not a few instructions either -- every path
      through ``get_or_create_claude_session``, warm reuse included, first
      acquires the unconditional ``_claude_runtime_generation_lock``, and the
      retry path additionally awaits receiver cleanup. On (2), the missing signal
      is not missing from the system: ``_end_codex`` already computes and RETURNS
      ``interrupted`` alongside ``process_killed``. The loss is one frame up, in
      ``end_running_agent``'s failed-stop branch, which discards the teardown
      result for a fresh ``{ok: True, action: "ended", backend: "codex"}`` literal
      and copies exactly one field back out. ``process_killed`` surviving while
      ``interrupted`` does not is the tell: this is a field the caller forgot, not
      information it never had, which makes the remediation a one-line forward
      rather than new plumbing. The reproducer had also been staging the absence
      of the thing it measured -- an empty ``_transports`` and a ``None`` thread
      id are the deliberate stale-row case ``_end_codex`` exists to clean up -- so
      it now runs a LIVE transport twice, once with ``turn/interrupt`` raising and
      once with it succeeding, and shows the two payloads byte-identical. Round 5
      found that a live transport was necessary and not sufficient: with
      ``sessions_for_cwd`` returning ``[]`` the session is the cwd's last, so
      ``_end_codex`` stops the shared app-server -- and a killed app-server ends
      the turn as surely as an interrupt does. Both runs had therefore terminated
      the turn by different means, which makes ``ended`` a TRUE report in both
      and establishes nothing. The pair that establishes the finding needs a
      CO-TENANT session on the same cwd: the transport stays up, the failed
      interrupt leaves the backend turn genuinely executing, and the probe now
      asserts that survival (transport never stopped, still registered) instead
      of assuming it. The last-session variant is kept for one narrow purpose --
      it is where ``process_killed`` IS forwarded, which is what shows the
      failed-stop branch can copy a field out of the teardown result and copied
      only one.
  - id: HFR-OBS-024
    date: 2026-08-06
    source: PR7R current-master evidence matrix (HFR-183, HFR-184)
    result: confirmed
    detail: >-
      ALL SIX backend/lane cells expose a per-Turn progress signal. Four rounds of
      corrections got here; the intermediate verdicts ("no backend", then "codex
      only", then "four of six, split by lane") are kept below because each was
      wrong for the same reason and the sequence is the lesson.
      Codex's ``item/*`` notifications carry a
      ``turnId`` and ``_find_request_for_notification`` resolves the participating
      Run's request from that id through a per-turn map, so the event IS attributable
      to an exact Turn -- but ``should_emit_progress`` then gates on the single
      ``_active_turns[base]`` slot and the activity timestamp is stamped per session,
      so the attribution is thrown away one step downstream. Claude stamps
      ``session_turn_started`` / ``session_last_activity`` per composite key and the
      SDK has no query/result correlation id -- but that projection is not the
      event stream either: ``_adopt_pending_turn_token`` copies the FIFO-head
      pending request's ``turn_token`` and attribution keys onto the long-lived
      receiver context before every assistant and tool emit, so a Workbench claude
      event does name its Turn. The mechanism is weaker than codex's and the
      difference matters for remediation: codex resolves by an id the event
      CARRIES, claude by FIFO POSITION among pending requests, which is exact only
      while that ordering holds. OpenCode's ``_active_requests`` is
      likewise one asyncio task per base session -- but that projection is not the
      event stream: ``run_prompt_poll`` is handed the exact ``AgentRequest`` and
      every progress emit in it passes ``request.context``, whose ``turn_token``
      ``_process_message`` has already read as ``logical_turn_id``. Round 5 held
      claude and opencode OPEN on direct IM on the ground that this token is
      "stamped only by ``core/session_turns.py`` and the streaming turn dispatch,
      both Workbench owners". That was FALSE, and it is the fourth correction of
      this observation. The claim came from grepping the LITERAL string
      ``"turn_token"``; the write that decides the question is CONSTANT-KEYED --
      ``platform_specific[AGENT_TURN_TOKEN]`` in
      ``AgentService._stamp_runtime_turn`` (modules/agents/service.py:1015), which
      ``AgentService.handle_message`` calls unconditionally, before the backend is
      invoked, for every request on every lane. So a plain IM request already
      carries a freshly generated per-Turn token: claude's adopt path has one to
      copy and opencode's ``logical_turn_id`` is non-empty. Driven, not read --
      HFR-188 calls the real ``handle_message`` twice on one runtime key and
      asserts the tokens differ (per Turn, not per session) and that a
      pre-existing Workbench token is preserved rather than overwritten. What
      remains is downstream and is remediation, not a missing capability: the
      activity timestamp is per SESSION on every backend, so the exact
      attribution is aggregated away at the last step. The earlier claim that
      codex additionally DISCARDS the signal at ``should_emit_progress`` is also
      narrowed: that filter reads the single ``_active_turns[base]`` slot, and the
      runtime gate is held across the whole backend call and released only by the
      outbound dispatcher, so one runtime key admits one live turn at a time
      (driven in HFR-191) and the slot is not lossy for live turns. The filter is
      correct as written. On the attribution question the plan's all-or-nothing
      rule is therefore SATISFIED and a generic inactivity timeout is no longer
      blocked by Q2; the per-Turn timestamp is the work that is left.
      This corrects the same observation THREE times, all three the same way: a
      lossy base-session projection was read and a conclusion about the event
      stream was drawn from it -- ``_active_turns[base]`` for codex, then, after
      that was named, ``_active_requests[base]`` for opencode, then, after THAT was
      named, ``session_turn_started[composite_key]`` for claude. Naming a mistake
      is not the same as being immune to it; the durable form of the lesson is a
      rule, not a memory -- before concluding a backend has no signal, read the
      producer, not the map the producer writes into. Round 6 made it FOUR, in a
      disguise the rule as written did not cover: the producer WAS read, and the
      search for its input was a literal grep that a constant-keyed write slips
      past. The rule extends -- a "nothing writes X" claim is only as good as the
      search that produced it, so resolve the KEY, not the string.
      Separately, a Turn's accepted-run
      record cannot discriminate between its participants: it holds a flat
      ``accepted_agent_run_ids`` list and one Turn-level ``source_kind`` that a later
      participant does not restamp, with no per-Run source or deadline anywhere.
      (Round 10 narrowed that from "stamped by the first participant", which the
      probe preloaded rather than drove.) Whether a
      scheduler cron Run and a manual CLI Run actually coalesce is a separate,
      still-open question owned by ``_hydrate_delivery_batch_context``, not by the
      accumulator. That is a statement about the PROJECTION and must not be read as
      one about the system: each accepted id is the primary key of an ``agent_runs``
      row carrying ``source_kind``, ``source_actor`` and ``definition_id``, and
      ``run_definitions`` carries ``timeout_seconds`` / ``lifetime_timeout_seconds``.
      The inputs exist and are one join away, so the open question is the narrower
      one of whether the cancellation site performs that join -- not, as an earlier
      draft had it, that per-Run timeout policy is unspecifiable.
  - id: HFR-OBS-025
    date: 2026-08-06
    source: PR7R current-master evidence matrix (Q1, Q4, Q5)
    result: confirmed
    detail: >-
      Of the plan's five questions Q5 was recorded as the one closing outright in
      master's favour. It closes by HALVES, and round 6 corrected the other half.
      ``health`` / ``consecutive_failures`` / ``recent_failures`` are derived per
      read by ``SQLiteBackgroundTaskStore._classify_health`` over the bounded verdict
      window ``_health_rows`` collects, rather than stored counters: a failure ages
      out of the window on its own and a success downgrades ``failing`` to
      ``degraded`` instead of erasing history. That half stands and needs no health
      cursor. ``last_run_at`` / ``last_error`` are NOT "written in the same
      CAS-guarded terminal transition that settles the Run", as this observation
      first said. They are a DEFINITION-level stamp committed by
      ``store.mark_task_result`` inside ``_execute_task``
      (core/scheduled_tasks.py:~8394); the Run's own terminal CAS is
      ``request_store.complete`` in ``_execute_claimed_request``'s ``finally``
      (~7815-7829), a second write that happens after the first has already
      committed. HFR-261 reconciles the case where that CAS REFUSES the
      transition; nothing reconciles process loss in the gap, so a definition can
      advertise a ``last_run_at`` / ``last_error`` for a Run that never reached a
      terminal status. Unlike the derived trio these two are stored, so they can
      drift -- they project an ATTEMPT, not settled Run history. Q5 is therefore
      ``open``. Q1 holds on the durable Workbench lane only -- a
      Delivery reservation and an ownership transfer both leave the Run ``running``
      -- but nothing exercises the direct-IM reservation or backend-acceptance
      boundary, so the premature-success claim may not be closed yet. Q4 names four
      pre-terminal facts and establishes two of them, for Claude only: the durable
      pending-output Activity batch and the ``activity_local_settlement_only``
      marker, both resting on an Activity whose only production producer is
      ``modules/agents/claude_agent.py``. The terminal-result latch and the accepted
      Message receipt are NOT established -- no cited node invokes
      ``SessionTurnManager.on_terminal_result`` or reads
      ``_avibe_terminal_result_latch``, and the latch is in-process context state
      popped by ``on_terminal_delivery_complete`` rather than a durable row, so
      listing it among "four durable facts" was wrong twice over.
  - id: HFR-OBS-026
    date: 2026-08-06
    source: adversarial review of the PR7R matrix (PR #1212)
    result: confirmed
    detail: >-
      An evidence cell citing a real, passing, topically adjacent test is still not
      evidence. Review of PR7R's first increment found 50 of 168 cells marked
      ``covered`` by a test whose SUBJECT was not the cell's subject, and the budget
      moved 28 -> 78 as a result. Four distinct substitutions, all of which read as
      coverage: a storage-writer property (the owed-notice stamp, proven by driving
      the five terminal writers directly) standing in for an IM dispatch path; a
      Claude-only fixture (every Activity test starts with ``backend="claude"``)
      standing in for three backends; an ownership-transfer test that ASSERTS the Run
      is still ``running`` standing in for a terminal success; and a constant lookup
      (``SETTLEMENT_TERMINAL_STATUS[...]``) standing in for a settlement that was
      never driven. The last one also carried a wrong claim -- PR7R-F1 originally
      said the Run settles as ``backend_refresh``, but that settlement is emitted by
      ``SessionTurnManager.release_for_backend_refresh`` on the Workbench lane and
      nothing connects it to an IM Run. The matrix guard cannot catch any of this:
      it verifies a citation RESOLVES, not that it is about the right thing. Only a
      reader comparing each cited test's body against its cell can, which makes that
      comparison a required step whenever a cell is marked covered.
  - id: HFR-OBS-027
    date: 2026-08-06
    source: second adversarial review of the PR7R matrix (PR #1212)
    result: confirmed
    detail: >-
      One adversarial pass over an evidence matrix is not enough. A second review of
      PR7R -- over cells the first pass had read and left alone -- found 39 more of
      the same substitution and moved the budget 78 -> 117. The four: a cancellation
      test (asserts the Run is ``failed`` after ``execution.cancel()``) standing in
      for a successful one-shot ``at`` firing; a Delivery-FSM prewrite test that
      inserts a bare Delivery and never creates an ``agent_runs`` row standing in for
      the Run's terminal-persistence-failure behaviour; an AST read of each backend's
      ``handle_stop`` plus a Running-tab test whose ``SessionTurnManager`` is a stub
      returning a prebuilt ``{ok: True}`` dict, together standing in for a durable
      Stop settling a real Run; and a settlement test admitted through
      ``enqueue_agent_run`` with ``task_trigger_kind="agent_run"`` -- which is not one
      of the matrix's four triggers -- standing in for all four. That last one is the
      general shape worth naming: a test can trace the SETTLEMENT half of a cell
      perfectly and still say nothing about the ADMISSION half, and a trigger owns
      admission. The same review also overturned a claim in the other direction:
      Q2's "no backend exposes a per-Turn progress signal" was false for codex, and
      it was reached by reading a lossy base-session projection instead of the
      notification that feeds it. Rejecting a finding and loosening a blocker are
      both valid outcomes of a review; the lesson is that reading one level up from
      where the loss happens is part of the check.
  - id: HFR-OBS-028
    date: 2026-08-06
    source: third adversarial review of the PR7R matrix (PR #1212)
    result: confirmed
    detail: >-
      Asked of the remaining cells as a class, the substitution question has one
      answer for all of them: no test on master traces a Run from a trigger's
      admission through to that Run's terminal settlement. A third review moved the
      budget 117 -> 168 -- every cell -- and the honest reading of that number is
      not that PR7R found nothing but that every surviving citation proved a
      SEGMENT. Storage writers driven in isolation with no admission (12 cells); a
      projection whose backend never returns (9); an Activity registry holding a
      bare run-id STRING against a mock store, so no ``agent_runs`` row exists in it
      at all (16); a terminal chain that is a genuine end-to-end Run trace but
      admitted by ``enqueue_agent_run``, which is deliberately not one of the four
      triggers (10); and the two End reproducers, filed as ``defect`` for a Run half
      they explicitly disclaim (8). An all-unproven matrix is uncomfortable and it
      is the correct result: the unit's value is the 168 named probes and the
      demonstration that the coverage was an artefact of reading citations
      charitably. Two second-order lessons. First, a guard assertion can encode a
      CONCLUSION instead of a property -- ``UNPROVEN_BUDGET < len(_CELLS)`` was
      written to mean "this is not an empty shell" and became false the moment the
      evidence said so; it is now an anti-degeneracy check on the number of DISTINCT
      probe texts, which is the property actually wanted. Second, the same
      validation asymmetry appeared twice in one file: test citations got full
      nested-symbol resolution while finding OWNERS were checked only for file
      existence, so a renamed owner stayed green. ``tests/test_scheduled_tasks.py``'s
      ``_assert_node_exists`` (HFR-105) still has the leaf-only weakness this unit
      fixed, and is untouched.
  - id: HFR-OBS-029
    date: 2026-08-06
    source: fourth adversarial review of the PR7R matrix (PR #1212)
    result: confirmed
    detail: >-
      A reproducer can be wrong about its own subject in two directions, and the
      fourth review found one of each. Under-staging: the codex End fixture left
      ``_transports`` empty and ``get_thread_id`` returning ``None``, which is
      precisely the dead-app-server case the teardown is DESIGNED to clean up, so
      the probe was staging the absence of the interrupt it then complained was
      missing. Giving it a live transport did not just fix the fixture, it moved
      the defect: ``_end_codex`` returns ``interrupted`` already, and the discard
      is ``end_running_agent``'s failed-stop literal one frame up. Over-claiming:
      the claude End probe asserted an ordering and left REACHABILITY to the
      reader, which review challenged on cold-start grounds and was right to --
      an ordering is not a window until the fixture's combination of registries is
      shown to occur. It does occur, in the warm-idle state, and that is now
      driven off ``mark_session_idle`` rather than argued. The review also asked
      for a probe that blocks the real session-creation path and observes the
      registries; that was rejected, because it would make the probe a test of
      session creation rather than of End and would need a live SDK. Accepting a
      finding's GAP while rejecting its PRESCRIPTION is a distinct outcome from
      accepting or rejecting it whole, and worth recording as one. Cross-cutting
      lesson from four rounds: an evidence unit has no production diff to stash,
      so the counter-check that keeps its assertions honest is to mutate the
      PRODUCTION fact and confirm the probe fails -- and that check must itself be
      checked, since one round's mutation was a no-op comment that left the
      asserted substring intact and produced a false pass.
  - id: HFR-OBS-030
    date: 2026-08-06
    source: fifth adversarial review of the PR7R matrix (PR #1212)
    result: confirmed
    detail: >-
      Fixing a fixture is not the same as fixing it ENOUGH, and a guard can be
      degenerate in the same way an evidence cell can. Round 4 gave the codex End
      probe a live transport, which was the right direction and stopped one step
      short: the fixture still made the session its cwd's last, so ``_end_codex``
      stopped the shared app-server and the failed-interrupt run's turn died by
      process kill. Two runs that both end the turn, by different means, report
      ``ended`` truthfully in both -- the byte-identical payloads were accurate,
      not evidence. Only a co-tenant session on the same cwd keeps the transport
      up and leaves the un-interrupted turn genuinely executing, and the probe
      now ASSERTS that survival rather than inferring it from the fixture's
      shape. Generalised: when a probe's claim is "these two worlds are
      indistinguishable to the caller", the two worlds must first be shown to
      actually DIFFER, and a teardown side effect can silently collapse them into
      one. Separately, the finding-to-matrix tie compared two sets that shrink
      together -- delete a finding from both ``PR7R_FINDINGS`` and every cell
      detail and the equality still holds, including for an empty matrix. That is
      the third instance of the round-3 lesson about assertions that read like a
      floor and enforce nothing (after ``UNPROVEN_BUDGET < len(_CELLS)``), and it
      sat two lines below a block that pins the five question ids explicitly. The
      finding ids are now pinned the same way. The transferable rule: a guard
      built from a comparison between two derived collections proves consistency,
      never existence, so anything the plan advertises has to be named literally
      somewhere in the guard.
  - id: HFR-OBS-031
    date: 2026-08-06
    source: sixth adversarial review of the PR7R matrix (PR #1212)
    result: confirmed
    detail: >-
      A "nothing writes X" claim is only as strong as the search that produced
      it, and a literal grep is a weak search. Five rounds of this unit held two
      matrix cells open because ``turn_token`` appeared to be stamped only by
      Workbench owners; the write that settles the question is
      ``platform_specific[AGENT_TURN_TOKEN]`` in
      ``AgentService._stamp_runtime_turn``, a CONSTANT-KEYED write in the shared
      admission layer that ``handle_message`` performs for every request on every
      lane before the backend runs. Grepping the string missed it; resolving the
      constant would have found it in one step. This is the fourth correction of
      the same underlying error in six rounds (HFR-OBS-024), and the first where
      the previously-stated rule -- read the producer, not its projection -- was
      followed and still did not help, because the failure had moved from WHICH
      artefact was read to HOW it was searched for. Two consequences beyond the
      cells: the shared admission layer is worth probing directly, since anything
      it does is true of all three backends and both lanes at once, and a claim
      of absence deserves the same counter-check standard as a claim of presence
      (both new probes here DRIVE the real ``AgentService`` and were validated by
      mutating the production write and the gate acquire). A third consequence
      applies to over-claiming from a filter: the earlier reading that codex
      DISCARDS its exact-Turn signal at ``should_emit_progress`` does not survive
      the observation that the runtime gate is held across the whole backend call,
      so one runtime key admits one live turn at a time and the single
      ``_active_turns[base]`` slot is not lossy for live turns. The filter is
      correct; only the per-SESSION activity timestamp aggregates the attribution
      away. Separately, this round found scenario ids drifting from the catalog --
      a docstring saying HFR-186 for a test filed as HFR-187, and two guards with
      no catalog row at all. Every other guard in the unit checks that a CITATION
      resolves to a test; none checked the reverse, that a test announcing an id
      is the test that id names. HFR-192 now ties the two directions together for
      both PR7R modules.
  - id: HFR-OBS-032
    date: 2026-08-06
    source: seventh adversarial review of the PR7R matrix (PR #1212)
    result: confirmed
    detail: >-
      A guard's EXEMPTIONS are invisible, so they need counter-checking as
      deliberately as its assertions -- fourth instance in this unit, and both of
      round 6's new guards were an instance. HFR-191 blocked the second turn
      while the first was still inside the backend, which is what any mutex does;
      the Q2 conclusion turns on the gate outliving the call, because a backend
      returning from turn submission is not a turn ending. Codex and claude both
      return while the native turn keeps executing, and that window is where a
      second live turn would have to be excluded. Adding a release right after
      ``await agent.handle_message(request)`` -- the precise regression the probe
      exists to catch -- left it green. It now lets the first call RETURN, asserts
      the queued turn is still outside the backend, and only then releases; the
      mutation fails it. HFR-192 walked ``tree.body`` for ``ast.FunctionDef``
      only, so an ``async def test_*`` or a class-nested test method was skipped
      in silence by a guard whose name promised every test -- and an async test is
      the natural next shape in a unit whose subject is an async admission path.
      It recurses into classes and accepts both function kinds now.
      Separately, and more consequentially, the PLAN had been left contradicting
      itself: §7's numbered question-verdict block still said Q2 blocks the
      inactivity timeout and Q5 is answered, three paragraphs below the round-6
      narration that says the opposite, and the scenario-range summary still
      advertised HFR-188…219 as reserved after the same commit filed rows through
      HFR-192. A stale verdict in the contract document is worse than a stale
      comment: it hands the next implementation unit the opposite instruction in
      the artefact that is supposed to be authoritative, while every test stays
      green. Both are now tied to code -- HFR-193 compares the plan's verdict word
      against ``PR7R_QUESTIONS``, HFR-194 asserts no catalog id falls inside the
      range the plan calls reserved. The general rule: when a document states a
      fact the code also states, the document's copy is a cache, and an unchecked
      cache goes stale.
  - id: HFR-OBS-033
    date: 2026-08-06
    source: eighth adversarial review of the PR7R matrix (PR #1212)
    result: confirmed
    detail: >-
      When a conclusion joins two mechanisms, the JOIN is the claim -- and an
      identifier that appears in both is not the same identifier until it is
      computed and compared. Round 6 acquitted codex's ``should_emit_progress``
      by appealing to the admission gate: the gate is held for the whole turn, so
      one runtime key admits one live turn, so the single ``_active_turns[base]``
      slot names the only live turn there is. Every clause is true and the
      conclusion is false, because the gate keys on
      ``BaseAgent.runtime_turn_key`` -- the composite ``<base>:<working_path>``,
      which codex does not override -- while ``_active_turns`` keys on
      ``request.base_session_id`` alone, and ``CodexAgent.handle_message`` moves
      the tracked cwd to whatever the latest request carried. A working-path
      change on a live session opens a SECOND gate, admits a second live turn into
      the SAME slot, evicts the first and mutes a turn that is still running;
      ``runtime_turn_keys_for_session_key`` then reports only the newer key, so no
      sweep can address the silenced turn. HFR-195 drives all of it and closes,
      against the conclusion, the probe the codex cell had carried since round 4.
      This is a NEW error shape rather than a fifth repeat of "a projection is not
      the event stream" -- and the assertion written to tie the two key spaces was
      ``"base_session_id" in getsource(_runtime_turn_key_for_base_session)``, a
      substring read of a function the gate never calls: the exact
      nearby-passing-assertion this unit exists to eliminate, committed by the
      unit itself. A guard against a class of error is not immunity from it.
      Round 8's second finding was round 7's staleness rule recurring one file
      over: HFR-183's docstring still described the four-cells-covered lane split
      that its own assertions had contradicted for two rounds, and HFR-192 checks
      only the scenario id in that docstring, so the contradiction stayed green.
      HFR-196 now ties the one sentence shape that went stale -- a spelled-out
      number of cells said to be covered or open -- to the real table, across
      both PR7R test modules, the matrix module and the plan.
  - id: HFR-OBS-034
    area: run-terminal-truth
    summary: >-
      Round 9 of PR7R's review, and its first finding retracts round 8's. The
      key-space half survives: the admission gate keys on the composite
      ``<base>:<working_path>`` while codex's ``_active_turns`` keys on the base
      session alone, so a working-path change does get two requests past the
      shared gate. What rounds 6 and 8 both skipped is the code BETWEEN those two
      facts. ``CodexAgent.handle_message`` holds ``_session_locks[base]`` -- the
      registry's key space, not the gate's -- across its whole body, and inside it
      sends ``turn/interrupt`` for any active turn before ``turn/start``. The two
      requests are serialized before they reach the backend, and the turn that
      goes mute has been interrupted, so ``should_emit_progress`` is correct.
      (Round 9 wrote "the two turns never overlap" there; round 10 narrowed it --
      see HFR-OBS-035. Serialized at the lock is not non-overlapping on the
      backend.) The real consequence of the split is
      narrower: a cwd change converts "queue behind the gate and run after" into
      "interrupt the running turn and replace it". HFR-195 now drives that on the
      real method. THE DURABLE RULE: this claim was argued three times -- correct,
      defective, correct -- and every argument reasoned from the two ENDS of a
      mechanism without running what sits between them. A claim that keeps
      flipping is not unlucky; it is a claim whose subject was never driven end to
      end, and the flip count is the signal to go drive it.
      Round 9's second finding is the shape round 8 named, applied to the question
      text rather than to a conclusion: Q2 asks about the exact Turn AND
      PARTICIPATING RUNS, every probe asserted Turn tokens only, and the verdict
      was written as though the conjunction had been checked. It had not. The join
      turns out to be cheap and real -- ``_owned_agent_run_ids`` reads
      ``accepted_agent_run_ids`` off the emit context and
      ``_durable_accepted_agent_run_ids`` looks Runs up by that context's
      ``turn_token``, so Run attribution is DERIVED from Turn attribution -- but
      cheap to verify is not the same as verified. HFR-197 drives it, including
      the case that would smear Runs across Turns: claude's reused receiver
      context replaces the list per Turn rather than merging it.
      The remaining two findings are guards failing at their own contract.
      HFR-194 reads the plan's ``- PR7:`` allocation line only, so the document's
      HEADLINE range went stale at ``HFR-180…187`` while the same commit filed rows
      through HFR-196. And ``_assert_node_exists`` reused ``_assert_symbol_exists``
      verbatim, inheriting an exemption written for a different caller: a class
      leaf is legitimate for a finding OWNER and is not a pytest node id, so
      ``tests/foo.py::_helper`` resolved green. HFR-198 pins both strictnesses.
  - id: HFR-OBS-035
    area: run-terminal-truth
    summary: >-
      Round 10 of PR7R's review, seven findings, seven accepted -- though the
      first one's proposed REMEDY was rejected, which is its own lesson. The
      finding is right that round 9's "there is no window in which two codex
      turns are live" is false: codex's own protocol note
      (docs/plans/codex-app-server-refactor.md, insertion step 2) requires
      waiting for ``turn/completed`` with interrupted status before
      ``turn/start``, and production sends the two calls back to back. Turn-1 is
      still executing on the backend while turn-2 is registered. But the finding
      asked to reopen Q2, and Q2 asks whether the exact-Turn signal EXISTS. The
      window does not touch that. What it corrects is the BASIS of the answer,
      from a projection's one slot to the handlers that actually meet the
      overlap -- and both of them handle it: the interrupted turn's late
      ``item/completed`` is dropped by the named guard in ``_on_item_completed``
      while the live turn's is kept, and its late ``turn/completed`` is popped,
      ack-removed and stream-released with nothing emitted. HFR-195 now drives
      the window through the real ``CodexEventHandler`` instead of stubbing it.
      THE DURABLE RULE, and it is round 9's rule one level deeper: the projection
      error survives being named. Round 9 caught itself reading
      ``_active_turns`` for a claim about the event stream, went and drove
      ``handle_message`` -- and then read the REGISTRY for a claim about what the
      BACKEND is doing. The subject moved out one layer and the habit followed
      it. When the thing you are asserting about lives on the other side of a
      wire, the in-process map is still a projection no matter how carefully you
      drove the code that writes it.
      A byproduct the window made visible and the probe now pins: an interrupted
      turn's ack is removed TWICE, eagerly at ``clear_pending(active_turn)``
      inside ``handle_message`` and again when the interrupted completion lands.
      Idempotent on every current surface; not obviously so on the next one.
      Round 10's second finding is the same displacement in the test corpus.
      HFR-197 asserted per-Turn Run attribution against a STUBBED
      ``session_turns``, i.e. against a store that answers whatever the test
      wants; a real store that smeared Runs across Turns would have left it
      green. It now drives real rows through the real durable chain, which cost
      three schema lessons: a delivery may not be inserted directly as
      ``accepted`` (``ck_message_deliveries_materialization``), a session may
      hold only one live Turn (unique ``session_turns.session_id``), and
      ``agent_runs.delivery_id`` is unique -- so a Turn with plural participating
      Runs must come from a MERGED delivery batch, not two Runs on one delivery.
      Findings three through five are guards weaker than their own comments.
      ``_assert_node_exists`` was tightened at the LEAF in round 9 and left the
      CONTAINERS unexamined, so ``tests/foo.py::Helper::test_x`` passed while
      pytest collects nothing in a class that is neither ``Test*``-named nor a
      ``TestCase`` subclass -- a rule fixed at one nesting level does not travel.
      HFR-192 checked docstring ids against the catalog in one direction only, so
      a catalog row pointing at a deleted test stayed green; it is bidirectional
      now. And HFR-185's anti-degeneracy check counted distinct probe names
      GLOBALLY, which a single diverse row satisfies on behalf of every
      degenerate one; it is per ``(lane, outcome)`` group now. That is the fifth
      instance in this unit of an assertion that reads like the comment above it
      and enforces something weaker.
      The last two narrow claims to what was driven. Q1's "reservation does not
      settle the Run" rested on a scheduler test that STUBS ``submit_scheduled``
      and merely reports ``queue_persisted`` / ``delivery_owner_transferred``.
      HFR-199 drives the real chain and finds the fact holds and is broader than
      claimed: terminalizing the TURN does not settle the Run either -- only
      ``settle_agent_runs_for_turn_in_connection`` does, so any path that ends a
      Turn without calling it leaves a live Run with no owner. Q1 stays open
      because the direct-IM lane is still unestablished. And HFR-182's Q3 claim
      said the Turn-level ``source_kind`` is stamped by the FIRST participant,
      which the probe PRELOADED rather than drove; it now attaches a second Run
      carrying real provenance and asserts only what that shows -- a later
      participant does not restamp it.
  - id: HFR-OBS-036
    area: run-terminal-truth
    summary: >-
      Round 11 of PR7R's review, three findings, three accepted -- and the
      round's real work was auditing my own fixes, two of which were degenerate
      on the first draft. Finding one: round 10 retracted the codex overlap
      claim in five artefacts and left it standing in ``catalog.yaml``, the file
      that exists to BE the canonical record, so a follow-up unit reading only
      the scenario row would have taken the retracted contract as the contract.
      A SEVENTH copy sat unnoticed in HFR-OBS-034, which the finding did not
      name. Rounds 7, 9, 10 and 11 have each now found a stale-copy defect --
      docstring, headline range, document, canonical row -- and each was fixed
      as a text edit while the class was named only in prose. THE DURABLE RULE:
      naming a class does not enforce it; four recurrences ARE the evidence that
      prose is not a control. So the retractions became data
      (``RETRACTED_PHRASINGS`` in ``tests/run_terminal_truth_evidence.py``) and
      HFR-201 enforces them across every artefact this unit owns: a retracted
      phrasing may appear only in a sentence that also carries a retraction
      marker.
      Building that guard produced two degenerate drafts and a rigged
      counter-check, all three caught by insisting the counter-check restore the
      REAL prior text rather than a paraphrase. (1) The ledger's first phrase was
      ``"turns never overlap"``, which spells the retraction as round 10 WROTE it
      and not as the catalog CARRIED it -- "so the two never overlap", the wording
      this round retracted. A ledger keyed to a paraphrase of the bug cannot fail
      on the bug. (2) The proximity rule was a
      400-character window; restoring the real stale sentence to HFR-OBS-034
      left it GREEN, rescued by the word "narrower" -- about the consequence of
      the gate split, nothing to do with any retraction. (3) Widening the scope
      to "own sentence plus the next" still passed it, because "narrower" was in
      exactly that next sentence. The rule is now the phrase's own sentence and
      nothing else, and the three strings that decided that width are asserted
      in the test. THE DURABLE RULE: a proximity rule wide enough to span
      unrelated prose does not test proximity, it tests prose density -- and a
      counter-check written against a remembered version of the defect proves
      only that you remember it.
      Finding two is round 10's lesson at the next joint out. Round 10 taught
      ``_assert_node_exists`` that a container class must be collectible; the
      catalog-discovery walker in the same file kept its own inline class walk
      and never learned it, so a scenario row citing a test inside an
      uncollectible class was discovered by the corpus check and rejected by the
      citation check. One predicate, two readers, one of them updated. The walk
      is now a single module-level ``_collected_tests`` both call. THE DURABLE
      RULE: when you fix a rule at one call site, the question is not "is this
      right" but "who else answers this question".
      Finding three: ``_expand`` read ``cell.get("per_backend", {})`` and
      ``cell["shared"]``, so a misspelled backend key or an unknown cell key
      silently fell back to the shared proof -- evidence written and never read,
      which is worse than missing evidence because it looks present.
      ``_validate_matrix`` now whitelists both levels and HFR-200 pins all three
      rejections. The checked-in matrix was audited before the guard landed and
      contains no such typo, so UNPROVEN_BUDGET stays 168. A defaulted lookup
      cannot fail; if a key is meaningful, the code that reads it must be able to
      say it does not recognise it.

  - id: HFR-OBS-037
    area: run-terminal-truth
    summary: >-
      Round 12, four findings, four factual cores accepted and one proposed
      remedy rejected. Three of the four are audits of round 11's own fixes,
      which is now the shape of this review: the newest guard is the likeliest
      defect.
      Finding one: ``_collectible_class`` was taught in round 10 that a
      container class must be collectible, and it checked the name and the base
      list. pytest also refuses a ``Test*``-named class that defines
      ``__init__`` or ``__new__`` -- ``cannot collect test class ... because it
      has a __init__ constructor`` -- so a scenario could cite a test that never
      runs and be discovered. Verified against this repo's pytest rather than
      reasoned, including the negative case that keeps the fix from being a
      blanket ban: a ``unittest.TestCase`` subclass with ``__init__`` IS
      collected, because the unittest plugin claims it. THE DURABLE RULE: a
      collectibility predicate has to be run against the collector, not derived
      from what you remember of it.
      Finding two: nothing in the repo asserted that a catalog id names exactly
      one row. Every reader de-duplicates before it looks -- HFR-192 builds
      ``{id: test}`` and compares ``{ids}`` against the discovered set -- so two
      rows answering to one id collapse to one element and pass the count, the
      tie and the orphan checks, while consumers keep whichever row they read
      last. HFR-202 checks the whole catalog for that collision and deliberately
      does NOT ban the reverse: seven tests legitimately prove more than one
      scenario. THE DURABLE RULE: a set built from a key silently accepts a
      duplicate key; if the key is a primary key, something has to compare
      lengths before the set is built.
      Finding three is the sharpest, because it is round 11's fix reproducing
      the exact accident round 11 named. HFR-201's marker list held the stem
      ``"narrow"`` matched with ``in``, and the word that had rescued the stale
      text was "narrower" -- so the guard against a false rescue could itself be
      satisfied by the very word that caused it. Markers are now whole-word with
      every inflection spelled out, and the finding's counterexample is a
      fixture. THE DURABLE RULE: when a postmortem names the word that fooled
      you, the fix has to be checked AGAINST THAT WORD; naming it is not
      excluding it.
      Finding four's fact was right and its remedy was not. Every probe behind
      Q2's Run clause built rows with ``platform="avibe"``, so the three
      ``direct_im`` cells asserted per-Turn RUN attribution from durable-lane
      rows plus a belief that the write path is platform-blind. The belief
      holds: ``_submit_scheduled_turn`` gates on session id,
      ``_start_persisted_turn`` stamps the token unconditionally, and
      ``accepted_agent_run_ids_for_turn`` filters on state and turn id -- none
      reads a platform. So the remedy of reopening the cells was rejected and
      the belief was driven instead: the probe now builds a telegram-scoped
      Scope and Session, takes a Delivery through claim, native bind and
      materialized acceptance, binds an ``agent_runs`` row and reads the same
      attribution. THE DURABLE RULE, and it is the round's: the belief was cheap
      to check, and cheap to check is not checked.
      Two schema facts appear only on the IM lane and are pinned with it.
      Acceptance MATERIALIZES the snapshot into a ``messages`` row (afterwards
      ``snapshot_json`` is NULL), so ``messages.scope_id`` needs a real Scope
