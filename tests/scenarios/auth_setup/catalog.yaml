  - id: AUTH-SETUP-148
    name: Bundled iOS onboarding completes email OTP, account discovery, and authorized instance selection
    status: covered
    kind: happy_path
    layer: contract
    backend: ios
    test: ui/src/mobile/MobileOnboarding.test.tsx::AUTH-SETUP-148 completes email OTP discovery and authorized instance selection
    reason: >-
      The owning browser boundary is the bundled React page and its fixed
      avibeMobile contract. The collected Vitest case drives the approved
      Welcome, full-email, six-cell OTP, session discovery, and authorized
      selection flow against deterministic bridge responses; the sixth code
      digit sends the verification without a button press. The Python
      auth_setup harness drives IM backend auth and cannot reach the bundled
      page or WebKit, so this case is the iOS sign-in closed loop. Focused
      cases in the same file own the send rule: a typed, pasted, or autofilled
      code is sent once; a failed code again only after an edit or a button
      press; nothing during an operation, a provider cooldown, or the
      second-factor throttle; a recovery code only by the button.
  - id: AUTH-SETUP-149
    name: Mobile account failures preserve their owning screen and never silently start reauthentication
    status: covered
    kind: negative_path
    layer: contract
    backend: ios
    test: ui/src/mobile/MobileOnboarding.test.tsx::AUTH-SETUP-149 keeps every bridge failure on its owning screen without reauthentication
    reason: >-
      The page consumes the native failure classification instead of deriving a
      second auth state machine. The collected Vitest case covers every page
      operation against every finite native/bridge error code plus an unknown
      provider code, including cold-start and #account bootstrap.
  - id: AUTH-SETUP-150
    name: Native WebKit account transport keeps cookies, redirects, deadlines, store rotation, and bundled scrolling inside their boundaries
