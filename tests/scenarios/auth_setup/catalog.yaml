      Release XCTest, and simulator UI checks own this boundary. The catalog
      citation checker does not collect Swift XCTest, so this row records the
      evidence honestly instead of attaching a Python case that cannot execute
      WebKit. Hosted Supabase and physical-device behavior remain separate.
    owning_layer: iOS XCTest plus authorized hosted/device acceptance
