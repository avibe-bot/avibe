version: 1
capability: auth_setup
observations:
  - id: OBS-AUTH-001
    source: manual_regression
    related_scenarios:
      - AUTH-SETUP-901
    summary: Codex OAuth completion was not enough to make the next turn usable.
    previous_assumption: Successful OAuth immediately left Codex ready for the next user turn.
    observed_behavior: Codex still needed the setup completion waiter and runtime refresh to finish before the next turn.
    required_updates:
      - restore the setup completion waiter
      - lock the behavior with a post-success readiness scenario
  - id: OBS-AUTH-002
    source: manual_regression
    related_scenarios:
      - AUTH-SETUP-902
    summary: Claude auth failures arrived as assistant events without the deprecated API-error marker.
    previous_assumption: Claude auth-recovery detection could rely on the older API-error flag.
    observed_behavior: Recovery must trigger from the explicit authentication failure subtype even when the older marker is absent.
    required_updates:
      - update the Claude auth-failure detector
      - keep a regression test in the runtime-specific suite
  - id: OBS-AUTH-003
    source: manual_regression
    related_scenarios:
      - AUTH-SETUP-912
      - AUTH-SETUP-913
    summary: A Claude CLI killed by the OOM killer, stopped with the service, or crashed told the user to log in again.
    previous_assumption: A Claude process failure whose diagnostic mentions the login is an auth failure.
    observed_behavior: >-
      With an API key or another auth source beside a claude.ai login, the CLI writes a
      connectors notice naming that login to stderr at every start. The stderr tail joins
      every failure diagnostic, so exit -9 and 143 matched the auth classifier, posted the
      re-login prompt and retired the runtime as an auth failure while the login was fine.
      A hermetic run of the bundled CLI against a 401 stub, and with no login, reported
      both failures only as an Assistant frame with error authentication_failed and an
      is_error Result; stderr stayed empty.
    required_updates:
      - keep CLI stderr out of Claude auth evidence while the diagnostic still shows it
      - let a signal exit outrank auth words in the diagnostic
      - keep the prompt for an auth failure the CLI reports itself
  - id: OBS-AUTH-004
    source: isolated_native_regression
    related_scenarios:
      - AUTH-SETUP-176
      - AUTH-SETUP-178
    summary: A parented macOS popup was visible before its source-fenced Finished callback.
    previous_assumption: WebviewWindowBuilder visible(false) kept a parented popup hidden until explicit show.
    observed_behavior: >-
      The actual held-Finished fixture reported visible=true while the popup was
      offscreen and unfocused. Pinned tao 0.37.1 attaches the child above its parent
      but does not hide it for visible(false). Explicit hide after construction,
      while the existing window serializer is held, makes that same observation
      false; normal Finished still shows and a retired source does not.
    required_updates:
      - hide the constructed receiver before releasing the window serializer and fail construction if hiding fails
      - assert actual native visibility during held Finished, independently from absence of a show callback
      - retain the limit that offscreen snapshots do not prove compositor-frame or OS-focus behavior
  - id: OBS-AUTH-005
    source: isolated_native_regression
    related_scenarios:
      - AUTH-SETUP-177
      - AUTH-SETUP-178
    summary: VersionBadge mounted before local role admission and permanently disabled its native controls.
    previous_assumption: An initial native updater-state refusal meant the shell lacked that command.
    observed_behavior: >-
      A real load-blocking subresource allowed React to mount in a candidate
      before publication. The actual native command refused that role. After
      publication and unlock, an independent native read succeeded while the old
      same-document consumer still lacked its updater subscription. The fixed
      consumer recovered from the existing client completion projection, then
      received actual Any-target events and saved a private setting.
    required_updates:
      - keep getState as authority and use validated client completion only to request another read
      - retain rebind, receipt-admitted signout, preserved Account return and delayed-result native controls
      - distinguish this real component/native loop from full Workbench and installed acceptance
