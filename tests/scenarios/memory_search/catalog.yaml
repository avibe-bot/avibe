version: 1
capability:
  id: memory_search
  name: Default Memory project and explicit named projects
  canonical_tests:
    - tests/test_memory_admission.py
    - tests/test_memory_store.py
    - tests/test_memory_module.py
    - tests/test_memory_everos.py
    - tests/test_memory_insight.py
    - tests/test_internal_server.py
    - tests/test_memory_cli.py
status_legend:
  covered: executable evidence exists
  partial: contract coverage exists
scenarios:
  - id: MEMORY-SEARCH-001
    name: User turns land in default and Settings default search can retrieve them
    status: covered
    kind: happy_path
    layer: scenario
    test: tests/test_memory_admission.py::test_user_turns_capture_into_default_without_a_workdir
  - id: MEMORY-SEARCH-002
    name: Named remember is isolated from default search
    status: partial
    kind: happy_path
    layer: contract
    test: tests/test_memory_project_ids.py::test_parsers_reject_empty_and_mixed_case
  - id: MEMORY-SEARCH-003
    name: Settings all searches this principal only
    status: partial
    kind: authorization
    layer: contract
    test: tests/test_memory_project_ids.py::test_ui_parser_accepts_all_agent_does_not
  - id: MEMORY-SEARCH-004
    name: Agent cannot search all; reserved ids are rejected
    status: covered
    kind: validation
    layer: contract
    test: tests/test_memory_project_ids.py::test_ui_parser_accepts_all_agent_does_not
  - id: MEMORY-SEARCH-005
    name: v2 stores migrate and accept default enqueue
    status: covered
    kind: migration
    layer: contract
    test: tests/test_memory_store.py::test_store_migrates_v2_queue_and_accepts_default_project
  - id: MEMORY-SEARCH-006
    name: Final flush visits every current session scope
    status: partial
    kind: lifecycle
    layer: contract
    test: tests/test_memory_store.py::test_session_scope_recovery_survives_store_reopen_and_separates_sessions
  - id: MEMORY-SEARCH-007
    name: Agentic CLI recall builds the bounded internal policy envelope
    status: covered
    kind: happy_path
    layer: contract
    test: tests/test_memory_cli.py::test_agentic_cli_builds_bounded_internal_recall_policy
  - id: MEMORY-SEARCH-008
    name: Derived Agent owners are stable, cross-user isolated, and session-disjoint
    status: covered
    kind: authorization
    layer: contract
    test: tests/test_memory_store.py::test_assistant_owner_derivation_and_read_session_refs_are_stable_and_disjoint
  - id: MEMORY-SEARCH-009
    name: Dual-owner recall labels results and exact duplicates retain both origins
    status: covered
    kind: happy_path
    layer: contract
    test: tests/test_memory_module.py::test_dual_owner_search_is_concurrent_and_merges_score_dedupe_and_origins
  - id: MEMORY-SEARCH-010
    name: Agentic dual-owner recall spends at most one agentic provider leg
    status: covered
    kind: budget
    layer: contract
    test: tests/test_memory_module.py::test_agentic_recall_interleaves_per_leg_rank_with_only_one_agentic_leg
  - id: MEMORY-SEARCH-011
    name: Capture provenance routes writes to disjoint user and Agent owners
    status: covered
    kind: happy_path
    layer: contract
    test: tests/test_memory_everos.py::test_add_payload_owner_matches_provenance_routed_session
  - id: MEMORY-SEARCH-012
    name: Recovery revalidates every persisted owner session back to its trusted caller scope
    status: covered
    kind: recovery
    layer: contract
    test: tests/test_memory_store.py::test_owner_scoped_session_recovery_returns_trusted_caller_scope_after_reopen
  - id: MEMORY-SEARCH-013
    name: Terminal flush concurrently closes every captured owner session
    status: covered
    kind: lifecycle
    layer: contract
    test: tests/test_memory_module.py::test_terminal_flush_closes_user_and_agent_sessions_under_one_deadline
  - id: MEMORY-SEARCH-014
    name: Processing diagnostics retain Assistant-owned captures in scoped and admin views
    status: covered
    kind: diagnostics
    layer: contract
    test: tests/test_memory_insight.py::test_assistant_owned_capture_is_visible_in_scoped_and_admin_diagnostics
  - id: MEMORY-SEARCH-015
    name: Agent write ownership stays isolated across callers
    status: covered
    kind: authorization
    layer: contract
    test: tests/test_memory_store.py::test_capture_provenance_routes_provider_owner_without_changing_caller_audit_scope
  - id: MEMORY-SEARCH-016
    name: Agent remember is returned by dual-owner search with Agent provenance
    status: covered
    kind: happy_path
    layer: scenario
    test: tests/test_memory_module.py::test_agent_remember_round_trips_through_dual_owner_search
