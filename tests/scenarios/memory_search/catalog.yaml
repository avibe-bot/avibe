version: 1
capability:
  id: memory_search
  name: Default Memory project and explicit named projects
  canonical_tests:
    - tests/test_memory_admission.py
    - tests/test_memory_store.py
    - tests/test_memory_module.py
    - tests/test_memory_everos.py
    - tests/test_memory_insight.py
    - tests/test_internal_server.py
    - tests/test_memory_cli.py
status_legend:
  covered: executable evidence exists
  partial: contract coverage exists
scenarios:
  - id: MEMORY-SEARCH-001
    name: User turns land in default and Settings default search can retrieve them
    status: covered
    kind: happy_path
    layer: scenario
    test: tests/test_memory_admission.py::test_user_turns_capture_into_default_without_a_workdir
  - id: MEMORY-SEARCH-002
    name: Named remember is isolated from default search
    status: partial
    kind: happy_path
    layer: contract
    test: tests/test_memory_project_ids.py::test_parsers_reject_empty_and_mixed_case
  - id: MEMORY-SEARCH-003
    name: Settings all searches this principal only
    status: partial
    kind: authorization
    layer: contract
    test: tests/test_memory_project_ids.py::test_ui_parser_accepts_all_agent_does_not
  - id: MEMORY-SEARCH-004
    name: Agent cannot search all; reserved ids are rejected
    status: covered
    kind: validation
    layer: contract
    test: tests/test_memory_project_ids.py::test_ui_parser_accepts_all_agent_does_not
  - id: MEMORY-SEARCH-005
    name: Released stores migrate to identity-only v4 and retain default project admission
    status: covered
    kind: migration
    layer: contract
    test: tests/test_memory_store.py::test_released_v2_migration_discards_delivery_tables_and_derives_projects
  - id: MEMORY-SEARCH-006
    name: Session barriers flush only pending work from the same raw session
    status: covered
    kind: lifecycle
    layer: contract
    test: tests/test_memory_writer.py::test_session_barrier_flushes_only_matching_raw_session
  - id: MEMORY-SEARCH-007
    name: Agentic CLI recall builds the bounded internal policy envelope
    status: covered
    kind: happy_path
    layer: contract
    test: tests/test_memory_cli.py::test_agentic_cli_builds_bounded_internal_recall_policy
  - id: MEMORY-SEARCH-008
    name: Derived Agent owners are stable, cross-user isolated, and session-disjoint
    status: covered
    kind: authorization
    layer: contract
    test: tests/test_memory_everos.py::test_assistant_owner_crosses_add_search_and_profile_provider_contract
  - id: MEMORY-SEARCH-009
    name: Dual-owner recall labels results and exact duplicates retain both origins
    status: covered
    kind: happy_path
    layer: contract
    test: tests/test_memory_everos.py::test_assistant_owner_crosses_add_search_and_profile_provider_contract
  - id: MEMORY-SEARCH-010
    name: Agentic dual-owner recall spends at most one agentic provider leg
    status: covered
    kind: budget
    layer: contract
    test: tests/test_memory_everos.py::test_agentic_search_retains_allowlisted_round_metadata
  - id: MEMORY-SEARCH-011
    name: Capture provenance routes writes to disjoint user and Agent owners
    status: covered
    kind: happy_path
    layer: contract
    test: tests/test_memory_everos.py::test_assistant_owner_crosses_add_search_and_profile_provider_contract
  - id: MEMORY-SEARCH-012
    name: Clear rotates the epoch without replacing the installation scope key
    status: covered
    kind: recovery
    layer: contract
    test: tests/test_memory_store.py::test_clear_preserves_scope_key_and_rotates_epoch
  - id: MEMORY-SEARCH-013
    name: Volatile duplicate suppression prevents process-local repeat delivery
    status: covered
    kind: lifecycle
    layer: contract
    test: tests/test_memory_module.py::test_capture_is_accepted_and_duplicate_is_process_local
  - id: MEMORY-SEARCH-014
    name: Failure diagnostics are unavailable without durable delivery history
    status: covered
    kind: diagnostics
    layer: contract
    test: tests/test_memory_runtime.py::test_capture_diagnostics_are_unavailable_without_delivery_history
  - id: MEMORY-SEARCH-015
    name: Capture stamps caller-scoped identity and a native dedupe key
    status: covered
    kind: authorization
    layer: contract
    test: tests/test_memory_slice3.py::test_capture_stamps_user_principal_provenance_and_native_dedup_key
  - id: MEMORY-SEARCH-016
    name: Agent remember is returned by dual-owner search
    status: covered
    kind: happy_path
    layer: contract
    test: tests/test_memory_module.py::test_agent_remember_round_trips_through_dual_owner_search
  - id: MEMORY-SEARCH-017
    name: Lifecycle barrier admission does not wait for volatile delivery
    status: covered
    kind: lifecycle
    layer: contract
    test: tests/test_memory_module.py::test_lifecycle_barrier_does_not_wait_for_writer
  - id: MEMORY-SEARCH-018
    name: Memory payload sizing and result limits follow the pinned EverOS contract
    status: covered
    kind: boundary
    layer: contract
    test: tests/test_memory_module.py::test_capture_and_search_delegate_payload_size_to_everos
  - id: MEMORY-SEARCH-019
    name: Automatic and explicit capture preserve source identity and text while carrying sender names
    status: covered
    kind: boundary
    layer: scenario
    test: tests/test_memory_everos.py::test_sender_name_crosses_automatic_and_explicit_capture_http_boundary
  - id: MEMORY-SEARCH-020
    name: Accepted sender-name snapshots remain unchanged by asynchronous processing or later renames
    status: covered
    kind: lifecycle
    layer: contract
    test: tests/test_memory_adapter.py::test_sender_name_snapshot_survives_rename_before_async_admission

  - id: MEMORY-SEARCH-021
    name: Same-Session Task and Watch retain default and named Memory reads
    status: covered
    kind: happy_path
    layer: scenario
    test: tests/test_memory_delegated_reads.py::test_delegated_read_survives_definition_and_controller_restart
  - id: MEMORY-SEARCH-022
    name: Persisted continuation restores read identity after controller restart without capture or write expansion
    status: covered
    kind: lifecycle
    layer: scenario
    test: tests/test_memory_delegated_reads.py::test_delegated_read_survives_definition_and_controller_restart
  - id: MEMORY-SEARCH-023
    name: Missing or caller-forged delegated owner cannot authorize Memory
    status: covered
    kind: authorization
    layer: contract
    test: tests/test_memory_delegated_reads.py::test_missing_and_forged_owner_stay_denied
  - id: MEMORY-SEARCH-024
    name: Delegated remote reads remain user-isolated and obey current binding revocation
    status: covered
    kind: authorization
    layer: scenario
    test: tests/test_memory_delegated_reads.py::test_remote_delegations_isolate_users_and_recheck_revoked_binding
  - id: MEMORY-SEARCH-025
    name: Session locator overrides cannot copy another IM user's delegated Memory owner
    status: covered
    kind: authorization
    layer: contract
    test: tests/test_memory_delegated_reads.py::test_im_session_override_rejected
  - id: MEMORY-SEARCH-026
    name: Public continuation and definition payloads hide owner without erasing runtime identity
    status: covered
    kind: boundary
    layer: contract
    test: tests/test_memory_delegated_reads.py::test_public_definition_projection_preserves_sqlite_runtime_owner
  - id: MEMORY-SEARCH-027
    name: Task and Watch execution Runs hide delegated owners in public output but retain runtime identity
    status: covered
    kind: boundary
    layer: scenario
    test: tests/test_cli_definition_read_projection.py::test_definition_to_run_public_projection_keeps_raw_execution_owner
  - id: MEMORY-SEARCH-028
    name: OpenCode initial binding failure retries with Session proof and preserves Task and Watch admission
    status: covered
    kind: lifecycle
    layer: scenario
    test: tests/test_agent_steering.py::test_opencode_coordinator_error_aborts_through_steering_owner
  - id: MEMORY-SEARCH-029
    name: Same-Session owner changes reject retained proofs even with caller subject override
    status: covered
    kind: authorization
    layer: scenario
    test: tests/test_memory_delegated_reads.py::test_owner_bound_proof_rejects_later_owner_and_subject_override
  - id: MEMORY-SEARCH-030
    name: Malformed persisted delegated owners omit execution proof without aborting launch
    status: covered
    kind: boundary
    layer: contract
    test: tests/test_memory_delegated_reads.py::test_malformed_persisted_owner_omits_proof
  - id: MEMORY-SEARCH-031
    name: Task and Watch batches preserve one owner and resource authorization per Turn
    status: covered
    kind: authorization
    layer: scenario
    test: tests/test_memory_delegated_reads.py::test_queued_authority_remains_singular
  - id: MEMORY-SEARCH-032
    name: Ordinary UI and preexisting user deliveries cannot inject scheduled Memory authority
    status: covered
    kind: authorization
    layer: scenario
    test: tests/test_memory_delegated_reads.py::test_ordinary_ui_injection_never_becomes_scheduled
