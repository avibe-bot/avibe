version: 1
capability:
  id: runtime_generations
  name: Configuration changes reach backend runtimes through generations
  plan: docs/plans/runtime-generations.md
  canonical_tests:
    - tests/test_runtime_generations.py
    - tests/test_claude_cli_path.py
    - tests/test_backend_restart.py
    - tests/test_controller_idle_cleanup.py
    - tests/test_codex_runtime_generations.py
    - tests/test_opencode_generations.py
    - tests/test_internal_server.py
    - tests/test_claude_agent_sessions.py
  shared_harness: []
status_legend:
  covered: deterministic scenario or contract coverage exists
  manual: validated in the local Incus black-box environment
scenarios:
  - id: RUNTIME-GEN-001
    name: A Claude launch change never makes a session's turn wait; a busy client stays until idle unless the turn needs a different Model Hub launch
    status: covered
    kind: concurrency
    layer: unit
    backend: claude
    test: tests/test_claude_cli_path.py::test_claude_launch_change_keeps_a_busy_client_until_its_session_is_idle
  - id: RUNTIME-GEN-002
    name: A changed launch spec replaces an idle generation in place and lets a busy one finish while new turns use a new one
    status: covered
    kind: concurrency
    layer: unit
    backend: shared
    test: tests/test_runtime_generations.py::test_runtime_gen_002_a_busy_generation_finishes_while_new_turns_use_a_new_one
  - id: RUNTIME-GEN-003
    name: At the generation cap a new turn still starts at once and the oldest retiring generation gives way
    status: covered
    kind: concurrency
    layer: unit
    backend: shared
    test: tests/test_runtime_generations.py::test_runtime_gen_003_at_the_cap_the_oldest_retiring_generation_gives_way
    related_tests:
      - tests/test_opencode_generations.py::test_a_cap_forced_stop_settles_the_activities_of_the_sessions_it_interrupts
      - tests/test_opencode_generations.py::test_the_cap_stops_the_oldest_adopted_generation_whatever_its_record_order
  - id: RUNTIME-GEN-004
    name: A routine restart request renews in place and never drains, holds a turn, or interrupts
    status: covered
    kind: lifecycle
    layer: contract
    backend: shared
    test: tests/test_backend_restart.py::test_runtime_gen_004_a_restart_request_never_drains_holds_or_interrupts
  - id: RUNTIME-GEN-005
    name: A saved idle timeout applies without a backend restart, and retiring generations are swept regardless of idle timeouts
    status: covered
    kind: lifecycle
    layer: unit
    backend: shared
    test: tests/test_controller_idle_cleanup.py::test_a_saved_idle_timeout_applies_without_a_backend_restart
    related_tests:
      - tests/test_opencode_generations.py::test_a_failed_start_whose_process_survives_is_reaped_until_it_is_gone
      - tests/test_claude_cli_path.py::test_a_config_save_that_only_changes_live_fields_renews_no_client
      - tests/test_claude_cli_path.py::test_runtime_gen_005_a_client_from_before_a_renewal_is_reclaimed_once_idle
  - id: RUNTIME-GEN-006
    name: Disabling a backend is the user's own interruption; new messages see it disabled at once, running work settles with the interruption notice, and every process stops now
    status: covered
    kind: lifecycle
    layer: contract
    backend: shared
    test: tests/test_backend_restart.py::test_runtime_gen_006_disabling_a_backend_stops_its_work_at_once
    related_tests:
      - tests/test_internal_server.py::test_runtime_gen_006_a_disabled_backend_tells_the_turn_it_was_turned_off
      - tests/test_agent_service.py::test_runtime_gen_006_a_disabled_agents_retried_stop_spares_the_re_enabled_agents_turn
      - tests/test_claude_agent_sessions.py::test_runtime_gen_006_a_turn_reaching_a_disabled_claude_starts_nothing
      - tests/test_claude_cli_path.py::test_runtime_gen_006_a_disabled_claude_client_whose_disconnect_fails_still_exits
      - tests/test_claude_cli_path.py::test_runtime_gen_006_a_client_connecting_when_claude_is_disabled_never_serves
      - tests/test_claude_cli_path.py::test_runtime_gen_006_a_turn_cancelled_while_its_client_connects_stops_the_cli
      - tests/test_codex_runtime_generations.py::test_runtime_gen_006_disabling_codex_ends_every_app_server_and_admits_nothing
      - tests/test_codex_runtime_generations.py::test_runtime_gen_006_a_disable_whose_stop_fails_is_retried_until_the_app_server_is_gone
      - tests/test_codex_runtime_generations.py::test_runtime_gen_006_a_retried_disable_settles_only_the_disabled_agents_work
      - tests/test_codex_runtime_generations.py::test_runtime_gen_006_a_reenabled_agent_starts_beside_a_teardown_that_holds_its_activation
      - tests/test_opencode_generations.py::test_runtime_gen_006_disabling_opencode_stops_every_generation_now_and_refuses_a_late_turn
      - tests/test_opencode_generations.py::test_a_disable_shutdown_that_leaves_a_process_raises_and_its_retry_finishes
      - tests/test_opencode_generations.py::test_runtime_gen_006_a_disable_retried_after_a_re_enable_settles_only_the_disabled_agents_work
  - id: RUNTIME-GEN-007
    name: Re-enabling a backend registers a fresh agent at once; disabling already stopped the old one
    status: covered
    kind: lifecycle
    layer: contract
    backend: shared
    test: tests/test_backend_restart.py::test_runtime_gen_007_re_enabling_starts_a_fresh_agent_at_once
  - id: RUNTIME-GEN-008
    name: An unattended CLI update closes admission only for its install, then renews in place instead of tearing the runtime down
    status: covered
    kind: lifecycle
    layer: contract
    backend: shared
    test: tests/test_backend_restart.py::test_runtime_gen_008_idle_maintenance_runs_behind_closed_admission_then_renews
    related_tests:
      - tests/test_opencode_generations.py::test_a_leased_generation_counts_as_active_runtime_work
  - id: RUNTIME-GEN-010
    name: A Codex turn on a new launch spec starts at once on a new app-server while a busy one in the same directory finishes on its own
    status: covered
    kind: concurrency
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_010_a_busy_directory_never_holds_a_turn_on_a_new_spec
    related_tests:
      - tests/test_codex_runtime_generations.py::test_runtime_gen_010_a_cancelled_admission_never_pins_its_generation
  - id: RUNTIME-GEN-011
    name: A Codex Session leaving an app-server releases its thread there before resuming it on the new one, and the old process keeps serving its other Sessions; only thread/closed, Codex reporting it unloaded, or the old process's exit proves the release, so a closed reader alone holds the input
    status: covered
    kind: lifecycle
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_011_a_session_releases_its_thread_before_resuming_elsewhere
    related_tests:
      - tests/test_codex_runtime_generations.py::test_runtime_gen_011_a_closed_reader_is_no_proof_of_release
      - tests/test_codex_runtime_generations.py::test_runtime_gen_011_a_resume_whose_answer_was_lost_is_released_before_resuming_elsewhere
      - tests/test_codex_runtime_generations.py::test_runtime_gen_011_end_releases_the_thread_of_a_process_already_being_stopped
      - tests/test_codex_runtime_generations.py::test_runtime_gen_011_new_releases_a_session_that_started_while_it_cleared
  - id: RUNTIME-GEN-012
    name: A new message to a busy Codex Session interrupts its own turn and proceeds on the new launch spec, and a refused interrupt changes nothing and holds the input
    status: covered
    kind: concurrency
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_012_a_busy_session_moves_after_its_own_turn_is_interrupted
  - id: RUNTIME-GEN-013
    name: At the cap a fourth Codex launch spec starts at once and only the oldest app-server's turns are interrupted
    status: covered
    kind: concurrency
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_013_at_the_cap_the_oldest_busy_generation_gives_way
    related_tests:
      - tests/test_codex_runtime_generations.py::test_runtime_gen_013_a_session_leaving_a_force_stopped_generation_waits_for_its_teardown
      - tests/test_codex_runtime_generations.py::test_runtime_gen_013_a_child_whose_reader_closed_is_settled_before_it_is_killed
  - id: RUNTIME-GEN-014
    name: A direct Codex launch with Model Hub enabled keeps the desktop-managed environment
    status: covered
    kind: regression
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_014_a_direct_launch_with_model_hub_keeps_the_managed_environment
  - id: RUNTIME-GEN-015
    name: Direct and native-CLI Codex launches with identical process inputs share one app-server, and an equal spec never reuses a process that can no longer serve
    status: covered
    kind: regression
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_015_direct_and_native_cli_launches_share_one_process
    related_tests:
      - tests/test_codex_runtime_generations.py::test_runtime_gen_015_a_dead_retiring_generation_is_never_reused
      - tests/test_codex_runtime_generations.py::test_runtime_gen_015_a_generation_that_dies_while_its_spec_is_prepared_is_not_reused
      - tests/test_codex_runtime_generations.py::test_runtime_gen_015_a_renewal_during_hub_catalog_preparation_leaves_one_coherent_spec
      - tests/test_codex_runtime_generations.py::test_runtime_gen_015_a_renewal_during_hub_launch_resolution_leaves_one_coherent_spec
      - tests/test_codex_config.py::test_credential_identity_tells_legacy_oauth_accounts_apart_but_not_their_refreshes
  - id: RUNTIME-GEN-016
    name: Retiring a Codex Hub app-server, by renewal or a switch to Direct, keeps the directory's gateway credential until the last Hub app-server stops, and a switch to Direct never holds a new turn behind a running Hub turn
    status: covered
    kind: lifecycle
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_016_hub_scope_is_revoked_only_with_the_last_hub_generation
    related_tests:
      - tests/test_codex_runtime_generations.py::test_runtime_gen_016_a_starting_hub_process_keeps_the_scope
      - tests/test_codex_runtime_generations.py::test_runtime_gen_016_a_failed_hub_start_is_cleaned_up
      - tests/test_codex_runtime_generations.py::test_runtime_gen_016_a_retried_disable_never_revokes_a_reenabled_agents_hub_credential
      - tests/test_codex_runtime_generations.py::test_runtime_gen_016_a_process_whose_post_start_setup_fails_is_stopped_by_the_sweep
  - id: RUNTIME-GEN-017
    name: A Codex Session that moved app-servers never receives late thread-level events from the one it left
    status: covered
    kind: concurrency
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_017_late_thread_events_from_a_previous_generation_are_dropped
  - id: RUNTIME-GEN-018
    name: A Codex fork reads its boundary from the app-server running the source turn
    status: covered
    kind: concurrency
    layer: unit
    backend: codex
    test: tests/test_codex_runtime_generations.py::test_runtime_gen_018_fork_boundary_reads_the_source_sessions_generation
  - id: RUNTIME-GEN-019
    name: The real Codex CLI moves a thread between two app-servers in one directory only after release, without touching its rollout
    status: covered
    kind: contract
    layer: e2e
    backend: codex
    test: tests/e2e/test_codex_runtime_generations_contract.py::test_runtime_gen_019_a_thread_moves_between_app_servers_only_after_release
  - id: RUNTIME-GEN-020
    name: An OpenCode launch change starts a new generation while a busy one finishes its native run, and the old one stops only once that run is cleared
    status: covered
    kind: concurrency
    layer: unit
    backend: opencode
    test: tests/test_opencode_generations.py::test_runtime_gen_020_a_busy_generation_finishes_its_run_while_new_turns_move_on
    related_tests:
      - tests/test_opencode_generations.py::test_an_in_place_binary_upgrade_changes_the_launch_spec
      - tests/test_opencode_generations.py::test_credential_digest_ignores_token_refresh_but_sees_new_credentials
      - tests/test_opencode_generations.py::test_a_renewal_during_overlay_preparation_leaves_the_launch_one_coherent_spec
      - tests/test_opencode_generations.py::test_a_turn_keeps_the_opencode_settings_it_was_admitted_with
  - id: RUNTIME-GEN-021
    name: An OpenCode turn is aborted and steered on the generation that runs it while a newer generation is current
    status: covered
    kind: concurrency
    layer: unit
    backend: opencode
    test: tests/test_opencode_generations.py::test_runtime_gen_021_a_live_turn_is_aborted_on_its_own_generation
    related_tests:
      - tests/test_opencode_generations.py::test_runtime_gen_021_a_steer_reaches_the_generation_running_the_turn
  - id: RUNTIME-GEN-022
    name: After a controller restart an OpenCode poll resumes on the adopted generation that runs it, including a poll from before generations
    status: covered
    kind: recovery
    layer: unit
    backend: opencode
    test: tests/test_opencode_generations.py::test_runtime_gen_022_a_restored_poll_resumes_on_the_generation_that_runs_it
    related_tests:
      - tests/test_opencode_generations.py::test_adoption_keeps_every_proven_serving_process_and_drops_the_rest
      - tests/test_opencode_restore_polls.py::test_a_cancelled_restore_releases_the_binding_its_poll_task_never_took
      - tests/test_opencode_restore_polls.py::test_two_overlapping_restores_of_one_durable_poll_start_exactly_one_loop
      - tests/test_opencode_restore_polls.py::test_a_restore_whose_generation_rewrite_fails_runs_nothing_and_the_sweep_restores_it
      - tests/test_opencode_restore_polls.py::test_a_poll_task_whose_rebind_cannot_be_recorded_leaves_its_turn_live_for_the_sweep
      - tests/test_opencode_restore_polls.py::test_a_restore_whose_publication_fails_leaves_no_poll_task_waiting_on_it
  - id: RUNTIME-GEN-023
    name: The UI process never launches OpenCode; it leases the controller's generation over control IPC
    status: covered
    kind: lifecycle
    layer: contract
    backend: opencode
    test: tests/test_opencode_generations.py::test_runtime_gen_023_the_ui_process_leases_the_controllers_generation_over_control_ipc
    related_tests:
      - tests/test_save_opencode_provider_auth.py::test_save_provider_model_fails_closed_when_an_enabled_opencode_cannot_be_leased
      - tests/test_opencode_generations.py::test_a_ui_request_running_past_its_lease_window_keeps_its_generation_until_release
  - id: RUNTIME-GEN-024
    name: A Hub-to-Direct mode switch while a Hub run is live moves new OpenCode turns to a Direct generation and lets the Hub one finish its run
    status: covered
    kind: concurrency
    layer: unit
    backend: opencode
    test: tests/test_opencode_generations.py::test_runtime_gen_024_a_mode_switch_during_a_hub_run_moves_new_turns_to_direct
  - id: RUNTIME-GEN-025
    name: A controller that starts with OpenCode disabled stops the OpenCode servers a crashed controller recorded and leaves them for adoption when OpenCode is enabled; shutdown stops only what this controller owns, nothing adopts, stops, forgets, or cleans another desktop Runtime's records, and restore never binds, rewrites, or settles a poll whose run another desktop Runtime's live server executes
    status: covered
    kind: recovery
    layer: unit
    backend: opencode
    test: tests/test_opencode_generations.py::test_a_controller_starting_with_opencode_disabled_stops_a_crashed_controllers_servers
    related_tests:
      - tests/test_opencode_generations.py::test_shutdown_stops_only_the_generations_this_controller_owns
      - tests/test_opencode_generations.py::test_service_shutdown_stops_a_started_process_whose_record_was_never_written
      - tests/test_opencode_generations.py::test_adoption_leaves_every_record_of_another_desktop_runtime_alone
      - tests/test_opencode_restore_polls.py::test_restore_leaves_every_poll_whose_run_another_desktop_runtimes_live_server_executes
      - tests/test_opencode_generations.py::test_a_malformed_record_never_disables_opencode
  - id: RUNTIME-GEN-026
    name: A clock step never makes a live OpenCode server this controller started look exited or foreign; its process handle, never the start time the platform reports, decides whether it runs, both for each turn and when the service shuts down
    status: covered
    kind: recovery
    layer: unit
    backend: opencode
    test: tests/test_opencode_generations.py::test_runtime_gen_026_a_generation_this_controller_started_is_alive_while_its_handle_says_so
    related_tests:
      - tests/test_opencode_generations.py::test_runtime_gen_026_service_shutdown_stops_its_own_recorded_server_after_a_clock_step
      - tests/test_opencode_generations.py::test_service_shutdown_stops_a_started_process_whose_record_was_never_written
