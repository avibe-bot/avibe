version: 1
capability: runtime_generations
observations:
  - id: RUNTIME-GEN-OBS-001
    date: 2026-10-01
    source: local log trace
    result: confirmed
    detail: >-
      An unattended Model Hub built-in snapshot refresh requested a Claude
      restart; the coordinator drained for 300 s and then force-interrupted a
      running turn. A Claude CLI install job interrupted three turns the same
      way the day before.
  - id: RUNTIME-GEN-OBS-002
    date: 2026-10-01
    source: hermetic probe (Claude CLI 2.1.286, Agent SDK 0.2.158)
    result: confirmed
    detail: >-
      A live Claude process whose gateway discovery listed only one model
      accepted set_model for an id added later, validating it with one gateway
      request, and ran the next turn on it.
  - id: RUNTIME-GEN-OBS-003
    date: 2026-10-01
    source: hermetic probe (OpenCode 1.18.33)
    result: confirmed
    detail: >-
      Two opencode serve processes shared one SQLite (WAL) home: sessions
      continued across servers without stale reads and concurrent prompts on
      different sessions completed in parallel. Simultaneous first starts on a
      fresh home failed with "database is locked", so starts are serialized.
  - id: RUNTIME-GEN-OBS-004
    date: 2026-10-01
    source: hermetic probe (codex-cli 0.159.3)
    result: confirmed
    detail: >-
      Two app-servers ran in one directory with concurrent turns. A thread
      loaded in one holds a cross-process writer lock, so another can resume it
      only after thread/unsubscribe and thread/closed, which take about 50 ms
      with thread_unload_delay_secs=0, or after the first exits. Neither
      unloading nor exit appends to the thread's rollout.
