version: 1
capability: memory_repair
observations:
  - id: MEMORY-REPAIR-OBS-001
    scenarios:
      - MEMORY-WAKE-001
      - MEMORY-WAKE-002
    observation: Startup, explicit Wake, and unexpected child recovery share one volatile non-destructive path; failures never route into Repair.
  - id: MEMORY-REPAIR-OBS-002
    scenarios:
      - MEMORY-REPAIR-001
      - MEMORY-REPAIR-002
      - MEMORY-REPAIR-003
      - MEMORY-REPAIR-006
    observation: Destructive authority consists only of exact accepted-loss confirmation, process-level exclusion, proven termination, and fixed confined surfaces; stable identity and project rows remain outside deletion.
  - id: MEMORY-REPAIR-OBS-003
    scenarios:
      - MEMORY-REPAIR-004
      - MEMORY-REPAIR-005
    observation: No operation stage is persisted or resumed; startup reevaluates the native root, while ordinary provider and machine faults stay degraded.
