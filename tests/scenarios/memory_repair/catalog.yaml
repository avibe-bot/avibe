version: 1
capability:
  id: memory_repair
  name: Unified non-destructive Wake and destructive Memory Repair
  canonical_tests:
    - tests/test_memory_wake.py
    - tests/test_controller_memory_data_reset.py
    - tests/test_internal_server.py
    - tests/test_internal_client.py
    - tests/test_ui_memory_routes.py
status_legend:
  covered: executable evidence exists at the declared layer
  partial: contract evidence exists but full packaged runtime regression remains
scenarios:
  - id: MEMORY-WAKE-001
    name: Wake reuses the existing admitted Memory root
    status: covered
    kind: happy_path
    layer: contract
    test: tests/test_memory_wake.py::test_wake_reuses_existing_root_and_proves_native_readiness
    given: Memory has an admitted artifact and an existing mutable data root
    when: Wake starts the runtime and verifies native readiness with bounded backoff
    then: The existing root remains intact and status becomes running
  - id: MEMORY-WAKE-002
    name: Wake failure is degraded and never destructive
    status: covered
    kind: degradation
    layer: contract
    test: tests/test_memory_wake.py::test_wake_artifact_failure_is_degraded_and_non_destructive
    given: Artifact validation or installation fails
    when: Wake is requested
    then: The runtime reports a short degraded reason and existing Memory data remains intact
  - id: MEMORY-REPAIR-001
    name: Repair requires exact accepted-loss confirmation and genuine eligibility
    status: covered
    kind: authorization
    layer: contract
    test: tests/test_controller_memory_data_reset.py::test_repair_requires_exact_loss_confirmation
    related_tests:
      - tests/test_controller_memory_data_reset.py::test_repair_is_not_offered_for_degraded_runtime
    given: A caller reaches the destructive Repair boundary
    when: accepted loss is absent or the local root does not genuinely need repair
    then: Repair fails closed and does not touch the runtime or data roots
  - id: MEMORY-REPAIR-002
    name: Repair proves stop before confined deletion and native readiness after reset
    status: covered
    kind: lifecycle
    layer: contract
    test: tests/test_controller_memory_data_reset.py::test_repair_stops_owned_runtime_before_delete_and_proves_native_readiness
    given: The confined local root is unusable and Repair is explicitly confirmed
    when: Repair owns both the process lease and controller replacement gate
    then: Recorded ownership is reaped, the old runtime is proven closed before deletion, and success waits for native readiness
  - id: MEMORY-REPAIR-003
    name: Unproved process termination authorizes no deletion
    status: covered
    kind: safety
    layer: contract
    test: tests/test_controller_memory_data_reset.py::test_repair_deletes_nothing_when_termination_is_unproved
    given: The old owned runtime cannot prove all writers and process trees stopped
    when: Repair attempts to cross the destructive boundary
    then: Both exact roots remain unchanged and the response reports the failed proof
  - id: MEMORY-REPAIR-004
    name: Failed post-reset native readiness remains needs repair without a workflow journal
    status: covered
    kind: failure
    layer: contract
    test: tests/test_controller_memory_data_reset.py::test_failed_post_repair_readiness_remains_needs_repair
    given: Confined deletion completed but the native data path is not ready
    when: Repair performs its final readiness check
    then: It reports deleted data truthfully, remains needs_repair, and a later Repair starts again from root evaluation
  - id: MEMORY-REPAIR-005
    name: Provider, credential, disk, and permission faults do not qualify for Repair
    status: covered
    kind: classification
    layer: contract
    test: tests/test_memory_wake.py::test_external_local_faults_are_degraded_not_repair_eligible
    given: Memory fails outside the unusable-or-incompatible local-root boundary
    when: Runtime state is classified
    then: The state is degraded with a bounded reason and no destructive Repair authority
  - id: MEMORY-REPAIR-006
    name: Repair preserves stable identity and the project catalog
    status: covered
    kind: migration
    layer: contract
    test: tests/test_memory_store.py::test_data_loss_settlement_preserves_stable_identity_and_rotates_epoch
    given: A confirmed destructive reset has stopped the old owned process
    when: Avibe settles the new provider data generation
    then: Scope identity, provider-root identity, and project rows survive while volatile data authority rotates
