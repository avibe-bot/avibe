version: 1
capability:
  id: memory_factory_reset
  name: Memory factory reset recovery floor
  canonical_tests:
    - tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py
    - tests/test_internal_server.py
status_legend:
  covered: scenario coverage exists
  partial: unit or contract coverage exists but the closed loop is incomplete
  manual: currently validated only by human regression
  gap: not covered yet
scenarios:
  - id: MEMORY-FACTORY-001
    name: Successful reset returns the closed two-root result
    status: covered
    kind: service_boundary
    layer: scenario
    test: tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py::test_memory_factory_001_successful_reset_is_a_closed_service_result
    given: Both exact mutable roots exist and the pinned artifact is admissible
    when: The Controller replacement gate executes Factory Reset
    then: Both roots are deleted and settled recovery_intent is cleared
  - id: MEMORY-FACTORY-002
    name: Partial deletion is truthful and retryable
    status: covered
    kind: service_boundary
    layer: scenario
    test: tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py::test_memory_factory_002_partial_delete_is_truthful_and_retryable
    given: The first root deletion succeeds and the second fails
    when: Factory Reset is retried
    then: The first response reports partial deletion and the retry completes the remaining root
  - id: MEMORY-FACTORY-003
    name: Remember is fenced by Controller replacement
    status: covered
    kind: service_boundary
    layer: scenario
    test: tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py::test_memory_factory_003_stale_remember_waits_for_controller_replacement_gate
    given: A capture is queued while replacement owns the gate
    when: The old runtime is retired
    then: The stale capture cannot write and returns operation_in_progress
  - id: MEMORY-FACTORY-004
    name: Captures cannot repopulate a freshly reset runtime
    status: covered
    kind: service_boundary
    layer: scenario
    test: tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py::test_memory_factory_004_capture_queued_for_reset_cannot_use_fresh_runtime
    given: A capture observes the old runtime before Factory Reset publishes a replacement
    when: The replacement gate opens after the fresh aggregate is published
    then: The capture is rejected without writing to either runtime
  - id: MEMORY-FACTORY-101
    name: Invalid artifact disables reset
    status: covered
    kind: service_boundary
    layer: scenario
    test: tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py::test_memory_factory_101_disabled_reset_fails_closed_without_deletion
    given: The pinned memory-runtime artifact is not admissible
    when: Factory Reset is requested
    then: Both roots remain untouched and the result reports the repair reason
  - id: MEMORY-FACTORY-201
    name: Worker and process death are quiesced before deletion
    status: covered
    kind: service_boundary
    layer: scenario
    test: tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py::test_memory_factory_201_worker_and_process_death_are_quiesced_before_delete
    given: The old aggregate has active worker/process ownership
    when: Factory Reset retires it
    then: close is awaited before the deletion result is returned
  - id: MEMORY-FACTORY-202
    name: Supervisor-down recovery keeps exact root outcomes
    status: covered
    kind: service_boundary
    layer: scenario
    test: tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py::test_memory_factory_202_supervisor_down_still_returns_two_root_outcomes
    given: A retained supervisor is already down
    when: The exact root deletion primitive runs
    then: The final result still contains two truthful root outcomes
  - id: MEMORY-FACTORY-301
    name: Post-delete activation failure retains recovery intent
    status: covered
    kind: service_boundary
    layer: scenario
    test: tests/scenarios/memory_factory_reset/test_memory_factory_reset_scenarios.py::test_memory_factory_301_post_delete_activation_failure_retains_recovery_intent
    given: Both roots are deleted but fresh activation fails
    when: The Controller publishes the replacement outcome
    then: The closed envelope reports deletion truth and leaves retryable intent persisted
