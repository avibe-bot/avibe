version: 1
capability: memory_factory_reset
observations:
  - id: OBS-MEMORY-FACTORY-001
    source: issue_contract
    related_scenarios:
      - MEMORY-FACTORY-001
      - MEMORY-FACTORY-002
      - MEMORY-FACTORY-101
      - MEMORY-FACTORY-201
    summary: Factory reset is a replacement of the mutable Memory aggregate, not a rebuild or generic operation projection.
    previous_assumption: A boolean rebuild marker and a single success toast were sufficient for destructive recovery.
    observed_behavior: A crash can delete one root before the second; the user needs durable factory_reset intent, an explicit Repair path for invalid artifacts, and final per-root deletion truth.
    required_updates:
      - keep the confirmation limited to the two mutable roots and retained settings/artifact
      - await the final response and render each root outcome
      - label a pending durable intent Retry initialization and disable competing controls
      - do not add polling, operation dashboards, or a generic operation abstraction
