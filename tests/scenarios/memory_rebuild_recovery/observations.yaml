version: 1
capability: memory_rebuild_recovery
observations:
  - id: OBS-MEMORY-REBUILD-001
    source: issue_reproduction
    related_scenarios:
      - MEMORY-REBUILD-001
      - MEMORY-REBUILD-101
      - MEMORY-REBUILD-201
    summary: An embedding identity write could bypass or enter recovery inconsistently depending on whether identity fields were previously empty.
    previous_assumption: First identity configuration was ordinary setup, while only changing an established identity needed confirmation and rebuild.
    observed_behavior: Vector-bearing state can outlive incomplete identity fields, and checking emptiness before saving creates a race; first and later identity writes require the same recovery admission.
    required_updates:
      - reject every unconfirmed base URL or model identity write without persistence
      - persist every confirmed first or changed identity plus rebuild intent before destructive work
      - run one runtime-owned rebuild and clear intent only after a closed successful result
      - retain the candidate and intent after failure so the same operation can be retried
