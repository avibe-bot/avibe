version: 1
capability:
  id: memory_rebuild_recovery
  name: Confirmed Memory embedding rebuild recovery
  canonical_tests:
    - tests/test_ui_memory_routes.py
    - tests/test_memory_runtime.py
  shared_harness:
    - tests/ui_server_test_helpers.py
status_legend:
  covered: scenario coverage exists
  partial: unit or contract coverage exists but the closed loop is incomplete
  manual: currently validated only by human regression
  gap: not covered yet
scenarios:
  - id: MEMORY-REBUILD-001
    name: Confirmed embedding identity write persists intent and reaches a closed rebuild result
    status: covered
    kind: happy_path
    layer: scenario
    test: tests/test_ui_memory_routes.py::test_memory_confirmed_first_embedding_identity_runs_retained_rebuild
    related_tests:
      - tests/test_ui_memory_routes.py::test_memory_confirmed_embedding_change_persists_marker_and_awaits_rebuild
    given: Memory has either empty identity fields or an established embedding identity
    when: The user confirms a first or changed embedding base URL or model in Settings
    then: The candidate and rebuild intent are durable before rebuild, and successful settlement clears the intent
  - id: MEMORY-REBUILD-101
    name: Unconfirmed embedding identity write is rejected without a write
    status: covered
    kind: validation
    layer: scenario
    test: tests/test_ui_memory_routes.py::test_memory_first_embedding_identity_requires_confirm_and_saves_nothing
    related_tests:
      - tests/test_ui_memory_routes.py::test_memory_embedding_identity_change_requires_confirm_and_saves_nothing
    given: Memory has either empty identity fields or an established embedding identity
    when: The user saves a first or changed embedding base URL or model without confirmation
    then: Settings returns rebuild-required and the config remains byte-for-byte unchanged
  - id: MEMORY-REBUILD-201
    name: Failed rebuild retains the confirmed candidate for retry
    status: covered
    kind: recovery
    layer: scenario
    test: tests/test_ui_memory_routes.py::test_memory_confirmed_rebuild_failure_keeps_candidate
    given: The user has confirmed a different embedding identity
    when: The rebuild reports that the provider root is busy
    then: The closed error is returned and the candidate plus rebuild intent remain durable for Retry
