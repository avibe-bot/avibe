version: 1
capability: memory_list
observations:
  - id: MEMORY-LIST-OBS-001
    scenarios:
      - MEMORY-LIST-001
      - MEMORY-LIST-002
      - MEMORY-LIST-004
    observation: The hermetic provider derives only extracted episodes from real module captures, and the public CLI reads two exact pages from one named project.
  - id: MEMORY-LIST-OBS-002
    scenarios:
      - MEMORY-LIST-003
    observation: The controller selects the UI or Agent project parser only after validating the caller scope; only the signed UI parser admits all.
  - id: MEMORY-LIST-OBS-003
    scenarios:
      - MEMORY-LIST-005
    observation: Aggregate reads retain healthy project items while surfacing a closed warning and nullable total when another project fails.
  - id: MEMORY-LIST-OBS-004
    scenarios:
      - MEMORY-LIST-003
      - MEMORY-LIST-004
      - MEMORY-LIST-006
      - MEMORY-LIST-007
    observation: The existing Search tab selects browse or relevance search solely from the trimmed query, while UI-only aggregate cursors remain opaque and entry ids are exposed only through a copy affordance.
  - id: MEMORY-LIST-OBS-005
    scenarios:
      - MEMORY-LIST-008
    observation: Settings selects an owner origin rather than accepting a raw owner id; the controller derives the Agent owner from the authenticated principal and every returned row identifies its origin.
  - id: MEMORY-LIST-OBS-006
    scenarios:
      - MEMORY-LIST-009
    observation: The pinned EverOS contract accepts pages up to 100 items and owns episode payload sizing; Avibe retains shape and scope validation without imposing a smaller aggregate byte limit.
