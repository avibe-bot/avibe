version: 1
capability: message_delivery
observations:
  - id: OBS-MESSAGE-DELIVERY-001
    source: live_local_diagnosis
    related_scenarios:
      - MESSAGE-DELIVERY-005
    summary: Structured Run output fan-out injected Activity summaries and duplicate finals into the callback Session.
    previous_assumption: Every user-visible full-duplex Run output should become its own callback turn.
    observed_behavior: Callback Sessions received Claude Activity labels, command fragments, and both explicit and automatic copies of the final report.
    required_updates:
      - retain intermediate outputs only in the Run output ledger and originating Session
      - keep result_text terminal-only and enqueue one terminal callback
      - keep explicit child delivery independent from the parent's automatic callback
      - persist harness-originated prompts with a non-user author and message type
  - id: OBS-MESSAGE-DELIVERY-003
    source: live_local_diagnosis
    related_scenarios:
      - MESSAGE-DELIVERY-008
    summary: Queued directed child Runs were recorded as completed parent callbacks even though they had not started.
    previous_assumption: Any explicit child Run targeting the callback Session could satisfy the parent callback.
    observed_behavior: Parent callback ledgers inherited the child Run id while the child stayed queued, and direct cross-Session database inspection consumed an intermediate preamble instead.
    required_updates:
      - derive callback payloads only from the parent Run terminal result
      - keep directed child Runs as separate durable queue objects with their own callback policy
      - preserve intermediate assistant and tool activity in the target Session only
