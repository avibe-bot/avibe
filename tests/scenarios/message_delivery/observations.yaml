version: 1
capability: message_delivery
observations:
  - id: OBS-MESSAGE-DELIVERY-001
    source: live_local_diagnosis
    related_scenarios:
      - MESSAGE-DELIVERY-005
    summary: Structured Run output fan-out injected Activity summaries and duplicate finals into the callback Session.
    previous_assumption: Every user-visible full-duplex Run output should become its own callback turn.
    observed_behavior: Callback Sessions received Claude Activity labels, command fragments, and both explicit and automatic copies of the final report.
    required_updates:
      - retain intermediate outputs only in the Run output ledger and originating Session
      - keep result_text terminal-only and enqueue one terminal callback
      - keep explicit child delivery independent from the parent's automatic callback
      - persist harness-originated prompts with a non-user author and message type
  - id: OBS-MESSAGE-DELIVERY-002
    source: live_local_diagnosis
    related_scenarios:
      - MESSAGE-DELIVERY-007
    summary: A terminal report containing the literal silent directive in inline Markdown code was truncated before persistence and callback delivery.
    previous_assumption: Silent directive parsing could safely inspect raw Markdown because literal examples would only appear in non-terminal helper output.
    observed_behavior: Run 6915939fd9e9, its persisted result message, and callback Run 8476952624d1 all stopped at the inline code opener and lost the substantial trailing report.
    required_updates:
      - recognize silent directives only outside Markdown inline and fenced code
      - preserve code examples byte-for-byte while retaining real silent-block semantics
      - prove the BaseAgent terminal path, message persistence, Run output ledger, and callback payload together
  - id: OBS-MESSAGE-DELIVERY-003
    source: live_local_diagnosis
    related_scenarios:
      - MESSAGE-DELIVERY-008
    summary: Queued directed child Runs were recorded as completed parent callbacks even though they had not started.
    previous_assumption: Any explicit child Run targeting the callback Session could satisfy the parent callback.
    observed_behavior: Parent callback ledgers inherited the child Run id while the child stayed queued, and direct cross-Session database inspection consumed an intermediate preamble instead.
    required_updates:
      - derive callback payloads only from the parent Run terminal result
      - keep directed child Runs as separate durable queue objects with their own callback policy
      - preserve intermediate assistant and tool activity in the target Session only
  - id: OBS-MESSAGE-DELIVERY-004
    source: live_local_diagnosis
    related_scenarios:
      - MESSAGE-DELIVERY-314
    summary: Four Agent Runs accepted into one callee Turn produced four identical callbacks to one callback Session.
    previous_assumption: Callback idempotency belonged to each parent Run and its source actor.
    observed_behavior: The four parent Runs settled from the same terminal Turn and each created a separate callback Run carrying the same terminal result.
    required_updates:
      - identify callback events by callee terminal Turn and callback Session
      - point every participating parent Run ledger to the shared callback Run
      - keep callbacks for different terminal Turns or callback Sessions independent
  - id: OBS-MESSAGE-DELIVERY-005
    source: live_local_diagnosis
    related_scenarios:
      - MESSAGE-DELIVERY-023
      - MESSAGE-DELIVERY-024
      - MESSAGE-DELIVERY-025
    summary: A prewrite Web Stop left the OpenCode runtime gate owned while the replacement input vanished from the recovered transcript.
    previous_assumption: The generic cancellation terminal tidy would always release the runtime gate quickly, and optimistic input rendering was sufficient until native acceptance.
    observed_behavior: The first Turn stopped 134 milliseconds after admission before native write; its asynchronous terminal tidy retained the gate, the next Turn waited before entering OpenCode, and its claimed Delivery was absent after Chat reloaded from materialized Messages.
    required_updates:
      - release the runtime gate synchronously when the durable prewrite Stop owns terminalization
      - prevent a send click burst from activating the destructive control rendered at the same pointer target
      - project the active claimed Delivery into Workbench tail and bootstrap reads until native acceptance materializes it
      - log Workbench Stop request and settlement boundaries for future source attribution
